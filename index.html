d>4,600</td><td>−0.14</td><td>4,600</td><td><strong>220</strong></td></tr>\n          </table>\n          <p class=\"ep-p\" style=\"font-size:12px;color:var(--color-text-secondary)\">Final Value = RHS → binding（资源用完）；Shadow Price = −0.14 → 每增加1单位纸板，总成本<strong>减少</strong>$0.14</p>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <div class=\"ep-warn-box\"><strong>No, it is NOT sensible.</strong></div>\n          <div class=\"ep-tip-box\">\n            Since 200 &lt; allowable increase of 220, the shadow price is valid.<br>\n            Cost saving = 0.14 × 200 = <strong>$28</strong><br>\n            Purchase cost = <strong>$30 &gt; $28</strong> → net loss of $2 → <strong>not sensible</strong>.\n          </div>\n          <div class=\"ep-info-box\">\n            📌 <strong>万能框架：</strong><br>\n            Step 1: 变化量是否在 allowable range 内？→ 判断 shadow price 是否有效<br>\n            Step 2: 实际影响 = shadow price × 变化量<br>\n            Step 3: 比较金额 → 得出结论\n          </div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Correct answer</td><td>Not sensible</td><td>1</td></tr>\n            <tr><td>Justification</td><td>$28 savings &lt; $30 cost</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-3')\">\n          <span class=\"ep-subq-num\">Q1.3</span>\n          <span class=\"ep-subq-title\">STEM Kits production cost increases from $16 to $24 — impact on solution?</span>\n          <span class=\"ep-subq-marks\">2 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-h5\">从 Table 1.3 找关键数据</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Variable</th><th>Objective Coefficient</th><th>Allowable Increase</th></tr>\n            <tr><td>STEM Kits Dec</td><td>$16</td><td>+∞ (1E+30)</td></tr>\n            <tr><td>STEM Kits Jan</td><td>$16</td><td>+∞ (1E+30)</td></tr>\n            <tr><td>STEM Kits Feb</td><td>$16</td><td>+∞ (1E+30)</td></tr>\n          </table>\n          <p class=\"ep-p\">变化量 = $24 − $16 = <strong>$8</strong>，Allowable Increase = ∞ → $8 &lt;&lt; ∞ ✅</p>\n          <span class=\"ep-answer-label\">情况一：变化在 allowable range 内（本题）</span>\n          <div class=\"ep-tip-box\">\n            <strong>No changes to the optimal solution.</strong><br><br>\n            Since the allowable increase for all STEM Kits production costs is +infinity, the increase of $8 (from $16 to $24) is within the allowable range. Therefore, the optimal solution stays the same, although the <strong>total cost will increase</strong>.\n          </div>\n          <span class=\"ep-answer-label\">情况二：变化超出 allowable range</span>\n          <div class=\"ep-tip-box\">\n            <strong>The optimal solution will change.</strong><br><br>\n            The increase of $[X] exceeds the allowable increase of $[Y] for [variable]. Therefore, the current optimal solution is no longer valid and the model needs to be <strong>re-solved</strong> to find the new optimal solution.\n          </div>\n          <div class=\"ep-info-box\">\n            📌 <strong>目标系数变化框架：</strong><br>\n            变化量 &lt; Allowable → \"No changes, solution stays the same, but total cost changes\"<br>\n            变化量 &gt; Allowable → \"Solution changes, model needs to be re-solved\"\n          </div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>\"No changes\"</td><td>明确说 no changes to solution</td><td>1</td></tr>\n            <tr><td>Reasoning</td><td>allowable increase = ∞，变化量在范围内</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-4')\">\n          <span class=\"ep-subq-num\">Q1.4</span>\n          <span class=\"ep-subq-title\">Construct the Markowitz Portfolio Model (min return 10%, returns equally likely)</span>\n          <span class=\"ep-subq-marks\">9 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">\n            💡 <strong>核心思想：</strong>在保证最低收益（≥10%）的前提下，最小化投资组合的方差（风险）。<br>\n            风险 = 收益的波动程度（方差）；平方是为了防止正负抵消。<br>\n            R<sub>s</sub> 不是固定数字，取决于你如何分配 X、Y、Z。\n          </div>\n          <p class=\"ep-h5\">① Decision Variables <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">X = fraction invested in Green Fund\nY = fraction invested in ESG Fund\nZ = fraction invested in Climate Fund</div>\n          <p class=\"ep-h5\">② Objective Function <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">Min  (1/4) × Σ(Rₛ − R̄)²   for s = 1 to 4</div>\n          <table class=\"ep-mini-table\" style=\"margin-top:6px\">\n            <tr><th>符号</th><th>含义</th></tr>\n            <tr><td>1/4</td><td>4年等概率，各占 1/4</td></tr>\n            <tr><td>Rₛ</td><td>第 s 年的实际组合收益</td></tr>\n            <tr><td>R̄</td><td>4年平均收益（变量，由等式约束定义）</td></tr>\n            <tr><td>(Rₛ − R̄)²</td><td>该年偏离均值的程度（平方防止正负抵消）</td></tr>\n          </table>\n          <p class=\"ep-h5\">③ Annual Return Constraints <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(4 marks，每条1分)</span></p>\n          <div class=\"ep-formula\">0.120X + 0.080Y + 0.065Z = R₁   (Year 1)\n0.095X + 0.105Y + 0.140Z = R₂   (Year 2)\n0.110X + 0.090Y + 0.160Z = R₃   (Year 3)\n−0.020X − 0.015Y − 0.030Z = R₄  (Year 4)</div>\n          <p class=\"ep-h5\">④ Average Return Definition <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">(1/4)(R₁ + R₂ + R₃ + R₄) = R̄</div>\n          <p class=\"ep-p\" style=\"font-size:12px;color:var(--color-text-secondary)\">R̄ 是变量，不是已知数，必须用此等式定义！</p>\n          <p class=\"ep-h5\">⑤ Minimum Return Constraint <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">R̄ ≥ 0.10</div>\n          <p class=\"ep-h5\">⑥ Portfolio Weights Sum to 1 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">X + Y + Z = 1</div>\n          <div class=\"ep-warn-box\">⚠️ 老师答案写了 X + Z + Z = 1，这是<strong>笔误</strong>，正确是 X + Y + Z = 1。</div>\n          <div class=\"ep-info-box\">\n            📌 <strong>建模逻辑串联：</strong><br>\n            决定 X,Y,Z → 算出每年 R₁…R₄ → 算出均值 R̄ = (R₁+R₂+R₃+R₄)/4 → 算方差 → 最小化<br>\n            约束：R̄ ≥ 10%（最低收益）＋ X+Y+Z = 1（全部投出去）\n          </div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Decision variables</td><td>X, Y, Z 定义</td><td>1</td></tr>\n            <tr><td>Objective function</td><td>Min (1/4)·Σ(Rₛ−R̄)²</td><td>1</td></tr>\n            <tr><td>R₁–R₄ equations</td><td>每条1分</td><td>4</td></tr>\n            <tr><td>Average return</td><td>(1/4)·ΣRₛ = R̄</td><td>1</td></tr>\n            <tr><td>Minimum return</td><td>R̄ ≥ 0.10</td><td>1</td></tr>\n            <tr><td>Sum to 1</td><td>X + Y + Z = 1</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n    </div><!-- /q1 panel -->\n\n    <!-- ── Q2: Monte Carlo ── -->\n    <div id=\"2025s1-q2\" class=\"ep-q-panel\">\n\n      <div class=\"ep-context\">\n        <h4>📋 题目背景 — Harvey Norman PlayStation 6 Inventory</h4>\n        <p>Harvey Norman is preparing for a holiday sales boom by stocking PlayStation 6 consoles.</p>\n        <table class=\"ep-param-table\">\n          <tr><th>Parameter</th><th>Value</th></tr>\n          <tr><td>Selling Price</td><td>$850 per unit</td></tr>\n          <tr><td>Procurement Cost</td><td>$580 per unit</td></tr>\n          <tr><td>Order Quantity</td><td>10,000 units</td></tr>\n          <tr><td>Holding Cost</td><td>$40 per excess unit</td></tr>\n          <tr><td>Shortage Cost</td><td>$100 per lost unit</td></tr>\n          <tr><td>Demand Distribution</td><td>Normal, μ = 10,000, σ = 200</td></tr>\n          <tr><td>Simulation Trials</td><td>1,000</td></tr>\n        </table>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-1')\">\n          <span class=\"ep-subq-num\">Q2.1</span>\n          <span class=\"ep-subq-title\">Identify and classify inputs and outputs. Why separate controllable from uncontrollable?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-warn-box\">⚠️ Procurement cost = <strong>Controllable</strong>（合同定价，公司可控）← 很多人错放到 Uncontrollable！<br>Output 要写 <strong>Net profit per month</strong>，不能只写 \"profit\"。</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-p\"><strong>Controllable inputs</strong> <span style=\"color:var(--color-text-tertiary)\">(each 0.5 mark)</span></p>\n          <ul class=\"ep-ul\"><li>Procurement cost（采购成本）</li><li>Selling price（售价）</li><li>Order quantity: 10,000 units（订货量）</li></ul>\n          <p class=\"ep-p\"><strong>Uncontrollable inputs</strong> <span style=\"color:var(--color-text-tertiary)\">(each 0.5 mark)</span></p>\n          <ul class=\"ep-ul\"><li>Customer demand（顾客需求）</li><li>Holding cost（库存成本）</li><li>Shortage cost（缺货成本）</li></ul>\n          <p class=\"ep-p\"><strong>Output:</strong> Net profit per month（每月净利润）</p>\n          <p class=\"ep-p\"><strong>Why separate:</strong></p>\n          <div class=\"ep-tip-box\">\"We separate the inputs into controllable and uncontrollable so that when making improvements to the simulation model, we understand which input variables are <strong>feasible to change</strong>, which are the controllable variables.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Controllable inputs</td><td>3个，各0.5分</td><td>1.5</td></tr>\n            <tr><td>Uncontrollable inputs</td><td>3个，各0.5分</td><td>1.5</td></tr>\n            <tr><td>Output</td><td>Net profit per month</td><td>0.5</td></tr>\n            <tr><td>Why separate</td><td>一句话说清楚</td><td>1.5</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-2')\">\n          <span class=\"ep-subq-num\">Q2.2</span>\n          <span class=\"ep-subq-title\">Write the formula to compute profit if demand &lt; 10,000</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-p\">当 demand &lt; 10,000 时，卖不完有剩货（D = actual demand）：</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>项目</th><th>计算逻辑</th></tr>\n            <tr><td>收入 Revenue</td><td>$850 × D（只卖出D件）</td></tr>\n            <tr><td>采购成本 Procurement</td><td>$580 × 10,000（全部订货量都要付）</td></tr>\n            <tr><td>库存成本 Holding Cost</td><td>$40 × (10,000 − D)（剩余库存）</td></tr>\n          </table>\n          <span class=\"ep-answer-label\">标准公式</span>\n          <div class=\"ep-formula\">Profit = 850 × D − 580 × 10,000 − 40 × (10,000 − D)\n       = 850D − 5,800,000 − 400,000 + 40D\n       = <strong>890D − 6,200,000</strong></div>\n          <div class=\"ep-warn-box\">⚠️ 采购成本是 580 × <strong>10,000</strong>（全部订货量），不是 580 × D（只算卖出的）！<br>当 demand &lt; 10,000 时<strong>没有</strong> Shortage Cost，排除它是关键得分点。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Revenue component</td><td>850 × D</td><td>1</td></tr>\n            <tr><td>Holding cost component</td><td>40 × (10,000−D)</td><td>1</td></tr>\n            <tr><td>Excluding shortage</td><td>正确排除 shortage cost</td><td>1</td></tr>\n            <tr><td>Complete correct expression</td><td>890D − 6,200,000</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-3')\">\n          <span class=\"ep-subq-num\">Q2.3</span>\n          <span class=\"ep-subq-title\">Explain how this problem is formulated in Excel</span>\n          <span class=\"ep-subq-marks\">9 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>关键：用 MIN/MAX，不是 IF</strong><br>MIN → 限制<strong>上限</strong>（最多只能这么多）；MAX(0,...) → 防止<strong>负数</strong>（成本最少是0）</div>\n          <p class=\"ep-h5\">Step 1 — 模拟随机需求 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">=NORM.INV(RAND(), 10000, 200)</div>\n          <p class=\"ep-p\">RAND() 生成 0–1 随机数；NORM.INV() 将其转换为正态分布需求值。重复 1,000 行 = 1,000 个模拟场景。</p>\n          <p class=\"ep-h5\">Step 2 — 计算每次利润 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(4 marks，每项1分)</span></p>\n          <div class=\"ep-formula\">Revenue      = MIN(Demand, 10000) × 270\nHolding cost = MAX(0, 10000 − Demand) × 40\nShortage cost = MAX(0, Demand − 10000) × 100\nProfit       = Revenue − Holding cost − Shortage cost</div>\n          <table class=\"ep-mini-table\" style=\"margin-top:10px\">\n            <tr><th>函数</th><th>用途</th><th>例子</th></tr>\n            <tr><td>MIN(Demand, 10000)</td><td>限制上限，卖出量不超过库存</td><td>需求10200→只能卖10000</td></tr>\n            <tr><td>MAX(0, 10000−Demand)</td><td>防止负数，成本最少为0</td><td>需求10200→MAX(0,−200)=0</td></tr>\n          </table>\n          <p class=\"ep-h5\">Step 3 — 汇总1,000次结果 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks)</span></p>\n          <div class=\"ep-formula\">=AVERAGE(profit range)  → estimated average profit\n=STDEV(profit range)    → variability of profit\n=MIN(profit range)      → worst case profit\n=MAX(profit range)      → best case profit\nHistogram               → distribution of profit outcomes</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>步骤</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Step 1</td><td>NORM.INV(RAND(), 10000, 200)</td><td>2</td></tr>\n            <tr><td>Step 2a</td><td>Revenue = MIN(Demand,10000)×270</td><td>1</td></tr>\n            <tr><td>Step 2b</td><td>Holding = MAX(0,10000−Demand)×40</td><td>1</td></tr>\n            <tr><td>Step 2c</td><td>Shortage = MAX(0,Demand−10000)×100</td><td>1</td></tr>\n            <tr><td>Step 2d</td><td>Profit = Revenue−Holding−Shortage</td><td>1</td></tr>\n            <tr><td>Step 3</td><td>1,000 rows + AVERAGE/STDEV/MIN/MAX/Histogram</td><td>3</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-4')\">\n          <span class=\"ep-subq-num\">Q2.4</span>\n          <span class=\"ep-subq-title\">92 of 1,000 scenarios had profit below $700,000 — estimate probability and interpret</span>\n          <span class=\"ep-subq-marks\">6 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <span class=\"ep-answer-label\">计算</span>\n          <div class=\"ep-formula\">P(Profit &lt; $700,000) = 92 / 1,000 = 0.092 = 9.2%</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：概率较低（&lt; 15%，本题）</p>\n          <div class=\"ep-tip-box\">\"There is a <strong>low but present risk</strong> of underperformance. Only 9.2% of simulated scenarios resulted in profit below $700,000, suggesting that under the current ordering strategy of 10,000 units, Harvey Norman is <strong>unlikely but not impossible</strong> to earn below this threshold.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：概率较高（&gt; 30%）</p>\n          <div class=\"ep-tip-box\">\"There is a <strong>significant risk</strong> of underperformance. [X]% of simulated scenarios resulted in profit below $[threshold], suggesting the current ordering strategy carries <strong>substantial downside risk</strong>. Management should consider revising the order quantity.\"</div>\n          <div class=\"ep-info-box\">📌 <strong>答题模板：</strong>P = 次数/总trials = X%<br>\"There is a <strong>[low/significant] risk</strong> of [outcome]. [一句背景说明 + 建议]\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Identifying count</td><td>92/1000</td><td>2</td></tr>\n            <tr><td>Correct probability</td><td>0.092 = 9.2%</td><td>2</td></tr>\n            <tr><td>Interpretation</td><td>Low but present risk of underperformance</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>6</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n    </div><!-- /q2 panel -->\n\n    <!-- ── Q3: Regression Analysis ── -->\n    <div id=\"2025s1-q3\" class=\"ep-q-panel\">\n\n      <div class=\"ep-context\">\n        <h4>📋 题目背景 — Australian Property Market（租金 vs 房贷）</h4>\n        <p>10个澳大利亚城市数据。Rent = Independent Variable (X)，Mortgage = Dependent Variable (Y)。</p>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-1')\">\n          <span class=\"ep-subq-num\">Q3.1</span>\n          <span class=\"ep-subq-title\">Scatter chart — what relationship exists? Is simple linear regression appropriate?</span>\n          <span class=\"ep-subq-marks\">4 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>散点图看三件事：</strong><br>1. Direction（方向）→ 右上走 = 正相关<br>2. Shape（形状）→ 直线 = 线性；曲线 = 非线性<br>3. Pattern（分布）→ 均匀分布 = 线性适合；两群分布 = 可能不适合</div>\n          <div class=\"ep-warn-box\">⚠️ 本题数据点分成<strong>两群</strong>，不是均匀分布的直线 → 不能确认线性关系！很多人会误判成线性。</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">Sentence 1 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"The scatter chart indicates a <strong>modest positive relationship</strong> between these variables. No special relations.\"</div>\n          <p class=\"ep-h5\">Sentence 2 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"It is <strong>not clear that the relationship is linear</strong>, and so a simple linear regression model <strong>may not be appropriate</strong>.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Relationship type</td><td>Modest positive relationship</td><td>2</td></tr>\n            <tr><td>Linear judgment</td><td>May not be appropriate + reason</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-2')\">\n          <span class=\"ep-subq-num\">Q3.2</span>\n          <span class=\"ep-subq-title\">Develop linear regression equation. Predict mortgage at rent = $1,000. Interpret coefficient 1.0699.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 从 Figure 3.2 读数：Row 17: Intercept = −197.9583 → b₀ ｜ Row 18: Rent ($) = 1.0699 → b₁</div>\n          <div class=\"ep-warn-box\">⚠️ 常见错误：系数顺序写反！ŷ = −197.9583x + 1.0699 ← <strong>错误！</strong>Intercept 永远在前！</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">① Equation <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = −197.9583 + 1.0699x    （x = avg asking rent，ŷ = estimated mortgage）</div>\n          <p class=\"ep-h5\">② Prediction at x = $1,000 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = −197.9583 + 1.0699 × 1000 = $871.94</div>\n          <p class=\"ep-h5\">③ Interpretation of 1.0699 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">\"The coefficient of 1.0699 indicates that for every <strong>$1 increase</strong> in average asking rent, the monthly mortgage repayment is estimated to <strong>increase by approximately $1.07</strong>.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Equation</td><td>Intercept first, correct formula</td><td>2</td></tr>\n            <tr><td>Prediction</td><td>x=1000 → $871.94</td><td>2</td></tr>\n            <tr><td>Interpretation</td><td>$1 increase in rent → $1.07 increase in mortgage</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-3')\">\n          <span class=\"ep-subq-num\">Q3.3</span>\n          <span class=\"ep-subq-title\">Develop quadratic regression equation. Predict mortgage at rent = $1,000.</span>\n          <span class=\"ep-subq-marks\">4 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 从 Figure 3.3 读数：Row 17: Intercept = 3965.633 → b₀ ｜ Row 18: Rent = −8.2606 → b₁ ｜ Row 19: Rent Squared = 0.005131 → b₂</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">① Equation <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = 3965.633 − 8.2606x + 0.005131x²</div>\n          <p class=\"ep-h5\">② Prediction at x = $1,000 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = 3965.633 − 8.2606(1000) + 0.005131(1000)²\n  = 3965.633 − 8260.6 + 5131 = $836.03</div>\n          <div class=\"ep-warn-box\">⚠️ 老师答案用系数 0.0051 得出 $805.03。考试时用你 Excel 里显示的系数即可，均可接受。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Equation</td><td>Correct quadratic formula with all three terms</td><td>2</td></tr>\n            <tr><td>Prediction</td><td>x=1000 → correct answer</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-4')\">\n          <span class=\"ep-subq-num\">Q3.4</span>\n          <span class=\"ep-subq-title\">t-test for each parameter at α = 0.05. If any equal zero, what is your recommendation?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>t-test vs F-test 触发词：</strong><br>\"each parameter/coefficient\" → t-test → 看每个变量 p-value<br>\"overall significance\" → F-test → 看 Significance F</div>\n          <div class=\"ep-formula\">p-value &lt; 0.05 → reject H₀ → coefficient ≠ 0 → SIGNIFICANT ✅\np-value &gt; 0.05 → do not reject H₀ → coefficient = 0 → NOT significant ❌</div>\n          <p class=\"ep-h5\">从 Figure 3.3 读取 p-values</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Parameter</th><th>p-value</th><th>vs 0.05</th><th>结论</th></tr>\n            <tr><td>Intercept</td><td>0.0208</td><td>&lt; 0.05</td><td>Significant ✅</td></tr>\n            <tr><td>Rent ($)</td><td>0.0277</td><td>&lt; 0.05</td><td>Significant ✅</td></tr>\n            <tr><td>Rent Squared</td><td>0.0165</td><td>&lt; 0.05</td><td>Significant ✅</td></tr>\n          </table>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">情况一：所有参数显著（本题）<span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"The p-value for the test of the hypothesis that βᵢ = 0 for <strong>Rent and Rent Squared</strong> are <strong>smaller</strong> than the 0.05 level of significance. We <strong>reject</strong> the hypothesis that βᵢ = 0, and conclude that there is a <strong>significant linear relationship</strong> between these variables and monthly mortgage.\"</div>\n          <p class=\"ep-h5\">情况二：部分参数不显著 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"The p-value for the test of the hypothesis that βᵢ = 0 for <strong>[variable name]</strong> is <strong>greater</strong> than the 0.05 level of significance. We <strong>do not reject</strong> the hypothesis that βᵢ = 0, and conclude that there is <strong>not a significant linear relationship</strong> between [variable] and monthly mortgage.\"</div>\n          <p class=\"ep-h5\">Part 2 — Recommendation <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks ← 不管结果如何都必须写！)</span></p>\n          <div class=\"ep-tip-box\">\"We cannot though simply delete these independent variables from the model. First, we need to determine whether they <strong>add to Adjusted R²</strong> and explain more variability of the mortgage. Second, if the <strong>expert's judgement</strong> is to keep them in the model for future evaluations, we should keep them. Otherwise, we should start from <strong>deleting only one variable at a time</strong> and test the model again to decide whether to delete one, two, or all of them.\"</div>\n          <div class=\"ep-warn-box\">⚠️ Recommendation 段不管所有参数是否显著都必须写！题目问的是\"if any equal zero\"，你要展示你知道该怎么做。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>t-test conclusion</td><td>p-value comparison + reject/not reject</td><td>2</td></tr>\n            <tr><td>Recommendation</td><td>Cannot simply delete, one at a time, check Adj R²</td><td>3</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-5\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-5')\">\n          <span class=\"ep-subq-num\">Q3.5</span>\n          <span class=\"ep-subq-title\">Compare Q3.2 (linear) vs Q3.3 (quadratic) — predictability, overall fit, overall significance.</span>\n          <span class=\"ep-subq-marks\">7 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>三个维度，三个工具：</strong><br>Predictability → <strong>MSE</strong>（越小越好）<br>Overall Fit → <strong>R² + Adj R²</strong>（越大越好）<br>Overall Significance → <strong>Significance F</strong>（越小越好，必须 &lt; 0.05）</div>\n          <p class=\"ep-h5\">① Predictability — MSE <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks)</span></p>\n          <div class=\"ep-formula\">MSE = SSE ÷ Residual df    （从 ANOVA 表 Residual 行读取）</div>\n          <table class=\"ep-mini-table\">\n            <tr><th>Model</th><th>SSE</th><th>Residual df</th><th>MSE</th></tr>\n            <tr><td>Q3.2 Linear</td><td>49,652.72</td><td>8</td><td><strong>6,206.59</strong></td></tr>\n            <tr><td>Q3.3 Quadratic</td><td>20,667.05</td><td>7</td><td><strong>2,952.44</strong></td></tr>\n          </table>\n          <div class=\"ep-tip-box\">Q3.3 has lower MSE → <strong>better predictability ✅</strong></div>\n          <p class=\"ep-h5\">② Overall Fit — R² and Adjusted R² <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Model</th><th>R²</th><th>Adjusted R²</th></tr>\n            <tr><td>Q3.2 Linear</td><td>0.7564</td><td>0.7256</td></tr>\n            <tr><td>Q3.3 Quadratic</td><td><strong>0.8985</strong></td><td><strong>0.8695</strong></td></tr>\n          </table>\n          <div class=\"ep-info-box\">R² 随变量增加只会上升，即使无用变量。<strong>Adjusted R²</strong> 会惩罚多余变量，是更公平的比较标准。</div>\n          <div class=\"ep-tip-box\">Q3.3 explains ~13% more variation in mortgage than Q3.2 ✅</div>\n          <p class=\"ep-h5\">③ Overall Significance — Significance F <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Model</th><th>Significance F</th><th>vs 0.05</th></tr>\n            <tr><td>Q3.2 Linear</td><td>0.00108</td><td>&lt; 0.05 ✅</td></tr>\n            <tr><td>Q3.3 Quadratic</td><td><strong>0.000333</strong></td><td>&lt; 0.05 ✅</td></tr>\n          </table>\n          <div class=\"ep-tip-box\">Both significant. Q3.3 has smaller Sig F → <strong>stronger overall significance ✅</strong></div>\n          <span class=\"ep-answer-label\">结论</span>\n          <div class=\"ep-tip-box\">The quadratic model in Q3.3 is <strong>more effective</strong> — it outperforms Q3.2 across all three dimensions: lower MSE, higher R² and Adjusted R², and stronger overall significance.</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>MSE for Q3.2</td><td>49652.72 ÷ 8 = 6206.59</td><td>1</td></tr>\n            <tr><td>MSE for Q3.3</td><td>20667.05 ÷ 7 = 2952.44</td><td>1</td></tr>\n            <tr><td>MSE comparison</td><td>Q3.3 lower → better predictability</td><td>1</td></tr>\n            <tr><td>R² and Adj R²</td><td>Both higher in Q3.3，~13% more variation</td><td>2</td></tr>\n            <tr><td>Significance F</td><td>Both &lt; 0.05，Q3.3 smaller → stronger</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>7</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n    </div><!-- /q3 panel -->\n\n    <!-- ── Q4: Descriptive Data Mining ── -->\n    <div id=\"2025s1-q4\" class=\"ep-q-panel\">\n\n      <div class=\"ep-context\">\n        <h4>📋 题目背景 — Voter Analysis（选民数据分析）</h4>\n        <p>100名选民数据集，Q4.1–Q4.3 使用其中5名选民样本。</p>\n        <table class=\"ep-param-table\" style=\"margin-top:10px\">\n          <tr><th>变量类型</th><th>变量名</th><th>用途</th></tr>\n          <tr><td>Numerical（数值）</td><td>Age, Household Size, Income</td><td>Euclidean Distance</td></tr>\n          <tr><td>Categorical（分类）</td><td>Vote, Gender, Married, Religious</td><td>Matching Coefficient</td></tr>\n        </table>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-1')\">\n          <span class=\"ep-subq-num\">Q4.1</span>\n          <span class=\"ep-subq-title\">Euclidean Distance (Unstandardised) — Voters 2&amp;4 and 2&amp;5. Which is more similar to Voter 2?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>公式口诀：</strong>每个变量做差 → 平方 → 全部相加 → 开根号<br>d = √[(x₁−x₂)² + (y₁−y₂)² + (z₁−z₂)²]</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">Voters 2 and 4 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[(46−50)² + (6−4)² + (420−18)²]\n  = √[16 + 4 + 161,604] = <strong>402.02</strong></div>\n          <p class=\"ep-h5\">Voters 2 and 5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[(46−49)² + (6−2)² + (420−66)²]\n  = √[9 + 16 + 125,316] = <strong>354.04</strong></div>\n          <p class=\"ep-h5\">Conclusion <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks ← 必须包含两句话！)</span></p>\n          <div class=\"ep-tip-box\">\"Voter 5 is more similar to Voter 2 as it has a lower Euclidean distance (354.04 &lt; 402.02). This is because the Euclidean distance is <strong>unduly influenced by the scale</strong> on which variables are measured, particularly Income which is measured on a much larger scale than Age or Household Size.\"</div>\n          <div class=\"ep-warn-box\">⚠️ 结论必须说 <strong>\"unduly influenced by scale\"</strong> ← 这句话值分！不能只说\"354 &lt; 402 so Voter 5 is closer\"。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Distance (2 &amp; 4)</td><td>402.02</td><td>1.5</td></tr>\n            <tr><td>Distance (2 &amp; 5)</td><td>354.04</td><td>1.5</td></tr>\n            <tr><td>Conclusion</td><td>Voter 5 closer + scale explanation</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-2')\">\n          <span class=\"ep-subq-num\">Q4.2</span>\n          <span class=\"ep-subq-title\">Euclidean Distance (Standardised) — Voters 2&amp;4 and 2&amp;5. Does the conclusion change?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 不标准化时，Income数值大会<strong>压倒</strong>Age和Household Size。标准化后各变量平等贡献。<br>⚠️ Mean 在计算时用不到！直接用差值 ÷ 标准差。</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">① 先写公式 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 必须写！)</span></p>\n          <div class=\"ep-formula\">Standardised d = √[((x₁−x₂)/sₓ)² + ((y₁−y₂)/sᵧ)² + ((z₁−z₂)/s_z)²]</div>\n          <p class=\"ep-h5\">② Voters 2 and 4 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[((46−50)/11)² + ((6−4)/2)² + ((420−18)/74)²]\n  = √[(−0.364)² + (1)² + (5.432)²]\n  = √[0.13 + 1 + 29.51] = <strong>5.54</strong></div>\n          <p class=\"ep-h5\">③ Voters 2 and 5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[((46−49)/11)² + ((6−2)/2)² + ((420−66)/74)²]\n  = √[(−0.273)² + (2)² + (4.784)²]\n  = √[0.07 + 4 + 22.88] = <strong>5.19</strong></div>\n          <p class=\"ep-h5\">④ Conclusion <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 必须提到Q4.1！)</span></p>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：结论与Q4.1相同（本题）</p>\n          <div class=\"ep-tip-box\">\"The standardised measures confirm that Voter 5 remains closer to Voter 2 (5.19 &lt; 5.54). Therefore the <strong>conclusion is the same as Q4.1</strong>. However, the standardised distances are proportionately closer to one another because they take account of the <strong>scale</strong> in which the variables are measured.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：结论与Q4.1不同</p>\n          <div class=\"ep-tip-box\">\"The standardised measures show that Voter [X] is now closer to Voter 2 ([d1] &lt; [d2]). Therefore the <strong>conclusion changes compared to Q4.1</strong>. This is because standardisation removes the undue influence of [Income/large variable], revealing that [X] is actually more similar when variables are measured on an equal scale.\"</div>\n          <div class=\"ep-warn-box\">⚠️ 必须写标准化公式（1分）｜结论必须说 <strong>\"same as Q4.1\"</strong> 或 <strong>\"changes compared to Q4.1\"</strong>（1分）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Formula written</td><td>Standardised formula（必须写）</td><td>1</td></tr>\n            <tr><td>Distance (2 &amp; 4)</td><td>5.54</td><td>1.5</td></tr>\n            <tr><td>Distance (2 &amp; 5)</td><td>5.19</td><td>1.5</td></tr>\n            <tr><td>Conclusion</td><td>Same/different from Q4.1 + reason</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-3')\">\n          <span class=\"ep-subq-num\">Q4.3</span>\n          <span class=\"ep-subq-title\">Matching Coefficient — Observation 5 vs all others. Least similar? One disadvantage on Married variable.</span>\n          <span class=\"ep-subq-marks\">6 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 MC = 匹配数 ÷ 总变量数（这里是4）</div>\n          <span class=\"ep-answer-label\">计算（Observation 5: Vote=1, Gender=0, Married=1, Religious=1）</span>\n          <table class=\"ep-mini-table\">\n            <tr><th>Comparison</th><th>Vote</th><th>Gender</th><th>Married</th><th>Religious</th><th>Matches</th><th>MC</th></tr>\n            <tr><td>5 vs 1</td><td>1=1 ✓</td><td>0=0 ✓</td><td>1=1 ✓</td><td>1≠0 ✗</td><td>3</td><td><strong>3/4 = 0.75</strong></td></tr>\n            <tr><td>5 vs 2</td><td>1≠0 ✗</td><td>0=0 ✓</td><td>1=1 ✓</td><td>1=1 ✓</td><td>3</td><td><strong>3/4 = 0.75</strong></td></tr>\n            <tr><td>5 vs 3</td><td>1=1 ✓</td><td>0≠1 ✗</td><td>1=1 ✓</td><td>1≠0 ✗</td><td>2</td><td><strong>2/4 = 0.50</strong></td></tr>\n            <tr><td>5 vs 4</td><td>1≠0 ✗</td><td>0≠1 ✗</td><td>1=1 ✓</td><td>1≠0 ✗</td><td>1</td><td><strong>1/4 = 0.25</strong></td></tr>\n          </table>\n          <div class=\"ep-tip-box\" style=\"margin-top:10px\"><strong>Least similar: Observation 4 (MC = 0.25)</strong></div>\n          <p class=\"ep-h5\">Disadvantage <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">角度一（老师标准答案）— 0-0匹配问题</p>\n          <div class=\"ep-tip-box\">\"One disadvantage of the matching coefficient is that it treats both <strong>1-1 and 0-0 matches</strong> as equally informative signs of similarity. However, a 0-0 match can <strong>conceal real differences</strong> between observations. For example, two voters might both have a value of 0 for the Married variable, but one could be single while another lives in a de-facto relationship — these are meaningfully different situations that the matching coefficient fails to distinguish.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">角度二（备用，如果问两个缺点）— 全部相同问题</p>\n          <div class=\"ep-tip-box\">\"One disadvantage is that if all observations share the same value for a variable (e.g. all voters have Married = 1), this variable provides <strong>no discriminating information</strong> between observations, yet it still contributes to the similarity score and <strong>artificially inflates</strong> the similarity values.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>4 MC calculations</td><td>0.5 mark each</td><td>2</td></tr>\n            <tr><td>Least similar</td><td>Observation 4, MC = 0.25</td><td>1</td></tr>\n            <tr><td>Disadvantage</td><td>0-0 match + specific example</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-4')\">\n          <span class=\"ep-subq-num\">Q4.4</span>\n          <span class=\"ep-subq-title\">Dendrogram — clusters at distances 0.36 and 0.28? Most distinctive and durable cluster?</span>\n          <span class=\"ep-subq-marks\">4 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 在该距离画水平线 → 数被切断的竖线数量 = cluster 数量<br>Most distinctive = 合并前竖线<strong>跨度最大</strong>的 cluster（不是最晚合并！）</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">Distance = 0.36 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">At a distance of 0.36, there are <strong>5 explicit clusters</strong>.</div>\n          <p class=\"ep-h5\">Distance = 0.28 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">At a distance of 0.28, there are <strong>7 explicit clusters</strong>.</div>\n          <p class=\"ep-h5\">Most distinctive and durable <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"<strong>Cluster 3</strong> is the most distinctive and durable cluster because the <strong>vertical distance before it merges</strong> with another cluster of approximately <strong>0.37–0.38</strong> is greater than for the other unmerged clusters. This large vertical span indicates that Cluster 3 is the most dissimilar to all others and maintains its distinctiveness the longest.\"</div>\n          <div class=\"ep-warn-box\">⚠️ 答案是 <strong>Cluster 3</strong>，不是 Cluster 10！判断依据是<strong>竖线跨度最大</strong>！</div>\n          <div class=\"ep-info-box\">📌 <strong>套入模板：</strong>\"Cluster [X] is most distinctive because the vertical distance before it merges (~[value]) is greater than for other unmerged clusters.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Clusters at 0.36</td><td>5 clusters</td><td>1</td></tr>\n            <tr><td>Clusters at 0.28</td><td>7 clusters</td><td>1</td></tr>\n            <tr><td>Most distinctive</td><td>Cluster 3</td><td>1</td></tr>\n            <tr><td>Why</td><td>Vertical span ~0.37–0.38, largest</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-5\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-5')\">\n          <span class=\"ep-subq-num\">Q4.5</span>\n          <span class=\"ep-subq-title\">Association Rules — Confidence &amp; Lift Ratio for Rule 13 and Rule 7. Why can Confidence be misleading?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>公式：</strong><br>Confidence = Support ÷ A-Support<br>Lift Ratio = Confidence ÷ (C-Support ÷ Total transactions)<br><br>Lift &gt; 1 → useful rule｜Lift = 1 → no association｜Lift &lt; 1 → negative association</div>\n          <p class=\"ep-h5\">数据来源</p>\n          <table class=\"ep-mini-table\">\n            <tr><th></th><th>Rule 13</th><th>Rule 7</th></tr>\n            <tr><td>Antecedent</td><td>[Vote, Religious]</td><td>[Married]</td></tr>\n            <tr><td>Consequent</td><td>[Married]</td><td>[Religious]</td></tr>\n            <tr><td>A-Support</td><td>12</td><td>84</td></tr>\n            <tr><td>C-Support</td><td>84</td><td>45</td></tr>\n            <tr><td>Support</td><td>11</td><td>39</td></tr>\n            <tr><td>Total</td><td>100</td><td>100</td></tr>\n          </table>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">Rule 13 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">Confidence = 11 / 12 = <strong>0.92 (92%)</strong>\nLift Ratio = 0.92 / (84/100) = 0.92 / 0.84 = <strong>1.09</strong></div>\n          <p class=\"ep-h5\">Rule 7 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">Confidence = 39 / 84 = <strong>0.46 (46%)</strong>\nLift Ratio = 0.46 / (45/100) = 0.46 / 0.45 = <strong>1.02</strong></div>\n          <p class=\"ep-h5\">Why misleading <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 照抄这句话)</span></p>\n          <div class=\"ep-tip-box\">\"If the <strong>support or frequency of the Consequent is high</strong>, then the confidence of the association rule could be <strong>high even if there is little or no association</strong> between the attributes. For example, since 84% of voters are married, any rule with Married as the consequent will have artificially high confidence regardless of the true association.\"</div>\n          <div class=\"ep-info-box\">📌 <strong>套入模板：</strong>\"If the support of <strong>[Consequent]</strong> is high (e.g. <strong>[X]%</strong> of transactions contain it), confidence can be high even if there is little or no real association.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Rule 13 Confidence</td><td>11/12 = 0.92</td><td>1</td></tr>\n            <tr><td>Rule 13 Lift Ratio</td><td>0.92/(84/100) = 1.09</td><td>1</td></tr>\n            <tr><td>Rule 7 Confidence</td><td>39/84 = 0.46</td><td>1</td></tr>\n            <tr><td>Rule 7 Lift Ratio</td><td>0.46/(45/100) = 1.02</td><td>1</td></tr>\n            <tr><td>Why misleading</td><td>High C-Support → artificially high confidence</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n    </div><!-- /q4 panel -->\n\n    <!-- ── Q5: Classification Tree ── -->\n    <div id=\"2025s1-q5\" class=\"ep-q-panel\">\n\n      <div class=\"ep-context\">\n        <h4>📋 题目背景 — Voter Classification（选民分类）</h4>\n        <p>预测选民是否未决定（Undecided），使用分类树模型，仅训练集，无验证/测试集划分。</p>\n        <table class=\"ep-param-table\" style=\"margin-top:10px\">\n          <tr><th>参数</th><th>值</th></tr>\n          <tr><td>总观测量</td><td>2,000（training set only）</td></tr>\n          <tr><td>Target Variable</td><td>Vote：1 = Undecided（未决定）, 0 = Decided（已决定）</td></tr>\n          <tr><td>树结构</td><td>Full-grown tree，最多4层，15个节点</td></tr>\n          <tr><td>决策节点顺序（从上到下从左到右）</td><td>1=Education, 2=Age, 3=Religious, 4=Religious, 5=HouseholdSize, 6=Gender_num, 7=Education</td></tr>\n        </table>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-1')\">\n          <span class=\"ep-subq-num\">Q5.1</span>\n          <span class=\"ep-subq-title\">One limitation of training-only model. Two reasons. Suggest a method to address it.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 就像备考时把所有真题做完看完答案，再用同样的题考自己——分数当然高，但不代表真实水平。</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">Limitation <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">\"Using the entire dataset as the training set means <strong>no separate data</strong> can evaluate how well the model performs on unseen data.\"</div>\n          <p class=\"ep-h5\">Two Reasons <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\n            1. This can lead to <strong>overfitting</strong> — the model captures noise or patterns specific to training data rather than general patterns.<br><br>\n            2. The model's reported accuracy may be <strong>overly optimistic</strong> and not reflect how it would perform on new data.\n          </div>\n          <p class=\"ep-h5\">Solution + Explanation <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"A recommended solution is to split the data into <strong>training, validation, and testing sets</strong>. This allows for more accurate performance assessment and tuning (e.g., pruning the tree), ensuring the model generalises to new data better.\"</div>\n          <div class=\"ep-info-box\">📌 Limitation → \"no separate data\" ｜ Reason 1 → overfitting ｜ Reason 2 → overly optimistic ｜ Solution → train/validation/test split ｜ Why → generalises better + pruning</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Limitation</td><td>Training set only, no unseen evaluation</td><td>1</td></tr>\n            <tr><td>Reason 1</td><td>Overfitting</td><td>1</td></tr>\n            <tr><td>Reason 2</td><td>Overly optimistic outcomes</td><td>1</td></tr>\n            <tr><td>Solution</td><td>Train/validation/test split</td><td>1</td></tr>\n            <tr><td>Explanation</td><td>Generalises better + allows pruning</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-2')\">\n          <span class=\"ep-subq-num\">Q5.2</span>\n          <span class=\"ep-subq-title\">Classification errors for 1–3 decision nodes. What observations can you make?</span>\n          <span class=\"ep-subq-marks\">8 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>Majority Rule：</strong>每个末端 group → 数 Class 0 和 Class 1 → 多的那方 = 预测 → 少的那方数量 = errors<br>Error rate = total errors ÷ 2000 ｜ 值 ≤ threshold → 左 ｜ 值 &gt; threshold → 右</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-h5\">① 1 Decision Node — Node 1: Education ≤ 12.5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(~2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Group</th><th>Class 0</th><th>Class 1</th><th>Majority</th><th>Errors</th></tr>\n            <tr><td>Education ≤ 12.5 (489 obs)</td><td>489</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Education &gt; 12.5 (1511 obs)</td><td>637</td><td>874</td><td>Class 1</td><td>637</td></tr>\n          </table>\n          <div class=\"ep-formula\">% Error = (0 + 637) / 2000 = <strong>0.3185</strong></div>\n          <p class=\"ep-h5\">② 2 Decision Nodes — +Node 2: Age ≤ 38.5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(~2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Group</th><th>Class 0</th><th>Class 1</th><th>Majority</th><th>Errors</th></tr>\n            <tr><td>Edu ≤ 12.5, Age ≤ 38.5 (93 obs)</td><td>93</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Edu ≤ 12.5, Age &gt; 38.5 (396 obs)</td><td>396</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Education &gt; 12.5 (1511 obs)</td><td>637</td><td>874</td><td>Class 1</td><td>637</td></tr>\n          </table>\n          <div class=\"ep-formula\">% Error = (0 + 0 + 637) / 2000 = <strong>0.3185</strong></div>\n          <p class=\"ep-h5\">③ 3 Decision Nodes — +Node 3: Religious ≤ 0.5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(~2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Group</th><th>Class 0</th><th>Class 1</th><th>Majority</th><th>Errors</th></tr>\n            <tr><td>Edu ≤ 12.5, Age ≤ 38.5 (93 obs)</td><td>93</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Edu ≤ 12.5, Age &gt; 38.5 (396 obs)</td><td>396</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Edu &gt; 12.5, Religious ≤ 0.5 (764 obs)</td><td>178</td><td>586</td><td>Class 1</td><td>178</td></tr>\n            <tr><td>Edu &gt; 12.5, Religious &gt; 0.5 (747 obs)</td><td>459</td><td>288</td><td>Class 0</td><td>288</td></tr>\n          </table>\n          <div class=\"ep-formula\">% Error = (0 + 0 + 178 + 288) / 2000 = 466 / 2000 = <strong>0.2330</strong></div>\n          <p class=\"ep-h5\">Observation <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks ← 必须说明 expected/unexpected！)</span></p>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：先不变再下降（本题）</p>\n          <div class=\"ep-tip-box\">\"The classification error remains the same from node 1 to node 2 (0.3185 → 0.3185), then <strong>decreases</strong> at node 3 (0.2330). This is <strong>expected</strong> because adding Node 2 does not split any group containing errors — both new groups are pure Class 0. The error only decreases when Node 3 further splits the right branch.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：持续下降</p>\n          <div class=\"ep-tip-box\">\"The classification error <strong>consistently decreases</strong> as nodes increase. This is <strong>expected</strong> because more nodes make the tree more specific, capturing more patterns and reducing training errors.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况三：下降后又上升（不正常！）</p>\n          <div class=\"ep-tip-box\">\"The error decreases then <strong>increases</strong> at node 3. This is <strong>unexpected</strong> on the training set — normally more nodes lead to lower training errors. This may indicate an issue with the data or node groupings.\"</div>\n          <div class=\"ep-warn-box\">⚠️ 必须说明 <strong>\"expected\"</strong> 或 <strong>\"unexpected\"</strong>！Training set 上错误率正常只会下降或持平，不会上升。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>1-node error</td><td>0.3185</td><td>2</td></tr>\n            <tr><td>2-node error</td><td>0.3185</td><td>2</td></tr>\n            <tr><td>3-node error</td><td>0.2330</td><td>2</td></tr>\n            <tr><td>Observation</td><td>Pattern + expected/unexpected + reason</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>8</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-3')\">\n          <span class=\"ep-subq-num\">Q5.3</span>\n          <span class=\"ep-subq-title\">Predict: 55yo male, married, income $90k, education 15 yrs, household 3, attends religious services.</span>\n          <span class=\"ep-subq-marks\">2 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 值 ≤ threshold → left ｜ 值 &gt; threshold → right ｜ 到达 Terminal Node → 读 Class<br><strong>Class 1 = undecided（未决定）← 不能写反！Class 0 = decided（已决定）</strong></div>\n          <div class=\"ep-formula\">Key values: Education = 15    Religious = 1（regularly attends = 1）</div>\n          <span class=\"ep-answer-label\">逐节点路径</span>\n          <table class=\"ep-mini-table\">\n            <tr><th>节点</th><th>判断条件</th><th>该选民的值</th><th>方向</th></tr>\n            <tr><td>Node 1</td><td>Education ≤ 12.5?</td><td>15 &gt; 12.5</td><td>→ Right</td></tr>\n            <tr><td>Node 3</td><td>Religious ≤ 0.5?</td><td>1 &gt; 0.5</td><td>→ Right</td></tr>\n            <tr><td>Node 7</td><td>Education ≤ 17?</td><td>15 ≤ 17</td><td>→ Left → Terminal</td></tr>\n          </table>\n          <div class=\"ep-tip-box\" style=\"margin-top:10px\"><strong>预测结果：Class 1（Undecided voter，未决定选民）</strong></div>\n          <div class=\"ep-warn-box\">⚠️ 每一步都要写出节点名称、值、方向，不能只写结论。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Correct path</td><td>All 3 nodes with correct direction</td><td>1</td></tr>\n            <tr><td>Final prediction</td><td>Class 1 / Undecided</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-4')\">\n          <span class=\"ep-subq-num\">Q5.4</span>\n          <span class=\"ep-subq-title\">Fill error report table. Calculate F1 Score and interpret. Provide overall conclusion.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-h5\">Confusion Matrix 读法</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Actual \\ Predicted</th><th>0</th><th>1</th></tr>\n            <tr><td><strong>0</strong></td><td>1138 (TN ✅)</td><td>5 (FP ❌ Class 0的错误)</td></tr>\n            <tr><td><strong>1</strong></td><td>12 (FN ❌ Class 1的错误)</td><td>845 (TP ✅)</td></tr>\n          </table>\n          <span class=\"ep-answer-label\">Error Report</span>\n          <table class=\"ep-mini-table\">\n            <tr><th>Class</th><th># Cases</th><th># Errors</th><th>% Error</th></tr>\n            <tr><td>0</td><td>1138+5 = <strong>1143</strong></td><td><strong>5</strong></td><td>5÷1143 = <strong>0.0044</strong></td></tr>\n            <tr><td>1</td><td>12+845 = <strong>857</strong></td><td><strong>12</strong></td><td>12÷857 = <strong>0.0140</strong></td></tr>\n            <tr><td>Overall</td><td><strong>2000</strong></td><td>5+12 = <strong>17</strong></td><td>17÷2000 = <strong>0.0085</strong></td></tr>\n          </table>\n          <span class=\"ep-answer-label\">F1 Score</span>\n          <div class=\"ep-formula\">F1 = 2×TP / (2×TP + FP + FN)\n   = 2×845 / (2×845 + 5 + 12)\n   = 1690 / 1707 = <strong>0.9900</strong></div>\n          <div class=\"ep-info-box\">📌 也可用：F1 = 2 × Precision × Sensitivity / (Precision + Sensitivity)，结果相同但展开版更快！</div>\n          <span class=\"ep-answer-label\">F1 Interpretation</span>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：F1 ≥ 0.9（接近1，本题）</p>\n          <div class=\"ep-tip-box\">\"An F1 score of <strong>0.9900</strong> indicates the model achieves a <strong>near-perfect balance</strong> between precision and recall, performing very well at identifying undecided voters in the training set.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：F1 0.6–0.9（中等）</p>\n          <div class=\"ep-tip-box\">\"An F1 score of <strong>[X]</strong> indicates the model achieves a <strong>moderate balance</strong> between precision and recall. The model has reasonable but imperfect performance at identifying [target class] in the training set.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况三：F1 ≤ 0.5（接近0）</p>\n          <div class=\"ep-tip-box\">\"An F1 score of <strong>[X]</strong> indicates the model has a <strong>poor balance</strong> between precision and recall — either failing to identify positive cases (low recall) or too many false positives (low precision), suggesting <strong>poor performance</strong> on the training set.\"</div>\n          <p class=\"ep-h5\">Overall Conclusion <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 必须写！)</span></p>\n          <div class=\"ep-tip-box\">\"While the model performs well on the training set as evidenced by a low error rate and high F1 score, these results should be interpreted with <strong>caution</strong>. They may not reflect performance on new, unseen data. There is a <strong>risk of overfitting</strong>, so further evaluation using a separate test set is recommended.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td># Errors (all 3)</td><td>5, 12, 17</td><td>1</td></tr>\n            <tr><td>% Errors (all 3)</td><td>0.0044, 0.0140, 0.0085</td><td>1</td></tr>\n            <tr><td>F1 Score</td><td>0.9900</td><td>1</td></tr>\n            <tr><td>F1 Interpretation</td><td>Near-perfect balance</td><td>1</td></tr>\n            <tr><td>Overall conclusion</td><td>Good BUT training only, overfitting risk</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-5\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-5')\">\n          <span class=\"ep-subq-num\">Q5.5</span>\n          <span class=\"ep-subq-title\">Expected Class 1 at 500 cases in cumulative lift chart. Interpret AUC = 0.99909.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-h5\">① Expected Class 1 at 500 cases <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-info-box\">💡 Baseline = 随机抽样时抽到 Class 1 的概率 = Class 1 占总体的比例<br>857 来自 Error Report 的 Class 1 行，# Cases 列（不能猜！）</div>\n          <div class=\"ep-formula\">= 500 × (857 / 2000) = <strong>214.25</strong></div>\n          <p class=\"ep-h5\">② AUC Interpretation <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks)</span></p>\n          <table class=\"ep-mini-table\" style=\"margin-bottom:10px\">\n            <tr><th>AUC 范围</th><th>评级</th></tr>\n            <tr><td>&gt; 0.9</td><td>Excellent（极好）← 本题</td></tr>\n            <tr><td>0.8 – 0.9</td><td>Good（好）</td></tr>\n            <tr><td>0.7 – 0.8</td><td>Fair（一般）</td></tr>\n            <tr><td>0.5 – 0.7</td><td>Poor（差）</td></tr>\n            <tr><td>= 0.5</td><td>Random guess，无预测能力</td></tr>\n          </table>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：AUC &gt; 0.9（本题，Excellent）</p>\n          <div class=\"ep-tip-box\">\"An AUC of <strong>0.99909</strong> indicates the model performs <strong>extremely well</strong> at distinguishing between the two classes. It means that in approximately <strong>99.91%</strong> of randomly chosen pairs (one Class 0, one Class 1), the model correctly ranks the positive case higher than the negative.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：AUC 0.7–0.9（Good/Fair）</p>\n          <div class=\"ep-tip-box\">\"An AUC of <strong>[X]</strong> indicates the model has a <strong>good/fair</strong> ability to distinguish between the two classes. In approximately <strong>[X×100]%</strong> of randomly chosen pairs, the model correctly ranks the positive case higher than the negative.\"</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况三：AUC 接近0.5（Poor）</p>\n          <div class=\"ep-tip-box\">\"An AUC of <strong>[X]</strong> indicates the model has <strong>little ability</strong> to distinguish between the two classes, performing only slightly better than random guessing.\"</div>\n          <div class=\"ep-warn-box\">⚠️ <strong>Training Set Caveat ← 所有情况都必须写！（值2分）</strong><br><br>\"However, since this AUC is from the <strong>training set only</strong>, it may <strong>overestimate</strong> the model's true performance. The model could be overfitting and may perform worse on new, unseen data. A separate <strong>validation or test set</strong> is needed to confirm the model's generalisability.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Formula</td><td>500 × (857 / 2000)</td><td>1</td></tr>\n            <tr><td>Answer</td><td>214.25</td><td>1</td></tr>\n            <tr><td>AUC interpretation</td><td>99.91% pairs correctly ranked, Excellent</td><td>1</td></tr>\n            <tr><td>Training set caveat</td><td>May overestimate, need test set</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n    </div><!-- /q5 panel -->\n\n  </div><!-- /2025s1 session -->\n\n</div><!-- /ep-wrap -->\n\n<script>\nfunction epSession(id, btn) {\n  document.querySelectorAll('.ep-session').forEach(s => s.classList.remove('on'));\n  document.querySelectorAll('.ep-session-btn').forEach(b => b.classList.remove('on'));\n  document.getElementById(id).classList.add('on');\n  btn.classList.add('on');\n}\nfunction epQ(session, qid, btn) {\n  const prefix = session + '-';\n  document.querySelectorAll('[id^=\"' + prefix + '\"]').forEach(p => p.classList.remove('on'));\n  document.querySelectorAll('#s' + session + ' .ep-q-btn').forEach(b => b.classList.remove('on'));\n  document.getElementById(prefix + qid).classList.add('on');\n  btn.classList.add('on');\n}\nfunction epToggle(id) {\n  document.getElementById(id).classList.toggle('open');\n}\n<\/script>\n"}];

// ===== Zoom =====
const ZOOM_STEPS = [50, 75, 100, 125, 150, 175, 200];
let zoomIdx = 2; // always start at 100%

function applyZoom() {
  const z = ZOOM_STEPS[zoomIdx];
  document.getElementById('module-content').style.transform = `scale(${z/100})`;
  document.getElementById('module-content').style.marginBottom = z > 100 ? `${(z-100)*3}px` : '0';
  document.getElementById('zoom-label').textContent = z + '%';
  document.getElementById('zoom-out').disabled = zoomIdx === 0;
  document.getElementById('zoom-in').disabled  = zoomIdx === ZOOM_STEPS.length - 1;
}
function adjustZoom(dir) { zoomIdx = Math.max(0, Math.min(ZOOM_STEPS.length-1, zoomIdx+dir)); applyZoom(); }
function resetZoom() { zoomIdx = 2; applyZoom(); }
applyZoom();

// ===== Sidebar Toggle =====
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const collapsed = sb.classList.toggle('collapsed');
  localStorage.setItem('sb-collapsed', collapsed ? '1' : '0');
}
(function() {
  if (localStorage.getItem('sb-collapsed') === '1') {
    document.getElementById('sidebar').classList.add('collapsed');
  }
})();

// ===== State =====
let currentView = 'home';   // 'home' | 'subject' | 'module'
let currentSubject = null;
let currentModuleId = null;
let _navByCode = false;     // prevents hashchange loop

// ===== Helpers =====
function groupByWeek(mods) {
  const map = {};
  const order = [];
  for (const m of mods) {
    if (!map[m.week]) { map[m.week] = []; order.push(m.week); }
    map[m.week].push(m);
  }
  return order.map(w => ({ week: w, modules: map[w] }));
}

// ===== Breadcrumb =====
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = '<button class="breadcrumb-item" onclick="goHome()">Young Vault</button>';
  if (currentView === 'subject') {
    html += '<span class="breadcrumb-sep">›</span>';
    html += '<button class="breadcrumb-item active">MGMT90280</button>';
  } else if (currentView === 'module') {
    const mod = MODULES.find(m => m.id === currentModuleId);
    html += '<span class="breadcrumb-sep">›</span>';
    html += '<button class="breadcrumb-item" onclick="goSubject(\'mgmt90280\')">MGMT90280</button>';
    html += '<span class="breadcrumb-sep">›</span>';
    html += `<button class="breadcrumb-item active">${mod ? mod.title : ''}</button>`;
  }
  bc.innerHTML = html;
}

// ===== Sidebar =====
function renderSidebar() {
  const sbHome = document.getElementById('sb-home');
  const sbSubjectSection = document.getElementById('sb-subject-section');

  if (currentView === 'home') {
    sbHome.className = 'sidebar-home-btn active';
    sbSubjectSection.style.display = 'none';
  } else {
    sbHome.className = 'sidebar-home-btn';
    sbSubjectSection.style.display = 'block';
    renderSidebarModules();
  }
}

function renderSidebarModules() {
  const container = document.getElementById('sb-week-list');
  const groups = groupByWeek(MODULES);
  let html = '';
  for (const g of groups) {
    html += `<div class="sidebar-week-header">${g.week}</div>`;
    for (const m of g.modules) {
      const active = m.id === currentModuleId ? ' active' : '';
      html += `<button class="sidebar-module-btn${active}" onclick="goModule('${m.id}')"><div class="sb-texts"><span class="sb-en">${m.title}</span><span class="sb-zh">${m.subtitle}</span></div></button>`;
    }
  }
  container.innerHTML = html;
}

// ===== Subject module grid =====
function renderSubjectModules() {
  const container = document.getElementById('subject-module-list');
  const groups = groupByWeek(MODULES);
  let html = '';
  for (const g of groups) {
    html += `<div class="week-group">`;
    html += `<div class="week-group-header">${g.week}</div>`;
    html += `<div class="modules-grid">`;
    for (const m of g.modules) {
      html += `
        <div class="module-card" style="--card-color:${m.color}" onclick="goModule('${m.id}')" role="button" tabindex="0">
          <div class="module-card-week">${m.week}</div>
          <div class="module-card-title">${m.title}</div>
          <div class="module-card-subtitle">${m.subtitle}</div>
        </div>`;
    }
    html += `</div></div>`;
  }
  container.innerHTML = html;
}

// ===== View switching =====
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  currentView = name;
  document.getElementById('main').scrollTop = 0;
  document.getElementById('zoom-bar').classList.toggle('visible', name === 'module');
  renderBreadcrumb();
  renderSidebar();
}

function goHome() {
  currentSubject = null;
  currentModuleId = null;
  _navByCode = true; location.hash = ''; _navByCode = false;
  showView('home');
}

function goSubject(id) {
  currentSubject = id;
  currentModuleId = null;
  _navByCode = true; location.hash = 'subject/' + id; _navByCode = false;
  renderSubjectModules();
  showView('subject');
}

function goModule(id) {
  currentModuleId = id;
  const mod = MODULES.find(m => m.id === id);
  if (!mod) return;
  _navByCode = true; location.hash = 'module/' + id; _navByCode = false;

  const contentDiv = document.getElementById('module-content');
  contentDiv.innerHTML = mod.content;

  // Re-execute script tags so interactive features work
  contentDiv.querySelectorAll('script').forEach(old => {
    const s = document.createElement('script');
    s.textContent = old.textContent;
    old.replaceWith(s);
  });

  showView('module');
}

// ===== Hash-based navigation (browser back/forward) =====
window.addEventListener('hashchange', function() {
  if (_navByCode) return;
  const hash = location.hash.slice(1);
  if (hash.startsWith('module/')) goModule(hash.slice(7));
  else if (hash.startsWith('subject/')) goSubject(hash.slice(8));
  else goHome();
});

// ===== Keyboard support for cards =====
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.getAttribute('role') === 'button') {
    e.target.click();
  }
});

// ===== Init: restore position from hash on load/refresh =====
(function() {
  const hash = location.hash.slice(1);
  if (hash.startsWith('module/')) goModule(hash.slice(7));
  else if (hash.startsWith('subject/')) goSubject(hash.slice(8));
  else { renderBreadcrumb(); renderSidebar(); }
})();
</script>
