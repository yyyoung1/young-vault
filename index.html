onte Carlo Simulation 中，Uniform Distribution U(40, 60)，随机数 = 0.7，模拟值为？</div>\n    <div class=\"q-opts\">\n      <label><input type=\"radio\" name=\"mq1\" value=\"a\"> 44</label>\n      <label><input type=\"radio\" name=\"mq1\" value=\"b\"> 54</label>\n      <label><input type=\"radio\" name=\"mq1\" value=\"c\"> 50</label>\n      <label><input type=\"radio\" name=\"mq1\" value=\"d\"> 46</label>\n    </div>\n    <div class=\"q-fb\" id=\"mq1-fb\"></div>\n    <button class=\"btn btn-blue\" style=\"margin-top:10px\" onclick=\"check('mq1','b','x = 40 + (60-40) × 0.7 = 40 + 14 = 54')\">提交</button>\n  </div>\n  <div class=\"qblock\">\n    <div class=\"q-text\">Q2. 正态分布模拟 N(μ, σ) 的 Excel 公式是？</div>\n    <div class=\"q-opts\">\n      <label><input type=\"radio\" name=\"mq2\" value=\"a\"> NORM.DIST(RAND(), μ, σ, TRUE)</label>\n      <label><input type=\"radio\" name=\"mq2\" value=\"b\"> NORM.INV(RAND(), μ, σ)</label>\n      <label><input type=\"radio\" name=\"mq2\" value=\"c\"> RAND() × σ + μ</label>\n      <label><input type=\"radio\" name=\"mq2\" value=\"d\"> NORM.DIST(μ, σ, RAND(), FALSE)</label>\n    </div>\n    <div class=\"q-fb\" id=\"mq2-fb\"></div>\n    <button class=\"btn btn-blue\" style=\"margin-top:10px\" onclick=\"check('mq2','b','正态模拟：NORM.INV(随机数, μ, σ)。NORM.INV 是反函数，已知概率求 x 值。')\">提交</button>\n  </div>\n  <div class=\"qblock\">\n    <div class=\"q-text\">Q3. 模拟至少需要多少次迭代才有意义？</div>\n    <div class=\"q-opts\">\n      <label><input type=\"radio\" name=\"mq3\" value=\"a\"> 10 次</label>\n      <label><input type=\"radio\" name=\"mq3\" value=\"b\"> 100 次</label>\n      <label><input type=\"radio\" name=\"mq3\" value=\"c\"> 1000 次</label>\n      <label><input type=\"radio\" name=\"mq3\" value=\"d\"> 5 次</label>\n    </div>\n    <div class=\"q-fb\" id=\"mq3-fb\"></div>\n    <button class=\"btn btn-blue\" style=\"margin-top:10px\" onclick=\"check('mq3','c','Monte Carlo Simulation 需要至少 1000 次迭代（Min 1000 iterations）才能得到有意义的结果。')\">提交</button>\n  </div>\n</div>\n</div>\n\n<script>\nfunction show(id, btn) {\n  document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));\n  document.getElementById('sec-' + id).classList.add('on');\n  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('on'));\n  btn.classList.add('on');\n}\nfunction check(qid, correct, explanation) {\n  const sel = document.querySelector('input[name=\"' + qid + '\"]:checked');\n  const fb = document.getElementById(qid + '-fb');\n  if (!sel) { fb.textContent = '请先选择答案'; fb.className = 'q-fb err'; fb.style.display = 'block'; return; }\n  if (sel.value === correct) { fb.textContent = '✓ 正确！' + explanation; fb.className = 'q-fb ok'; }\n  else { fb.textContent = '✗ 再想想。提示：' + explanation; fb.className = 'q-fb err'; }\n  fb.style.display = 'block';\n}\nfunction calcUniform() {\n  const a = parseFloat(document.getElementById('ua').value);\n  const b = parseFloat(document.getElementById('ub').value);\n  const r = parseFloat(document.getElementById('ur').value);\n  const res = document.getElementById('ures');\n  if (isNaN(a)||isNaN(b)||isNaN(r)||r<0||r>1||a>=b){res.textContent='请检查输入值';res.style.display='block';return;}\n  const x = a + (b-a)*r;\n  res.textContent = 'x = ' + a + ' + (' + b + '-' + a + ') × ' + r + ' = ' + x.toFixed(4);\n  res.style.display = 'block';\n}\n<\/script>\n"}, {"id": "week6_descriptive_data_mining", "subject_id": "mgmt90280", "week": "Week 6", "title": "Descriptive Data Mining", "subtitle": "聚类 · 关联规则 · 文本挖掘", "color": "#6366F1", "content": "\n<h2 class=\"sr-only\">Week 6 Descriptive Data Mining 互动教学 — 涵盖聚类分析、关联规则与文本挖掘</h2>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n.wrap{padding:1.5rem 0}\n.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}\n.nav button{font-size:13px;padding:6px 14px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer}\n.nav button.on{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}\n.sec{display:none}.sec.on{display:block}\n.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}\n.formula{background:var(--color-background-secondary);border-left:3px solid var(--color-border-info);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14px;margin:10px 0;font-family:var(--font-mono,monospace);color:var(--color-text-primary)}\n.tip{border-left:3px solid var(--color-border-success);background:var(--color-background-success);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;margin:8px 0;color:var(--color-text-success)}\n.warn{border-left:3px solid var(--color-border-warning);background:var(--color-background-warning);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;margin:8px 0;color:var(--color-text-warning)}\n.danger{border-left:3px solid var(--color-border-danger);background:var(--color-background-danger);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;margin:8px 0;color:var(--color-text-danger)}\n.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:4px}\n.b-blue{background:var(--color-background-info);color:var(--color-text-info)}\n.b-green{background:var(--color-background-success);color:var(--color-text-success)}\n.b-warn{background:var(--color-background-warning);color:var(--color-text-warning)}\n.b-red{background:var(--color-background-danger);color:var(--color-text-danger)}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.step-tab{font-size:12px;padding:5px 12px;border-radius:16px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;margin-right:6px;margin-bottom:6px}\n.step-tab.on{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}\n.step-panel{display:none}.step-panel.on{display:block}\n.ans-box{display:none;margin-top:10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;background:var(--color-background-secondary);font-size:13px;line-height:1.7;color:var(--color-text-primary)}\n.ans-box.show{display:block}\n.reveal-btn{font-size:12px;padding:5px 14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;margin-top:8px;color:var(--color-text-secondary)}\n.tbl{width:100%;border-collapse:collapse;font-size:13px}\n.tbl th{background:var(--color-background-secondary);padding:7px 10px;text-align:left;border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);font-weight:500}\n.tbl td{padding:7px 10px;border:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}\n.tbl .hi{background:var(--color-background-success)}\n.num-circle{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--color-background-info);color:var(--color-text-info);font-size:12px;font-weight:500;margin-right:8px;flex-shrink:0}\n.row-step{display:flex;align-items:flex-start;gap:8px;margin:8px 0;font-size:13px;line-height:1.6;color:var(--color-text-primary)}\n.ask-btn{font-size:13px;padding:8px 16px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;margin-top:12px;color:var(--color-text-secondary)}\nh3{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px}\np{font-size:13px;line-height:1.7;color:var(--color-text-primary);margin:6px 0}\n<\/style>\n\n<div class=\"wrap\">\n\n<div class=\"nav\">\n  <button class=\"on\" onclick=\"sw('overview',this)\">知识点总览</button>\n  <button onclick=\"sw('cluster',this)\">聚类分析</button>\n  <button onclick=\"sw('assoc',this)\">关联规则</button>\n  <button onclick=\"sw('text',this)\">文本挖掘</button>\n  <button onclick=\"sw('practice',this)\">模拟练习</button>\n  <button onclick=\"sw('tips',this)\">易错点</button>\n</div>\n\n<!-- ====== OVERVIEW ====== -->\n<div id=\"overview\" class=\"sec on\">\n  <div class=\"card\">\n    <h3>Week 6 — Descriptive Data Mining 全图</h3>\n    <p style=\"margin-bottom:12px\">本周三大知识点，全部属于考察可能性大（4星）：</p>\n    <div class=\"grid2\" style=\"gap:10px\">\n      <div style=\"border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px\">\n        <div style=\"font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)\">知识点1 — Cluster Analysis</div>\n        <p>把观测数据按相似性分组。<br>核心问题：\"这个新样本属于哪组？\"</p>\n        <div style=\"margin-top:8px\">\n          <span class=\"badge b-blue\">Euclidean Distance</span>\n          <span class=\"badge b-blue\">Matching Coef</span>\n          <span class=\"badge b-blue\">Jaccard</span>\n          <span class=\"badge b-blue\">K-means</span>\n        </div>\n      </div>\n      <div style=\"border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px\">\n        <div style=\"font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)\">知识点2 — Association Rules</div>\n        <p>发现\"买了A就会买B\"的购买规律。<br>核心指标：Confidence + Lift Ratio</p>\n        <div style=\"margin-top:8px\">\n          <span class=\"badge b-warn\">Antecedent (if)</span>\n          <span class=\"badge b-warn\">Consequent (then)</span>\n          <span class=\"badge b-warn\">Lift Ratio</span>\n        </div>\n      </div>\n    </div>\n    <div style=\"border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;margin-top:10px\">\n      <div style=\"font-size:13px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)\">知识点3 — Text Mining</div>\n      <p>把文字（定性数据）转成数字（定量数据），然后再对文本做聚类分析。考察的是读图解读能力。</p>\n    </div>\n  </div>\n  <div class=\"card\">\n    <h3>本章考点速查</h3>\n    <table class=\"tbl\">\n      <tr><th>知识点</th><th>题型</th><th>核心考察</th></tr>\n      <tr><td>Cluster Analysis</td><td>简答题 + 计算题</td><td>计算Euclidean Distance，读Cluster Center表，描述每组特征</td></tr>\n      <tr><td>Association Rules</td><td>简答题 + 计算题</td><td>计算Confidence / Lift Ratio，解释规则含义</td></tr>\n      <tr><td>Text Mining</td><td>简答题</td><td>读图，描述Cluster的文字含义</td></tr>\n    </table>\n  </div>\n</div>\n\n<!-- ====== CLUSTER ====== -->\n<div id=\"cluster\" class=\"sec\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px\">\n    <button class=\"step-tab on\" onclick=\"sc('c1',this)\">定义</button>\n    <button class=\"step-tab\" onclick=\"sc('c2',this)\">Euclidean Distance</button>\n    <button class=\"step-tab\" onclick=\"sc('c3',this)\">Matching Coefficient</button>\n    <button class=\"step-tab\" onclick=\"sc('c4',this)\">Jaccard's Coefficient</button>\n    <button class=\"step-tab\" onclick=\"sc('c5',this)\">K-means 读图</button>\n  </div>\n\n  <div id=\"c1\" class=\"step-panel on\">\n    <div class=\"card\">\n      <h3>什么是 Cluster Analysis？</h3>\n      <p>Cluster Analysis（聚类分析）的核心目标是把观测数据分成几组，让同一组内的数据尽量相似，不同组之间尽量不同。</p>\n      <div style=\"margin:12px 0\">\n        <div class=\"row-step\"><span class=\"num-circle\">1</span><span>Marketing 中最常见的应用就是 <strong>Market Segmentation（市场细分）</strong>，把客户按特征分成不同的同质群体</span></div>\n        <div class=\"row-step\"><span class=\"num-circle\">2</span><span>也可以在数据准备阶段用来识别 <strong>outliers（异常值）</strong></span></div>\n        <div class=\"row-step\"><span class=\"num-circle\">3</span><span>聚类是 <strong>Descriptive（描述性）</strong>分析，不是预测性分析——它描述数据现状，不预测未来</span></div>\n      </div>\n      <div class=\"tip\">记忆点：Cluster = 分组 + 同组相似 + 异组不同</div>\n    </div>\n    <div class=\"card\">\n      <h3>两大类相似度衡量方法</h3>\n      <table class=\"tbl\">\n        <tr><th>数据类型</th><th>方法</th><th>适用场景</th></tr>\n        <tr><td>数值型（Numerical）</td><td>Euclidean Distance</td><td>身高、收入、分数等连续变量</td></tr>\n        <tr><td>分类型（Categorical）</td><td>Matching Coefficient / Jaccard</td><td>是/否、男/女等0-1编码变量</td></tr>\n      </table>\n    </div>\n  </div>\n\n  <div id=\"c2\" class=\"step-panel\">\n    <div class=\"card\">\n      <h3>Euclidean Distance — 数值型数据的相似度</h3>\n      <p>衡量两个观察值之间的\"直线距离\"。距离越小 = 两者越相似。</p>\n      <div class=\"formula\">d(u,v) = √[(u₁-v₁)² + (u₂-v₂)² + ... + (uₙ-vₙ)²]</div>\n      <div class=\"tip\">口诀：每个变量做差 → 平方 → 全部相加 → 开根号</div>\n      <div style=\"margin-top:14px\">\n        <p style=\"font-weight:500;margin-bottom:8px\">为什么用 z-score 标准化？</p>\n        <div class=\"formula\">z(u_j) = (u_j - 变量平均值) / 变量标准差</div>\n        <p>如果不标准化，数值大的变量（如收入10万）会\"压倒\"数值小的变量（如评分5分），导致距离计算失真。标准化后所有变量都在同一尺度上比较。</p>\n        <div class=\"warn\">表格里出现负数和小数不用慌！这正是标准化后的 z-score 值。负数 = 低于平均，正数 = 高于平均。</div>\n      </div>\n    </div>\n    <div class=\"card\">\n      <h3>如何把新观察值分配到某个 Cluster？</h3>\n      <div class=\"row-step\"><span class=\"num-circle\">1</span><span>计算新样本到每个 Cluster 质心（centroid）的 Euclidean Distance</span></div>\n      <div class=\"row-step\"><span class=\"num-circle\">2</span><span>比较三个距离，找最小值</span></div>\n      <div class=\"row-step\"><span class=\"num-circle\">3</span><span>把新样本分配到距离最小的 Cluster</span></div>\n      <div class=\"tip\" style=\"margin-top:10px\">结论句模板：<br>\"The new observation should be placed in Cluster X because it has the smallest Euclidean distance (d = X.XX) to that cluster's centroid, indicating the greatest similarity.\"</div>\n    </div>\n  </div>\n\n  <div id=\"c3\" class=\"step-panel\">\n    <div class=\"card\">\n      <h3>Matching Coefficient — 分类型数据</h3>\n      <p>用于变量全是 0 或 1 的情况（如：是否女性、是否已婚、是否有贷款）。</p>\n      <div class=\"formula\">Matching Coefficient = 匹配的变量数 / 总变量数</div>\n      <p style=\"margin-top:10px;font-weight:500\">实战例子：</p>\n      <table class=\"tbl\" style=\"margin-top:8px\">\n        <tr><th>变量</th><th>Obs 1</th><th>Obs 4</th><th>匹配？</th></tr>\n        <tr><td>Female</td><td>1</td><td>1</td><td class=\"hi\">✓ 匹配</td></tr>\n        <tr><td>Married</td><td>0</td><td>1</td><td>✗ 不匹配</td></tr>\n        <tr><td>Loan</td><td>0</td><td>0</td><td class=\"hi\">✓ 匹配</td></tr>\n        <tr><td>Mortgage</td><td>0</td><td>0</td><td class=\"hi\">✓ 匹配</td></tr>\n      </table>\n      <div class=\"formula\" style=\"margin-top:10px\">MC = 3/4 = 0.75</div>\n      <div class=\"warn\" style=\"margin-top:8px\">注意：Matching Coefficient 把\"两个都是0\"也算作匹配，这可能高估了相似度。这就是 Jaccard 存在的原因。</div>\n    </div>\n  </div>\n\n  <div id=\"c4\" class=\"step-panel\">\n    <div class=\"card\">\n      <h3>Jaccard's Coefficient — 改进版</h3>\n      <p>Jaccard 不把\"两个都是0\"算作相似，因为\"两者都没有某特征\"不代表它们相似。</p>\n      <div class=\"formula\">Jaccard = 匹配的非零变量数 / (总变量数 - 两者都为0的变量数)</div>\n      <p style=\"margin-top:12px;font-weight:500\">与上方同样的例子：</p>\n      <table class=\"tbl\" style=\"margin-top:8px\">\n        <tr><th>变量</th><th>Obs 1</th><th>Obs 4</th><th>情况</th></tr>\n        <tr><td>Female</td><td>1</td><td>1</td><td class=\"hi\">非零匹配</td></tr>\n        <tr><td>Married</td><td>0</td><td>1</td><td>不匹配</td></tr>\n        <tr><td>Loan</td><td>0</td><td>0</td><td style=\"background:var(--color-background-warning)\">双零（排除）</td></tr>\n        <tr><td>Mortgage</td><td>0</td><td>0</td><td style=\"background:var(--color-background-warning)\">双零（排除）</td></tr>\n      </table>\n      <div class=\"formula\" style=\"margin-top:10px\">Jaccard = 1 / (4 - 2) = 1/2 = 0.5</div>\n      <div class=\"tip\">记忆口诀：Jaccard 剔除\"双零\"，只看两者都有的特征是否匹配</div>\n    </div>\n    <div class=\"card\">\n      <h3>Matching vs Jaccard 一眼区分</h3>\n      <table class=\"tbl\">\n        <tr><th></th><th>Matching Coefficient</th><th>Jaccard's Coefficient</th></tr>\n        <tr><td>双零算相似？</td><td>✓ 算</td><td>✗ 不算（排除）</td></tr>\n        <tr><td>适合场景</td><td>所有0-1变量都同等重要</td><td>特征的\"缺失\"不代表相似</td></tr>\n        <tr><td>结果偏向</td><td>偏高（会高估相似度）</td><td>更保守</td></tr>\n      </table>\n    </div>\n  </div>\n\n  <div id=\"c5\" class=\"step-panel\">\n    <div class=\"card\">\n      <h3>K-means 输出表解读</h3>\n      <p style=\"margin-bottom:10px\">考试最常考的是：给你三张表，让你描述每个 Cluster 的特征。</p>\n      <p style=\"font-weight:500;margin-bottom:6px\">表1：Cluster Centers（质心）</p>\n      <p>每行是一个 Cluster，每列是一个变量的平均 z-score。</p>\n      <div class=\"tip\">正数 = 该 Cluster 在这个变量上高于平均；负数 = 低于平均。数值越大越极端。</div>\n      <p style=\"font-weight:500;margin:12px 0 6px\">表2：Inter-Cluster Distances（簇间距离）</p>\n      <p>两个 Cluster 之间的距离。距离越大 = 两组差异越明显 = 分类效果越好。</p>\n      <p style=\"font-weight:500;margin:12px 0 6px\">表3：Cluster Summary（各组概况）</p>\n      <p>Size = 该组有多少个样本；Avg Distance = 组内成员平均离质心多远（越小越紧密）。</p>\n      <div class=\"warn\" style=\"margin-top:10px\">答题模板（必须包含3个要素）：<br>\n      \"Cluster X contains [Size] ([%]%) of observations and consists of [对变量1的描述] and [对变量2的描述].\"</div>\n\n<!-- ========================================================\n     K-means 输出表解读 — 互动例子演示\n     ======================================================== -->\n\n<div class=\"example-demo-section\">\n\n  <h3>📊 例子演示：读懂三张表</h3>\n  <p class=\"demo-intro\">以下是一个真实考试风格的例子。先看三张表，再看下方的解读。</p>\n\n  <!-- ── 场景说明 ── -->\n  <div class=\"scenario-box\">\n    <strong>场景：</strong>某银行对 150 位客户做了 K-means 聚类（k=3），变量包括\n    Age（年龄）、Income（收入）、Spending（消费）、DebtRatio（负债率）。\n    下面是输出的三张表：\n  </div>\n\n  <!-- ── 表1：Cluster Centers ── -->\n  <h4>表1：Cluster Centers（质心）</h4>\n  <p class=\"table-hint\">每格是该变量在该 Cluster 的平均 z-score（已标准化）</p>\n  <div class=\"table-wrapper\">\n    <table class=\"km-table\">\n      <thead>\n        <tr>\n          <th>Variable</th>\n          <th>Cluster 1</th>\n          <th>Cluster 2</th>\n          <th>Cluster 3</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td>Age</td>\n          <td class=\"neg\">−1.20</td>\n          <td class=\"pos\">+0.85</td>\n          <td class=\"neutral\">+0.10</td>\n        </tr>\n        <tr>\n          <td>Income</td>\n          <td class=\"neg\">−0.90</td>\n          <td class=\"pos\">+1.30</td>\n          <td class=\"neutral\">−0.05</td>\n        </tr>\n        <tr>\n          <td>Spending</td>\n          <td class=\"pos\">+1.10</td>\n          <td class=\"pos\">+0.70</td>\n          <td class=\"neg\">−0.95</td>\n        </tr>\n        <tr>\n          <td>DebtRatio</td>\n          <td class=\"pos\">+1.40</td>\n          <td class=\"neg\">−0.80</td>\n          <td class=\"neutral\">+0.05</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <!-- 颜色图例 -->\n  <div class=\"legend\">\n    <span class=\"legend-pos\">■ 正数 = 高于平均</span>\n    <span class=\"legend-neg\">■ 负数 = 低于平均</span>\n    <span class=\"legend-neu\">■ 接近0 = 约等于平均</span>\n  </div>\n\n  <!-- ── 表2：Inter-Cluster Distances ── -->\n  <h4>表2：Inter-Cluster Distances（簇间距离）</h4>\n  <div class=\"table-wrapper\">\n    <table class=\"km-table\">\n      <thead>\n        <tr>\n          <th></th>\n          <th>Cluster 1</th>\n          <th>Cluster 2</th>\n          <th>Cluster 3</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td><strong>Cluster 1</strong></td>\n          <td>0</td>\n          <td>4.82</td>\n          <td>3.15</td>\n        </tr>\n        <tr>\n          <td><strong>Cluster 2</strong></td>\n          <td>4.82</td>\n          <td>0</td>\n          <td>3.67</td>\n        </tr>\n        <tr>\n          <td><strong>Cluster 3</strong></td>\n          <td>3.15</td>\n          <td>3.67</td>\n          <td>0</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <!-- ── 表3：Cluster Summary ── -->\n  <h4>表3：Cluster Summary（各组概况）</h4>\n  <div class=\"table-wrapper\">\n    <table class=\"km-table\">\n      <thead>\n        <tr>\n          <th>Cluster</th>\n          <th>Size</th>\n          <th>% of Total</th>\n          <th>Avg Distance from Centroid</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td>1</td>\n          <td>38</td>\n          <td>25.3%</td>\n          <td>1.24</td>\n        </tr>\n        <tr>\n          <td>2</td>\n          <td>52</td>\n          <td>34.7%</td>\n          <td>1.05</td>\n        </tr>\n        <tr>\n          <td>3</td>\n          <td>60</td>\n          <td>40.0%</td>\n          <td>1.31</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <!-- ── 互动答题区 ── -->\n  <div class=\"quiz-prompt\">\n    <strong>🤔 考试问题：</strong>请描述每个 Cluster 的特征，并写出标准答题句。\n  </div>\n\n  <!-- Cluster 按钮 -->\n  <div class=\"cluster-btn-group\">\n    <button class=\"cluster-btn\" onclick=\"showAnswer(1)\">解读 Cluster 1</button>\n    <button class=\"cluster-btn\" onclick=\"showAnswer(2)\">解读 Cluster 2</button>\n    <button class=\"cluster-btn\" onclick=\"showAnswer(3)\">解读 Cluster 3</button>\n  </div>\n\n  <!-- 答案区域 -->\n  <div id=\"answer-box\" class=\"answer-box\" style=\"display:none;\"></div>\n\n  <!-- ── 关键距离解读 ── -->\n  <div class=\"insight-box\">\n    <strong>💡 距离表怎么用？</strong><br>\n    Cluster 1 和 Cluster 2 距离最远（4.82）→ 这两组差异最大，最容易区分。<br>\n    Cluster 1 和 Cluster 3 距离最近（3.15）→ 这两组有些相似之处。\n  </div>\n\n</div>\n\n<style>\n  .example-demo-section {\n    margin-top: 1.2rem;\n    padding: 1.25rem;\n    background: var(--color-background-primary);\n    border-radius: var(--border-radius-lg);\n    border: 0.5px solid var(--color-border-tertiary);\n  }\n  .example-demo-section h3 {\n    font-size: 15px;\n    font-weight: 600;\n    color: var(--color-text-primary);\n    margin-bottom: 6px;\n  }\n  .example-demo-section h4 {\n    margin-top: 1.2rem;\n    margin-bottom: 4px;\n    color: var(--color-text-primary);\n    font-size: 13px;\n    font-weight: 600;\n  }\n  .demo-intro { color: var(--color-text-secondary); font-size: 13px; margin-bottom: 1rem; }\n  .scenario-box {\n    background: var(--color-background-info);\n    border-left: 3px solid var(--color-border-info);\n    padding: 10px 14px;\n    border-radius: 0 var(--border-radius-md) var(--border-radius-md) 0;\n    color: var(--color-text-info);\n    margin-bottom: 1.2rem;\n    font-size: 13px;\n  }\n  .table-hint { color: var(--color-text-tertiary); font-size: 12px; margin-bottom: 6px; }\n  .table-wrapper { overflow-x: auto; margin-bottom: 6px; }\n  .km-table {\n    width: 100%;\n    border-collapse: collapse;\n    font-size: 13px;\n  }\n  .km-table th {\n    background: var(--color-background-secondary);\n    color: var(--color-text-secondary);\n    font-weight: 500;\n    padding: 7px 10px;\n    text-align: center;\n    border: 0.5px solid var(--color-border-tertiary);\n  }\n  .km-table td {\n    padding: 7px 10px;\n    text-align: center;\n    border: 0.5px solid var(--color-border-tertiary);\n    color: var(--color-text-primary);\n  }\n  .km-table td:first-child { font-weight: 500; text-align: left; }\n  .pos  { color: var(--color-text-success); background: var(--color-background-success); font-weight: 600; }\n  .neg  { color: var(--color-text-danger);  background: var(--color-background-danger);  font-weight: 600; }\n  .neutral { color: var(--color-text-secondary); }\n  .legend {\n    display: flex; gap: 1rem; font-size: 12px;\n    margin-bottom: 1rem; flex-wrap: wrap;\n    color: var(--color-text-tertiary);\n  }\n  .legend-pos { color: var(--color-text-success); }\n  .legend-neg { color: var(--color-text-danger); }\n  .legend-neu { color: var(--color-text-tertiary); }\n  .quiz-prompt {\n    background: var(--color-background-warning);\n    border-left: 3px solid var(--color-border-warning);\n    padding: 10px 14px;\n    border-radius: 0 var(--border-radius-md) var(--border-radius-md) 0;\n    color: var(--color-text-warning);\n    margin: 1.2rem 0 0.8rem;\n    font-size: 13px;\n  }\n  .cluster-btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }\n  .cluster-btn {\n    padding: 5px 14px;\n    background: var(--color-background-primary);\n    color: var(--color-text-secondary);\n    border: 0.5px solid var(--color-border-secondary);\n    border-radius: var(--border-radius-md);\n    cursor: pointer;\n    font-size: 12px;\n    font-family: inherit;\n    transition: background 0.15s, color 0.15s;\n  }\n  .cluster-btn:hover {\n    background: var(--color-background-info);\n    color: var(--color-text-info);\n    border-color: var(--color-border-info);\n  }\n  .answer-box {\n    background: var(--color-background-secondary);\n    border: 0.5px solid var(--color-border-tertiary);\n    border-radius: var(--border-radius-md);\n    padding: 12px;\n    color: var(--color-text-primary);\n    font-size: 13px;\n    line-height: 1.7;\n    margin-bottom: 10px;\n  }\n  .answer-box .template-line {\n    margin-top: 10px;\n    padding: 8px 12px;\n    background: var(--color-background-success);\n    border-radius: var(--border-radius-sm);\n    font-style: italic;\n    color: var(--color-text-success);\n    font-size: 13px;\n  }\n  .insight-box {\n    background: var(--color-background-secondary);\n    border-left: 3px solid var(--color-border-primary);\n    padding: 10px 14px;\n    border-radius: 0 var(--border-radius-md) var(--border-radius-md) 0;\n    color: var(--color-text-secondary);\n    font-size: 13px;\n    line-height: 1.6;\n    margin-top: 1rem;\n  }\n<\/style>\n\n<script>\n  const answers = {\n    1: {\n      title: \"Cluster 1 — 「年轻高负债消费者」\",\n      points: [\n        \"Age: <strong>−1.20</strong> → 年龄明显低于平均，属于<strong>年轻</strong>客户\",\n        \"Income: <strong>−0.90</strong> → 收入低于平均，属于<strong>低收入</strong>群体\",\n        \"Spending: <strong>+1.10</strong> → 消费远高于平均，<strong>爱消费</strong>\",\n        \"DebtRatio: <strong>+1.40</strong> → 负债率远高于平均，<strong>高风险</strong>\"\n      ],\n      template: `\"Cluster 1 contains 38 (25.3%) of observations and consists of customers who are <strong>relatively young and low-income</strong>, yet exhibit <strong>high spending behaviour and a significantly elevated debt ratio</strong>, suggesting a high-risk financial profile.\"`\n    },\n    2: {\n      title: \"Cluster 2 — 「年长高收入低风险」\",\n      points: [\n        \"Age: <strong>+0.85</strong> → 年龄高于平均，属于<strong>较年长</strong>客户\",\n        \"Income: <strong>+1.30</strong> → 收入远高于平均，属于<strong>高收入</strong>群体\",\n        \"Spending: <strong>+0.70</strong> → 消费略高于平均，<strong>适度消费</strong>\",\n        \"DebtRatio: <strong>−0.80</strong> → 负债率低于平均，<strong>财务稳健</strong>\"\n      ],\n      template: `\"Cluster 2 contains 52 (34.7%) of observations and consists of customers who are <strong>older and high-income</strong>, with <strong>moderate spending and low debt ratio</strong>, indicating a financially stable and low-risk group.\"`\n    },\n    3: {\n      title: \"Cluster 3 — 「中等收入低消费」\",\n      points: [\n        \"Age: <strong>+0.10</strong> → 年龄接近平均，<strong>中年</strong>客户\",\n        \"Income: <strong>−0.05</strong> → 收入接近平均，<strong>中等收入</strong>\",\n        \"Spending: <strong>−0.95</strong> → 消费明显低于平均，<strong>节俭型</strong>\",\n        \"DebtRatio: <strong>+0.05</strong> → 负债率接近平均，<strong>风险中等</strong>\"\n      ],\n      template: `\"Cluster 3 contains 60 (40.0%) of observations and consists of customers who are <strong>average in age and income</strong>, but demonstrate <strong>notably low spending behaviour</strong>, suggesting a conservative or savings-oriented consumer profile.\"`\n    }\n  };\n\n  function showAnswer(n) {\n    const a = answers[n];\n    const box = document.getElementById('answer-box');\n    box.style.display = 'block';\n    box.innerHTML = `\n      <strong>${a.title}</strong>\n      <ul style=\"margin:0.6rem 0 0 1rem; padding:0;\">\n        ${a.points.map(p => `<li style=\"margin-bottom:4px\">${p}</li>`).join('')}\n      </ul>\n      <div class=\"template-line\">\n        ✍️ 标准答题句：<br>${a.template}\n      </div>\n    `;\n    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n  }\n<\/script>\n\n    </div>\n  </div>\n</div>\n\n<!-- ====== ASSOCIATION ====== -->\n<div id=\"assoc\" class=\"sec\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px\">\n    <button class=\"step-tab on\" onclick=\"sa('a1',this)\">基本概念</button>\n    <button class=\"step-tab\" onclick=\"sa('a2',this)\">Confidence</button>\n    <button class=\"step-tab\" onclick=\"sa('a3',this)\">Lift Ratio</button>\n    <button class=\"step-tab\" onclick=\"sa('a4',this)\">读表格</button>\n  </div>\n\n  <div id=\"a1\" class=\"step-panel on\">\n    <div class=\"card\">\n      <h3>Association Rules 是什么？</h3>\n      <p>关联规则就是\"If-Then\"语句，描述某些东西被同时购买的可能性。</p>\n      <div style=\"margin:12px 0;padding:12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md)\">\n        <p style=\"font-size:13px;color:var(--color-text-secondary)\">例子：</p>\n        <p style=\"margin-top:4px;font-size:14px\">IF [RetinaDisplay, Stand] → THEN [Speakers]</p>\n        <p style=\"margin-top:4px;font-size:12px;color:var(--color-text-secondary)\">= 如果顾客买了视网膜屏iPad和支架，那么他/她也很可能同时买音响</p>\n      </div>\n      <table class=\"tbl\" style=\"margin-top:10px\">\n        <tr><th>术语</th><th>中文</th><th>含义</th></tr>\n        <tr><td>Antecedent</td><td>先行项（IF部分）</td><td>触发条件，买了什么</td></tr>\n        <tr><td>Consequent</td><td>结果项（THEN部分）</td><td>被推断会买的东西</td></tr>\n        <tr><td>Support</td><td>支持度</td><td>同时买A和C的交易数量</td></tr>\n        <tr><td>A-Support</td><td>先行项支持度</td><td>只买了A（先行项）的交易数量</td></tr>\n        <tr><td>C-Support</td><td>结果项支持度</td><td>只买了C（结果项）的交易数量</td></tr>\n      </table>\n    </div>\n  </div>\n\n  <div id=\"a2\" class=\"step-panel\">\n    <div class=\"card\">\n      <h3>Confidence（置信度）</h3>\n      <p>回答\"在买了先行项的人里，有多少比例也买了结果项？\"</p>\n      <div class=\"formula\">Confidence = Support(A and C) / Support(A)</div>\n      <div class=\"formula\">= 同时买A和C的交易数 / 只买了A的交易数</div>\n      <p style=\"margin-top:12px;font-weight:500\">例题（Rule 7）：</p>\n      <table class=\"tbl\" style=\"margin-top:6px\">\n        <tr><th>A-Support</th><th>C-Support</th><th>Support</th><th>Antecedent</th><th>Consequent</th></tr>\n        <tr><td>552</td><td>689</td><td>282</td><td>Speakers</td><td>32GB</td></tr>\n      </table>\n      <div class=\"formula\" style=\"margin-top:10px\">Confidence = 282 / 552 = 0.5109 = <strong>51.09%</strong></div>\n      <div class=\"tip\" style=\"margin-top:8px\">\n        <strong>解读句模板：</strong><br>\n        \"For [Confidence]% of the transactions when [Antecedent] is purchased, [Consequent] is also purchased.\"<br><br>\n        套入数字：For 51.09% of the transactions when Speakers are purchased, 32GB is also purchased.\n      </div>\n    </div>\n  </div>\n\n  <div id=\"a3\" class=\"step-panel\">\n    <div class=\"card\">\n      <h3>Lift Ratio（提升比率）</h3>\n      <p>回答\"这个规则比随机猜测好多少？\"Lift > 1 说明规则有效。</p>\n      <div class=\"formula\">Lift Ratio = Confidence / (C-Support / Total transactions)</div>\n      <p style=\"margin-top:10px;font-weight:500\">例题（Rule 7 续）：</p>\n      <div class=\"formula\">Lift = (282/552) / (689/2000) = 0.5109 / 0.3445 = <strong>1.483</strong></div>\n      <div class=\"tip\" style=\"margin-top:10px\">\n        <strong>Lift Ratio 解读：</strong><br>\n        Lift = 1.48 → 高于1 → 正向关联有效<br><br>\n        <strong>解读句模板：</strong><br>\n        \"A lift ratio of [X] means that a transaction in which [Antecedent] is purchased is [X-1 as %}] more likely to also include [Consequent] than a randomly selected transaction.\"<br><br>\n        套入数字：A lift ratio of 1.48 means that a transaction where Speakers are purchased is 48% more likely to also include 32GB than a randomly selected transaction.\n      </div>\n      <div class=\"warn\" style=\"margin-top:10px\">\n        Lift 解读中\"提升多少%\"= (Lift - 1) × 100%<br>\n        Lift = 2.27 → 提升 127%（不是 227%！）\n      </div>\n    </div>\n    <div class=\"card\">\n      <h3>Lift Ratio 三种情况</h3>\n      <table class=\"tbl\">\n        <tr><th>Lift 值</th><th>含义</th></tr>\n        <tr><td>Lift &gt; 1</td><td>正向关联，先行项能有效预测结果项，规则有价值</td></tr>\n        <tr><td>Lift = 1</td><td>两者独立，没有关联关系</td></tr>\n        <tr><td>Lift &lt; 1</td><td>负向关联，买了A反而不太会买C</td></tr>\n      </table>\n    </div>\n  </div>\n\n  <div id=\"a4\" class=\"step-panel\">\n    <div class=\"card\">\n      <h3>如何快速读懂 Association Rules 表格</h3>\n      <p style=\"margin-bottom:10px\">表格通常按某个指标排序，考题常问\"找 Lift Ratio 最大的规则\"。</p>\n      <div class=\"row-step\"><span class=\"num-circle\">1</span><span>看 Antecedent 列 = IF部分（触发条件）</span></div>\n      <div class=\"row-step\"><span class=\"num-circle\">2</span><span>看 Consequent 列 = THEN部分（被推断购买的东西）</span></div>\n      <div class=\"row-step\"><span class=\"num-circle\">3</span><span>找 Lift Ratio 最大的行 = 最有效的规则</span></div>\n      <div class=\"row-step\"><span class=\"num-circle\">4</span><span>Confidence 列为空时：手动用公式算 Support / A-Support</span></div>\n      <div class=\"tip\" style=\"margin-top:10px\">\n        <strong>解读最大 Lift Ratio 的句式：</strong><br>\n        \"Rule [X] has the largest lift ratio of [Y]. The antecedent is [A] and the consequent is [C]. If [A] is purchased, then [C] is also likely to be purchased. With a lift ratio of [Y] (> 1), there is a positive association between [A] and [C].\"\n      </div>\n\n<div class=\"ar-example-section\">\n  <h3>📋 例子演示：读一张真实的 AR 表格</h3>\n  <p class=\"ar-intro\">超市购物数据，共 1000 笔交易。按照上面4步来读这张表：</p>\n\n  <div class=\"ar-table-wrapper\">\n    <table class=\"ar-table\">\n      <thead>\n        <tr><th>#</th><th>Antecedent (IF)</th><th>Consequent (THEN)</th><th>Support</th><th>A-Support</th><th>Confidence</th><th>Lift Ratio</th></tr>\n      </thead>\n      <tbody>\n        <tr><td>1</td><td>Bread</td><td>Butter</td><td>15%</td><td>40%</td><td>37.5%</td><td>1.12</td></tr>\n        <tr class=\"ar-highlight-row\">\n          <td>2</td><td>Milk, Eggs</td><td>Cheese</td><td>12%</td><td>25%</td>\n          <td class=\"conf-blank\" data-support=\"12\" data-asupport=\"25\">❓</td>\n          <td class=\"ar-best-lift\">2.84 ⭐</td>\n        </tr>\n        <tr><td>3</td><td>Wine</td><td>Cheese</td><td>8%</td><td>30%</td><td>26.7%</td><td>1.95</td></tr>\n        <tr><td>4</td><td>Diapers</td><td>Beer</td><td>6%</td><td>18%</td><td>33.3%</td><td>0.87</td></tr>\n        <tr><td>5</td><td>Bread, Milk</td><td>Eggs</td><td>10%</td><td>35%</td><td>28.6%</td><td>1.43</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"ar-quiz-area\">\n    <div class=\"ar-question\">\n      <div class=\"ar-q-label\">🔍 Step 3：哪条规则 Lift Ratio 最大？</div>\n      <div class=\"ar-btn-group\">\n        <button class=\"ar-btn\" onclick=\"checkLift('wrong')\">Rule 1 (1.12)</button>\n        <button class=\"ar-btn\" onclick=\"checkLift('correct')\">Rule 2 (2.84)</button>\n        <button class=\"ar-btn\" onclick=\"checkLift('wrong')\">Rule 3 (1.95)</button>\n        <button class=\"ar-btn\" onclick=\"checkLift('wrong')\">Rule 4 (0.87)</button>\n      </div>\n      <div id=\"lift-feedback\" class=\"ar-feedback\" style=\"display:none\"></div>\n    </div>\n    <div class=\"ar-question\" style=\"margin-top:10px\">\n      <div class=\"ar-q-label\">🧮 Step 4：Rule 2 的 Confidence 是多少？（Support ÷ A-Support）</div>\n      <div class=\"ar-btn-group\">\n        <button class=\"ar-btn\" onclick=\"checkConf('wrong')\">30%</button>\n        <button class=\"ar-btn\" onclick=\"checkConf('wrong')\">25%</button>\n        <button class=\"ar-btn\" onclick=\"checkConf('correct')\">48%</button>\n        <button class=\"ar-btn\" onclick=\"checkConf('wrong')\">12%</button>\n      </div>\n      <div id=\"conf-feedback\" class=\"ar-feedback\" style=\"display:none\"></div>\n    </div>\n  </div>\n\n  <div class=\"ar-answer-box\" id=\"ar-answer-template\" style=\"display:none\">\n    <strong>✍️ 标准答题句（Rule 2）：</strong>\n    <div class=\"ar-template-text\">\n      \"Rule 2 has the largest lift ratio of <strong>2.84</strong>. The antecedent is <strong>Milk and Eggs</strong> and the consequent is <strong>Cheese</strong>. If <strong>Milk and Eggs</strong> are purchased, then <strong>Cheese</strong> is also likely to be purchased. With a lift ratio of <strong>2.84 (&gt; 1)</strong>, there is a positive association between <strong>Milk &amp; Eggs</strong> and <strong>Cheese</strong>.\"\n    </div>\n    <div class=\"ar-extra-note\">\n      💡 Rule 4 的 Lift Ratio = 0.87 &lt; 1 → 负相关，买 Diapers 反而<strong>不太可能</strong>买 Beer\n    </div>\n  </div>\n</div>\n\n<style>\n  .ar-example-section {\n    margin-top: 1.2rem;\n    padding: 1.25rem;\n    background: var(--color-background-primary);\n    border-radius: var(--border-radius-lg);\n    border: 0.5px solid var(--color-border-tertiary);\n  }\n  .ar-example-section h3 { font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 6px; }\n  .ar-intro { color: var(--color-text-secondary); font-size: 13px; margin-bottom: 1rem; }\n  .ar-table-wrapper { overflow-x: auto; margin-bottom: 1rem; }\n  .ar-table { width: 100%; border-collapse: collapse; font-size: 13px; }\n  .ar-table th {\n    background: var(--color-background-secondary);\n    color: var(--color-text-secondary);\n    font-weight: 500;\n    padding: 7px 10px;\n    text-align: center;\n    border: 0.5px solid var(--color-border-tertiary);\n    white-space: nowrap;\n  }\n  .ar-table td {\n    padding: 7px 10px;\n    text-align: center;\n    border: 0.5px solid var(--color-border-tertiary);\n    color: var(--color-text-primary);\n  }\n  .ar-table td:nth-child(2), .ar-table td:nth-child(3) { text-align: left; }\n  .ar-highlight-row { background: var(--color-background-info); }\n  .ar-best-lift { color: var(--color-text-info); font-weight: 700; }\n  .conf-blank { color: var(--color-text-tertiary); font-style: italic; }\n  .ar-quiz-area { margin-bottom: 1rem; }\n  .ar-question {\n    background: var(--color-background-secondary);\n    border-radius: var(--border-radius-md);\n    padding: 12px;\n    border: 0.5px solid var(--color-border-tertiary);\n  }\n  .ar-q-label { font-weight: 600; color: var(--color-text-primary); margin-bottom: 8px; font-size: 13px; }\n  .ar-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }\n  .ar-btn {\n    padding: 5px 14px;\n    background: var(--color-background-primary);\n    color: var(--color-text-secondary);\n    border: 0.5px solid var(--color-border-secondary);\n    border-radius: var(--border-radius-md);\n    cursor: pointer;\n    font-size: 12px;\n    font-family: inherit;\n    transition: background 0.15s, color 0.15s;\n  }\n  .ar-btn:hover { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }\n  .ar-btn.clicked-correct { background: var(--color-background-success); border-color: var(--color-border-success); color: var(--color-text-success); font-weight: 600; }\n  .ar-btn.clicked-wrong { background: var(--color-background-danger); border-color: var(--color-border-danger); color: var(--color-text-danger); }\n  .ar-feedback { margin-top: 8px; padding: 8px 12px; border-radius: var(--border-radius-md); font-size: 13px; }\n  .ar-feedback.correct { background: var(--color-background-success); color: var(--color-text-success); border: 0.5px solid var(--color-border-success); }\n  .ar-feedback.wrong { background: var(--color-background-danger); color: var(--color-text-danger); border: 0.5px solid var(--color-border-danger); }\n  .ar-answer-box {\n    background: var(--color-background-secondary);\n    border: 0.5px solid var(--color-border-tertiary);\n    border-radius: var(--border-radius-md);\n    padding: 12px;\n    margin-top: 10px;\n  }\n  .ar-answer-box strong { color: var(--color-text-primary); }\n  .ar-template-text {\n    margin-top: 8px;\n    padding: 10px 12px;\n    background: var(--color-background-success);\n    border-radius: var(--border-radius-sm);\n    color: var(--color-text-success);\n    font-size: 13px;\n    line-height: 1.7;\n    font-style: italic;\n  }\n  .ar-extra-note {\n    margin-top: 8px;\n    padding: 8px 12px;\n    background: var(--color-background-warning);\n    border-radius: var(--border-radius-sm);\n    color: var(--color-text-warning);\n    font-size: 13px;\n  }\n<\/style>\n\n<script>\n  let liftDone = false, confDone = false;\n  function checkLift(result) {\n    if (liftDone) return;\n    const fb = document.getElementById('lift-feedback');\n    fb.style.display = 'block';\n    if (result === 'correct') {\n      liftDone = true;\n      fb.className = 'ar-feedback correct';\n      fb.innerHTML = '✅ 正确！Rule 2 的 Lift Ratio = 2.84，是最大的，也是最有效的规则。';\n    } else {\n      fb.className = 'ar-feedback wrong';\n      fb.innerHTML = '❌ 再看看！找 Lift Ratio 那一列，哪一行的数字最大？';\n    }\n    maybeShowTemplate();\n  }\n  function checkConf(result) {\n    if (confDone) return;\n    const fb = document.getElementById('conf-feedback');\n    fb.style.display = 'block';\n    if (result === 'correct') {\n      confDone = true;\n      fb.className = 'ar-feedback correct';\n      fb.innerHTML = '✅ 正确！Confidence = 12% ÷ 25% = <strong>48%</strong>。买了 Milk & Eggs 的人里，有 48% 也买了 Cheese。';\n      const cell = document.querySelector('.conf-blank');\n      cell.textContent = '48%';\n      cell.style.color = 'var(--color-text-success)';\n      cell.style.fontWeight = '600';\n      cell.style.fontStyle = 'normal';\n    } else {\n      fb.className = 'ar-feedback wrong';\n      fb.innerHTML = '❌ 公式是 Support ÷ A-Support = 12% ÷ 25%，再算一次！';\n    }\n    maybeShowTemplate();\n  }\n  function maybeShowTemplate() {\n    if (liftDone && confDone) {\n      const box = document.getElementById('ar-answer-template');\n      box.style.display = 'block';\n      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    }\n  }\n<\/script>\n\n    </div>\n  </div>\n</div>\n\n<!-- ====== TEXT MINING ====== -->\n<div id=\"text\" class=\"sec\">\n  <div class=\"card\">\n    <h3>Text Mining 是什么？</h3>\n    <p>Text Mining 就是把文字（定性数据）转化为数字（定量数据），然后用聚类分析来发现规律。</p>\n    <div style=\"margin:12px 0;padding:12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md)\">\n      <p style=\"font-size:13px;color:var(--color-text-secondary)\">转化过程示意：</p>\n      <p style=\"margin-top:6px;font-size:13px\">\"This product is great!\" → 词频统计 → great=5, terrible=0 → 数值矩阵 → 聚类分析</p>\n    </div>\n    <div class=\"grid2\" style=\"margin-top:10px;gap:10px\">\n      <div style=\"border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px\">\n        <p style=\"font-weight:500;margin-bottom:6px;font-size:13px\">输入：文档-词频矩阵</p>\n        <table class=\"tbl\">\n          <tr><th>Doc</th><th>Great</th><th>Terrible</th></tr>\n          <tr><td>1</td><td>5</td><td>0</td></tr>\n          <tr><td>2</td><td>5</td><td>1</td></tr>\n          <tr><td>6</td><td>0</td><td>5</td></tr>\n        </table>\n      </div>\n      <div style=\"border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px\">\n        <p style=\"font-weight:500;margin-bottom:6px;font-size:13px\">输出：Cluster Centers</p>\n        <table class=\"tbl\">\n          <tr><th>Cluster</th><th>Great</th><th>Terrible</th></tr>\n          <tr><td>1</td><td>4.83</td><td>1.17</td></tr>\n          <tr><td>2</td><td>1.25</td><td>3.25</td></tr>\n        </table>\n      </div>\n    </div>\n  </div>\n  <div class=\"card\">\n    <h3>如何解读 Text Mining 的 Cluster Centers？</h3>\n    <p>和普通聚类一样，看每个词的平均出现频率，频率高的词代表该组的主要特征。</p>\n    <div class=\"tip\" style=\"margin-top:10px\">\n      例：Cluster 1 的 Great=4.83（高）、Terrible=1.17（低）<br>\n      → Cluster 1 以正面评价为主，文档多包含\"great\"这类积极词汇\n    </div>\n    <div class=\"tip\" style=\"margin-top:6px\">\n      例：Cluster 2 的 Great=1.25（低）、Terrible=3.25（高）<br>\n      → Cluster 2 以负面评价为主，文档多包含\"terrible\"这类消极词汇\n    </div>\n    <div class=\"warn\" style=\"margin-top:10px\">\n      考试答题时一定要联系原始文字的语义来解释，不能只说\"数字大/小\"，要说\"积极/消极评论\"这样有意义的结论。\n    </div>\n  </div>\n  <div class=\"card\">\n    <h3>Inter-Cluster Distance 和 Cluster Summary 怎么解读？</h3>\n    <div class=\"row-step\"><span class=\"num-circle\">1</span><span><strong>Inter-Cluster Distance 越大</strong>：两个 Cluster 分得越开，分类效果越好</span></div>\n    <div class=\"row-step\"><span class=\"num-circle\">2</span><span><strong>Avg Distance 越小</strong>：组内成员越相似，聚类质量越高</span></div>\n    <div class=\"row-step\"><span class=\"num-circle\">3</span><span>Total Average Distance 是整体聚类质量的指标，越小越好</span></div>\n  </div>\n</div>\n\n<!-- ====== PRACTICE ====== -->\n<div id=\"practice\" class=\"sec\">\n  <div class=\"card\">\n    <h3>练习1：Euclidean Distance 计算</h3>\n    <p>某新葡萄酒的两项标准化特征值为：Alcohol = -1.023，Alkalinity = 0.600。已知三个 Cluster 的质心如下：</p>\n    <table class=\"tbl\" style=\"margin:10px 0\">\n      <tr><th>Cluster</th><th>Alcohol</th><th>Alkalinity</th></tr>\n      <tr><td>Cluster 1</td><td>0.819</td><td>-0.677</td></tr>\n      <tr><td>Cluster 2</td><td>0.164</td><td>0.523</td></tr>\n      <tr><td>Cluster 3</td><td>-0.937</td><td>0.249</td></tr>\n    </table>\n    <p>只用这两个变量，请计算新葡萄酒到每个 Cluster 的 Euclidean Distance，并判断归属。</p>\n    <button class=\"reveal-btn\" onclick=\"tog('ans1')\">查看答案 ↓</button>\n    <div id=\"ans1\" class=\"ans-box\">\n      <strong>到 Cluster 1：</strong><br>\n      d₁ = √[(-1.023-0.819)² + (0.600-(-0.677))²]<br>\n      = √[(-1.842)² + (1.277)²] = √[3.393 + 1.631] = √5.024 = <strong>2.241</strong><br><br>\n      <strong>到 Cluster 2：</strong><br>\n      d₂ = √[(-1.023-0.164)² + (0.600-0.523)²]<br>\n      = √[(-1.187)² + (0.077)²] = √[1.409 + 0.006] = √1.415 = <strong>1.189</strong><br><br>\n      <strong>到 Cluster 3：</strong><br>\n      d₃ = √[(-1.023-(-0.937))² + (0.600-0.249)²]<br>\n      = √[(-0.086)² + (0.351)²] = √[0.007 + 0.123] = √0.130 = <strong>0.361</strong><br><br>\n      <strong>结论：d₃ = 0.361 最小 → 归入 Cluster 3</strong><br>\n      \"The new wine should be placed in Cluster 3 because it has the smallest Euclidean distance (0.361) to that cluster's centroid.\"\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <h3>练习2：Matching Coefficient vs Jaccard</h3>\n    <p>计算 Obs 2 和 Obs 3 之间的 Matching Coefficient 和 Jaccard's Coefficient：</p>\n    <table class=\"tbl\" style=\"margin:10px 0\">\n      <tr><th>观察值</th><th>Female</th><th>Married</th><th>Loan</th><th>Mortgage</th></tr>\n      <tr><td>Obs 2</td><td>0</td><td>1</td><td>1</td><td>1</td></tr>\n      <tr><td>Obs 3</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>\n    </table>\n    <button class=\"reveal-btn\" onclick=\"tog('ans2')\">查看答案 ↓</button>\n    <div id=\"ans2\" class=\"ans-box\">\n      <strong>Matching Coefficient：</strong><br>\n      匹配的变量：Married（1=1）✓、Loan（1=1）✓ → 2个匹配<br>\n      不匹配：Female（0≠1）、Mortgage（1≠0）<br>\n      MC = 2/4 = <strong>0.5</strong><br><br>\n      <strong>Jaccard's Coefficient：</strong><br>\n      两者都为0的变量：无（没有哪个变量两个都是0）<br>\n      非零匹配：Married ✓、Loan ✓ → 2个<br>\n      分母 = 4 - 0 = 4<br>\n      Jaccard = 2/4 = <strong>0.5</strong><br><br>\n      此题两个结果相同，因为没有\"双零\"变量被排除。\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <h3>练习3：Confidence + Lift Ratio 计算与解读</h3>\n    <p>以下是某规则的数据（总交易数 = 1500）：</p>\n    <table class=\"tbl\" style=\"margin:10px 0\">\n      <tr><th>A-Support</th><th>C-Support</th><th>Support</th><th>Antecedent</th><th>Consequent</th></tr>\n      <tr><td>420</td><td>600</td><td>210</td><td>Coffee</td><td>Milk</td></tr>\n    </table>\n    <p>计算并解释该规则的 Confidence 和 Lift Ratio。</p>\n    <button class=\"reveal-btn\" onclick=\"tog('ans3')\">查看答案 ↓</button>\n    <div id=\"ans3\" class=\"ans-box\">\n      <strong>Confidence：</strong><br>\n      Confidence = 210 / 420 = 0.5 = <strong>50%</strong><br>\n      解读：\"For 50% of the transactions when Coffee is purchased, Milk is also purchased.\"<br><br>\n      <strong>Lift Ratio：</strong><br>\n      Lift = Confidence / (C-Support/Total) = (210/420) / (600/1500) = 0.5 / 0.4 = <strong>1.25</strong><br>\n      解读：\"A lift ratio of 1.25 means that a transaction in which Coffee is purchased is 25% more likely to also include Milk than a randomly selected transaction. Since the lift ratio is greater than 1, there is a positive association between Coffee and Milk.\"\n    </div>\n  </div>\n\n  \n</div>\n\n<!-- ====== TIPS ====== -->\n<div id=\"tips\" class=\"sec\">\n  <div class=\"card\">\n    <h3>高频易错点</h3>\n    <div class=\"danger\">\n      <strong>错误1：Lift Ratio 解读搞错百分比</strong><br>\n      Lift = 2.27 → 应说\"高出127%\"（不是227%）<br>\n      公式：(Lift - 1) × 100%\n    </div>\n    <div class=\"danger\" style=\"margin-top:8px\">\n      <strong>错误2：Matching vs Jaccard 区分不清</strong><br>\n      Matching 把双零算相似；Jaccard 排除双零。<br>\n      考试出现\"avoid falsely indicating similarity due to lack of features\"就是在说 Jaccard。\n    </div>\n    <div class=\"danger\" style=\"margin-top:8px\">\n      <strong>错误3：z-score 负数慌了</strong><br>\n      Cluster Center 表里出现 -0.937 这样的负数完全正常，是标准化后的值，不是错误！负数 = 低于该变量的平均值。\n    </div>\n    <div class=\"danger\" style=\"margin-top:8px\">\n      <strong>错误4：Confidence 计算的分母搞错</strong><br>\n      分母是 A-Support（先行项），不是总交易数，也不是 C-Support。\n    </div>\n    <div class=\"warn\" style=\"margin-top:8px\">\n      <strong>注意：Lift Ratio 的分母</strong><br>\n      Lift = Confidence / (C-Support / Total transactions)<br>\n      分母里是\"结果项的支持数 ÷ 总交易数\"，Total transactions 有时题目会给，有时需要用 minimum support 反推。\n    </div>\n  </div>\n  <div class=\"card\">\n    <h3>必背答题模板</h3>\n    <div class=\"tip\">\n      <strong>Cluster 归属（Euclidean Distance）：</strong><br>\n      \"The new observation is most similar to Cluster X, as it has the smallest Euclidean distance of [d] to that cluster's centroid.\"\n    </div>\n    <div class=\"tip\" style=\"margin-top:8px\">\n      <strong>Cluster 特征描述（K-means 读图）：</strong><br>\n      \"Cluster X contains [N] ([%]%) of the observations and consists of [high/low] [variable1] and [high/low] [variable2].\"\n    </div>\n    <div class=\"tip\" style=\"margin-top:8px\">\n      <strong>Confidence 解读：</strong><br>\n      \"For [X]% of the transactions when [Antecedent] is purchased, [Consequent] is also purchased.\"\n    </div>\n    <div class=\"tip\" style=\"margin-top:8px\">\n      <strong>Lift Ratio 解读：</strong><br>\n      \"A lift ratio of [X] means that a transaction in which [Antecedent] is purchased is [(X-1)×100]% more likely to also include [Consequent] than a randomly selected transaction.\"\n    </div>\n  </div>\n  \n</div>\n\n</div>\n\n<script>\nfunction sw(id,btn){\n  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));\n  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));\n  document.getElementById(id).classList.add('on');\n  btn.classList.add('on');\n}\nfunction sc(id,btn){\n  document.querySelectorAll('#cluster .step-panel').forEach(p=>p.classList.remove('on'));\n  document.querySelectorAll('#cluster .step-tab').forEach(t=>t.classList.remove('on'));\n  document.getElementById(id).classList.add('on');\n  btn.classList.add('on');\n}\nfunction sa(id,btn){\n  document.querySelectorAll('#assoc .step-panel').forEach(p=>p.classList.remove('on'));\n  document.querySelectorAll('#assoc .step-tab').forEach(t=>t.classList.remove('on'));\n  document.getElementById(id).classList.add('on');\n  btn.classList.add('on');\n}\nfunction tog(id){\n  var el=document.getElementById(id);\n  el.classList.toggle('show');\n}\n<\/script>\n"}, {"id": "week7_regression_interactive_guide", "subject_id": "mgmt90280", "week": "Week 7", "title": "Regression Analysis", "subtitle": "回归分析互动指南", "color": "#6366F1", "content": "\n<style>\n  h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:var(--font-sans,sans-serif)}\n  .wrap{padding:1.5rem 0}\n  .nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}\n  .nav button{font-size:13px;padding:6px 14px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;transition:all .2s}\n  .nav button.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}\n  .section{display:none}.section.active{display:block}\n  .card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}\n  .label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}\n  .val{font-size:22px;font-weight:500;color:var(--color-text-primary)}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}\n  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:4px;margin-top:4px}\n  .tag-blue{background:var(--color-background-info);color:var(--color-text-info)}\n  .tag-green{background:var(--color-background-success);color:var(--color-text-success)}\n  .tag-red{background:var(--color-background-danger);color:var(--color-text-danger)}\n  .tag-warn{background:var(--color-background-warning);color:var(--color-text-warning)}\n  .formula{background:var(--color-background-secondary);border-left:3px solid var(--color-border-info);border-radius:0 8px 8px 0;padding:12px 16px;font-size:15px;margin:10px 0;font-family:var(--font-mono,monospace)}\n  .rule{border-left:3px solid;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:14px;line-height:1.6}\n  .rule-green{border-color:var(--color-border-success);background:var(--color-background-success);color:var(--color-text-success)}\n  .rule-red{border-color:var(--color-border-danger);background:var(--color-background-danger);color:var(--color-text-danger)}\n  .rule-blue{border-color:var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info)}\n  .rule-warn{border-color:var(--color-border-warning);background:var(--color-background-warning);color:var(--color-text-warning)}\n  h3{font-size:16px;font-weight:500;margin-bottom:10px;color:var(--color-text-primary)}\n  h4{font-size:14px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)}\n  p{font-size:14px;line-height:1.7;color:var(--color-text-primary);margin-bottom:8px}\n  .sep{height:0.5px;background:var(--color-border-tertiary);margin:14px 0}\n  .q-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;margin-bottom:10px}\n  .ans-btn{font-size:13px;padding:5px 14px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;margin-top:8px}\n  .ans-box{display:none;margin-top:10px;padding:10px;background:var(--color-background-success);border-radius:8px;font-size:14px;color:var(--color-text-success);line-height:1.6}\n  .ans-box.show{display:block}\n  table{width:100%;border-collapse:collapse;font-size:13px}\n  th{text-align:left;padding:8px 10px;border-bottom:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);font-weight:500}\n  td{padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}\n  .highlight-row td{background:var(--color-background-info);color:var(--color-text-info)}\n  .ask-btn{display:inline-block;margin-top:10px;font-size:13px;padding:6px 14px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;color:var(--color-text-secondary)}\n  .step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--color-background-info);color:var(--color-text-info);font-size:12px;font-weight:500;margin-right:8px;flex-shrink:0}\n  .step-row{display:flex;align-items:flex-start;margin-bottom:10px}\n<\/style>\n\n<div class=\"wrap\">\n  <h2 class=\"sr-only\">Week 7 Regression Modelling interactive study guide</h2>\n\n  <div class=\"nav\">\n    <button class=\"active\" onclick=\"show('overview')\">总览 Overview</button>\n    <button onclick=\"show('slr')\">简单线性回归 SLR</button>\n    <button onclick=\"show('mlr')\">多元线性回归 MLR</button>\n    <button onclick=\"show('tests')\">F检验 & T检验</button>\n    <button onclick=\"show('nonlinear')\">非线性回归</button>\n    <button onclick=\"show('quiz')\">练习题</button>\n  </div>\n\n  <!-- OVERVIEW -->\n  <div id=\"s-overview\" class=\"section active\">\n    <div class=\"card\">\n      <h3>Week 7 核心框架</h3>\n      <p>回归分析用来研究自变量(x)对因变量(y)的影响，预测y的值。考试重点是<strong>读Excel输出表格</strong>并得出结论。</p>\n    </div>\n    <div class=\"grid3\">\n      <div class=\"card\">\n        <div class=\"label\">知识点 1</div>\n        <div class=\"val\" style=\"font-size:16px\">简单线性回归</div>\n        <p style=\"margin-top:8px;font-size:13px\">一个自变量x预测y<br>ŷ = b₀ + b₁x</p>\n        <span class=\"tag tag-blue\">Least Squares</span>\n        <span class=\"tag tag-blue\">R²</span>\n        <span class=\"tag tag-blue\">rxy</span>\n      </div>\n      <div class=\"card\">\n        <div class=\"label\">知识点 2</div>\n        <div class=\"val\" style=\"font-size:16px\">多元线性回归</div>\n        <p style=\"margin-top:8px;font-size:13px\">两个或更多自变量<br>ŷ = b₀ + b₁x₁ + b₂x₂…</p>\n        <span class=\"tag tag-green\">Adjusted R²</span>\n        <span class=\"tag tag-green\">F-test</span>\n        <span class=\"tag tag-green\">T-test</span>\n      </div>\n      <div class=\"card\">\n        <div class=\"label\">知识点 3</div>\n        <div class=\"val\" style=\"font-size:16px\">非线性回归</div>\n        <p style=\"margin-top:8px;font-size:13px\">二次项或交互项<br>ŷ = b₀ + b₁x₁ + b₂x₁²</p>\n        <span class=\"tag tag-warn\">Quadratic</span>\n        <span class=\"tag tag-warn\">Interaction</span>\n      </div>\n    </div>\n    <div class=\"card\">\n      <h3>考试重点提醒</h3>\n      <div class=\"rule rule-red\">重点题型：给你一个Excel回归输出表，要求读图回答问题（写回归方程、判断显著性、解释系数、解释置信区间）。</div>\n      <div class=\"rule rule-blue\">最常考：T-test判断单个变量是否显著（看P-value vs α）；F-test判断整体模型是否显著（看Significance F vs α）。</div>\n    </div>\n    \n  </div>\n\n  <!-- SLR -->\n  <div id=\"s-slr\" class=\"section\">\n    <div class=\"card\">\n      <h3>简单线性回归公式</h3>\n      <div class=\"formula\">ŷ = b₀ + b₁x</div>\n      <div class=\"grid2\" style=\"margin-top:10px\">\n        <div>\n          <div class=\"label\">b₀（截距 y-intercept）</div>\n          <p style=\"font-size:13px\">当x=0时，y的预测值。在Excel里就是\"Intercept\"那行的系数。</p>\n        </div>\n        <div>\n          <div class=\"label\">b₁（斜率 slope）</div>\n          <p style=\"font-size:13px\">x每增加1个单位，y增加/减少b₁个单位。正数=正相关，负数=负相关。</p>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <h3>最小二乘法（Least Squares Method）</h3>\n      <p>用样本数据求b₁和b₀的方法，让预测误差的平方和最小。</p>\n      <div class=\"formula\">b₁ = Σ(xᵢ-x̄)(yᵢ-ȳ) / Σ(xᵢ-x̄)²</div>\n      <div class=\"formula\">b₀ = ȳ - b₁x̄</div>\n      <div class=\"rule rule-blue\">记忆技巧：先求b₁（斜率），再用b₀ = ȳ - b₁x̄ 求截距。</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>判定系数 R²（Coefficient of Determination）</h3>\n      <div class=\"formula\">R² = SSR / SST</div>\n      <div class=\"grid3\" style=\"margin-top:10px\">\n        <div class=\"q-box\">\n          <div class=\"label\">SST（总变差）</div>\n          <p style=\"font-size:13px\">Σ(yᵢ - ȳ)²<br>y的总变动</p>\n        </div>\n        <div class=\"q-box\">\n          <div class=\"label\">SSR（回归变差）</div>\n          <p style=\"font-size:13px\">Σ(ŷᵢ - ȳ)²<br>= SST - SSE</p>\n        </div>\n        <div class=\"q-box\">\n          <div class=\"label\">SSE（误差变差）</div>\n          <p style=\"font-size:13px\">Σ(yᵢ - ŷᵢ)²<br>预测误差</p>\n        </div>\n      </div>\n      <div class=\"rule rule-green\">R²越接近1，模型拟合越好。例如R²=0.75，表示模型解释了y变动的75%。</div>\n      <div class=\"rule rule-warn\">在Excel里，R² 就是\"R Square\"那行的值。</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>样本相关系数 rxy（Sample Correlation Coefficient）</h3>\n      <div class=\"formula\">rxy = √R²  （正负号与b₁相同）</div>\n      <div class=\"grid2\" style=\"margin-top:10px\">\n        <div><div class=\"label\">b₁ > 0 → rxy 为正</div><p style=\"font-size:13px\">x和y正相关</p></div>\n        <div><div class=\"label\">b₁ &lt; 0 → rxy 为负</div><p style=\"font-size:13px\">x和y负相关</p></div>\n      </div>\n      <div class=\"rule rule-blue\">rxy范围 -1 到 1，越接近±1表示线性关系越强。在Excel里，\"Multiple R\"就是rxy（简单线性回归时）。</div>\n    </div>\n    \n  </div>\n\n  <!-- MLR -->\n  <div id=\"s-mlr\" class=\"section\">\n    <div class=\"card\">\n      <h3>多元回归方程</h3>\n      <div class=\"formula\">ŷ = b₀ + b₁x₁ + b₂x₂ + … + bₙxₙ</div>\n      <p style=\"margin-top:8px\">每个bᵢ的解释：<strong>其他变量保持不变时</strong>，xᵢ每增加1单位，y增加/减少bᵢ单位。</p>\n    </div>\n\n    <div class=\"card\">\n      <h3>Excel输出表解读</h3>\n      <table>\n        <tr><th>位置</th><th>指标</th><th>含义</th></tr>\n        <tr><td>Regression Statistics</td><td>Multiple R</td><td>相关系数（rxy）</td></tr>\n        <tr class=\"highlight-row\"><td>Regression Statistics</td><td>R Square</td><td>R²，模型解释力</td></tr>\n        <tr class=\"highlight-row\"><td>Regression Statistics</td><td>Adjusted R Square</td><td>修正R²（用这个！MLR首选）</td></tr>\n        <tr><td>ANOVA表</td><td>Significance F</td><td>F检验P值 → 整体显著性</td></tr>\n        <tr class=\"highlight-row\"><td>系数表</td><td>Coefficients</td><td>各变量系数（写回归方程用）</td></tr>\n        <tr class=\"highlight-row\"><td>系数表</td><td>P-value</td><td>T检验P值 → 单个变量显著性</td></tr>\n        <tr><td>系数表</td><td>Lower/Upper 95%</td><td>95%置信区间</td></tr>\n      </table>\n    </div>\n\n    <div class=\"card\">\n      <h3>修正R²（Adjusted R²）</h3>\n      <div class=\"formula\">R²ₐ = 1 - [(1-R²)(n-1)/(n-p-1)]</div>\n      <div class=\"rule rule-warn\">为什么用Adjusted R²而不是R²？因为每加一个变量，R²都会增大（即使那个变量没用），Adjusted R²会惩罚多余变量，更准确。MLR时永远用Adjusted R²来评估模型！</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>置信区间（Confidence Interval）</h3>\n      <p>以95%置信区间为例：</p>\n      <div class=\"formula\">我们有95%的把握，参数的真实值落在 (Lower 95%, Upper 95%) 这个区间内。</div>\n      <div class=\"rule rule-blue\">考试答题模板：<br>\"We are 95% confident that this interval of (Lower, Upper) contains the population parameter of [变量名].\"</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>多重共线性（Multicollinearity）</h3>\n      <p>指自变量之间存在相关关系，会导致无法分清各自变量的单独影响。</p>\n      <div class=\"rule rule-red\">判断标准：两个自变量之间相关系数 &gt; 0.7 或 &lt; -0.7，则怀疑存在多重共线性。</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>虚拟变量（Dummy Variable）</h3>\n      <p>处理分类变量（如性别、地区）的方法，用0/1编码。</p>\n      <div class=\"rule rule-blue\">规则：K个类别只需 K-1 个虚拟变量。<br>例如3个地区A/B/C → 需要2个虚拟变量：x₁=1(A地区)，x₂=1(B地区)，C地区时x₁=x₂=0。</div>\n    </div>\n    \n  </div>\n\n  <!-- TESTS -->\n  <div id=\"s-tests\" class=\"section\">\n    <div class=\"card\">\n      <h3>两种检验：F检验 vs T检验</h3>\n      <div class=\"grid2\">\n        <div>\n          <h4>F检验（整体显著性）</h4>\n          <p style=\"font-size:13px;line-height:1.7\">检验整个模型是否有意义。<br>看Excel里的 <strong>Significance F</strong></p>\n          <div class=\"rule rule-green\" style=\"font-size:13px\">Significance F &lt; α<br>→ 模型整体显著<br>→ 自变量与y存在显著线性关系</div>\n          <div class=\"rule rule-red\" style=\"font-size:13px\">Significance F ≥ α<br>→ 模型整体不显著</div>\n        </div>\n        <div>\n          <h4>T检验（单个变量显著性）</h4>\n          <p style=\"font-size:13px;line-height:1.7\">检验<strong>每个</strong>自变量是否显著影响y。<br>看各变量行的 <strong>P-value</strong></p>\n          <div class=\"rule rule-green\" style=\"font-size:13px\">P-value &lt; α<br>→ 该变量显著<br>→ 对y有显著影响</div>\n          <div class=\"rule rule-red\" style=\"font-size:13px\">P-value ≥ α<br>→ 该变量不显著</div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <h3>考试答题模板（T检验）</h3>\n      <div class=\"step-row\"><span class=\"step-num\">1</span><p style=\"font-size:13px\">找到该变量的P-value（例如Amenities的P-value = 0.00004）</p></div>\n      <div class=\"step-row\"><span class=\"step-num\">2</span><p style=\"font-size:13px\">与α（通常0.05或0.01）比较：0.00004 &lt; 0.05</p></div>\n      <div class=\"step-row\"><span class=\"step-num\">3</span><p style=\"font-size:13px\">得出结论：\"Amenities is a significant factor.\"</p></div>\n      <div class=\"step-row\"><span class=\"step-num\">4</span><p style=\"font-size:13px\">解释系数：\"A one-point increase in Amenities corresponds to an increase of 0.2443 in overall score, <strong>holding other independent variables fixed</strong>.\"</p></div>\n      <div class=\"rule rule-warn\">划重点：解释系数时一定要加 \"holding other independent variables fixed\"（其他变量保持不变）！</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>科学计数法P-value怎么看？</h3>\n      <p>Excel里经常出现类似 <strong>3.69454E-05</strong> 这样的数值，不用慌：</p>\n      <div class=\"formula\">3.69454E-05 = 3.69454 × 10⁻⁵ = 0.0000369454</div>\n      <div class=\"rule rule-blue\">E-05 表示小数点向左移5位，所以是个非常小的数，远小于0.05，说明变量高度显著！</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>交互式练习：判断显著性</h3>\n      <div class=\"q-box\">\n        <p style=\"font-size:14px\">给定α = 0.05，以下哪些变量是显著的？</p>\n        <table style=\"margin-top:8px\">\n          <tr><th>变量</th><th>P-value</th><th>显著？</th></tr>\n          <tr><td>Comfort</td><td>0.4117</td><td id=\"r1\" style=\"color:var(--color-text-secondary)\">点击查看</td></tr>\n          <tr><td>Amenities</td><td>3.69E-05</td><td id=\"r2\" style=\"color:var(--color-text-secondary)\">点击查看</td></tr>\n          <tr><td>In-House Dining</td><td>0.0011</td><td id=\"r3\" style=\"color:var(--color-text-secondary)\">点击查看</td></tr>\n        </table>\n        <button class=\"ans-btn\" onclick=\"reveal()\">显示答案</button>\n      </div>\n    </div>\n    \n  </div>\n\n  <!-- NONLINEAR -->\n  <div id=\"s-nonlinear\" class=\"section\">\n    <div class=\"card\">\n      <h3>二次回归（Quadratic Regression）</h3>\n      <p>当x和y不是线性关系（如U形或倒U形），需要加入x的二次项：</p>\n      <div class=\"formula\">ŷ = b₀ + b₁x₁ + b₂x₁²</div>\n      <div class=\"rule rule-blue\">注意：虽然有x²，但这仍然被视为线性回归（对参数b₀, b₁, b₂是线性的），Excel处理方式相同。</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>自变量交互项（Interaction Between Independent Variables）</h3>\n      <p>当两个自变量之间存在相互影响时，加入交互项：</p>\n      <div class=\"formula\">ŷ = b₀ + b₁x₁ + b₂x₂ + b₃x₁x₂</div>\n      <p style=\"margin-top:8px\">x₁x₂ 描述了两个自变量之间的相互作用。</p>\n      <div class=\"rule rule-warn\">解释交互项系数 b₃ 的方法（课件例题A5）：<br>\"When x₁ increases by 1, y increases by b₃×x₂, holding other variables fixed.\"<br>\"When x₂ increases by 1, y increases by b₃×x₁, holding other variables fixed.\"</div>\n    </div>\n\n    <div class=\"card\">\n      <h3>在Excel中识别交互项</h3>\n      <p>如果题目说预测y用的是x₁、x₂以及\"their interaction\"，那：</p>\n      <div class=\"step-row\"><span class=\"step-num\">1</span><p style=\"font-size:13px\">x₁ = 第一个自变量（如Reading）</p></div>\n      <div class=\"step-row\"><span class=\"step-num\">2</span><p style=\"font-size:13px\">x₂ = 第二个自变量（如Math）</p></div>\n      <div class=\"step-row\"><span class=\"step-num\">3</span><p style=\"font-size:13px\">ReadMath = x₁×x₂ = 交互项</p></div>\n    </div>\n    \n  </div>\n\n  <!-- QUIZ -->\n  <div id=\"s-quiz\" class=\"section\">\n    <div class=\"card\">\n      <h3>练习题：读Excel输出</h3>\n      <p style=\"font-size:13px;color:var(--color-text-secondary);margin-bottom:12px\">基于课件例题1（酒店评分）</p>\n      <table style=\"font-size:12px;margin-bottom:14px\">\n        <tr><th></th><th>Coeff.</th><th>P-value</th><th>Lower 95%</th><th>Upper 95%</th></tr>\n        <tr><td>Intercept</td><td>35.6967</td><td>0.0157</td><td>7.68</td><td>63.71</td></tr>\n        <tr><td>Comfort</td><td>0.1094</td><td>0.4117</td><td>-0.17</td><td>0.38</td></tr>\n        <tr><td>Amenities</td><td>0.2443</td><td>3.7E-05</td><td>0.15</td><td>0.34</td></tr>\n        <tr><td>In-House Dining</td><td>0.2474</td><td>0.0011</td><td>0.12</td><td>0.38</td></tr>\n      </table>\n      <p style=\"font-size:13px;margin-bottom:4px\">ANOVA: Significance F = 4.52E-05，Adjusted R² = 0.7029</p>\n    </div>\n\n    <div class=\"q-box\">\n      <h4>Q1：写出回归方程</h4>\n      <button class=\"ans-btn\" onclick=\"toggleAns('a1')\">显示答案</button>\n      <div id=\"a1\" class=\"ans-box\">ŷ = 35.6967 + 0.1094x₁ + 0.2443x₂ + 0.2474x₃<br><br>其中 x₁=Comfort, x₂=Amenities, x₃=In-House Dining</div>\n    </div>\n\n    <div class=\"q-box\">\n      <h4>Q2：α=0.05，整体模型显著吗？</h4>\n      <button class=\"ans-btn\" onclick=\"toggleAns('a2')\">显示答案</button>\n      <div id=\"a2\" class=\"ans-box\">Significance F = 4.52E-05 &lt; 0.05 = α<br>→ 整体模型显著，自变量与因变量之间存在显著线性关系。</div>\n    </div>\n\n    <div class=\"q-box\">\n      <h4>Q3：α=0.05，Comfort显著吗？解释其系数。</h4>\n      <button class=\"ans-btn\" onclick=\"toggleAns('a3')\">显示答案</button>\n      <div id=\"a3\" class=\"ans-box\">Comfort的P-value = 0.4117 &gt; 0.05<br>→ Comfort is NOT a significant factor.<br>（不显著，所以不需要解释系数）</div>\n    </div>\n\n    <div class=\"q-box\">\n      <h4>Q4：α=0.05，Amenities显著吗？解释其系数。</h4>\n      <button class=\"ans-btn\" onclick=\"toggleAns('a4')\">显示答案</button>\n      <div id=\"a4\" class=\"ans-box\">Amenities P-value = 3.7E-05 &lt; 0.05 → 显著<br><br>系数解释：<br>\"A one-point increase in Amenities corresponds to an increase of 0.2443 in overall score, holding other independent variables fixed.\"</div>\n    </div>\n\n    <div class=\"q-box\">\n      <h4>Q5：解释Amenities的95%置信区间</h4>\n      <button class=\"ans-btn\" onclick=\"toggleAns('a5')\">显示答案</button>\n      <div id=\"a5\" class=\"ans-box\">\"We are 95% confident that this interval of (0.15, 0.34) contains the population parameter of Amenities.\"</div>\n    </div>\n\n    <div class=\"q-box\">\n      <h4>Q6：这个模型的解释力如何？</h4>\n      <button class=\"ans-btn\" onclick=\"toggleAns('a6')\">显示答案</button>\n      <div id=\"a6\" class=\"ans-box\">Adjusted R² = 0.7029<br>→ 该回归模型解释了总体评分变动的约70%。<br>(The regression model explains approximately 70% of the variation in the sample values of overall score.)</div>\n    </div>\n\n    \n  </div>\n</div>\n\n<script>\nfunction show(id){\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));\n  document.getElementById('s-'+id).classList.add('active');\n  event.target.classList.add('active');\n}\nfunction toggleAns(id){\n  const el=document.getElementById(id);\n  el.classList.toggle('show');\n}\nfunction reveal(){\n  const p05='<0.05 → 不显著 ✗';\n  const s05='<0.05 → 显著 ✓';\n  document.getElementById('r1').textContent='0.4117 > 0.05 → 不显著 ✗';\n  document.getElementById('r1').style.color='var(--color-text-danger)';\n  document.getElementById('r2').textContent='3.69E-05 < 0.05 → 显著 ✓';\n  document.getElementById('r2').style.color='var(--color-text-success)';\n  document.getElementById('r3').textContent='0.0011 < 0.05 → 显著 ✓';\n  document.getElementById('r3').style.color='var(--color-text-success)';\n}\n<\/script>\n"}, {"id": "sat_gpa_interaction_regression", "subject_id": "mgmt90280", "week": "Week 7", "title": "Interaction Term Regression", "subtitle": "SAT × GPA 交互项", "color": "#6366F1", "content": "\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  .wrap{padding:1.5rem 0;font-family:var(--font-sans,sans-serif)}\n  h3{font-size:16px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px}\n  h4{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}\n  p{font-size:14px;line-height:1.7;color:var(--color-text-primary);margin-bottom:8px}\n  .card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}\n  .formula{background:var(--color-background-secondary);border-left:3px solid var(--color-border-info);border-radius:0 8px 8px 0;padding:12px 16px;font-size:15px;margin:10px 0;font-family:var(--font-mono,monospace);line-height:1.8}\n  .rule{border-left:3px solid;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px;line-height:1.7}\n  .rule-green{border-color:var(--color-border-success);background:var(--color-background-success);color:var(--color-text-success)}\n  .rule-red{border-color:var(--color-border-danger);background:var(--color-background-danger);color:var(--color-text-danger)}\n  .rule-blue{border-color:var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info)}\n  .rule-warn{border-color:var(--color-border-warning);background:var(--color-background-warning);color:var(--color-text-warning)}\n  table{width:100%;border-collapse:collapse;font-size:13px}\n  th{text-align:left;padding:8px 10px;border-bottom:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);font-weight:500;font-size:12px}\n  td{padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}\n  .hi-blue td{background:var(--color-background-info);color:var(--color-text-info);font-weight:500}\n  .hi-green td{background:var(--color-background-success);color:var(--color-text-success);font-weight:500}\n  .hi-red td{background:var(--color-background-danger);color:var(--color-text-danger)}\n  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin:2px}\n  .tag-blue{background:var(--color-background-info);color:var(--color-text-info)}\n  .tag-green{background:var(--color-background-success);color:var(--color-text-success)}\n  .tag-red{background:var(--color-background-danger);color:var(--color-text-danger)}\n  .tag-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}\n  .step-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}\n  .step-tab{font-size:12px;padding:5px 12px;border-radius:16px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;transition:all .2s}\n  .step-tab.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}\n  .step-panel{display:none}.step-panel.active{display:block}\n  .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--color-background-info);color:var(--color-text-info);font-size:12px;font-weight:500;margin-right:8px;flex-shrink:0;vertical-align:middle}\n  .row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n  .sep{height:0.5px;background:var(--color-border-tertiary);margin:12px 0}\n  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500;margin-left:6px}\n  .b-sig{background:var(--color-background-success);color:var(--color-text-success)}\n  .b-not{background:var(--color-background-danger);color:var(--color-text-danger)}\n  .highlight-box{background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:10px 14px;font-size:13px;color:var(--color-text-warning);margin:10px 0}\n  .eq-part{display:inline-block;padding:4px 10px;border-radius:6px;font-family:var(--font-mono,monospace);font-size:14px;margin:3px}\n  .eq-intercept{background:var(--color-background-secondary);color:var(--color-text-primary)}\n  .eq-r{background:var(--color-background-danger);color:var(--color-text-danger)}\n  .eq-m{background:var(--color-background-info);color:var(--color-text-info)}\n  .eq-rm{background:var(--color-background-success);color:var(--color-text-success)}\n  .ask-btn{display:inline-block;margin-top:10px;font-size:13px;padding:6px 14px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;color:var(--color-text-secondary)}\n  .coef-highlight{transition:all .3s;cursor:pointer;border-radius:4px;padding:2px 4px}\n  .coef-highlight:hover{background:var(--color-background-warning)}\n<\/style>\n\n<div class=\"wrap\">\n\n  <!-- Excel Output Table -->\n  <div class=\"card\">\n    <h3>课件原题 Excel 输出（完整）</h3>\n    <p style=\"font-size:13px;color:var(--color-text-secondary);margin-bottom:10px\">预测GPA，自变量：SAT阅读分、SAT数学分、及两者的交互项</p>\n    <table>\n      <tr><th colspan=\"2\">Regression Statistics</th></tr>\n      <tr><td>Multiple R</td><td><strong>0.8863</strong></td></tr>\n      <tr class=\"hi-blue\"><td>R Square</td><td><strong>0.7855</strong></td></tr>\n      <tr class=\"hi-blue\"><td>Adjusted R Square</td><td><strong>0.7822</strong></td></tr>\n      <tr><td>Standard Error</td><td>0.3096</td></tr>\n      <tr><td>Observations</td><td>200</td></tr>\n    </table>\n    <div class=\"sep\"></div>\n    <table>\n      <tr><th>ANOVA</th><th>df</th><th>SS</th><th>MS</th><th>F</th><th>Significance F</th></tr>\n      <tr class=\"hi-green\"><td>Regression</td><td>3</td><td>68.7913</td><td>22.9304</td><td>239.2597</td><td><strong>2.996E-65</strong></td></tr>\n      <tr><td>Residual</td><td>196</td><td>18.7845</td><td>0.0958</td><td></td><td></td></tr>\n      <tr><td>Total</td><td>199</td><td>87.5757</td><td></td><td></td><td></td></tr>\n    </table>\n    <div class=\"sep\"></div>\n    <table>\n      <tr><th>变量</th><th>Coefficients</th><th>Std Error</th><th>t Stat</th><th>P-value</th><th>Lower 95%</th><th>Upper 95%</th><th>Lower 99%</th><th>Upper 99%</th></tr>\n      <tr><td>Intercept</td><td>0.7977</td><td>1.0186</td><td>0.7832</td><td>0.4344</td><td>-1.2111</td><td>2.8066</td><td>-1.8518</td><td>3.4473</td></tr>\n      <tr class=\"hi-red\"><td>Reading (x₁)</td><td>-0.0011</td><td>0.0016</td><td>-0.7061</td><td><strong>0.4810</strong></td><td>-0.0042</td><td>0.0020</td><td>-0.0051</td><td>0.0030</td></tr>\n      <tr class=\"hi-red\"><td>Math (x₂)</td><td>-0.0010</td><td>0.0016</td><td>-0.6020</td><td><strong>0.5479</strong></td><td>-0.0041</td><td>0.0022</td><td>-0.0051</td><td>0.0032</td></tr>\n      <tr class=\"hi-green\"><td>ReadMath (x₁x₂)</td><td>0.000009</td><td>2.485E-06</td><td>3.4834</td><td><strong>0.0006</strong></td><td>3.755E-06</td><td>1.356E-05</td><td>2.192E-06</td><td>1.512E-05</td></tr>\n    </table>\n    <div style=\"margin-top:8px;display:flex;gap:6px;flex-wrap:wrap\">\n      <span class=\"tag tag-green\">绿色 = 显著 (α=0.01)</span>\n      <span class=\"tag tag-red\">红色 = 不显著 (α=0.01)</span>\n      <span class=\"tag tag-blue\">蓝色 = 关键统计量</span>\n    </div>\n  </div>\n\n  <!-- Step-by-step tabs -->\n  <div class=\"step-tabs\">\n    <div class=\"step-tab active\" onclick=\"showStep('q1')\">Q1 写回归方程</div>\n    <div class=\"step-tab\" onclick=\"showStep('q2')\">Q2 模型解释力</div>\n    <div class=\"step-tab\" onclick=\"showStep('q3')\">Q3 Reading显著性</div>\n    <div class=\"step-tab\" onclick=\"showStep('q4')\">Q4 Math显著性</div>\n    <div class=\"step-tab\" onclick=\"showStep('q5')\">Q5 交互项★重点</div>\n    <div class=\"step-tab\" onclick=\"showStep('q6')\">Q6 置信区间95%</div>\n    <div class=\"step-tab\" onclick=\"showStep('q7')\">Q7 置信区间99%</div>\n    <div class=\"step-tab\" onclick=\"showStep('q8')\">Q8 手动算R²</div>\n    <div class=\"step-tab\" onclick=\"showStep('q9')\">Q9 F检验整体</div>\n  </div>\n\n  <!-- Q1 -->\n  <div id=\"p-q1\" class=\"step-panel active\">\n    <div class=\"card\">\n      <h3>Q1：写出回归方程</h3>\n      <div class=\"row\"><span class=\"num\">1</span><p>先定义变量名</p></div>\n      <div style=\"background:var(--color-background-secondary);border-radius:8px;padding:12px;font-size:13px;line-height:2\">\n        <span class=\"eq-r\" style=\"padding:4px 10px;border-radius:6px\">x₁ = SAT scores on Reading（阅读分）</span><br>\n        <span class=\"eq-m\" style=\"padding:4px 10px;border-radius:6px\">x₂ = SAT scores on Math（数学分）</span><br>\n        <span class=\"eq-rm\" style=\"padding:4px 10px;border-radius:6px\">x₁x₂ = Interaction of Reading and Math（交互项）</span>\n      </div>\n      <div class=\"row\" style=\"margin-top:12px\"><span class=\"num\">2</span><p>从Excel系数列读取各系数</p></div>\n      <table style=\"font-size:13px;margin-bottom:12px\">\n        <tr><th>变量</th><th>对应Excel行</th><th>系数值</th></tr>\n        <tr><td>b₀（截距）</td><td>Intercept → Coefficients</td><td><strong>0.7977</strong></td></tr>\n        <tr><td>b₁（Reading系数）</td><td>Reading → Coefficients</td><td><strong>-0.0011</strong></td></tr>\n        <tr><td>b₂（Math系数）</td><td>Math → Coefficients</td><td><strong>-0.0010</strong></td></tr>\n        <tr><td>b₃（交互项系数）</td><td>ReadMath → Coefficients</td><td><strong>0.000009（= 8.656E-06）</strong></td></tr>\n      </table>\n      <div class=\"row\"><span class=\"num\">3</span><p>代入方程</p></div>\n      <div class=\"formula\">\n        ŷ = 0.7977 − 0.0011x₁ − 0.0010x₂ + 0.000009x₁x₂\n      </div>\n      <div class=\"rule rule-warn\">注意：8.65563E-06 = 8.65563 × 10⁻⁶ ≈ 0.000009（保留4位有效数字）。考试时这样写数字就行。<
