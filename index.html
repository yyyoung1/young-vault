s=\"row\" style=\"margin-top:10px\"><span class=\"num\">3</span><p>与α = 0.01比较</p></div>\n      <div class=\"formula\">2.996E-65 &lt;&lt; 0.01 = α ✓</div>\n      <div class=\"row\"><span class=\"num\">4</span><p>标准答题句式</p></div>\n      <div class=\"rule rule-green\">\n        Significance F = 2.996E-65 &lt; α = 0.01<br><br>\n        <strong>\"There is a significant linear relationship between GPA and the independent variables.\"</strong><br><br>\n        （GPA与自变量之间存在显著的线性关系。）\n      </div>\n      <div class=\"highlight-box\">\n        F检验说的是\"整体模型\"，即Reading、Math和交互项<strong>合起来</strong>能否显著预测GPA。<br>\n        结论：可以！虽然Reading和Math单独不显著，但三者合起来的整体模型极其显著。\n      </div>\n    </div>\n  </div>\n\n  \n</div>\n\n<script>\nfunction showStep(id){\n  document.querySelectorAll('.step-panel').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.step-tab').forEach(t=>t.classList.remove('active'));\n  document.getElementById('p-'+id).classList.add('active');\n  event.target.classList.add('active');\n}\n<\/script>\n"}, {"id": "week8_time_series_patterns", "week": "Week 8", "title": "Time Series Patterns", "subtitle": "时间序列模式", "color": "#F59E0B", "content": "\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:var(--font-sans)}\n.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}\n.nav button{padding:7px 16px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}\n.nav button.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}\n.nav button:hover:not(.active){background:var(--color-background-secondary)}\n.section{display:none}.section.active{display:block}\n.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 20px;margin-bottom:12px}\n.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}\n.badge-teal{background:#E1F5EE;color:#0F6E56}\n.badge-purple{background:#EEEDFE;color:#3C3489}\n.badge-amber{background:#FAEEDA;color:#633806}\n.badge-coral{background:#FAECE7;color:#712B13}\n.badge-blue{background:#E6F1FB;color:#0C447C}\n.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin:3px 3px 0 0}\n.label{font-size:11px;color:var(--color-text-tertiary);letter-spacing:.03em;margin-bottom:4px}\n.title{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}\n.desc{font-size:13px;color:var(--color-text-secondary);line-height:1.6}\n.exam-box{border-left:3px solid #D85A30;background:#FAECE7;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;padding:12px 16px;margin-top:12px}\n.exam-box p{font-size:13px;color:#4A1B0C;line-height:1.6}\n.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}\n.mini-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px}\n.chart-wrap{margin:12px 0;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px;overflow:hidden}\n.formula{font-family:var(--font-mono);font-size:13px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px;margin:8px 0;color:var(--color-text-primary)}\n.warn{background:#E6F1FB;border-radius:var(--border-radius-md);padding:12px 14px;margin-top:10px}\n.warn p{font-size:13px;color:#0C447C;line-height:1.6}\n<\/style>\n\n<h2 class=\"sr-only\">Week 8.1 时间序列模式 Time Series Patterns 讲解</h2>\n\n\n<div class=\"nav\">\n  <button class=\"active\" onclick=\"show('overview',this)\">总览 Overview</button>\n  <button onclick=\"show('h',this)\">水平模式 Horizontal</button>\n  <button onclick=\"show('t',this)\">趋势模式 Trend</button>\n  <button onclick=\"show('s',this)\">季节模式 Seasonal</button>\n  <button onclick=\"show('c',this)\">周期模式 Cyclical</button>\n  <button onclick=\"show('exam',this)\">考点提示</button>\n</div>\n\n<div id=\"overview\" class=\"section active\">\n  <div class=\"card\">\n    <p class=\"label\">WEEK 8.1 核心框架</p>\n    <p class=\"title\">什么是时间序列？</p>\n    <p class=\"desc\">Time series is a sequence of observations on a variable measured at successive points in time.<br>\n    <strong style=\"color:var(--color-text-primary)\">时间序列</strong>是在连续时间点上对某个变量进行观测所得的数据序列。目标是：<strong style=\"color:var(--color-text-primary)\">识别规律 → 预测未来</strong>。</p>\n  </div>\n  <div class=\"grid-3\" style=\"margin-bottom:12px\">\n    <div class=\"mini-card\" onclick=\"show('h',document.querySelectorAll('.nav button')[1])\" style=\"cursor:pointer\">\n      <span class=\"badge badge-teal\" style=\"margin-bottom:8px\">模式 1</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px\">水平模式 Horizontal</p>\n      <p style=\"font-size:12px;color:var(--color-text-secondary)\">围绕恒定均值随机波动</p>\n      <canvas id=\"c-h\" width=\"140\" height=\"50\" style=\"margin-top:8px;width:100%;max-width:140px\"></canvas>\n    </div>\n    <div class=\"mini-card\" onclick=\"show('t',document.querySelectorAll('.nav button')[2])\" style=\"cursor:pointer\">\n      <span class=\"badge badge-purple\" style=\"margin-bottom:8px\">模式 2</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px\">趋势模式 Trend</p>\n      <p style=\"font-size:12px;color:var(--color-text-secondary)\">数值持续向上或向下移动</p>\n      <canvas id=\"c-t\" width=\"140\" height=\"50\" style=\"margin-top:8px;width:100%;max-width:140px\"></canvas>\n    </div>\n    <div class=\"mini-card\" onclick=\"show('s',document.querySelectorAll('.nav button')[3])\" style=\"cursor:pointer\">\n      <span class=\"badge badge-amber\" style=\"margin-bottom:8px\">模式 3</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px\">季节模式 Seasonal</p>\n      <p style=\"font-size:12px;color:var(--color-text-secondary)\">每年定期出现的规律</p>\n      <canvas id=\"c-s\" width=\"140\" height=\"50\" style=\"margin-top:8px;width:100%;max-width:140px\"></canvas>\n    </div>\n    <div class=\"mini-card\" onclick=\"show('c',document.querySelectorAll('.nav button')[4])\" style=\"cursor:pointer\">\n      <span class=\"badge badge-coral\" style=\"margin-bottom:8px\">模式 4</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px\">周期模式 Cyclical</p>\n      <p style=\"font-size:12px;color:var(--color-text-secondary)\">跨年度的长周期波动</p>\n      <canvas id=\"c-c\" width=\"140\" height=\"50\" style=\"margin-top:8px;width:100%;max-width:140px\"></canvas>\n    </div>\n  </div>\n  <div class=\"exam-box\">\n    <p><strong>考试重点：</strong>给你一张时间序列图，判断属于哪种模式，或在多元回归中加入趋势变量和虚拟变量。</p>\n  </div>\n</div>\n\n<div id=\"h\" class=\"section\">\n  <div class=\"card\">\n    <p class=\"label\">模式 1 · HORIZONTAL PATTERN</p>\n    <p class=\"title\">水平模式</p>\n    <p class=\"desc\">Exists when the data <strong style=\"color:var(--color-text-primary)\">fluctuate randomly around a constant mean</strong> over time.<br>数据在一个恒定均值附近随机波动，没有明显的上升、下降或周期趋势。</p>\n    <div class=\"chart-wrap\">\n      <canvas id=\"chart-h\" height=\"120\"></canvas>\n    </div>\n    <div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n      <span class=\"tag badge-teal\">Stationary（平稳）</span>\n      <span class=\"tag badge-teal\">无趋势 No Trend</span>\n      <span class=\"tag badge-teal\">均值不变 Constant Mean</span>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:10px\">如何识别？</p>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <div class=\"mini-card\"><p style=\"font-size:12px;color:var(--color-text-secondary);margin-bottom:4px\">图形特征</p><p style=\"font-size:13px;color:var(--color-text-primary)\">散点随机分布，围绕水平线上下波动</p></div>\n      <div class=\"mini-card\"><p style=\"font-size:12px;color:var(--color-text-secondary);margin-bottom:4px\">适用预测方法</p><p style=\"font-size:13px;color:var(--color-text-primary)\">Moving Averages、Exponential Smoothing</p></div>\n    </div>\n  </div>\n</div>\n\n<div id=\"t\" class=\"section\">\n  <div class=\"card\">\n    <p class=\"label\">模式 2 · TREND PATTERN</p>\n    <p class=\"title\">趋势模式</p>\n    <p class=\"desc\">Shows <strong style=\"color:var(--color-text-primary)\">gradual shifts or movements to relatively higher or lower values</strong> over a longer period of time.<br>在较长时间内，数值呈现出持续的上升或下降趋势。</p>\n    <div class=\"chart-wrap\">\n      <canvas id=\"chart-t\" height=\"120\"></canvas>\n    </div>\n    <div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n      <span class=\"tag badge-purple\">Upward Trend 上升</span>\n      <span class=\"tag badge-purple\">Downward Trend 下降</span>\n      <span class=\"tag badge-purple\">长期方向性</span>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">回归中如何处理趋势？</p>\n    <p class=\"desc\" style=\"margin-bottom:8px\">在回归预测中，用 <strong style=\"color:var(--color-text-primary)\">时间变量 t</strong> 来捕捉趋势：</p>\n    <div class=\"formula\">ŷ = b₀ + b₁t</div>\n    <p class=\"desc\">其中 t = 1, 2, 3, … 依次代表时间段（如第1季度 = 1，第2季度 = 2…）</p>\n  </div>\n</div>\n\n<div id=\"s\" class=\"section\">\n  <div class=\"card\">\n    <p class=\"label\">模式 3 · SEASONAL PATTERN</p>\n    <p class=\"title\">季节模式</p>\n    <p class=\"desc\"><strong style=\"color:var(--color-text-primary)\">Recurring patterns</strong> over successive periods of time（通常在一年以内）。<br>每隔固定周期就会重复出现的规律，例如每年特定季度销量高低。</p>\n    <div class=\"chart-wrap\">\n      <canvas id=\"chart-s\" height=\"120\"></canvas>\n    </div>\n    <div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n      <span class=\"tag badge-amber\">固定周期 Fixed Period</span>\n      <span class=\"tag badge-amber\">≤1年 Within a Year</span>\n      <span class=\"tag badge-amber\">Dummy Variables</span>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">季节性如何用虚拟变量表示？</p>\n    <p class=\"desc\" style=\"margin-bottom:8px\">4个季度 → 用 <strong style=\"color:var(--color-text-primary)\">K-1 = 3</strong> 个虚拟变量（第4季度为基准）：</p>\n    <div class=\"formula\">Qtr1 = 1 if Q1, 0 otherwise<br>Qtr2 = 1 if Q2, 0 otherwise<br>Qtr3 = 1 if Q3, 0 otherwise</div>\n    <p class=\"desc\">完整模型（含趋势+季节）：</p>\n    <div class=\"formula\">ŷ = b₀ + b₁Qtr1 + b₂Qtr2 + b₃Qtr3 + b₄t</div>\n    <div class=\"warn\">\n      <p><strong>例子：</strong>泳衣零售商 → 秋冬销量低，春夏销量高，这就是典型季节模式。</p>\n    </div>\n  </div>\n</div>\n\n<div id=\"c\" class=\"section\">\n  <div class=\"card\">\n    <p class=\"label\">模式 4 · CYCLICAL PATTERN</p>\n    <p class=\"title\">周期模式</p>\n    <p class=\"desc\">Exists if the time series shows <strong style=\"color:var(--color-text-primary)\">an alternating sequence of points below and above the trendline that lasts for more than one year</strong>.<br>数值在趋势线上下交替波动，且每个周期<strong style=\"color:var(--color-text-primary)\">超过一年</strong>。</p>\n    <div class=\"chart-wrap\">\n      <canvas id=\"chart-c\" height=\"120\"></canvas>\n    </div>\n    <div style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n      <span class=\"tag badge-coral\">&gt;1年 Multi-year</span>\n      <span class=\"tag badge-coral\">经济周期 Business Cycle</span>\n      <span class=\"tag badge-coral\">趋势线上下波动</span>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:10px\">季节 vs 周期 怎么区分？</p>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <div class=\"mini-card\" style=\"border:0.5px solid #FAC775\">\n        <p style=\"font-size:12px;color:#633806;margin-bottom:6px;font-weight:500\">Seasonal 季节性</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">周期 ≤ 1年<br>规律固定（每年同一时期）<br>可用虚拟变量建模</p>\n      </div>\n      <div class=\"mini-card\" style=\"border:0.5px solid #F09595\">\n        <p style=\"font-size:12px;color:#711313;margin-bottom:6px;font-weight:500\">Cyclical 周期性</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">周期 &gt; 1年<br>长度不固定（2~10年）<br>难以精确预测</p>\n      </div>\n    </div>\n  </div>\n</div>\n\n<div id=\"exam\" class=\"section\">\n  <div class=\"card\">\n    <p class=\"label\">考点提示 EXAM FOCUS</p>\n    <p class=\"title\" style=\"margin-bottom:12px\">Week 8.1 核心考法</p>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"mini-card\">\n        <p style=\"font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px\">题型 1：看图判断模式</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">给你一张时间序列折线图，判断是哪种模式。重点看：是否有方向（趋势）？是否有重复高低（季节）？是否跨年度（周期）？还是随机波动（水平）？</p>\n      </div>\n      <div class=\"mini-card\">\n        <p style=\"font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px\">题型 2：混合模式识别</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">现实数据往往是\"趋势 + 季节\"同时存在，例如：每年Q3销量最高（季节），但整体销量逐年上升（趋势）→ 需同时描述两种模式。</p>\n      </div>\n      <div class=\"mini-card\">\n        <p style=\"font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px\">题型 3：虚拟变量建模</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">给出季节模式，要求写出包含虚拟变量的回归方程，解释各系数含义。</p>\n      </div>\n    </div>\n  </div>\n  <div class=\"exam-box\">\n    <p><strong>记忆口诀：</strong>水平随机绕均值，趋势方向长期移，季节每年定时来，周期跨年超一期。</p>\n  </div>\n  <div style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n    \n    \n  </div>\n</div>\n\n<script>\nfunction show(id, btn) {\n  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));\n  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));\n  document.getElementById(id).classList.add('active');\n  if (btn) btn.classList.add('active');\n  if (id === 'h') drawBig('chart-h', 'horizontal');\n  if (id === 't') drawBig('chart-t', 'trend');\n  if (id === 's') drawBig('chart-s', 'seasonal');\n  if (id === 'c') drawBig('chart-c', 'cyclical');\n}\n\nfunction getColors() {\n  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;\n  return { line: dark ? '#9FE1CB' : '#0F6E56', mean: dark ? '#AFA9EC' : '#534AB7', bg: dark ? '#888780' : '#D3D1C7' };\n}\n\nfunction drawMini(canvasId, type) {\n  const c = document.getElementById(canvasId);\n  if (!c) return;\n  const ctx = c.getContext('2d');\n  const W = c.width, H = c.height;\n  ctx.clearRect(0, 0, W, H);\n  const col = getColors();\n  ctx.strokeStyle = col.line;\n  ctx.lineWidth = 1.5;\n  ctx.beginPath();\n  const n = 10;\n  for (let i = 0; i < n; i++) {\n    const x = (i / (n - 1)) * W;\n    let y;\n    if (type === 'horizontal') y = H / 2 + (Math.sin(i * 1.7) * 12 + (i % 3 - 1) * 5);\n    else if (type === 'trend') y = H * 0.85 - (i / (n - 1)) * H * 0.65;\n    else if (type === 'seasonal') y = H / 2 - Math.sin(i * 1.2) * H * 0.35;\n    else y = H / 2 - Math.sin(i * 0.7) * H * 0.35 - (i / n) * 5;\n    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n  }\n  ctx.stroke();\n}\n\nfunction drawBig(canvasId, type) {\n  const c = document.getElementById(canvasId);\n  if (!c) return;\n  c.width = c.offsetWidth || 600;\n  const ctx = c.getContext('2d');\n  const W = c.width, H = c.height;\n  ctx.clearRect(0, 0, W, H);\n  const col = getColors();\n  const n = 20;\n  const pts = [];\n  for (let i = 0; i < n; i++) {\n    const x = 30 + (i / (n - 1)) * (W - 50);\n    let y;\n    if (type === 'horizontal') y = H * 0.5 + (Math.sin(i * 2.3) * 22 + Math.cos(i * 1.1) * 14);\n    else if (type === 'trend') y = H * 0.85 - (i / (n - 1)) * H * 0.65 + (Math.sin(i * 1.5) * 10);\n    else if (type === 'seasonal') { const cycle = Math.sin(i * Math.PI * 2 / 5) * 30; y = H * 0.5 - cycle + (i / n) * (-5); }\n    else y = H * 0.5 - Math.sin(i * 0.45) * H * 0.35 + (Math.sin(i * 0.2) * 8);\n    pts.push({x, y});\n  }\n  if (type === 'horizontal') {\n    ctx.strokeStyle = col.mean; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);\n    ctx.beginPath(); ctx.moveTo(30, H * 0.5); ctx.lineTo(W - 20, H * 0.5); ctx.stroke();\n    ctx.setLineDash([]);\n  }\n  if (type === 'trend') {\n    ctx.strokeStyle = col.mean; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);\n    ctx.beginPath(); ctx.moveTo(30, H * 0.85); ctx.lineTo(W - 20, H * 0.2); ctx.stroke();\n    ctx.setLineDash([]);\n  }\n  ctx.strokeStyle = col.line; ctx.lineWidth = 2;\n  ctx.beginPath();\n  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });\n  ctx.stroke();\n  ctx.fillStyle = col.line;\n  pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); });\n  ctx.fillStyle = col.bg; ctx.font = '11px var(--font-sans)';\n  if (type === 'horizontal') { ctx.fillText('均值 mean', W - 70, H * 0.5 - 6); }\n  if (type === 'trend') { ctx.fillText('趋势线 trend', W - 80, H * 0.25); }\n}\n\nsetTimeout(() => {\n  ['h','t','s','c'].forEach((t,i) => drawMini('c-'+t, ['horizontal','trend','seasonal','cyclical'][i]));\n}, 200);\n<\/script>\n"}, {"id": "week8_2_forecast_methods", "week": "Week 8", "title": "Forecast Methods", "subtitle": "预测方法 · Naive · MA · ES", "color": "#F59E0B", "content": "\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}\n.nav button{padding:7px 16px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}\n.nav button.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}\n.nav button:hover:not(.active){background:var(--color-background-secondary)}\n.section{display:none}.section.active{display:block}\n.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 20px;margin-bottom:12px}\n.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;margin-bottom:8px}\n.badge-teal{background:#E1F5EE;color:#0F6E56}\n.badge-purple{background:#EEEDFE;color:#3C3489}\n.badge-amber{background:#FAEEDA;color:#633806}\n.badge-blue{background:#E6F1FB;color:#0C447C}\n.badge-coral{background:#FAECE7;color:#712B13}\n.title{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}\n.desc{font-size:13px;color:var(--color-text-secondary);line-height:1.7}\n.formula{font-family:var(--font-mono);font-size:13px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin:8px 0;color:var(--color-text-primary);line-height:1.8}\n.mini-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.exam-box{border-left:3px solid #D85A30;background:#FAECE7;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;padding:12px 16px;margin-top:12px}\n.exam-box p{font-size:13px;color:#4A1B0C;line-height:1.6}\n.hint{background:#E6F1FB;border-radius:var(--border-radius-md);padding:12px 14px;margin-top:10px}\n.hint p{font-size:13px;color:#0C447C;line-height:1.6}\n.warn{background:#FAEEDA;border-radius:var(--border-radius-md);padding:12px 14px;margin-top:10px}\n.warn p{font-size:13px;color:#633806;line-height:1.6}\ntable{width:100%;border-collapse:collapse;font-size:12px}\nth{background:var(--color-background-secondary);padding:8px 10px;text-align:left;font-weight:500;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}\ntd{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}\ntr:last-child td{border-bottom:none}\n.calc-row{display:flex;align-items:center;gap:8px;margin:8px 0}\n.calc-label{font-size:12px;color:var(--color-text-secondary);min-width:90px}\ninput[type=range]{flex:1}\n.calc-val{font-size:13px;font-weight:500;color:var(--color-text-primary);min-width:36px;text-align:right}\n.result-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:14px;margin-top:12px}\n.result-num{font-size:22px;font-weight:500;color:var(--color-text-primary)}\n.result-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:2px}\n.step{display:flex;gap:12px;margin-bottom:10px;align-items:flex-start}\n.step-num{min-width:22px;height:22px;border-radius:50%;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--color-text-secondary);flex-shrink:0;margin-top:1px}\n.step-text{font-size:13px;color:var(--color-text-secondary);line-height:1.6}\n.highlight{color:var(--color-text-primary);font-weight:500}\n<\/style>\n\n<h2 class=\"sr-only\">Week 8.2 预测方法 Forecast Methods 讲解</h2>\n\n\n<div class=\"nav\">\n  <button class=\"active\" onclick=\"show('ov',this)\">总览 Overview</button>\n  <button onclick=\"show('naive',this)\">Naïve 朴素法</button>\n  <button onclick=\"show('ma',this)\">Moving Averages 移动平均</button>\n  <button onclick=\"show('es',this)\">Exponential Smoothing 指数平滑</button>\n  <button onclick=\"show('acc',this)\">Accuracy 精度指标</button>\n  <button onclick=\"show('eg',this)\">例题精讲</button>\n</div>\n\n<!-- OVERVIEW -->\n<div id=\"ov\" class=\"section active\">\n  <div class=\"card\">\n    <p style=\"font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px\">WEEK 8.2 核心框架</p>\n    <p class=\"title\">三种预测方法对比</p>\n    <p class=\"desc\" style=\"margin-bottom:14px\">以下三种方法都基于<strong style=\"color:var(--color-text-primary)\">过去的实际值</strong>来预测未来，适用于水平或短期趋势模式。</p>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"mini-card\" style=\"cursor:pointer;border:0.5px solid #9FE1CB\" onclick=\"show('naive',document.querySelectorAll('.nav button')[1])\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">\n          <span class=\"badge badge-teal\" style=\"margin:0\">方法 1</span>\n          <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">Naïve Forecast 朴素预测法</p>\n        </div>\n        <p class=\"desc\">直接用<strong style=\"color:var(--color-text-primary)\">上一期实际值</strong>作为下一期预测值。最简单，适合水平模式。</p>\n        <div class=\"formula\" style=\"margin-top:8px\">ŷ(t+1) = y(t)</div>\n      </div>\n      <div class=\"mini-card\" style=\"cursor:pointer;border:0.5px solid #AFA9EC\" onclick=\"show('ma',document.querySelectorAll('.nav button')[2])\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">\n          <span class=\"badge badge-purple\" style=\"margin:0\">方法 2</span>\n          <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">Moving Averages 移动平均法</p>\n        </div>\n        <p class=\"desc\">用最近 <strong style=\"color:var(--color-text-primary)\">k 期</strong>实际值的平均数作为预测值，平滑随机波动。</p>\n        <div class=\"formula\" style=\"margin-top:8px\">ŷ(t+1) = (y(t) + y(t-1) + … + y(t-k+1)) / k</div>\n      </div>\n      <div class=\"mini-card\" style=\"cursor:pointer;border:0.5px solid #FAC775\" onclick=\"show('es',document.querySelectorAll('.nav button')[3])\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">\n          <span class=\"badge badge-amber\" style=\"margin:0\">方法 3</span>\n          <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">Exponential Smoothing 指数平滑法</p>\n        </div>\n        <p class=\"desc\">用上一期<strong style=\"color:var(--color-text-primary)\">实际值与预测值的加权平均</strong>来预测，权重由 α 控制。</p>\n        <div class=\"formula\" style=\"margin-top:8px\">ŷ(t+1) = α·y(t) + (1-α)·ŷ(t)</div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- NAIVE -->\n<div id=\"naive\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-teal\">方法 1 · NAÏVE FORECAST</span>\n    <p class=\"title\">朴素预测法</p>\n    <p class=\"desc\">Uses the <strong style=\"color:var(--color-text-primary)\">most recent observed value</strong> as the forecast for the next period.<br>直接用上一期的实际值来预测下一期，是最简单的基准方法。</p>\n    <div class=\"formula\" style=\"margin-top:12px\">ŷ(t+1) = y(t)</div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:12px\">计算步骤</p>\n    <div class=\"step\"><span class=\"step-num\">1</span><p class=\"step-text\"><span class=\"highlight\">写明方法：</span>\"Using Naïve method, ŷ(2) = y(1)\"，考试必须先列式说明用的是 Naïve。</p></div>\n    <div class=\"step\"><span class=\"step-num\">2</span><p class=\"step-text\"><span class=\"highlight\">逐期赋值：</span>ŷ(t+1) = y(t)，即每一期的预测值 = 上一期的实际值。</p></div>\n    <div class=\"step\"><span class=\"step-num\">3</span><p class=\"step-text\"><span class=\"highlight\">计算误差：</span>Forecast Error = y(t) − ŷ(t)，再代入 MFE / MAE / MSE / MAPE 公式。</p></div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:10px\">快速示例</p>\n    <table>\n      <tr><th>Week t</th><th>实际值 y(t)</th><th>预测值 ŷ(t)</th><th>误差 e(t)</th></tr>\n      <tr><td>1</td><td>18</td><td>—</td><td>—</td></tr>\n      <tr><td>2</td><td>29</td><td>18 (=y₁)</td><td>11</td></tr>\n      <tr><td>3</td><td>15</td><td>29 (=y₂)</td><td>-14</td></tr>\n      <tr><td>4</td><td>22</td><td>15 (=y₃)</td><td>7</td></tr>\n      <tr><td>5</td><td>14</td><td>22 (=y₄)</td><td>-8</td></tr>\n    </table>\n    <div class=\"warn\"><p><strong>考试提醒：</strong>第一期没有预测值，所以 n = 观测数 − 1，计算误差均值时分母要注意！</p></div>\n  </div>\n</div>\n\n<!-- MOVING AVERAGES -->\n<div id=\"ma\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-purple\">方法 2 · MOVING AVERAGES</span>\n    <p class=\"title\">移动平均法</p>\n    <p class=\"desc\">Uses the <strong style=\"color:var(--color-text-primary)\">average of the most recent k data values</strong> as the forecast for the next period.<br>用最近 k 期实际值的均值作为预测，k 越大越平滑，但对变化反应越慢。</p>\n    <div class=\"formula\" style=\"margin-top:12px\">ŷ(t+1) = [y(t) + y(t-1) + … + y(t-k+1)] / k</div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:12px\">互动演算器 — 3期移动平均</p>\n    <p class=\"desc\" style=\"margin-bottom:12px\">拖动滑块修改数据，自动计算下一期预测值：</p>\n    <div class=\"calc-row\"><span class=\"calc-label\">y(t-2)</span><input type=\"range\" min=\"5\" max=\"50\" value=\"17\" id=\"ma1\" oninput=\"updateMA()\"><span class=\"calc-val\" id=\"ma1v\">17</span></div>\n    <div class=\"calc-row\"><span class=\"calc-label\">y(t-1)</span><input type=\"range\" min=\"5\" max=\"50\" value=\"21\" id=\"ma2\" oninput=\"updateMA()\"><span class=\"calc-val\" id=\"ma2v\">21</span></div>\n    <div class=\"calc-row\"><span class=\"calc-label\">y(t)</span><input type=\"range\" min=\"5\" max=\"50\" value=\"24\" id=\"ma3\" oninput=\"updateMA()\"><span class=\"calc-val\" id=\"ma3v\">24</span></div>\n    <div class=\"result-box\">\n      <div class=\"result-label\">3期移动平均预测值 ŷ(t+1)</div>\n      <div class=\"result-num\" id=\"ma-result\">20.7</div>\n      <p style=\"font-size:12px;color:var(--color-text-tertiary);margin-top:4px\" id=\"ma-formula\">(17 + 21 + 24) / 3 = 20.7</p>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">注意事项</p>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div class=\"mini-card\"><p style=\"font-size:12px;color:var(--color-text-secondary)\"><strong style=\"color:var(--color-text-primary)\">k 越大：</strong>预测越平滑，但对近期变化反应越迟钝，前几期无法生成预测值。</p></div>\n      <div class=\"mini-card\"><p style=\"font-size:12px;color:var(--color-text-secondary)\"><strong style=\"color:var(--color-text-primary)\">k 越小：</strong>对最新数据反应更灵敏，但波动较大（极端情况 k=1 就是 Naïve 法）。</p></div>\n      <div class=\"mini-card\"><p style=\"font-size:12px;color:var(--color-text-secondary)\"><strong style=\"color:var(--color-text-primary)\">有效数据：</strong>3期移动平均，前2期无预测值，计算 MSE 的分母 = n−2。</p></div>\n    </div>\n  </div>\n</div>\n\n<!-- EXPONENTIAL SMOOTHING -->\n<div id=\"es\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-amber\">方法 3 · EXPONENTIAL SMOOTHING</span>\n    <p class=\"title\">指数平滑法</p>\n    <p class=\"desc\">Uses a <strong style=\"color:var(--color-text-primary)\">weighted average</strong> of the most recent actual value and the most recent forecast.<br>用上一期实际值与上一期预测值的加权平均来生成预测，权重由 <strong style=\"color:var(--color-text-primary)\">α（平滑系数）</strong>控制。</p>\n    <div class=\"formula\" style=\"margin-top:12px\">ŷ(t+1) = α · y(t) + (1 − α) · ŷ(t)<br><span style=\"font-size:11px;color:var(--color-text-tertiary)\">其中 0 &lt; α &lt; 1</span></div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:12px\">互动演算器 — α 的影响</p>\n    <div class=\"calc-row\"><span class=\"calc-label\">实际值 y(t)</span><input type=\"range\" min=\"5\" max=\"50\" value=\"22\" id=\"es-y\" oninput=\"updateES()\"><span class=\"calc-val\" id=\"es-yv\">22</span></div>\n    <div class=\"calc-row\"><span class=\"calc-label\">上期预测 ŷ(t)</span><input type=\"range\" min=\"5\" max=\"50\" value=\"18\" id=\"es-yhat\" oninput=\"updateES()\"><span class=\"calc-val\" id=\"es-yhatv\">18</span></div>\n    <div class=\"calc-row\"><span class=\"calc-label\">α 值</span><input type=\"range\" min=\"1\" max=\"9\" value=\"2\" step=\"1\" id=\"es-alpha\" oninput=\"updateES()\"><span class=\"calc-val\" id=\"es-av\">0.2</span></div>\n    <div class=\"result-box\">\n      <div class=\"result-label\">指数平滑预测值 ŷ(t+1)</div>\n      <div class=\"result-num\" id=\"es-result\">18.8</div>\n      <p style=\"font-size:12px;color:var(--color-text-tertiary);margin-top:4px\" id=\"es-formula\">0.2 × 22 + 0.8 × 18 = 18.8</p>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:10px\">α 的含义</p>\n    <div class=\"grid2\">\n      <div class=\"mini-card\" style=\"border:0.5px solid #9FE1CB\">\n        <p style=\"font-size:12px;color:#0F6E56;font-weight:500;margin-bottom:4px\">α 接近 1（如 0.8）</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">更重视最新实际值，对近期变化反应灵敏，但波动较大</p>\n      </div>\n      <div class=\"mini-card\" style=\"border:0.5px solid #AFA9EC\">\n        <p style=\"font-size:12px;color:#3C3489;font-weight:500;margin-bottom:4px\">α 接近 0（如 0.1）</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">更重视历史预测值，曲线更平滑，但对变化反应迟钝</p>\n      </div>\n    </div>\n    <div class=\"hint\"><p><strong>初始值：</strong>第1期无预测值，通常用 ŷ(1) = y(1) 作为初始预测值开始计算。</p></div>\n    <div class=\"warn\"><p><strong>最优 α：</strong>考试可能要求用 trial and error 或 optimization 找到使 MSE 最小的 α 值。</p></div>\n  </div>\n</div>\n\n<!-- ACCURACY -->\n<div id=\"acc\" class=\"section\">\n  <div class=\"card\">\n    <p style=\"font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px\">FORECAST ACCURACY</p>\n    <p class=\"title\">四个精度指标</p>\n    <p class=\"desc\">Forecast Error for period t：e(t) = y(t) − ŷ(t)（实际值 − 预测值）</p>\n  </div>\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <div class=\"card\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n        <span class=\"badge badge-teal\" style=\"margin:0\">MFE</span>\n        <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">Mean Forecast Error — 平均预测误差</p>\n      </div>\n      <div class=\"formula\">MFE = Σe(t) / n</div>\n      <p class=\"desc\">正误差与负误差相互抵消。<strong style=\"color:var(--color-text-primary)\">MFE ≈ 0</strong> 说明预测无系统性偏差（无偏）；MFE &gt; 0 说明整体预测偏低；MFE &lt; 0 说明整体预测偏高。</p>\n    </div>\n    <div class=\"card\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n        <span class=\"badge badge-purple\" style=\"margin:0\">MAE</span>\n        <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">Mean Absolute Error — 平均绝对误差</p>\n      </div>\n      <div class=\"formula\">MAE = Σ|e(t)| / n</div>\n      <p class=\"desc\">取绝对值，正负不会相消，衡量平均误差大小。<strong style=\"color:var(--color-text-primary)\">越小越好</strong>，与原数据同单位，直观易解释。</p>\n    </div>\n    <div class=\"card\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n        <span class=\"badge badge-amber\" style=\"margin:0\">MSE</span>\n        <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">Mean Squared Error — 均方误差</p>\n      </div>\n      <div class=\"formula\">MSE = Σe(t)² / n</div>\n      <p class=\"desc\">平方后误差不消，且对大误差惩罚更重。<strong style=\"color:var(--color-text-primary)\">最常用于比较不同预测方法</strong>（选α或k时以MSE最小为准）。</p>\n    </div>\n    <div class=\"card\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n        <span class=\"badge badge-coral\" style=\"margin:0\">MAPE</span>\n        <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">Mean Absolute Percentage Error — 平均绝对百分比误差</p>\n      </div>\n      <div class=\"formula\">MAPE = (Σ|e(t)/y(t)|) / n × 100%</div>\n      <p class=\"desc\">用百分比表示，方便跨数据集比较。例如 MAPE = 10% 意味着预测平均偏差约为实际值的 10%。</p>\n    </div>\n  </div>\n  <div class=\"exam-box\">\n    <p><strong>四指标记忆：</strong>MFE 看偏向（有正负）；MAE 看平均大小（取绝对值）；MSE 比较方法优劣（取平方）；MAPE 看百分比偏差（÷实际值）。</p>\n  </div>\n</div>\n\n<!-- 例题 -->\n<div id=\"eg\" class=\"section\">\n  <div class=\"card\">\n    <p style=\"font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px\">例题精讲 · WORKED EXAMPLE</p>\n    <p class=\"title\" style=\"margin-bottom:8px\">Pokémon Plushies 销量预测</p>\n    <p class=\"desc\" style=\"margin-bottom:12px\">已知连续周销量数据如下：</p>\n    <table>\n      <tr><th>Week</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>\n      <tr><td>Sales y(t)</td><td>17</td><td>21</td><td>19</td><td>23</td><td>18</td><td>16</td></tr>\n    </table>\n  </div>\n\n  <div class=\"card\">\n    <span class=\"badge badge-purple\">Q1</span>\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">3期移动平均 + MSE</p>\n    <div class=\"step\"><span class=\"step-num\">1</span><p class=\"step-text\">从第4期开始有预测值：<span class=\"formula\" style=\"display:inline;padding:3px 8px\">ŷ(4) = (y1+y2+y3)/3 = (17+21+19)/3 = 19</span></p></div>\n    <div class=\"step\"><span class=\"step-num\">2</span><p class=\"step-text\">依次计算：<br>ŷ(5) = (21+19+23)/3 = 21，ŷ(6) = (19+23+18)/3 = 20</p></div>\n    <div class=\"step\"><span class=\"step-num\">3</span><p class=\"step-text\">计算误差并求 MSE：e(4)=4, e(5)=-3, e(6)=-4<br><span class=\"formula\" style=\"display:inline;padding:3px 8px\">MSE = (4² + (-3)² + (-4)²) / 3 = (16+9+16)/3 ≈ 13.7</span></p></div>\n    <table style=\"margin-top:10px\">\n      <tr><th>Week t</th><th>y(t)</th><th>ŷ(t)</th><th>e(t)</th><th>e²</th></tr>\n      <tr><td>4</td><td>23</td><td>19</td><td>4</td><td>16</td></tr>\n      <tr><td>5</td><td>18</td><td>21</td><td>-3</td><td>9</td></tr>\n      <tr><td>6</td><td>16</td><td>20</td><td>-4</td><td>16</td></tr>\n      <tr><td colspan=\"4\" style=\"font-weight:500\">MSE</td><td style=\"font-weight:500;color:var(--color-text-primary)\">≈ 13.7</td></tr>\n    </table>\n  </div>\n\n  <div class=\"card\">\n    <span class=\"badge badge-amber\">Q2</span>\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">α = 0.2 指数平滑 + MSE</p>\n    <div class=\"step\"><span class=\"step-num\">1</span><p class=\"step-text\">初始值：ŷ(1) = y(1) = 17</p></div>\n    <div class=\"step\"><span class=\"step-num\">2</span><p class=\"step-text\">逐期代入公式 ŷ(t+1) = 0.2·y(t) + 0.8·ŷ(t)：<br>ŷ(2) = 0.2×17 + 0.8×17 = <strong>17</strong><br>ŷ(3) = 0.2×21 + 0.8×17 = 4.2 + 13.6 = <strong>17.8</strong><br>ŷ(4) = 0.2×19 + 0.8×17.8 = 3.8 + 14.24 = <strong>18.04</strong><br>ŷ(5) = 0.2×23 + 0.8×18.04 = 4.6 + 14.43 = <strong>19.03</strong><br>ŷ(6) = 0.2×18 + 0.8×19.03 = 3.6 + 15.22 = <strong>18.82</strong></p></div>\n    <table style=\"margin-top:10px\">\n      <tr><th>Week t</th><th>y(t)</th><th>ŷ(t)</th><th>e(t)</th><th>e²</th></tr>\n      <tr><td>2</td><td>21</td><td>17</td><td>4</td><td>16</td></tr>\n      <tr><td>3</td><td>19</td><td>17.8</td><td>1.2</td><td>1.44</td></tr>\n      <tr><td>4</td><td>23</td><td>18.04</td><td>4.96</td><td>24.6</td></tr>\n      <tr><td>5</td><td>18</td><td>19.03</td><td>-1.03</td><td>1.06</td></tr>\n      <tr><td>6</td><td>16</td><td>18.82</td><td>-2.82</td><td>7.95</td></tr>\n      <tr><td colspan=\"4\" style=\"font-weight:500\">MSE</td><td style=\"font-weight:500;color:var(--color-text-primary)\">≈ 10.21</td></tr>\n    </table>\n  </div>\n\n  <div class=\"card\">\n    <span class=\"badge badge-teal\">Q3</span>\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">寻找最优 α（optimization）</p>\n    <p class=\"desc\">用 trial and error 或优化方法，找到使 MSE 最小的 α 值。</p>\n    <div class=\"hint\"><p><strong>考试答法：</strong>When α = [最优值]，it results in the smallest MSE = [值]。一般题目会告知 α，或让你写出方法思路，不需要手算。实际中用 Excel Solver 完成。</p></div>\n  </div>\n\n  <div style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n    \n    \n    \n  </div>\n</div>\n\n<script>\nfunction show(id,btn){\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));\n  document.getElementById(id).classList.add('active');\n  if(btn) btn.classList.add('active');\n}\nfunction updateMA(){\n  const v1=+document.getElementById('ma1').value;\n  const v2=+document.getElementById('ma2').value;\n  const v3=+document.getElementById('ma3').value;\n  document.getElementById('ma1v').textContent=v1;\n  document.getElementById('ma2v').textContent=v2;\n  document.getElementById('ma3v').textContent=v3;\n  const r=((v1+v2+v3)/3).toFixed(1);\n  document.getElementById('ma-result').textContent=r;\n  document.getElementById('ma-formula').textContent=`(${v1} + ${v2} + ${v3}) / 3 = ${r}`;\n}\nfunction updateES(){\n  const y=+document.getElementById('es-y').value;\n  const yhat=+document.getElementById('es-yhat').value;\n  const a=+document.getElementById('es-alpha').value/10;\n  document.getElementById('es-yv').textContent=y;\n  document.getElementById('es-yhatv').textContent=yhat;\n  document.getElementById('es-av').textContent=a.toFixed(1);\n  const r=(a*y+(1-a)*yhat).toFixed(1);\n  document.getElementById('es-result').textContent=r;\n  document.getElementById('es-formula').textContent=`${a.toFixed(1)} × ${y} + ${(1-a).toFixed(1)} × ${yhat} = ${r}`;\n}\n<\/script>\n"}, {"id": "week8_3_regression_forecasting", "week": "Week 8", "title": "Regression Forecasting", "subtitle": "回归预测时间序列", "color": "#F59E0B", "content": "\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}\n.nav button{padding:7px 16px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}\n.nav button.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}\n.nav button:hover:not(.active){background:var(--color-background-secondary)}\n.section{display:none}.section.active{display:block}\n.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 20px;margin-bottom:12px}\n.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;margin-bottom:8px}\n.badge-teal{background:#E1F5EE;color:#0F6E56}\n.badge-purple{background:#EEEDFE;color:#3C3489}\n.badge-amber{background:#FAEEDA;color:#633806}\n.badge-blue{background:#E6F1FB;color:#0C447C}\n.badge-coral{background:#FAECE7;color:#712B13}\n.badge-red{background:#FCEBEB;color:#791F1F}\n.title{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}\n.desc{font-size:13px;color:var(--color-text-secondary);line-height:1.7}\n.formula{font-family:var(--font-mono);font-size:13px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin:8px 0;color:var(--color-text-primary);line-height:1.9}\n.mini-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px}\n.exam-box{border-left:3px solid #D85A30;background:#FAECE7;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;padding:12px 16px;margin-top:10px}\n.exam-box p{font-size:13px;color:#4A1B0C;line-height:1.6}\n.hint{background:#E6F1FB;border-radius:var(--border-radius-md);padding:12px 14px;margin-top:10px}\n.hint p{font-size:13px;color:#0C447C;line-height:1.6}\n.warn{background:#FAEEDA;border-radius:var(--border-radius-md);padding:12px 14px;margin-top:10px}\n.warn p{font-size:13px;color:#633806;line-height:1.6}\n.success{background:#EAF3DE;border-radius:var(--border-radius-md);padding:12px 14px;margin-top:10px}\n.success p{font-size:13px;color:#3B6D11;line-height:1.6}\ntable{width:100%;border-collapse:collapse;font-size:12px}\nth{background:var(--color-background-secondary);padding:8px 10px;text-align:center;font-weight:500;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}\ntd{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);text-align:center}\ntr:last-child td{border-bottom:none}\n.step{display:flex;gap:12px;margin-bottom:10px;align-items:flex-start}\n.step-num{min-width:22px;height:22px;border-radius:50%;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--color-text-secondary);flex-shrink:0;margin-top:2px}\n.hl{color:var(--color-text-primary);font-weight:500}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.qtr-row{display:flex;gap:6px;margin:6px 0;align-items:center}\n.qtr-label{font-size:12px;color:var(--color-text-secondary);width:60px;flex-shrink:0}\n.qtr-val{font-size:12px;color:var(--color-text-primary);font-family:var(--font-mono);width:32px;text-align:center;font-weight:500}\n.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}\n.interp-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}\n.interp-card:hover{border-color:var(--color-border-primary)}\n.interp-detail{display:none;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary)}\n.interp-card.open .interp-detail{display:block}\n.forecast-input{display:flex;align-items:center;gap:8px;margin:6px 0}\n.forecast-input label{font-size:12px;color:var(--color-text-secondary);min-width:80px}\n.forecast-input select,.forecast-input input{font-size:13px;padding:5px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);flex:1}\n.result-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:14px;margin-top:12px}\n.result-num{font-size:24px;font-weight:500;color:var(--color-text-primary)}\n.result-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:2px}\n.tab2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}\n.tab2 button{font-size:12px;padding:5px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}\n.tab2 button.on{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}\n.eg-sub{display:none}.eg-sub.on{display:block}\n<\/style>\n\n<h2 class=\"sr-only\">Week 8.3 用回归分析做时间序列预测</h2>\n\n\n<div class=\"nav\">\n  <button class=\"active\" onclick=\"show('ov',this)\">总览 Overview</button>\n  <button onclick=\"show('trend',this)\">趋势变量 t</button>\n  <button onclick=\"show('dummy',this)\">虚拟变量 Dummy</button>\n  <button onclick=\"show('model',this)\">完整模型</button>\n  <button onclick=\"show('interp',this)\">解读 Excel 输出</button>\n  <button onclick=\"show('eg',this)\">例题精讲</button>\n</div>\n\n<!-- OVERVIEW -->\n<div id=\"ov\" class=\"section active\">\n  <div class=\"card\">\n    <p style=\"font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px\">WEEK 8.3 核心框架</p>\n    <p class=\"title\">用回归预测时间序列</p>\n    <p class=\"desc\" style=\"margin-bottom:14px\">当时间序列含有<strong class=\"hl\">趋势</strong>或<strong class=\"hl\">季节性</strong>时，用之前的 Naïve / MA / ES 效果较差。此时用<strong class=\"hl\">多元线性回归</strong>，把时间和季节信息作为自变量来建模预测。</p>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"mini-card\" style=\"border:0.5px solid #9FE1CB;cursor:pointer\" onclick=\"show('trend',document.querySelectorAll('.nav button')[1])\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">\n          <span class=\"badge badge-teal\" style=\"margin:0\">变量 1</span>\n          <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">趋势变量 t（Trend Variable）</p>\n        </div>\n        <p class=\"desc\">用连续整数 t = 1, 2, 3, … 代表时间顺序，捕捉数据的<strong class=\"hl\">线性上升或下降趋势</strong>。</p>\n        <div class=\"formula\" style=\"margin-top:8px\">ŷ = b₀ + b₁t</div>\n      </div>\n      <div class=\"mini-card\" style=\"border:0.5px solid #AFA9EC;cursor:pointer\" onclick=\"show('dummy',document.querySelectorAll('.nav button')[2])\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">\n          <span class=\"badge badge-purple\" style=\"margin:0\">变量 2</span>\n          <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">虚拟变量 Dummy Variables（Seasonal）</p>\n        </div>\n        <p class=\"desc\">用 0/1 变量编码季节类别，K 个季节只需 <strong class=\"hl\">K−1 个虚拟变量</strong>，第 K 个季节为基准（Base）。</p>\n        <div class=\"formula\" style=\"margin-top:8px\">Qtr1=1 if Q1; Qtr2=1 if Q2; Qtr3=1 if Q3</div>\n      </div>\n      <div class=\"mini-card\" style=\"border:0.5px solid #FAC775;cursor:pointer\" onclick=\"show('model',document.querySelectorAll('.nav button')[3])\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">\n          <span class=\"badge badge-amber\" style=\"margin:0\">完整模型</span>\n          <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">趋势 + 季节 Combined Model</p>\n        </div>\n        <p class=\"desc\">同时加入趋势变量和季节虚拟变量，建立能捕捉<strong class=\"hl\">方向性增长 + 周期性波动</strong>的预测模型。</p>\n        <div class=\"formula\" style=\"margin-top:8px\">ŷ = b₀ + b₁Qtr1 + b₂Qtr2 + b₃Qtr3 + b₄t</div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- TREND VARIABLE -->\n<div id=\"trend\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-teal\">趋势变量 TREND VARIABLE</span>\n    <p class=\"title\">时间变量 t 的设置</p>\n    <p class=\"desc\">预测变量 ŷ 是时间序列在 t 期的实际值，趋势变量就是时间编号 t，它是一个<strong class=\"hl\">连续整数</strong>，反映数据在时间轴上的位置。</p>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:12px\">如何设置 t？</p>\n    <p class=\"desc\" style=\"margin-bottom:10px\">以季度数据为例：</p>\n    <table>\n      <tr><th>年份</th><th>季度</th><th>t 值</th><th>说明</th></tr>\n      <tr><td>Year 1</td><td>Q1</td><td style=\"font-weight:500;color:var(--color-text-primary)\">1</td><td style=\"color:var(--color-text-secondary)\">第1个观测</td></tr>\n      <tr><td>Year 1</td><td>Q2</td><td style=\"font-weight:500;color:var(--color-text-primary)\">2</td><td style=\"color:var(--color-text-secondary)\">第2个观测</td></tr>\n      <tr><td>Year 1</td><td>Q3</td><td style=\"font-weight:500;color:var(--color-text-primary)\">3</td><td style=\"color:var(--color-text-secondary)\">第3个观测</td></tr>\n      <tr><td>Year 1</td><td>Q4</td><td style=\"font-weight:500;color:var(--color-text-primary)\">4</td><td style=\"color:var(--color-text-secondary)\">第4个观测</td></tr>\n      <tr><td>Year 2</td><td>Q1</td><td style=\"font-weight:500;color:var(--color-text-primary)\">5</td><td style=\"color:var(--color-text-secondary)\">第5个观测</td></tr>\n      <tr><td>Year 2</td><td>Q2</td><td style=\"font-weight:500;color:var(--color-text-primary)\">6</td><td style=\"color:var(--color-text-secondary)\">…以此类推</td></tr>\n    </table>\n    <div class=\"hint\"><p><strong>关键：</strong>t 是全局连续编号，不是季度内编号。3年 × 4季度 = 12期，所以 t = 1 到 12。Year 4 Q1 就是 t = 13。</p></div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">b₁（t 的系数）如何解读？</p>\n    <div class=\"formula\">ŷ = b₀ + b₁t</div>\n    <p class=\"desc\" style=\"margin-top:8px\"><strong class=\"hl\">b₁</strong> 表示：每增加一个时间单位（如一个季度），预测值平均增加 b₁ 个单位，<strong class=\"hl\">holding other variables fixed</strong>。</p>\n    <div class=\"success\"><p><strong>例如：</strong>b₁ = 23.125，说明每多一个季度，销量平均增加 23.125 本，其他条件不变。</p></div>\n  </div>\n</div>\n\n<!-- DUMMY VARIABLES -->\n<div id=\"dummy\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-purple\">虚拟变量 DUMMY VARIABLES</span>\n    <p class=\"title\">K−1 规则</p>\n    <p class=\"desc\">K 个类别（如 4 个季度）需要 <strong class=\"hl\">K−1 = 3 个虚拟变量</strong>，省掉的那一个季度作为<strong class=\"hl\">基准组（Reference / Base）</strong>。</p>\n    <div class=\"warn\"><p><strong>为什么是 K−1？</strong>如果放入全部 4 个虚拟变量，会造成完全多重共线性（Qtr1+Qtr2+Qtr3+Qtr4 = 1 恒成立），回归无法估计。</p></div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:12px\">4个季度的虚拟变量编码</p>\n    <table>\n      <tr><th>季度</th><th>Qtr1</th><th>Qtr2</th><th>Qtr3</th><th>说明</th></tr>\n      <tr><td style=\"font-weight:500\">Q1</td><td style=\"color:#0F6E56;font-weight:500\">1</td><td>0</td><td>0</td><td style=\"color:var(--color-text-secondary)\">Qtr1 = 1</td></tr>\n      <tr><td style=\"font-weight:500\">Q2</td><td>0</td><td style=\"color:#3C3489;font-weight:500\">1</td><td>0</td><td style=\"color:var(--color-text-secondary)\">Qtr2 = 1</td></tr>\n      <tr><td style=\"font-weight:500\">Q3</td><td>0</td><td>0</td><td style=\"color:#633806;font-weight:500\">1</td><td style=\"color:var(--color-text-secondary)\">Qtr3 = 1</td></tr>\n      <tr><td style=\"font-weight:500;background:#FCEBEB;color:#791F1F\">Q4（基准）</td><td>0</td><td>0</td><td>0</td><td style=\"color:#791F1F;background:#FCEBEB\">全为 0 → 基准组</td></tr>\n    </table>\n    <div class=\"hint\"><p><strong>Q4 全为 0：</strong>当 Qtr1=Qtr2=Qtr3=0 时，自动代表 Q4。Q4 效果已包含在截距 b₀ 中。</p></div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">虚拟变量系数如何解读？</p>\n    <p class=\"desc\" style=\"margin-bottom:8px\">以 b₂（Qtr2 的系数）为例：</p>\n    <div class=\"formula\">b₂ = 该季度相对于<strong>基准季度（Q4）</strong>的平均差异<br>holding all other variables fixed（t 不变）</div>\n    <div class=\"success\"><p><strong>例如：</strong>b₂ = −1465.42，说明在 Q2 时，销量比 Q4 <strong>少 1465.42 本</strong>，其他条件不变。</p></div>\n    <div class=\"exam-box\"><p><strong>考试答题模板：</strong>\"When it is in Quarter 2, the [y变量] is [|b₂|] [less/more] than that in Quarter 4, holding other independent variables fixed.\"</p></div>\n  </div>\n</div>\n\n<!-- FULL MODEL -->\n<div id=\"model\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-amber\">完整模型 COMBINED MODEL</span>\n    <p class=\"title\">趋势 + 季节 完整回归方程</p>\n    <p class=\"desc\" style=\"margin-bottom:10px\">同时捕捉<strong class=\"hl\">方向性趋势（t）</strong>和<strong class=\"hl\">周期性季节效应（Dummy）</strong>：</p>\n    <div class=\"formula\">ŷ = b₀ + b₁Qtr1 + b₂Qtr2 + b₃Qtr3 + b₄t</div>\n    <p class=\"desc\" style=\"margin-top:8px\">其中 b₀ = 截距（Q4 在 t=0 时的基准值）；b₁−b₃ = 各季度相对 Q4 的差异；b₄ = 每期趋势增量。</p>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:12px\">代入预测：Year 4 各季度</p>\n    <p class=\"desc\" style=\"margin-bottom:10px\">已知方程：ŷ = 2306.667 − 642.292Qtr1 − 1465.42Qtr2 + 349.792Qtr3 + 23.125t</p>\n    <p class=\"desc\" style=\"margin-bottom:8px\">Year 4 中 t 从 13 开始（Year 1 Q1 = t=1，…，Year 3 Q4 = t=12）：</p>\n    <table>\n      <tr><th>季度</th><th>t</th><th>Qtr1</th><th>Qtr2</th><th>Qtr3</th><th>预测 ŷ</th></tr>\n      <tr><td>Y4 Q1</td><td>13</td><td style=\"color:#0F6E56;font-weight:500\">1</td><td>0</td><td>0</td><td style=\"font-weight:500;color:var(--color-text-primary)\">1965</td></tr>\n      <tr><td>Y4 Q2</td><td>14</td><td>0</td><td style=\"color:#3C3489;font-weight:500\">1</td><td>0</td><td style=\"font-weight:500;color:var(--color-text-primary)\">1165</td></tr>\n      <tr><td>Y4 Q3</td><td>15</td><td>0</td><td>0</td><td style=\"color:#633806;font-weight:500\">1</td><td style=\"font-weight:500;color:var(--color-text-primary)\">3003</td></tr>\n      <tr><td>Y4 Q4</td><td>16</td><td>0</td><td>0</td><td>0</td><td style=\"font-weight:500;color:var(--color-text-primary)\">2677</td></tr>\n    </table>\n    <div class=\"hint\"><p><strong>代入示例（Q1）：</strong>2306.667 − 642.292×<strong>1</strong> − 1465.42×<strong>0</strong> + 349.792×<strong>0</strong> + 23.125×<strong>13</strong> = <strong>1965</strong></p></div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:10px\">互动预测器</p>\n    <p class=\"desc\" style=\"margin-bottom:10px\">基于教材例题的方程，选择季度 + 输入 t 值，自动计算预测值：</p>\n    <div class=\"forecast-input\">\n      <label>季度 Quarter</label>\n      <select id=\"fc-qtr\" onchange=\"calcForecast()\">\n        <option value=\"1\">Q1</option>\n        <option value=\"2\">Q2</option>\n        <option value=\"3\">Q3</option>\n        <option value=\"4\">Q4（基准）</option>\n      </select>\n    </div>\n    <div class=\"forecast-input\">\n      <label>时间 t</label>\n      <input type=\"number\" id=\"fc-t\" value=\"13\" min=\"1\" max=\"30\" oninput=\"calcForecast()\">\n    </div>\n    <div class=\"result-box\">\n      <div class=\"result-label\">预测销量 ŷ（copies）</div>\n      <div class=\"result-num\" id=\"fc-result\">1965.0</div>\n      <p style=\"font-size:12px;color:var(--color-text-tertiary);margin-top:4px\" id=\"fc-formula\">2306.667 − 642.292×1 + 23.125×13</p>\n    </div>\n  </div>\n</div>\n\n<!-- INTERPRET EXCEL -->\n<div id=\"interp\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-blue\">解读 Excel 输出 READING OUTPUT</span>\n    <p class=\"title\">考试核心：看表答题</p>\n    <p class=\"desc\">考试最常考的形式是：给你一张 Excel 回归输出表，要求回答 3−4 个问题。</p>\n  </div>\n\n  <p style=\"font-size:13px;color:var(--color-text-secondary);margin-bottom:10px\">点击展开每个考点的答题方法：</p>\n\n  <div class=\"interp-card\" onclick=\"toggleInterp(this)\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span class=\"badge badge-teal\" style=\"margin:0\">考点 1</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">写出回归方程</p>\n      <span style=\"margin-left:auto;font-size:16px;color:var(--color-text-tertiary)\">﹀</span>\n    </div>\n    <div class=\"interp-detail\">\n      <p class=\"desc\" style=\"margin-bottom:8px\">从 Excel 的 Coefficients 列直接读取系数，格式如下：</p>\n      <div class=\"formula\">ŷ = [Intercept] + [b₁]Qtr1 + [b₂]Qtr2 + [b₃]Qtr3 + [b₄]t</div>\n      <p class=\"desc\" style=\"margin-top:8px\">先定义虚拟变量（\"Let Qtr1 = 1 if Q1, 0 otherwise…\"），再写方程。</p>\n    </div>\n  </div>\n\n  <div class=\"interp-card\" onclick=\"toggleInterp(this)\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span class=\"badge badge-purple\" style=\"margin:0\">考点 2</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">判断显著性 Significance</p>\n      <span style=\"margin-left:auto;font-size:16px;color:var(--color-text-tertiary)\">﹀</span>\n    </div>\n    <div class=\"interp-detail\">\n      <div class=\"grid2\" style=\"margin-bottom:10px\">\n        <div class=\"mini-card\" style=\"border:0.5px solid #9FE1CB\">\n          <p style=\"font-size:12px;font-weight:500;color:#0F6E56;margin-bottom:4px\">显著 Significant</p>\n          <p style=\"font-size:12px;color:var(--color-text-secondary)\">P-value &lt; α（通常 0.05）<br>→ 该变量对 y 有显著影响</p>\n        </div>\n        <div class=\"mini-card\" style=\"border:0.5px solid #F09595\">\n          <p style=\"font-size:12px;font-weight:500;color:#791F1F;margin-bottom:4px\">不显著</p>\n          <p style=\"font-size:12px;color:var(--color-text-secondary)\">P-value ≥ 0.05<br>→ 无法证明该变量有影响</p>\n        </div>\n      </div>\n      <div class=\"exam-box\"><p><strong>答题模板：</strong>\"Qtr2: P-value = 2.3E-07 &lt; 0.05, it is a significant factor.\"</p></div>\n    </div>\n  </div>\n\n  <div class=\"interp-card\" onclick=\"toggleInterp(this)\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span class=\"badge badge-amber\" style=\"margin:0\">考点 3</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">解释系数含义</p>\n      <span style=\"margin-left:auto;font-size:16px;color:var(--color-text-tertiary)\">﹀</span>\n    </div>\n    <div class=\"interp-detail\">\n      <p class=\"desc\" style=\"margin-bottom:8px\">虚拟变量系数的解读（与基准季度比较）：</p>\n      <div class=\"formula\">b₂ = −1465.42</div>\n      <div class=\"exam-box\"><p><strong>答题模板：</strong>\"When it is in Quarter 2, the sales is 1465.42 <strong>less</strong> than that in Quarter 4, holding other independent variables fixed.\"</p></div>\n      <p class=\"desc\" style=\"margin-top:8px\">趋势变量系数：b₄ = 23.125 → \"每增加一个时间单位（季度），销量平均增加 23.125 本，其他不变。\"</p>\n    </div>\n  </div>\n\n  <div class=\"interp-card\" onclick=\"toggleInterp(this)\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span class=\"badge badge-coral\" style=\"margin:0\">考点 4</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">计算预测值 Forecast</p>\n      <span style=\"margin-left:auto;font-size:16px;color:var(--color-text-tertiary)\">﹀</span>\n    </div>\n    <div class=\"interp-detail\">\n      <div class=\"step\"><span class=\"step-num\">1</span><p class=\"step-text\">确认未来期的 t 值（接续历史数据编号）</p></div>\n      <div class=\"step\"><span class=\"step-num\">2</span><p class=\"step-text\">确认该期属于哪个季度，填入对应虚拟变量值（0或1）</p></div>\n      <div class=\"step\"><span class=\"step-num\">3</span><p class=\"step-text\">代入方程计算 ŷ</p></div>\n      <div class=\"hint\"><p><strong>记住：</strong>Q4 时 Qtr1=Qtr2=Qtr3 全为 0，代入后方程只剩 b₀ + b₄t。</p></div>\n    </div>\n  </div>\n\n  <div class=\"interp-card\" onclick=\"toggleInterp(this)\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span class=\"badge badge-red\" style=\"margin:0\">考点 5</span>\n      <p style=\"font-size:14px;font-weight:500;color:var(--color-text-primary)\">识别时间序列模式</p>\n      <span style=\"margin-left:auto;font-size:16px;color:var(--color-text-tertiary)\">﹀</span>\n    </div>\n    <div class=\"interp-detail\">\n      <p class=\"desc\" style=\"margin-bottom:8px\">考试常问\"图中显示什么模式\"，标准答题包含两部分：</p>\n      <div class=\"exam-box\"><p><strong>答题模板：</strong>\"The time series plot shows <strong>linear trend</strong> and <strong>seasonal patterns</strong> in the data. For instance, in each year the lowest value occurs in quarter [X] and the highest value occurs in quarter [Y]. Also, the [sales] [increase/decrease] over time.\"</p></div>\n    </div>\n  </div>\n</div>\n\n<!-- WORKED EXAMPLE -->\n<div id=\"eg\" class=\"section\">\n  <div class=\"card\">\n    <p style=\"font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px\">例题精讲 · 教材原题</p>\n    <p class=\"title\" style=\"margin-bottom:8px\">大学教材季度销量预测</p>\n    <p class=\"desc\" style=\"margin-bottom:12px\">某大学教材过去 3 年的季度销量数据如下（单位：册），Excel 已拟合包含趋势和季节效应的多元回归。</p>\n    <table>\n      <tr><th>Year</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>\n      <tr><td style=\"font-weight:500\">1</td><td>1690</td><td>940</td><td>2625</td><td>2500</td></tr>\n      <tr><td style=\"font-weight:500\">2</td><td>1800</td><td>900</td><td>2900</td><td>2360</td></tr>\n      <tr><td style=\"font-weight:500\">3</td><td>1850</td><td>1100</td><td>2930</td><td>2615</td></tr>\n    </table>\n    <div class=\"warn\" style=\"margin-top:10px\"><p><strong>特征：</strong>Q3 最高、Q2 最低，且整体销量随时间上升 → 同时存在<strong>趋势模式 + 季节模式</strong>。</p></div>\n  </div>\n\n  <div class=\"tab2\">\n    <button class=\"on\" onclick=\"showEg('q1',this)\">Q1 识别模式</button>\n    <button onclick=\"showEg('q2',this)\">Q2 写方程</button>\n    <button onclick=\"showEg('q3',this)\">Q3 预测Year 4</button>\n    <button onclick=\"showEg('q4',this)\">Q4 显著性+解释</button>\n  </div>\n\n  <div id=\"q1\" class=\"eg-sub on\">\n    <div class=\"card\">\n      <span class=\"badge badge-teal\">Q1</span>\n      <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">What types of pattern exists in the data?</p>\n      <div class=\"step\"><span class=\"step-num\">看</span><p class=\"step-text\">观察图形：每年 Q2 最低、Q3 最高 → <strong class=\"hl\">季节模式 Seasonal Pattern</strong></p></div>\n      <div class=\"step\"><span class=\"step-num\">看</span><p class=\"step-text\">整体销量逐年上升 → <strong class=\"hl\">线性趋势 Linear Trend</strong></p></div>\n      <div class=\"exam-box\"><p><strong>标准答案：</strong>\"The time series plot shows <strong>linear trend and seasonal patterns</strong> in the data. For instance, in each year the lowest value occurs in quarter 2 and the highest value occurs in quarter 3. Also, the sales increase over time.\"</p></div>\n    </div>\n  </div>\n\n  <div id=\"q2\" class=\"eg-sub\">\n    <div class=\"card\">\n      <span class=\"badge badge-purple\">Q2</span>\n      <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">Write out the estimated multiple regression model.</p>\n      <div class=\"step\"><span class=\"step-num\">1</span><p class=\"step-text\"><strong class=\"hl\">先定义虚拟变量（必须写）：</strong><br>Let Qtr1 = 1 if quarter 1, 0 otherwise;<br>Let Qtr2 = 1 if quarter 2, 0 otherwise;<br>Let Qtr3 = 1 if quarter 3, 0 otherwise.</p></div>\n      <div class=\"step\"><span class=\"step-num\">2</span><p class=\"step-text\"><strong class=\"hl\">定义 t（必须写）：</strong><br>Let t = 1 refer to Q1 Year 1; t = 2 refer to Q2 Year 1; …; t = 12 refer to Q4 Year 3.</p></div>\n      <div class=\"step\"><span class=\"step-num\">3</span><p class=\"step-text\"><strong class=\"hl\">写出方程（从 Excel Coefficients 列读数）：</strong></p></div>\n      <div class=\"formula\">ŷ = 2306.667 − 642.292Qtr1 − 1465.42Qtr2 + 349.792Qtr3 + 23.125t</div>\n      <div class=\"exam-box\"><p><strong>扣分点：</strong>漏写虚拟变量定义或 t 的定义，系数符号写错（正负），系数数值抄错。</p></div>\n    </div>\n  </div>\n\n  <div id=\"q3\" class=\"eg-sub\">\n    <div class=\"card\">\n      <span class=\"badge badge-amber\">Q3</span>\n      <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">Compute the quarterly forecasts for Year 4.</p>\n      <p class=\"desc\" style=\"margin-bottom:10px\">Year 4 中 t 从 <strong class=\"hl\">13</strong> 开始（因为已有3年×4季度=12期数据）。</p>\n      <table>\n        <tr><th>Quarter</th><th>t</th><th>Q1</th><th>Q2</th><th>Q3</th><th>代入方程</th><th>ŷ</th></tr>\n        <tr>\n          <td style=\"font-weight:500\">Y4 Q1</td><td>13</td>\n          <td style=\"color:#0F6E56;font-weight:500\">1</td><td>0</td><td>0</td>\n          <td style=\"font-size:11px;color:var(--color-text-secondary)\">2306.667 − 642.292(1) + 23.125(13)</td>\n          <td style=\"font-weight:500;color:var(--color-text-primary)\">1965</td>\n        </tr>\n        <tr>\n          <td style=\"font-weight:500\">Y4 Q2</td><td>14</td>\n          <td>0</td><td style=\"color:#3C3489;font-weight:500\">1</td><td>0</td>\n          <td style=\"font-size:11px;color:var(--color-text-secondary)\">2306.667 − 1465.42(1) + 23.125(14)</td>\n          <td style=\"font-weight:500;color:var(--color-text-primary)\">1165</td>\n        </tr>\n        <tr>\n          <td style=\"font-weight:500\">Y4 Q3</td><td>15</td>\n          <td>0</td><td>0</td><td style=\"color:#633806;font-weight:500\">1</td>\n          <td style=\"font-size:11px;color:var(--color-text-secondary)\">2306.667 + 349.792(1) + 23.125(15)</td>\n          <td style=\"font-weight:500;color:var(--color-text-primary)\">3003</td>\n        </tr>\n        <tr>\n          <td style=\"font-weight:500\">Y4 Q4</td><td>16</td>\n          <td>0</td><td>0</td><td>0</td>\n          <td style=\"font-size:11px;color:var(--color-text-secondary)\">2306.667 + 23.125(16)</td>\n          <td style=\"font-weight:500;color:var(--color-text-primary)\">2677</td>\n        </tr>\n      </table>\n      <div class=\"hint\" style=\"margin-top:10px\"><p><strong>Q4 简化：</strong>Qtr1=Qtr2=Qtr3 全为 0，方程简化为 2306.667 + 23.125×16 = 2677。</p></div>\n    </div>\n  </div>\n\n  <div id=\"q4\" class=\"eg-sub\">\n    <div class=\"card\">\n      <span class=\"badge badge-coral\">Q4</span>\n      <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">Is Qtr2 a significant factor? Interpret its coefficient. (α = 0.05)</p>\n      <div class=\"step\"><span class=\"step-num\">1</span><p class=\"step-text\"><strong class=\"hl\">判断显著性：</strong><br>Qtr2: P-value = 2.3E-07（即 0.00000023）&lt; 0.05<br>→ <strong class=\"hl\">it is a significant factor.</strong></p></div>\n      <div class=\"step\"><span class=\"step-num\">2</span><p class=\"step-text\"><strong class=\"hl\">解释系数 b₂ = −1465.42：</strong></p></div>\n      <div class=\"exam-box\"><p><strong>标准答案：</strong>\"When it is in Quarter 2, the sales is <strong>1465.42 less</strong> than that in Quarter 4, holding other independent variables fixed.\"</p></div>\n      <div class=\"warn\" style=\"margin-top:10px\"><p><strong>注意：</strong>比较对象永远是<strong>基准季度（Q4）</strong>，不是 Q1 或 Q3。系数为负 → less；系数为正 → more。</p></div>\n    </div>\n  </div>\n\n  <div style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n    \n    \n  </div>\n</div>\n\n<script>\nfunction show(id,btn){\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));\n  document.getElementById(id).classList.add('active');\n  if(btn) btn.classList.add('active');\n}\nfunction toggleInterp(el){\n  el.classList.toggle('open');\n  const arr=el.querySelector('span:last-child');\n  if(arr) arr.textContent=el.classList.contains('open')?'︿':'﹀';\n}\nfunction showEg(id,btn){\n  document.querySelectorAll('.eg-sub').forEach(s=>s.classList.remove('on'));\n  document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('on'));\n  document.getElementById(id).classList.add('on');\n  if(btn) btn.classList.add('on');\n}\nfunction calcForecast(){\n  const qtr=+document.getElementById('fc-qtr').value;\n  const t=+document.getElementById('fc-t').value||1;\n  const b0=2306.667, b1=-642.292, b2=-1465.42, b3=349.792, b4=23.125;\n  let q1=0,q2=0,q3=0;\n  if(qtr===1)q1=1; else if(qtr===2)q2=1; else if(qtr===3)q3=1;\n  const result=b0+b1*q1+b2*q2+b3*q3+b4*t;\n  document.getElementById('fc-result').textContent=result.toFixed(1);\n  let parts=['2306.667'];\n  if(q1)parts.push('− 642.292×1');\n  if(q2)parts.push('− 1465.42×1');\n  if(q3)parts.push('+ 349.792×1');\n  parts.push(`+ 23.125×${t}`);\n  document.getElementById('fc-formula').textContent=parts.join(' ');\n}\n<\/script>\n"}, {"id": "week8_exam_review_checklist", "week": "Week 8", "title": "Exam Review Checklist", "subtitle": "考前复习清单", "color": "#F59E0B", "content": "\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}\n.nav button{padding:7px 16px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}\n.nav button.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}\n.nav button:hover:not(.active){background:var(--color-background-secondary)}\n.section{display:none}.section.active{display:block}\n.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 20px;margin-bottom:12px}\n.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}\n.badge-teal{background:#E1F5EE;color:#0F6E56}\n.badge-purple{background:#EEEDFE;color:#3C3489}\n.badge-amber{background:#FAEEDA;color:#633806}\n.badge-blue{background:#E6F1FB;color:#0C447C}\n.badge-coral{background:#FAECE7;color:#712B13}\n.badge-red{background:#FCEBEB;color:#791F1F}\n.badge-green{background:#EAF3DE;color:#3B6D11}\n.title{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}\n.desc{font-size:13px;color:var(--color-text-secondary);line-height:1.7}\n.formula{font-family:var(--font-mono);font-size:12.5px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 13px;margin:7px 0;color:var(--color-text-primary);line-height:1.9}\n.mini-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:11px 13px;margin-bottom:8px}\n.exam-box{border-left:3px solid #D85A30;background:#FAECE7;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;padding:11px 14px;margin:8px 0}\n.exam-box p{font-size:13px;color:#4A1B0C;line-height:1.6}\n.hint{background:#E6F1FB;border-radius:var(--border-radius-md);padding:11px 14px;margin:8px 0}\n.hint p{font-size:13px;color:#0C447C;line-height:1.6}\n.warn{background:#FAEEDA;border-radius:var(--border-radius-md);padding:11px 14px;margin:8px 0}\n.warn p{font-size:13px;color:#633806;line-height:1.6}\n.success{background:#EAF3DE;border-radius:var(--border-radius-md);padding:11px 14px;margin:8px 0}\n.success p{font-size:13px;color:#3B6D11;line-height:1.6}\n\n/* checklist */\n.cl-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;user-select:none}\n.cl-item:last-child{border-bottom:none}\n.cl-box{width:18px;height:18px;min-width:18px;border-radius:4px;border:1.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s;background:var(--color-background-primary)}\n.cl-item.done .cl-box{background:#1D9E75;border-color:#1D9E75}\n.cl-item.done .cl-box::after{content:'✓';font-size:11px;color:#fff;font-weight:600}\n.cl-item.done .cl-text{color:var(--color-text-tertiary);text-decoration:line-through}\n.cl-text{font-size:13px;color:var(--color-text-primary);line-height:1.6;flex:1}\n.cl-text em{font-style:normal;color:var(--color-text-secondary);font-size:12px}\n.progress-bar{height:6px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden;margin:8px 0 4px}\n.progress-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .3s}\n.prog-text{font-size:11px;color:var(--color-text-tertiary)}\n\ntable{width:100%;border-collapse:collapse;font-size:12px}\nth{background:var(--color-background-secondary);padding:8px 10px;text-align:left;font-weight:500;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}\ntd{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}\ntr:last-child td{border-bottom:none}\n\n.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}\n.compare-cell{border-radius:var(--border-radius-md);padding:10px 12px;border:0.5px solid var(--color-border-tertiary)}\n.compare-head{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid var(--color-border-tertiary)}\n.compare-row{font-size:12px;color:var(--color-text-secondary);line-height:1.7}\n\n.trap-item{padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;gap:10px;align-items:flex-start}\n.trap-item:last-child{border-bottom:none}\n.trap-icon{font-size:14px;min-width:20px;color:#D85A30}\n.trap-text{font-size:13px;color:var(--color-text-secondary);line-height:1.6;flex:1}\n.trap-text strong{color:var(--color-text-primary)}\n<\/style>\n\n<h2 class=\"sr-only\">Week 8 考前复习清单 Exam Review Checklist</h2>\n\n\n<div class=\"nav\">\n  <button class=\"active\" onclick=\"show('checklist',this)\">复习清单</button>\n  <button onclick=\"show('p1',this)\">8.1 时间序列模式</button>\n  <button onclick=\"show('p2',this)\">8.2 预测方法 & 精度</button>\n  <button onclick=\"show('p3',this)\">8.3 回归预测</button>\n  <button onclick=\"show('trap',this)\">易错点 & 答题模板</button>\n</div>\n\n<!-- CHECKLIST -->\n<div id=\"checklist\" class=\"section active\">\n  <div class=\"card\">\n    <p style=\"font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px\">EXAM CHECKLIST · 点击勾选已掌握的考点</p>\n    <p class=\"title\" style=\"margin-bottom:4px\">Week 8 全部考点</p>\n    <div class=\"progress-bar\"><div class=\"progress-fill\" id=\"prog-fill\" style=\"width:0%\"></div></div>\n    <p class=\"prog-text\" id=\"prog-text\">0 / 20 已掌握</p>\n  </div>\n\n  <div class=\"card\">\n    <p style=\"font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px\">8.1 — 时间序列模式 <span class=\"badge badge-teal\" style=\"font-size:10px\">4 考点</span></p>\n    <div id=\"cl-8-1\">\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-1')\"><div class=\"cl-box\"></div><p class=\"cl-text\">能用<strong>一句话</strong>定义时间序列，说明其分析目标（识别规律 → 外推预测）<em>· 简答题定义题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-1')\"><div class=\"cl-box\"></div><p class=\"cl-text\">掌握<strong>4种模式</strong>的特征：Horizontal / Trend / Seasonal / Cyclical，能区分 Seasonal vs Cyclical（1年以内 vs 超过1年）<em>· 简答题看图判断</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-1')\"><div class=\"cl-box\"></div><p class=\"cl-text\">看折线图能<strong>同时识别两种模式</strong>（如趋势+季节），答题需两部分都说清楚<em>· 高频考点</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-1')\"><div class=\"cl-box\"></div><p class=\"cl-text\">知道<strong>每种模式对应的预测方法</strong>：水平→MA/ES；趋势+季节→回归分析<em>· 概念理解</em></p></div>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <p style=\"font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px\">8.2 — 预测方法 & 精度指标 <span class=\"badge badge-purple\" style=\"font-size:10px\">7 考点</span></p>\n    <div id=\"cl-8-2\">\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-2')\"><div class=\"cl-box\"></div><p class=\"cl-text\"><strong>Naïve：</strong>ŷ(t+1) = y(t)，写方程时必须先列式证明所用方法<em>· 计算题必考步骤</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-2')\"><div class=\"cl-box\"></div><p class=\"cl-text\"><strong>Moving Averages：</strong>ŷ = 最近k期均值，注意有效预测从第k+1期开始，分母 = n−k<em>· 计算题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-2')\"><div class=\"cl-box\"></div><p class=\"cl-text\"><strong>Exponential Smoothing：</strong>ŷ(t+1) = α·y(t) + (1−α)·ŷ(t)，初始值 ŷ(1) = y(1)<em>· 计算题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-2')\"><div class=\"cl-box\"></div><p class=\"cl-text\">理解 α 的含义：α 大→重视近期；α 小→重视历史；最优 α = MSE 最小时的值<em>· 概念题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-2')\"><div class=\"cl-box\"></div><p class=\"cl-text\">4个精度指标公式全部会写并能计算：<strong>MFE / MAE / MSE / MAPE</strong><em>· 计算题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-2')\"><div class=\"cl-box\"></div><p class=\"cl-text\">理解各指标含义：MFE 看偏向（有正负），MAE 看绝对大小，MSE 比较方法（选最优k/α），MAPE 看百分比<em>· 简答/解释题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-2')\"><div class=\"cl-box\"></div><p class=\"cl-text\">知道如何选择最优 k（MA）或最优 α（ES）：以 <strong>MSE 最小</strong>为标准<em>· 方法题</em></p></div>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <p style=\"font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px\">8.3 — 回归分析预测 <span class=\"badge badge-amber\" style=\"font-size:10px\">9 考点</span></p>\n    <div id=\"cl-8-3\">\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">理解<strong>趋势变量 t</strong> 的设置方式：从第1个观测开始全局连续编号，不随年份重置<em>· 概念题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">掌握<strong>K−1 规则</strong>：K个季度只放K−1个虚拟变量，第K个季度（通常Q4）为基准组<em>· 核心规则</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">能完整<strong>定义虚拟变量 + 定义 t</strong>，再写出回归方程（缺一扣分）<em>· 书写规范</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">能从 Excel 输出表的 <strong>Coefficients 列</strong>正确读取各系数，包括正负号<em>· 读表技能</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">能代入方程计算未来各季度预测值，注意 t 值要接续历史数据编号（如第4年Q1 = t=13）<em>· 计算题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">能用 <strong>P-value vs α</strong> 判断变量显著性，答题格式完整<em>· 假设检验</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">能解释虚拟变量系数：始终与<strong>基准季度（Q4）比较</strong>，说清 more/less + 数量 + 条件<em>· 解释题高频</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">能解释趋势变量系数：每增加一个时间单位，y 平均变化多少，holding other variables fixed<em>· 解释题</em></p></div>\n      <div class=\"cl-item\" onclick=\"toggle(this,'cl-8-3')\"><div class=\"cl-box\"></div><p class=\"cl-text\">Q4预测简化：当Qtr1=Qtr2=Qtr3=0，方程简化为 b₀ + b₄t，不会代错<em>· 计算细节</em></p></div>\n    </div>\n  </div>\n</div>\n\n<!-- 8.1 PATTERNS -->\n<div id=\"p1\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-teal\" style=\"margin-bottom:10px\">8.1 时间序列模式</span>\n    <p class=\"title\" style=\"margin-bottom:12px\">四种模式速查表</p>\n    <table>\n      <tr><th>模式</th><th>英文</th><th>核心特征</th><th>关键词</th></tr>\n      <tr><td><span class=\"badge badge-teal\">水平</span></td><td style=\"font-size:12px\">Horizontal</td><td style=\"font-size:12px\">围绕<strong>恒定均值</strong>随机波动</td><td style=\"font-size:12px;color:var(--color-text-secondary)\">constant mean, stationary</td></tr>\n      <tr><td><span class=\"badge badge-purple\">趋势</span></td><td style=\"font-size:12px\">Trend</td><td style=\"font-size:12px\">数值持续<strong>上升或下降</strong></td><td style=\"font-size:12px;color:var(--color-text-secondary)\">gradual shifts, upward/downward</td></tr>\n      <tr><td><span class=\"badge badge-amber\">季节</span></td><td style=\"font-size:12px\">Seasonal</td><td style=\"font-size:12px\">每年<strong>定期重复</strong>的规律（≤1年）</td><td style=\"font-size:12px;color:var(--color-text-secondary)\">recurring, within a year</td></tr>\n      <tr><td><span class=\"badge badge-coral\">周期</span></td><td style=\"font-size:12px\">Cyclical</td><td style=\"font-size:12px\">趋势线上下交替，周期<strong>&gt;1年</strong></td><td style=\"font-size:12px;color:var(--color-text-secondary)\">alternating, more than one year</td></tr>\n    </table>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:8px\">Seasonal vs Cyclical 核心区别</p>\n    <div class=\"compare-grid\" style=\"grid-template-columns:1fr 1fr\">\n      <div class=\"compare-cell\" style=\"background:#FAEEDA\">\n        <div class=\"compare-head\" style=\"color:#633806\">Seasonal 季节性</div>\n        <div class=\"compare-row\">周期 ≤ 1年<br>每年同一时间出现<br>可用虚拟变量建模<br>例：夏季销量高</div>\n      </div>\n      <div class=\"compare-cell\" style=\"background:#FAECE7\">\n        <div class=\"compare-head\" style=\"color:#712B13\">Cyclical 周期性</div>\n        <div class=\"compare-row\">周期 &gt; 1年<br>长度不固定（2–10年）<br>难以精确建模<br>例：经济景气周期</div>\n      </div>\n    </div>\n    <div class=\"exam-box\">
