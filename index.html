h>Assembly Time (hrs)</th><th>Demand (STEM Kits)</th><th>Demand (Puzzle Boards)</th></tr><tr><td>December</td><td>4,200</td><td>2,400</td><td>350</td><td>300</td></tr><tr><td>January</td><td>4,800</td><td>2,600</td><td>400</td><td>370</td></tr><tr><td>February</td><td>4,600</td><td>2,500</td><td>450</td><td>390</td></tr></table>\n  <p class=\"ep-orig-note\">Inventory balance: Beginning Inventory + Production − Demand = Ending Inventory<br>\n  March 1 requirement: ≥ 80 STEM Kits and ≥ 90 Puzzle Boards.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">12 marks</span>\n  <span class=\"ep-orig-qnum\">Q1.1</span>\n  <p class=\"ep-orig-qtxt\">Develop a linear optimization model to determine the monthly production quantities for each toy, aiming to minimise the total cost while accounting for material and time limitations, fulfilling demand, and meeting the manager&#39;s specifications.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">2 marks</span>\n  <span class=\"ep-orig-qnum\">Q1.2</span>\n  <p class=\"ep-orig-qtxt\">Considering the data presented in Table 1.3 (Sensitivity Analysis report), would it be a sensible decision for the company to purchase 200 units of extra Cardboard in the month of February for the total of $30? Justify your answer.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">2 marks</span>\n  <span class=\"ep-orig-qnum\">Q1.3</span>\n  <p class=\"ep-orig-qtxt\">Due to unexpected circumstances, the production cost of the STEM Kits has increased to $24. What impact do you anticipate this change will have on the solution? Please explain.</p>\n</div>\n\n<hr class=\"ep-orig-divider\">\n\n<div class=\"ep-orig-bg\" style=\"border-bottom:none;margin-bottom:0;padding-bottom:0\">\n  <strong>Part 2 — Premier Wealth Advisors (Markowitz Portfolio)</strong><br>\n  John Davis is thinking about developing an investment portfolio using performance data from the previous six years for three specific stocks. The main objective is to achieve a <strong>minimum expected return of 10%</strong>. It is assumed that the returns over the six-year period are equally likely.\n  <table class=\"ep-orig-tbl\"><tr><th>Fund</th><th>Year 1</th><th>Year 2</th><th>Year 3</th><th>Year 4</th></tr><tr><td>Green Fund</td><td>0.120</td><td>0.095</td><td>0.110</td><td>–0.020</td></tr><tr><td>ESG Fund</td><td>0.080</td><td>0.105</td><td>0.090</td><td>–0.015</td></tr><tr><td>Climate Fund</td><td>0.065</td><td>0.140</td><td>0.160</td><td>–0.030</td></tr></table>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">9 marks</span>\n  <span class=\"ep-orig-qnum\">Q1.4</span>\n  <p class=\"ep-orig-qtxt\">Construct the Markowitz portfolio model using the performance data above. The main objective is to achieve a minimum expected return of 10%. Show your decision variables, objective function, and all constraints.</p>\n</div>\n      </div>\n    </div>\n\n    <!-- ── 右栏：解析 ── -->\n    <div class=\"ep-analysis-col\">\n      <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-1')\">\n          <span class=\"ep-subq-num\">Q1.1</span>\n          <span class=\"ep-subq-title\">Develop a Linear Optimization Model for WonderPlay — minimise total cost</span>\n          <span class=\"ep-subq-marks\">12 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>LP建模五步走：</strong>决策变量 → 目标函数 → 库存平衡约束 → 资源约束 → 非负约束<br><em>Five steps: decision variables → objective → inventory balance → resource constraints → non-negativity</em></div>\n          <div class=\"ep-warn-box\">⚠️ 漏掉 S<sub>ij</sub>（库存变量）不得分！有 holding cost 就必须定义库存变量。非负约束不给分但必须写完整。<br><em>Missing S<sub>ij</sub> (inventory variable) = no marks! If there is a holding cost, inventory variables must be defined.</em></div>\n          <p class=\"ep-h5\">① Decision Variables（决策变量） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">P<sub>ij</sub> = number of toy i produced in month j（toy i 在月份 j 的生产量）\nS<sub>ij</sub> = surplus (ending inventory) of toy i at end of month j（toy i 在月份 j 末的期末库存）\n\ni = 1 (STEM Kits), i = 2 (Puzzle Boards)\nj = 1 (Dec), j = 2 (Jan), j = 3 (Feb)</div>\n          <p class=\"ep-h5\">② Objective Function（目标函数） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">Min = 16(P₁₁+P₁₂+P₁₃) + 12(P₂₁+P₂₂+P₂₃)\n    + 0.9(S₁₁+S₁₂+S₁₃) + 0.7(S₂₁+S₂₂+S₂₃)\n\n生产成本（Production cost）+ 库存持有成本（Holding cost），三个月都要算进去。</div>\n          <p class=\"ep-h5\">③ Inventory Balance Constraints（库存平衡约束） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(6 marks，每条1分)</span></p>\n          <div class=\"ep-info-box\">公式：Beginning + Production − Demand = Ending<br>Dec期初库存已代入：STEM: 60+P₁₁−350=S₁₁ → P₁₁−S₁₁=290；Puzzle: 45+P₂₁−300=S₂₁ → P₂₁−S₂₁=255</div>\n          <table class=\"ep-mini-table\">\n            <tr><th>Month</th><th>STEM Kits (i=1)</th><th>Puzzle Boards (i=2)</th></tr>\n            <tr><td>Dec</td><td>P₁₁ − S₁₁ = 290</td><td>P₂₁ − S₂₁ = 255</td></tr>\n            <tr><td>Jan</td><td>S₁₁ + P₁₂ − S₁₂ = 400</td><td>S₂₁ + P₂₂ − S₂₂ = 370</td></tr>\n            <tr><td>Feb</td><td>S₁₂ + P₁₃ − S₁₃ = 450</td><td>S₂₂ + P₂₃ − S₂₃ = 390</td></tr>\n          </table>\n          <p class=\"ep-h5\">④ March 1st Inventory Constraints（三月期初库存约束） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark，各0.5)</span></p>\n          <div class=\"ep-formula\">S₁₃ ≥ 80    S₂₃ ≥ 90</div>\n          <div class=\"ep-warn-box\">⚠️ 必须写 S₁₃ 和 S₂₃，不能写成 X₁ ≥ 80！<br><em>Must use S₁₃ and S₂₃, not X₁ ≥ 80!</em></div>\n          <p class=\"ep-h5\">⑤ Cardboard Constraints（纸板约束） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks，各0.5)</span></p>\n          <div class=\"ep-formula\">4P₁₁ + 5P₂₁ ≤ 4200\n4P₁₂ + 5P₂₂ ≤ 4800\n4P₁₃ + 5P₂₃ ≤ 4600</div>\n          <p class=\"ep-h5\">⑥ Assembly Time Constraints（组装时间约束） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks，各0.5)</span></p>\n          <div class=\"ep-formula\">2P₁₁ + 1.8P₂₁ ≤ 2400\n2P₁₂ + 1.8P₂₂ ≤ 2600\n2P₁₃ + 1.8P₂₃ ≤ 2500</div>\n          <p class=\"ep-h5\">⑦ Non-negativity（非负约束）</p>\n          <div class=\"ep-formula\">P<sub>ij</sub>, S<sub>ij</sub> ≥ 0 for all i, j    （不给分但必须写 / Not awarded marks but must be written）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Decision variables</td><td>P<sub>ij</sub> 和 S<sub>ij</sub></td><td>1</td></tr>\n            <tr><td>Objective function</td><td>生产成本 + holding cost</td><td>1</td></tr>\n            <tr><td>Inventory balance (STEM)</td><td>Dec/Jan/Feb 各1分</td><td>3</td></tr>\n            <tr><td>Inventory balance (Puzzle)</td><td>Dec/Jan/Feb 各1分</td><td>3</td></tr>\n            <tr><td>March inventory constraints</td><td>各0.5分</td><td>1</td></tr>\n            <tr><td>Cardboard constraints</td><td>各0.5分</td><td>1.5</td></tr>\n            <tr><td>Assembly time constraints</td><td>各0.5分</td><td>1.5</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>12</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-2')\">\n          <span class=\"ep-subq-num\">Q1.2</span>\n          <span class=\"ep-subq-title\">Purchase 200 extra Cardboard in February for $30 — sensible?</span>\n          <span class=\"ep-subq-marks\">2 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>考点：Sensitivity Analysis — Shadow Price 判断题</strong><br>逻辑：节省金额（shadow price × 变化量）vs 购买成本，哪个大？<br><em>Key: compare savings (shadow price × change) vs purchase cost.</em></div>\n          <p class=\"ep-h5\">从 Table 1.3 找关键数据 / Key Data from Table 1.3</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Constraint</th><th>Final Value</th><th>Shadow Price</th><th>RHS</th><th>Allowable Increase</th></tr>\n            <tr><td>Cardboard Feb</td><td>4,600</td><td>−0.14</td><td>4,600</td><td><strong>220</strong></td></tr>\n          </table>\n          <p class=\"ep-p\" style=\"font-size:12px;color:var(--color-text-secondary)\">Final Value = RHS → binding constraint（资源用完）；Shadow Price = −0.14 → 每增加1单位纸板，总成本<strong>减少</strong>$0.14</p>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <div class=\"ep-warn-box\"><strong>No, it is NOT sensible.（不，这不明智。）</strong></div>\n          <div class=\"ep-tip-box\">Since 200 &lt; allowable increase of 220, the shadow price is valid.<br>Cost saving = 0.14 × 200 = <strong>$28</strong><br>Purchase cost = <strong>$30 &gt; $28</strong> → net loss of $2 → <strong>not sensible（不划算）</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">由于200在允许增加量220以内，购买200单位额外纸板可节省$28，但购买成本$30 &gt; $28，净亏损$2，因此不明智。</span></div>\n          <div class=\"ep-info-box\">📌 <strong>万能框架 / Framework：</strong><br>Step 1: 变化量是否在 allowable range 内？→ 判断 shadow price 是否有效<br>Step 2: 实际影响 = shadow price × 变化量<br>Step 3: 比较金额 → 得出结论</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Correct answer</td><td>Not sensible</td><td>1</td></tr>\n            <tr><td>Justification</td><td>$28 savings &lt; $30 cost</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-3')\">\n          <span class=\"ep-subq-num\">Q1.3</span>\n          <span class=\"ep-subq-title\">STEM Kits production cost increases from $16 to $24 — impact on solution?</span>\n          <span class=\"ep-subq-marks\">2 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-h5\">从 Table 1.3 找关键数据 / Key Data</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Variable</th><th>Objective Coefficient</th><th>Allowable Increase</th></tr>\n            <tr><td>STEM Kits Dec</td><td>$16</td><td>+∞ (1E+30)</td></tr>\n            <tr><td>STEM Kits Jan</td><td>$16</td><td>+∞ (1E+30)</td></tr>\n            <tr><td>STEM Kits Feb</td><td>$16</td><td>+∞ (1E+30)</td></tr>\n          </table>\n          <p class=\"ep-p\">变化量 = $24 − $16 = <strong>$8</strong>，Allowable Increase = ∞ → $8 &lt;&lt; ∞ ✅</p>\n          <span class=\"ep-answer-label\">情况一：变化在 allowable range 内（本题）/ Case 1: within allowable range</span>\n          <div class=\"ep-tip-box\"><strong>No changes to the optimal solution.（最优解不变。）</strong><br><br>Since the allowable increase for all STEM Kits production costs is +infinity, the increase of $8 (from $16 to $24) is within the allowable range. Therefore, the optimal solution stays the same, although the <strong>total cost will increase</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">由于所有月份STEM Kits的允许增加量为无穷大，$8的增加在允许范围内，最优解不变，但总成本会增加。</span></div>\n          <span class=\"ep-answer-label\">情况二：变化超出 allowable range / Case 2: exceeds allowable range</span>\n          <div class=\"ep-tip-box\"><strong>The optimal solution will change.（最优解将改变。）</strong><br><br>The increase of $[X] exceeds the allowable increase of $[Y] for [variable]. Therefore, the current optimal solution is no longer valid and the model needs to be <strong>re-solved</strong> to find the new optimal solution.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">$X的增加超出了允许增加量$Y，当前最优解不再有效，需要重新求解模型。</span></div>\n          <div class=\"ep-info-box\">📌 <strong>目标系数变化框架：</strong><br>变化量 &lt; Allowable → \"No changes, but total cost changes\"（解不变，总成本变）<br>变化量 &gt; Allowable → \"Solution changes, needs re-solved\"（解改变，需重新求解）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>\"No changes\"</td><td>明确说 no changes to solution</td><td>1</td></tr>\n            <tr><td>Reasoning</td><td>allowable increase = ∞，变化量在范围内</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-4')\">\n          <span class=\"ep-subq-num\">Q1.4</span>\n          <span class=\"ep-subq-title\">Construct the Markowitz Portfolio Model (min return 10%, returns equally likely)</span>\n          <span class=\"ep-subq-marks\">9 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>核心思想：</strong>在保证最低收益（≥10%）的前提下，最小化投资组合的方差（风险）。<br>风险 = 收益的波动程度；平方是为了防止正负抵消。R<sub>s</sub> 不是固定数字，取决于你如何分配 X、Y、Z。<br><em>Minimise variance (risk) subject to minimum return ≥10%. Squared deviations prevent cancellation of positive/negative values.</em></div>\n          <p class=\"ep-h5\">① Decision Variables（决策变量） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">X = fraction of portfolio invested in Green Fund（投资Green Fund的比例）\nY = fraction of portfolio invested in ESG Fund（投资ESG Fund的比例）\nZ = fraction of portfolio invested in Climate Fund（投资Climate Fund的比例）</div>\n          <p class=\"ep-h5\">② Objective Function（目标函数） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">Min  (1/4) × Σ(Rₛ − R̄)²   for s = 1 to 4</div>\n          <table class=\"ep-mini-table\">\n            <tr><th>符号</th><th>含义</th></tr>\n            <tr><td>1/4</td><td>4年等概率，各占 1/4 (average over 4 years, equal probability)</td></tr>\n            <tr><td>Rₛ</td><td>第 s 年的实际组合收益 (portfolio return in year s)</td></tr>\n            <tr><td>R̄</td><td>4年平均收益，是变量 (average return — a variable, not a known number)</td></tr>\n            <tr><td>(Rₛ − R̄)²</td><td>该年偏离均值的程度（平方防止正负抵消）(squared deviation from mean)</td></tr>\n          </table>\n          <p class=\"ep-h5\">③ Annual Return Constraints（每年组合收益约束） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(4 marks，每条1分)</span></p>\n          <div class=\"ep-formula\">0.120X + 0.080Y + 0.065Z = R₁   (Year 1 portfolio return)\n0.095X + 0.105Y + 0.140Z = R₂   (Year 2 portfolio return)\n0.110X + 0.090Y + 0.160Z = R₃   (Year 3 portfolio return)\n−0.020X − 0.015Y − 0.030Z = R₄  (Year 4 portfolio return)</div>\n          <p class=\"ep-h5\">④ Average Return Definition（平均收益定义） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">(1/4)(R₁ + R₂ + R₃ + R₄) = R̄</div>\n          <p class=\"ep-p\" style=\"font-size:12px;color:var(--color-text-secondary)\">R̄ 是变量不是已知数，必须用此等式定义！(R̄ is a variable, not a known number — must be defined by this equation!)</p>\n          <p class=\"ep-h5\">⑤ Minimum Return Constraint（最低收益约束） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">R̄ ≥ 0.10   (minimum 10% expected return)</div>\n          <p class=\"ep-h5\">⑥ Portfolio Weights Sum to 1（比例加总等于1） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">X + Y + Z = 1   (all funds must be fully invested)</div>\n          <div class=\"ep-warn-box\">⚠️ 老师答案写了 X + Z + Z = 1，这是<strong>笔误</strong>，正确是 X + Y + Z = 1。<br><em>Teacher's answer had a typo X+Z+Z=1; correct is X+Y+Z=1.</em></div>\n          <div class=\"ep-info-box\">📌 <strong>建模逻辑串联：</strong><br>决定 X,Y,Z → 算出每年 R₁…R₄ → 算出均值 R̄ = (R₁+R₂+R₃+R₄)/4 → 算方差 → 最小化<br>约束：R̄ ≥ 10%（最低收益）＋ X+Y+Z = 1（全部投出去）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Decision variables</td><td>X, Y, Z 定义</td><td>1</td></tr>\n            <tr><td>Objective function</td><td>Min (1/4)·Σ(Rₛ−R̄)²</td><td>1</td></tr>\n            <tr><td>R₁–R₄ equations</td><td>每条1分</td><td>4</td></tr>\n            <tr><td>Average return</td><td>(1/4)·ΣRₛ = R̄</td><td>1</td></tr>\n            <tr><td>Minimum return</td><td>R̄ ≥ 0.10</td><td>1</td></tr>\n            <tr><td>Sum to 1</td><td>X + Y + Z = 1</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n          </table>\n        </div>\n      </div>\n    </div>\n\n  </div>\n</div><!-- /q1 panel -->\n    <!-- ── Q2: Monte Carlo ── -->\n    <div id=\"2025s1-q2\" class=\"ep-q-panel\">\n  <div class=\"ep-split-layout\">\n\n    <!-- ── 左栏：原题 ── -->\n    <div class=\"ep-orig-col\">\n      <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n      <div class=\"ep-orig-card\">\n        <div class=\"ep-orig-bg\">\n  <strong>SECTION 1 · Q2 (25 marks)</strong><br>\n  Harvey Norman is preparing for a holiday sales boom by stocking PlayStation 6 consoles. Each unit is sold for <strong>$850</strong> and procured for <strong>$580</strong>. The store pre-orders <strong>10,000 units</strong> for December. Customer demand is normally distributed with a mean of 10,000 units and standard deviation of 200 units. If demand is less than 10,000, the company incurs a <strong>holding cost of $40</strong> per excess unit. If demand is greater than 10,000, <strong>shortage costs of $100</strong> per lost unit are incurred. Harvey Norman conducts a <strong>1,000-trial Monte Carlo simulation</strong> to estimate profit outcomes.\n  <table class=\"ep-orig-tbl\"><tr><th>Parameter</th><th>Value</th></tr><tr><td>Selling Price</td><td>$850 per unit</td></tr><tr><td>Procurement Cost</td><td>$580 per unit</td></tr><tr><td>Order Quantity</td><td>10,000 units</td></tr><tr><td>Holding Cost</td><td>$40 per excess unit</td></tr><tr><td>Shortage Cost</td><td>$100 per lost unit</td></tr><tr><td>Demand Distribution</td><td>Normal, μ = 10,000, σ = 200</td></tr><tr><td>Simulation Trials</td><td>1,000</td></tr></table>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q2.1</span>\n  <p class=\"ep-orig-qtxt\">Identify and classify the inputs and outputs of this simulation. Why do we separate inputs into controllable and uncontrollable?</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q2.2</span>\n  <p class=\"ep-orig-qtxt\">Write the formula to compute profit if demand &lt; 10,000.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">9 marks</span>\n  <span class=\"ep-orig-qnum\">Q2.3</span>\n  <p class=\"ep-orig-qtxt\">Please explain how this problem is formulated in Excel by Harvey Norman.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">6 marks</span>\n  <span class=\"ep-orig-qnum\">Q2.4</span>\n  <p class=\"ep-orig-qtxt\">The simulation shows 92 of 1,000 scenarios resulted in profit below $700,000. Estimate the probability and interpret.</p>\n</div>\n      </div>\n    </div>\n\n    <!-- ── 右栏：解析 ── -->\n    <div class=\"ep-analysis-col\">\n      <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-1')\">\n          <span class=\"ep-subq-num\">Q2.1</span>\n          <span class=\"ep-subq-title\">Identify and classify inputs and outputs. Why separate controllable from uncontrollable?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>三要素分类框架：</strong><br>Controllable（可控）→ 公司自己可以决定的变量<br>Uncontrollable（不可控）→ 公司无法控制的变量（随机/外部）<br>Output（输出）→ 模拟跑完后得到的结果</div>\n          <div class=\"ep-warn-box\">⚠️ Procurement cost = <strong>Controllable</strong>（合同定价，公司可控）← 很多人错放到 Uncontrollable！<br>Output 要写 <strong>Net profit per month</strong>，不能只写 \"profit\"。</div>\n          <span class=\"ep-answer-label\">标准答案</span>\n          <p class=\"ep-p\"><strong>Controllable inputs（可控输入）</strong> <span style=\"color:var(--color-text-tertiary)\">(each 0.5 mark)</span></p>\n          <ul class=\"ep-ul\">\n            <li>Procurement cost（采购成本）</li>\n            <li>Selling price（售价）</li>\n            <li>Order quantity: 10,000 units（订货量）</li>\n          </ul>\n          <p class=\"ep-p\"><strong>Uncontrollable inputs（不可控输入）</strong> <span style=\"color:var(--color-text-tertiary)\">(each 0.5 mark)</span></p>\n          <ul class=\"ep-ul\">\n            <li>Customer demand（顾客需求）</li>\n            <li>Holding cost（库存成本）</li>\n            <li>Shortage cost（缺货成本）</li>\n          </ul>\n          <p class=\"ep-p\"><strong>Output:</strong> Net profit per month（每月净利润）</p>\n          <p class=\"ep-p\"><strong>Why separate（为什么分类）:</strong></p>\n          <div class=\"ep-tip-box\">\"We separate the inputs into controllable and uncontrollable so that when making improvements to the simulation model, we understand which input variables are <strong>feasible to change</strong>, which are the controllable variables.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">我们将输入分为可控和不可控，是为了在改进模拟模型时，明确哪些输入变量是可以改变的（即可控变量）。</span></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Controllable inputs</td><td>3个，各0.5分</td><td>1.5</td></tr>\n            <tr><td>Uncontrollable inputs</td><td>3个，各0.5分</td><td>1.5</td></tr>\n            <tr><td>Output</td><td>Net profit per month</td><td>0.5</td></tr>\n            <tr><td>Why separate</td><td>一句话说清楚</td><td>1.5</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-2')\">\n          <span class=\"ep-subq-num\">Q2.2</span>\n          <span class=\"ep-subq-title\">Write the formula to compute profit if demand &lt; 10,000</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-p\">当 demand &lt; 10,000 时，卖不完有剩货（D = actual demand / 实际需求量）：</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>项目</th><th>计算逻辑</th></tr>\n            <tr><td>收入 Revenue</td><td>$850 × D（只卖出D件 / only D units sold）</td></tr>\n            <tr><td>采购成本 Procurement</td><td>$580 × 10,000（全部订货量都要付 / pay for all 10,000 units ordered）</td></tr>\n            <tr><td>库存成本 Holding Cost</td><td>$40 × (10,000 − D)（剩余库存 / unsold surplus）</td></tr>\n          </table>\n          <span class=\"ep-answer-label\">标准公式（Let D = actual demand）</span>\n          <div class=\"ep-formula\">Profit = 850 × D − 580 × 10,000 − 40 × (10,000 − D)\n       = 850D − 5,800,000 − 400,000 + 40D\n       = <strong>890D − 6,200,000</strong>\n\n当需求D &lt; 10,000时：收入基于实际销售量D，采购成本覆盖全部10,000件，\n库存成本适用于未售出的剩余(10,000−D)件。</div>\n          <div class=\"ep-warn-box\">⚠️ 采购成本是 580 × <strong>10,000</strong>（全部订货量），不是 580 × D（只算卖出的）！<br>当 demand &lt; 10,000 时<strong>没有</strong> Shortage Cost，排除它是关键得分点。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Revenue component</td><td>850 × D</td><td>1</td></tr>\n            <tr><td>Holding cost component</td><td>40 × (10,000−D)</td><td>1</td></tr>\n            <tr><td>Excluding shortage</td><td>正确排除 shortage cost</td><td>1</td></tr>\n            <tr><td>Complete correct expression</td><td>890D − 6,200,000</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-3')\">\n          <span class=\"ep-subq-num\">Q2.3</span>\n          <span class=\"ep-subq-title\">Explain how this problem is formulated in Excel</span>\n          <span class=\"ep-subq-marks\">9 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>关键：用 MIN/MAX，不是 IF / Use MIN/MAX, not IF</strong><br>MIN → 限制<strong>上限</strong>（最多只能这么多 / limits upper bound）<br>MAX(0,...) → 防止<strong>负数</strong>（成本最少是0 / prevents negative costs）</div>\n          <p class=\"ep-p\" style=\"color:var(--color-text-secondary)\">想象你是Harvey Norman的数据分析师，老板让你用Excel预测PS6利润。需求是不确定的，所以你模拟1000种可能场景 → Monte Carlo的本质。<br><em>Imagine simulating 1,000 possible demand scenarios to estimate profit distribution — the essence of Monte Carlo.</em></p>\n          <p class=\"ep-h5\">Step 1 — 模拟随机需求 / Simulate random demand <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">=NORM.INV(RAND(), 10000, 200)</div>\n          <p class=\"ep-p\">RAND() 生成 0–1 随机数；NORM.INV() 将其转换为正态分布需求值。重复 1,000 行 = 1,000 个模拟场景。<br><em>RAND() generates a 0–1 random number; NORM.INV() converts it to a normally distributed demand value. Repeat for 1,000 rows.</em></p>\n          <p class=\"ep-h5\">Step 2 — 计算每次利润 / Compute profit each trial <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(4 marks，每项1分)</span></p>\n          <div class=\"ep-formula\">Revenue       = MIN(Demand, 10000) × 270\nHolding cost  = MAX(0, 10000 − Demand) × 40\nShortage cost = MAX(0, Demand − 10000) × 100\nProfit        = Revenue − Holding cost − Shortage cost</div>\n          <table class=\"ep-mini-table\">\n            <tr><th>函数</th><th>用途</th><th>例子</th></tr>\n            <tr><td>MIN(Demand, 10000)</td><td>限制上限，卖出量不超过库存</td><td>需求10200→只能卖10000</td></tr>\n            <tr><td>MAX(0, 10000−Demand)</td><td>防止负数，成本最少为0</td><td>需求10200→MAX(0,−200)=0</td></tr>\n          </table>\n          <p class=\"ep-h5\">Step 3 — 汇总1,000次结果 / Summarise 1,000 results <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks)</span></p>\n          <div class=\"ep-formula\">=AVERAGE(profit range)  → estimated average profit（估计平均利润）\n=STDEV(profit range)    → variability of profit（利润波动）\n=MIN(profit range)      → worst case profit（最坏情况）\n=MAX(profit range)      → best case profit（最好情况）\nHistogram               → distribution of profit outcomes（利润分布图）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Step 1</td><td>NORM.INV(RAND(), 10000, 200)</td><td>2</td></tr>\n            <tr><td>Step 2a</td><td>Revenue = MIN(Demand,10000)×270</td><td>1</td></tr>\n            <tr><td>Step 2b</td><td>Holding = MAX(0,10000−Demand)×40</td><td>1</td></tr>\n            <tr><td>Step 2c</td><td>Shortage = MAX(0,Demand−10000)×100</td><td>1</td></tr>\n            <tr><td>Step 2d</td><td>Profit = Revenue−Holding−Shortage</td><td>1</td></tr>\n            <tr><td>Step 3</td><td>1,000 rows + AVERAGE/STDEV/MIN/MAX/Histogram</td><td>3</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q2-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q2-4')\">\n          <span class=\"ep-subq-num\">Q2.4</span>\n          <span class=\"ep-subq-title\">92 of 1,000 scenarios had profit below $700,000 — estimate probability and interpret</span>\n          <span class=\"ep-subq-marks\">6 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <span class=\"ep-answer-label\">计算 / Calculation</span>\n          <div class=\"ep-formula\">P(Profit &lt; $700,000) = 92 / 1,000 = 0.092 = 9.2%</div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：概率较低（&lt; 15%，本题）/ Case 1: Low probability</p>\n          <div class=\"ep-tip-box\">\"There is a <strong>low but present risk</strong> of underperformance. Only 9.2% of simulated scenarios resulted in profit below $700,000, suggesting that under the current ordering strategy of 10,000 units, Harvey Norman is <strong>unlikely but not impossible</strong> to earn below this threshold.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">存在低但真实的表现不佳风险。只有9.2%的模拟场景利润低于$700,000，说明在当前订购10,000件的策略下，Harvey Norman不太可能但并非不可能低于此门槛。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：概率较高（&gt; 30%）/ Case 2: High probability</p>\n          <div class=\"ep-tip-box\">\"There is a <strong>significant risk</strong> of underperformance. [X]% of simulated scenarios resulted in profit below $[threshold], suggesting that the current ordering strategy carries <strong>substantial downside risk</strong>. Management should consider revising the order quantity to reduce this risk.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">存在显著的表现不佳风险。[X]%的模拟场景利润低于$[门槛]，说明当前订购策略存在较大的下行风险。管理层应考虑调整订购数量以降低风险。</span></div>\n          <div class=\"ep-info-box\">📌 <strong>答题模板：</strong>P = 次数/总trials = X%<br>\"There is a <strong>[low/significant] risk</strong> of [outcome]. [一句背景说明 + 建议]\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Identifying count</td><td>92/1000</td><td>2</td></tr>\n            <tr><td>Correct probability</td><td>0.092 = 9.2%</td><td>2</td></tr>\n            <tr><td>Interpretation</td><td>Low but present risk of underperformance</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>6</strong></td></tr>\n          </table>\n        </div>\n      </div>\n    </div>\n\n  </div>\n</div><!-- /q2 panel -->\n    <!-- ── Q3: Regression Analysis ── -->\n    <div id=\"2025s1-q3\" class=\"ep-q-panel\">\n  <div class=\"ep-split-layout\">\n\n    <!-- ── 左栏：原题 ── -->\n    <div class=\"ep-orig-col\">\n      <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n      <div class=\"ep-orig-card\">\n        <div class=\"ep-orig-bg\">\n  <strong>SECTION 1 · Q3 (25 marks)</strong><br>\n  In 2011, property prices and mortgage rates in Australia declined to the point where, in several cities, the monthly cost of owning a home became cheaper than renting. The table below presents data from 10 Australian markets, showing the average advertised monthly rent and the monthly mortgage repayment on a median-priced home in each city.\n  <table class=\"ep-orig-tbl\"><tr><th>City</th><th>Rent ($)</th><th>Mortgage ($)</th></tr><tr><td>Adelaide</td><td>840</td><td>539</td></tr><tr><td>Melbourne</td><td>1,062</td><td>1,002</td></tr><tr><td>Hobart</td><td>823</td><td>626</td></tr><tr><td>Newcastle</td><td>779</td><td>711</td></tr><tr><td>Gold Coast</td><td>796</td><td>655</td></tr><tr><td>Brisbane</td><td>1,071</td><td>977</td></tr><tr><td>Canberra</td><td>953</td><td>776</td></tr><tr><td>Sunshine Coast</td><td>851</td><td>695</td></tr><tr><td>Perth</td><td>762</td><td>651</td></tr><tr><td>Geelong</td><td>723</td><td>654</td></tr></table>\n  <p class=\"ep-orig-note\">Treat <strong>average asking rent</strong> as the independent variable (X), and <strong>monthly mortgage repayment</strong> as the dependent variable (Y).</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">4 marks</span>\n  <span class=\"ep-orig-qnum\">Q3.1</span>\n  <p class=\"ep-orig-qtxt\">Considering the scatter chart (Figure 3.1), for these data, treating the average asking rent as the independent variable — what type of relationship(s) exist in the data? Please explain your observation. Also, does a simple linear regression model appear to be appropriate?</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q3.2</span>\n  <p class=\"ep-orig-qtxt\">Considering the provided Summary Output in Figure 3.2, develop an estimated linear regression equation to predict the monthly mortgage given the average asking rent. Calculate the estimated monthly mortgage for a property rented for $1,000. Also, interpret the coefficient in cell B18 (1.0699).</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">4 marks</span>\n  <span class=\"ep-orig-qnum\">Q3.3</span>\n  <p class=\"ep-orig-qtxt\">The following Excel output (Figure 3.3) provides the estimated second-order quadratic regression equation. Develop an estimated regression equation to predict the monthly mortgage given the average asking rent, then calculate the estimated monthly mortgage for a property rented for $1,000.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q3.4</span>\n  <p class=\"ep-orig-qtxt\">Test whether each of the regression parameters for the model shown in Figure 3.3 is equal to zero at a 0.05 level of significance. If any of the regression parameters are equal to zero, what would be your recommendation?</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">7 marks</span>\n  <span class=\"ep-orig-qnum\">Q3.5</span>\n  <p class=\"ep-orig-qtxt\">Compare the models in Q3.2 (Figure 3.2) and Q3.3 (Figure 3.3) in terms of <strong>predictability</strong>, <strong>overall fit</strong> and <strong>overall significance</strong>. Explain which model is more effective.</p>\n</div>\n      </div>\n    </div>\n\n    <!-- ── 右栏：解析 ── -->\n    <div class=\"ep-analysis-col\">\n      <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-1')\">\n          <span class=\"ep-subq-num\">Q3.1</span>\n          <span class=\"ep-subq-title\">Scatter chart — what relationship exists? Is simple linear regression appropriate?</span>\n          <span class=\"ep-subq-marks\">4 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>散点图看三件事 / Three Things to Check：</strong><br>1. Direction（方向）→ 右上走 = 正相关；右下走 = 负相关<br>2. Shape（形状）→ 直线 = 线性；曲线 = 非线性<br>3. Pattern（分布）→ 均匀分布 = 线性适合；两群分布 = 可能不适合</div>\n          <div class=\"ep-warn-box\">⚠️ 本题数据点分成<strong>两群</strong>，不是均匀分布的直线 → 不能确认线性关系！很多人会误判成线性。<br><em>Data points appear in two clusters, not a uniform linear pattern — cannot confirm linear relationship!</em></div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">Sentence 1 — 关系类型 / Relationship type <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"The scatter chart indicates a <strong>modest positive relationship</strong> between these variables. No special relations.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">散点图显示这两个变量之间存在<strong>适度正相关关系</strong>，无特殊关系。</span></div>\n          <p class=\"ep-h5\">Sentence 2 — 线性回归判断 / Linear regression judgment <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"It is <strong>not clear that the relationship is linear</strong>, and so a simple linear regression model <strong>may not be appropriate</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">变量之间的关系<strong>是否为线性并不明确</strong>，因此简单线性回归模型<strong>可能不适合</strong>。</span></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Relationship type</td><td>Modest positive relationship</td><td>2</td></tr>\n            <tr><td>Linear judgment</td><td>May not be appropriate + reason</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-2')\">\n          <span class=\"ep-subq-num\">Q3.2</span>\n          <span class=\"ep-subq-title\">Develop linear regression equation. Predict mortgage at rent = $1,000. Interpret coefficient 1.0699.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>从 Excel output 读数据 / Reading Excel Output：</strong><br>From Figure 3.2: Row 17: Intercept = −197.9583 → b₀ ｜ Row 18: Rent ($) = 1.0699 → b₁</div>\n          <div class=\"ep-warn-box\">⚠️ 常见错误：系数顺序写反！ŷ = −197.9583x + 1.0699 ← <strong>错误！</strong><br>Intercept 永远在前！(Intercept always comes first!)<br><em>Common mistake: writing the equation with coefficients in the wrong order.</em></div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">① Equation（回归方程） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = −197.9583 + 1.0699x\n\n(where x = average asking rent, ŷ = estimated monthly mortgage)\n（x为平均租金，ŷ为估计月供）</div>\n          <p class=\"ep-h5\">② Prediction for x = $1,000（预测） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = −197.9583 + 1.0699 × 1000 = $871.94</div>\n          <p class=\"ep-h5\">③ Interpretation of coefficient 1.0699（系数解读） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">\"The coefficient of 1.0699 indicates that for every <strong>$1 increase</strong> in average asking rent, the monthly mortgage repayment is estimated to <strong>increase by approximately $1.07</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">系数1.0699表示平均租金每增加$1，估计月供增加约$1.07。</span></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Equation</td><td>Intercept first, correct formula</td><td>2</td></tr>\n            <tr><td>Prediction</td><td>x=1000 → $871.94</td><td>2</td></tr>\n            <tr><td>Interpretation</td><td>$1 increase in rent → $1.07 increase in mortgage</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-3')\">\n          <span class=\"ep-subq-num\">Q3.3</span>\n          <span class=\"ep-subq-title\">Develop quadratic regression equation. Predict mortgage at rent = $1,000.</span>\n          <span class=\"ep-subq-marks\">4 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>二次回归方程格式 / Quadratic format：</strong> ŷ = b₀ + b₁x + b₂x²<br>From Figure 3.3: Row 17: Intercept = 3965.633 → b₀ ｜ Row 18: Rent = −8.2606 → b₁ ｜ Row 19: Rent Squared = 0.005131 → b₂</div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">① Equation（二次回归方程） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = 3965.633 − 8.2606x + 0.005131x²</div>\n          <p class=\"ep-h5\">② Prediction for x = $1,000（预测） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">ŷ = 3965.633 − 8.2606(1000) + 0.005131(1000)²\n  = 3965.633 − 8260.6 + 5131 = $836.03</div>\n          <div class=\"ep-warn-box\">⚠️ 注意：老师答案用系数 0.0051 得出 $805.03。考试时<strong>用你 Excel 里显示的系数</strong>即可，均可接受。<br><em>Teacher's answer used 0.0051 giving $805.03. Use whatever coefficient appears in your Excel output — all accepted.</em></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Equation</td><td>Correct quadratic formula with all three terms</td><td>2</td></tr>\n            <tr><td>Prediction</td><td>x=1000 → correct answer</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-4')\">\n          <span class=\"ep-subq-num\">Q3.4</span>\n          <span class=\"ep-subq-title\">t-test for each parameter at α = 0.05. If any equal zero, what is your recommendation?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>t-test vs F-test 触发词 / Trigger Words：</strong><br>\"each parameter/coefficient\" → t-test → 看每个变量的p-value<br>\"overall significance\" → F-test → 看 Significance F</div>\n          <div class=\"ep-formula\">p-value &lt; 0.05 → reject H₀ → coefficient ≠ 0 → SIGNIFICANT ✅\np-value &gt; 0.05 → do not reject H₀ → coefficient = 0 → NOT significant ❌</div>\n          <p class=\"ep-h5\">从 Figure 3.3 读取 p-values / Data from Figure 3.3</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Parameter</th><th>p-value</th><th>vs 0.05</th><th>结论</th></tr>\n            <tr><td>Intercept</td><td>0.0208</td><td>&lt; 0.05</td><td>Significant ✅</td></tr>\n            <tr><td>Rent ($)</td><td>0.0277</td><td>&lt; 0.05</td><td>Significant ✅</td></tr>\n            <tr><td>Rent Squared</td><td>0.0165</td><td>&lt; 0.05</td><td>Significant ✅</td></tr>\n          </table>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">情况一：所有参数显著（本题）/ Case 1: All significant <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"The p-value for the test of the hypothesis that βᵢ = 0 for <strong>Rent and Rent Squared</strong> are <strong>smaller</strong> than the 0.05 level of significance. We <strong>reject the hypothesis that βᵢ = 0</strong>, and conclude that there is a <strong>significant linear relationship</strong> between these variables and monthly mortgage.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Rent和Rent Squared的p值小于0.05显著性水平。我们拒绝βᵢ=0的假设，得出这些变量与月供之间存在显著线性关系。</span></div>\n          <p class=\"ep-h5\">情况二：部分参数不显著 / Case 2: Some NOT significant <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"The p-value for the test of the hypothesis that βᵢ = 0 for <strong>[variable name]</strong> is <strong>greater</strong> than the 0.05 level of significance. We <strong>do not reject the hypothesis that βᵢ = 0</strong>, and conclude that there is <strong>not a significant linear relationship</strong> between [variable] and monthly mortgage.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">[变量名]的p值大于0.05。我们不拒绝βᵢ=0的假设，得出该变量与月供之间不存在显著线性关系。</span></div>\n          <p class=\"ep-h5\">Part 2 — Recommendation（建议） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks ← 不管结果如何都必须写！)</span></p>\n          <div class=\"ep-tip-box\">\"We cannot though simply delete these independent variables from the model. First, we need to determine whether they <strong>add to Adjusted R²</strong> and explain more variability of the mortgage. Second, if the <strong>expert's judgement</strong> is to keep them in the model for future evaluations, we should keep them. Otherwise, we should start from <strong>deleting only one variable at a time</strong> and test the model again to decide whether to delete one, two, or all of them.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">不能简单地从模型中删除这些变量。首先，需要判断它们是否提高了Adjusted R²并解释了更多变异。其次，如果专家判断需要保留，则应保留。否则，每次只删除一个变量，重新测试模型，再决定是否删除。</span></div>\n          <div class=\"ep-warn-box\">⚠️ Recommendation段不管所有参数是否显著都必须写！题目问的是\"if any equal zero\"，你要展示你知道该怎么做。<br><em>Always write the Recommendation paragraph regardless of results!</em></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>t-test conclusion</td><td>p-value comparison + reject/not reject</td><td>2</td></tr>\n            <tr><td>Recommendation</td><td>Cannot simply delete, one at a time, check Adj R²</td><td>3</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q3-5\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q3-5')\">\n          <span class=\"ep-subq-num\">Q3.5</span>\n          <span class=\"ep-subq-title\">Compare Q3.2 (linear) vs Q3.3 (quadratic) — predictability, overall fit, overall significance.</span>\n          <span class=\"ep-subq-marks\">7 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>三个维度，三个工具 / Three Dimensions, Three Tools：</strong><br>Predictability（预测精度）→ <strong>MSE</strong>（越小越好 / lower = better）<br>Overall Fit（整体拟合）→ <strong>R² + Adj R²</strong>（越大越好 / higher = better）<br>Overall Significance（整体显著性）→ <strong>Significance F</strong>（越小越好，必须&lt;0.05 / lower, must &lt; 0.05）</div>\n          <p class=\"ep-h5\">① Predictability — MSE（预测精度） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks)</span></p>\n          <div class=\"ep-formula\">MSE = SSE ÷ Residual df    （SSE and df from ANOVA table Residual row / 从ANOVA表Residual行读取）</div>\n          <table class=\"ep-mini-table\">\n            <tr><th>Model</th><th>SSE</th><th>Residual df</th><th>MSE</th></tr>\n            <tr><td>Q3.2 Linear</td><td>49,652.72</td><td>8</td><td><strong>6,206.59</strong></td></tr>\n            <tr><td>Q3.3 Quadratic</td><td>20,667.05</td><td>7</td><td><strong>2,952.44</strong></td></tr>\n          </table>\n          <div class=\"ep-tip-box\">Q3.3 has lower MSE → <strong>better predictability ✅</strong><br><span style=\"color:var(--color-text-secondary);font-size:12px\">Q3.3的MSE更低，预测精度更高。</span></div>\n          <p class=\"ep-h5\">② Overall Fit — R² and Adjusted R²（整体拟合度） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Model</th><th>R²</th><th>Adjusted R²</th></tr>\n            <tr><td>Q3.2 Linear</td><td>0.7564</td><td>0.7256</td></tr>\n            <tr><td>Q3.3 Quadratic</td><td><strong>0.8985</strong></td><td><strong>0.8695</strong></td></tr>\n          </table>\n          <div class=\"ep-info-box\">为什么同时看 R² 和 Adj R²？/ Why both?<br>R² 随变量增加只会上升，即使无用变量 (R² always increases with more variables)。<br><strong>Adjusted R²</strong> 会惩罚多余变量，是更公平的比较标准 (penalises unnecessary variables — fairer comparison)。</div>\n          <div class=\"ep-tip-box\">Q3.3 explains ~13% more variation in mortgage than Q3.2 ✅<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Q3.3的R²和Adjusted R²均更高，二次模型比线性模型多解释约13%的月供变异。</span></div>\n          <p class=\"ep-h5\">③ Overall Significance — Significance F（整体显著性） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Model</th><th>Significance F</th><th>vs 0.05</th></tr>\n            <tr><td>Q3.2 Linear</td><td>0.00108</td><td>&lt; 0.05 ✅</td></tr>\n            <tr><td>Q3.3 Quadratic</td><td><strong>0.000333</strong></td><td>&lt; 0.05 ✅</td></tr>\n          </table>\n          <div class=\"ep-tip-box\">Both significant. Q3.3 has smaller Sig F → <strong>stronger overall significance ✅</strong><br><span style=\"color:var(--color-text-secondary);font-size:12px\">两个模型都整体显著，但Q3.3的Significance F更小，整体显著性更强。</span></div>\n          <span class=\"ep-answer-label\">结论 / Conclusion</span>\n          <div class=\"ep-tip-box\">The quadratic model in Q3.3 is <strong>more effective</strong> — it outperforms Q3.2 across all three dimensions: lower MSE, higher R² and Adjusted R², and stronger overall significance.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Q3.3（二次模型）更有效——在所有三个维度上均优于Q3.2。</span></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>MSE for Q3.2</td><td>49652.72 ÷ 8 = 6206.59</td><td>1</td></tr>\n            <tr><td>MSE for Q3.3</td><td>20667.05 ÷ 7 = 2952.44</td><td>1</td></tr>\n            <tr><td>MSE comparison</td><td>Q3.3 lower → better predictability</td><td>1</td></tr>\n            <tr><td>R² and Adj R²</td><td>Both higher in Q3.3，~13% more variation</td><td>2</td></tr>\n            <tr><td>Significance F</td><td>Both &lt; 0.05，Q3.3 smaller → stronger</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>7</strong></td></tr>\n          </table>\n        </div>\n      </div>\n    </div>\n\n  </div>\n</div><!-- /q3 panel -->\n    <!-- ── Q4: Descriptive Data Mining ── -->\n    <div id=\"2025s1-q4\" class=\"ep-q-panel\">\n  <div class=\"ep-split-layout\">\n\n    <!-- ── 左栏：原题 ── -->\n    <div class=\"ep-orig-col\">\n      <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n      <div class=\"ep-orig-card\">\n        <div class=\"ep-orig-bg\">\n  <strong>SECTION 1 · Q4 (25 marks)</strong><br>\n  As a Campaign Data Analyst working at Essential Research, you have been engaged by campaign strategists ahead of a federal election. Your key responsibility is to improve the accuracy of voter targeting strategies, particularly in identifying <strong>undecided voters</strong>.\n  <table class=\"ep-orig-tbl\"><tr><th>Variable</th><th>Description</th></tr><tr><td>Vote</td><td>Binary: 1 = undecided voter, 0 = decided voter</td></tr><tr><td>Age</td><td>Age in years</td></tr><tr><td>HomeOwner</td><td>Binary: 1 = owns home, 0 = does not</td></tr><tr><td>Gender</td><td>male / female</td></tr><tr><td>Gender_num</td><td>Binary: 1 = male, 0 = female</td></tr><tr><td>Married</td><td>Binary: 1 = married, 0 = not married</td></tr><tr><td>HouseholdSize</td><td>Number of individuals in household</td></tr><tr><td>Income</td><td>Annual income in thousands AUD</td></tr><tr><td>Education</td><td>Years of formal education completed</td></tr><tr><td>Religious</td><td>Binary: 1 = regularly attends religious services, 0 = otherwise</td></tr></table>\n  <strong>Table 4.2 — Five voter data sample:</strong>\n  <table class=\"ep-orig-tbl\"><tr><th>Obs.</th><th>Vote</th><th>Age</th><th>HomeOwner</th><th>Gender</th><th>Gender_num</th><th>Married</th><th>HouseholdSize</th><th>Income</th><th>Education</th><th>Religious</th></tr><tr><td>1</td><td>1</td><td>51</td><td>1</td><td>female</td><td>0</td><td>1</td><td>4</td><td>171</td><td>15</td><td>0</td></tr><tr><td>2</td><td>0</td><td>46</td><td>1</td><td>female</td><td>0</td><td>1</td><td>6</td><td>420</td><td>15</td><td>1</td></tr><tr><td>3</td><td>1</td><td>55</td><td>1</td><td>male</td><td>1</td><td>1</td><td>6</td><td>132</td><td>16</td><td>0</td></tr><tr><td>4</td><td>0</td><td>50</td><td>1</td><td>male</td><td>1</td><td>1</td><td>4</td><td>18</td><td>8</td><td>0</td></tr><tr><td>5</td><td>1</td><td>49</td><td>1</td><td>female</td><td>0</td><td>1</td><td>2</td><td>66</td><td>15</td><td>1</td></tr></table>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q4.1</span>\n  <p class=\"ep-orig-qtxt\">Using Table 4.2, calculate the <strong>Euclidean distance</strong> to determine the dissimilarity values across the numerical variables of Age, Household Size and Income for Voters 2 and 4, and Voters 2 and 5. Use the relevant formulae and show your workings. Based on your answers, explain whether Voter 4 or 5 is more similar to Voter 2 and why.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q4.2</span>\n  <p class=\"ep-orig-qtxt\">Suppose that the sample mean values for Age, Household Size and Income are 47, 3 and 101 respectively, and the sample standard deviations are 11, 2 and 74. Calculate dissimilarity values based on <strong>standardised Euclidean distance</strong> across Age, Household Size and Income for Voters 2 and 4, and Voters 2 and 5. Discuss whether your conclusion about the similarity between the voters changes compared to Q4.1.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">6 marks</span>\n  <span class=\"ep-orig-qnum\">Q4.3</span>\n  <p class=\"ep-orig-qtxt\">Use Table 4.3 (binary variables: Vote, Gender, Married, Religious) to calculate <strong>similarity values based on the matching coefficient</strong> for observation 5 with all other observations. Which of the observations are least similar? Discuss one disadvantage of using the matching coefficient as applied to the Married variable.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">4 marks</span>\n  <span class=\"ep-orig-qnum\">Q4.4</span>\n  <p class=\"ep-orig-qtxt\">A hierarchical clustering based on the group average linkage method produced a dendrogram (Figure 4.1). The clustering analysis was based on a sample of 100 voters and 4 characteristics: voter status, gender, age, and religious status. How many explicit clusters can you identify at distances of 0.36 and 0.28 respectively? Which of the initial ten clusters is the most distinctive and durable cluster and why?</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q4.5</span>\n  <p class=\"ep-orig-qtxt\">The table below (Table 4.4) shows output from Association Rules analysis based on 100 voters across 4 binary variables: Vote, Gender, Married and Religious. Calculate the <strong>Confidence</strong> and <strong>Lift Ratio</strong> for the two rules provided. Explain why the Confidence can be a misleading association measure.</p>\n</div>\n      </div>\n    </div>\n\n    <!-- ── 右栏：解析 ── -->\n    <div class=\"ep-analysis-col\">\n      <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-1')\">\n          <span class=\"ep-subq-num\">Q4.1</span>\n          <span class=\"ep-subq-title\">Euclidean Distance (Unstandardised) — Voters 2&amp;4 and 2&amp;5. Which is more similar to Voter 2?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>公式口诀：</strong>每个变量做差 → 平方 → 全部相加 → 开根号<br><em>Difference → Square → Sum → Square root</em><br>d = √[(x₁−x₂)² + (y₁−y₂)² + (z₁−z₂)²]</div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">Voters 2 and 4（Voter 2 与 4） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[(46−50)² + (6−4)² + (420−18)²]\n  = √[16 + 4 + 161,604] = <strong>402.02</strong></div>\n          <p class=\"ep-h5\">Voters 2 and 5（Voter 2 与 5） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[(46−49)² + (6−2)² + (420−66)²]\n  = √[9 + 16 + 125,316] = <strong>354.04</strong></div>\n          <p class=\"ep-h5\">Conclusion（结论） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks ← 必须包含两句话！)</span></p>\n          <div class=\"ep-tip-box\">\"Voter 5 is more similar to Voter 2 as it has a lower Euclidean distance (354.04 &lt; 402.02). This is because the Euclidean distance is <strong>unduly influenced by the scale</strong> on which variables are measured, particularly Income which is measured on a much larger scale than Age or Household Size.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Voter 5与Voter 2更相似，因为欧式距离更小（354.04 &lt; 402.02）。这是因为欧式距离受变量测量尺度的过度影响，特别是Income的尺度远大于Age和Household Size。</span></div>\n          <div class=\"ep-warn-box\">⚠️ 结论必须说 <strong>\"unduly influenced by scale\"</strong> ← 这句话值分！不能只说\"354 &lt; 402 so Voter 5 is closer\"，太简单会扣分。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Distance (2 &amp; 4)</td><td>402.02</td><td>1.5</td></tr>\n            <tr><td>Distance (2 &amp; 5)</td><td>354.04</td><td>1.5</td></tr>\n            <tr><td>Conclusion</td><td>Voter 5 closer + scale explanation</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-2')\">\n          <span class=\"ep-subq-num\">Q4.2</span>\n          <span class=\"ep-subq-title\">Euclidean Distance (Standardised) — Voters 2&amp;4 and 2&amp;5. Does the conclusion change?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>为什么要标准化 / Why Standardise：</strong><br>不标准化时，Income数值大会<strong>压倒</strong>Age和Household Size，导致结果失真。标准化后所有变量在同一尺度上比较，每个变量贡献相等。<br><em>Without standardisation, large-scale variables (like Income) dominate. Standardising puts all variables on equal footing.</em><br>⚠️ Mean 在计算时用不到！直接用差值 ÷ 标准差。<em>(Mean is not needed! Just use difference ÷ standard deviation.)</em></div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">① 先写公式 / Write the formula first <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 必须写！)</span></p>\n          <div class=\"ep-formula\">Standardised d = √[((x₁−x₂)/sₓ)² + ((y₁−y₂)/sᵧ)² + ((z₁−z₂)/s_z)²]</div>\n          <p class=\"ep-h5\">② Voters 2 and 4 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[((46−50)/11)² + ((6−4)/2)² + ((420−18)/74)²]\n  = √[(−0.364)² + (1)² + (5.432)²]\n  = √[0.13 + 1 + 29.51] = <strong>5.54</strong></div>\n          <p class=\"ep-h5\">③ Voters 2 and 5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks)</span></p>\n          <div class=\"ep-formula\">d = √[((46−49)/11)² + ((6−2)/2)² + ((420−66)/74)²]\n  = √[(−0.273)² + (2)² + (4.784)²]\n  = √[0.07 + 4 + 22.88] = <strong>5.19</strong></div>\n          <p class=\"ep-h5\">④ Conclusion（结论） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 必须提到Q4.1！)</span></p>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：结论与Q4.1相同（本题）/ Case 1: Same conclusion as Q4.1</p>\n          <div class=\"ep-tip-box\">\"The standardised measures confirm that Voter 5 remains closer to Voter 2 (5.19 &lt; 5.54). Therefore the <strong>conclusion is the same as Q4.1</strong>. However, the standardised distances are proportionately closer to one another because they take account of the <strong>scale</strong> in which the variables are measured.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">标准化后Voter 5仍然更接近Voter 2（5.19 &lt; 5.54），结论与Q4.1<strong>相同</strong>。但标准化后两个距离之间的差距比未标准化时更小，因为标准化考虑了变量的测量尺度。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：结论与Q4.1不同 / Case 2: Different conclusion from Q4.1</p>\n          <div class=\"ep-tip-box\">\"The standardised measures show that Voter [X] is now closer to Voter 2 ([d1] &lt; [d2]). Therefore the <strong>conclusion changes compared to Q4.1</strong>. This is because standardisation removes the undue influence of [Income/large variable], revealing that [X] is actually more similar when variables are measured on an equal scale.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">标准化后Voter [X]反而更接近Voter 2，结论与Q4.1<strong>不同</strong>。这是因为标准化消除了[大尺度变量]的过度影响，在等比例尺度下[X]实际上更相似。</span></div>\n          <div class=\"ep-warn-box\">⚠️ 必须写标准化公式（1分）｜结论必须说 <strong>\"same as Q4.1\"</strong> 或 <strong>\"changes compared to Q4.1\"</strong>（1分）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Formula written</td><td>Standardised formula（必须写）</td><td>1</td></tr>\n            <tr><td>Distance (2 &amp; 4)</td><td>5.54</td><td>1.5</td></tr>\n            <tr><td>Distance (2 &amp; 5)</td><td>5.19</td><td>1.5</td></tr>\n            <tr><td>Conclusion</td><td>Same/different from Q4.1 + reason</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-3')\">\n          <span class=\"ep-subq-num\">Q4.3</span>\n          <span class=\"ep-subq-title\">Matching Coefficient — Observation 5 vs all others. Least similar? One disadvantage on Married variable.</span>\n          <span class=\"ep-subq-marks\">6 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>公式口诀：</strong>数有几个位置两者相同 ÷ 总变量数（这里是4）<br>MC = Number of matching attributes ÷ Total number of attributes（匹配数/总变量数）</div>\n          <span class=\"ep-answer-label\">计算（Observation 5: Vote=1, Gender=0, Married=1, Religious=1）</span>\n          <table class=\"ep-mini-table\">\n            <tr><th>Comparison</th><th>Vote</th><th>Gender</th><th>Married</th><th>Religious</th><th>Matches</th><th>MC</th></tr>\n            <tr><td>5 vs 1</td><td>1=1 ✓</td><td>0=0 ✓</td><td>1=1 ✓</td><td>1≠0 ✗</td><td>3</td><td><strong>3/4 = 0.75</strong></td></tr>\n            <tr><td>5 vs 2</td><td>1≠0 ✗</td><td>0=0 ✓</td><td>1=1 ✓</td><td>1=1 ✓</td><td>3</td><td><strong>3/4 = 0.75</strong></td></tr>\n            <tr><td>5 vs 3</td><td>1=1 ✓</td><td>0≠1 ✗</td><td>1=1 ✓</td><td>1≠0 ✗</td><td>2</td><td><strong>2/4 = 0.50</strong></td></tr>\n            <tr><td>5 vs 4</td><td>1≠0 ✗</td><td>0≠1 ✗</td><td>1=1 ✓</td><td>1≠0 ✗</td><td>1</td><td><strong>1/4 = 0.25</strong></td></tr>\n          </table>\n          <div class=\"ep-tip-box\" style=\"margin-top:10px\"><strong>Least similar（最不相似）: Observation 4 (MC = 0.25)</strong></div>\n          <p class=\"ep-h5\">Disadvantage（缺点） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">角度一（老师标准答案）— 0-0匹配问题 / 0-0 Match Problem</p>\n          <div class=\"ep-tip-box\">\"One disadvantage of the matching coefficient is that it treats both <strong>1-1 and 0-0 matches</strong> as equally informative signs of similarity. However, a 0-0 match can <strong>conceal real differences</strong> between observations. For example, two voters might both have a value of 0 for the Married variable, but one could be single while another lives in a de-facto relationship — these are meaningfully different situations that the matching coefficient fails to distinguish.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">匹配系数将1-1和0-0匹配都视为相似的证据，但0-0匹配可能掩盖真实差异。例如，两个选民Married都是0，但一个是单身一个是事实婚姻——这是有意义的区别，但匹配系数无法识别。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">角度二（备用，如果问两个缺点）— 全部相同问题 / All Same Value Problem</p>\n          <div class=\"ep-tip-box\">\"One disadvantage is that if all observations share the same value for a variable (e.g. all voters have Married = 1), this variable provides <strong>no discriminating information</strong> between observations, yet it still contributes to the similarity score and <strong>artificially inflates</strong> the similarity values.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">如果某个变量所有观测值都相同（如Married全是1），该变量无法区分观测值，但仍被计入相似度分数，虚假地拉高了相似度。</span></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>4 MC calculations</td><td>0.5 mark each</td><td>2</td></tr>\n            <tr><td>Least similar</td><td>Observation 4, MC = 0.25</td><td>1</td></tr>\n            <tr><td>Disadvantage</td><td>0-0 match + specific example</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-4')\">\n          <span class=\"ep-subq-num\">Q4.4</span>\n          <span class=\"ep-subq-title\">Dendrogram — clusters at distances 0.36 and 0.28? Most distinctive and durable cluster?</span>\n          <span class=\"ep-subq-marks\">4 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>Dendrogram 读图规则 / Reading Rules：</strong><br>在该距离画水平线 → 数被切断的竖线数量 = cluster 数量<br><em>Draw horizontal line at distance → count intersected vertical lines = # clusters</em><br>Most distinctive = 合并前竖线<strong>跨度最大</strong>的 cluster<br><em>Most distinctive = cluster with largest vertical span before merging</em></div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">Distance = 0.36 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">\"At a distance of 0.36, there are <strong>5 explicit clusters</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">在距离0.36处，有5个明确的cluster。</span></div>\n          <p class=\"ep-h5\">Distance = 0.28 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">\"At a distance of 0.28, there are <strong>7 explicit clusters</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">在距离0.28处，有7个明确的cluster。</span></div>\n          <p class=\"ep-h5\">Most distinctive and durable（最具特色且最持久） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"<strong>Cluster 3</strong> is the most distinctive and durable cluster because the <strong>vertical distance before it merges</strong> with another cluster of approximately <strong>0.37–0.38</strong> is greater than for the other unmerged clusters. This large vertical span indicates that Cluster 3 is the most dissimilar to all others and maintains its distinctiveness the longest.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\"><strong>Cluster 3</strong> 是最具特色且最持久的cluster，因为它在与其他cluster合并之前的竖线跨度（约0.37-0.38）比其他未合并cluster更大。这个大跨度说明Cluster 3与所有其他cluster差异最大，且保持独立时间最长。</span></div>\n          <div class=\"ep-warn-box\">⚠️ 答案是 <strong>Cluster 3</strong>，不是 Cluster 10！← 常见错误<br>判断依据是<strong>竖线跨度最大</strong>，不是\"最晚合并\"！</div>\n          <div class=\"ep-info-box\">📌 <strong>套入模板 / Fill-in Template：</strong><br>\"Cluster [X] is the most distinctive and durable cluster because the vertical distance before it merges with another cluster of approximately [distance value] is greater than for the other unmerged clusters. This large vertical span indicates that Cluster [X] is the most dissimilar to all others and maintains its distinctiveness the longest.\"</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Clusters at 0.36</td><td>5 clusters</td><td>1</td></tr>\n            <tr><td>Clusters at 0.28</td><td>7 clusters</td><td>1</td></tr>\n            <tr><td>Most distinctive</td><td>Cluster 3</td><td>1</td></tr>\n            <tr><td>Why</td><td>Vertical span ~0.37–0.38, largest</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q4-5\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q4-5')\">\n          <span class=\"ep-subq-num\">Q4.5</span>\n          <span class=\"ep-subq-title\">Association Rules — Confidence &amp; Lift Ratio for Rule 13 and Rule 7. Why can Confidence be misleading?</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>两个公式 / Two Formulas：</strong><br>Confidence = Support ÷ A-Support = 同时出现次数 ÷ Antecedent出现次数<br>Lift Ratio = Confidence ÷ (C-Support ÷ Total) = Confidence ÷ Consequent出现比例<br><br>Lift &gt; 1 → positive association（正关联，规则有用）<br>Lift = 1 → no association（无关联）<br>Lift &lt; 1 → negative association（负关联）</div>\n          <p class=\"ep-h5\">从表格提取数据 / Data from Table</p>\n          <table class=\"ep-mini-table\">\n            <tr><th></th><th>Rule 13</th><th>Rule 7</th></tr>\n            <tr><td>Antecedent</td><td>[Vote, Religious]</td><td>[Married]</td></tr>\n            <tr><td>Consequent</td><td>[Married]</td><td>[Religious]</td></tr>\n            <tr><td>A-Support</td><td>12</td><td>84</td></tr>\n            <tr><td>C-Support</td><td>84</td><td>45</td></tr>\n            <tr><td>Support</td><td>11</td><td>39</td></tr>\n            <tr><td>Total</td><td>100</td><td>100</td></tr>\n          </table>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">Rule 13 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">Confidence  = 11 / 12 = <strong>0.92 (92%)</strong>\nLift Ratio  = 0.92 / (84/100) = 0.92 / 0.84 = <strong>1.09</strong></div>\n          <p class=\"ep-h5\">Rule 7 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-formula\">Confidence  = 39 / 84 = <strong>0.46 (46%)</strong>\nLift Ratio  = 0.46 / (45/100) = 0.46 / 0.45 = <strong>1.02</strong></div>\n          <p class=\"ep-h5\">Why Confidence is Misleading（为什么置信度可能是误导性的） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 照抄这句话 / Copy this sentence)</span></p>\n          <div class=\"ep-tip-box\">\"If the <strong>support or frequency of the Consequent is high</strong>, then the confidence of the association rule could be <strong>high even if there is little or no association</strong> between the attributes. For example, since 84% of voters are married, any rule with Married as the consequent will have artificially high confidence regardless of the true association.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">如果Consequent的频率很高，即使Antecedent和Consequent之间几乎没有关联，置信度也可能很高。例如，84%的选民已婚，所以任何以Married为Consequent的规则都会有虚高的置信度。</span></div>\n          <div class=\"ep-info-box\">📌 <strong>套入模板 / Fill-in Template：</strong><br>\"If the support or frequency of <strong>[Consequent item]</strong> is high (e.g. <strong>[X]%</strong> of transactions contain it), then the confidence could be high even if there is little or no real association between the antecedent and consequent.\"<br><em>如果[Consequent项目]的频率很高（如[X]%的交易包含它），即使没有真实关联，置信度也可能很高。</em></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Rule 13 Confidence</td><td>11/12 = 0.92</td><td>1</td></tr>\n            <tr><td>Rule 13 Lift Ratio</td><td>0.92/(84/100) = 1.09</td><td>1</td></tr>\n            <tr><td>Rule 7 Confidence</td><td>39/84 = 0.46</td><td>1</td></tr>\n            <tr><td>Rule 7 Lift Ratio</td><td>0.46/(45/100) = 1.02</td><td>1</td></tr>\n            <tr><td>Why misleading</td><td>High C-Support → artificially high confidence</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n    </div>\n\n  </div>\n</div><!-- /q4 panel -->\n    <!-- ── Q5: Classification Tree ── -->\n    <div id=\"2025s1-q5\" class=\"ep-q-panel\">\n  <div class=\"ep-split-layout\">\n\n    <!-- ── 左栏：原题 ── -->\n    <div class=\"ep-orig-col\">\n      <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n      <div class=\"ep-orig-card\">\n        <div class=\"ep-orig-bg\">\n  <strong>SECTION 1 · Q5 (25 marks)</strong><br>\n  This question shares the same context as Q4 (voter targeting for Australian federal election). A <strong>classification tree</strong> (Figure 5.1) was used to create a classifier for this data with <strong>2,000 observations</strong>, with the variable <strong>Vote</strong> as the target (response) variable.<br><br>\n  The dataset was used <em>solely</em> for training the model, and no additional data was set aside for independent evaluation. As a result, the model&#39;s performance was assessed using the same data on which it was built. A <strong>full-grown tree with a maximum of four levels</strong> was applied.\n  <p class=\"ep-orig-note\">Please use the Excel printouts (Figures 5.1, 5.2, 5.3) to answer the questions below.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q5.1</span>\n  <p class=\"ep-orig-qtxt\">Based on the approach described, what is one <strong>limitation</strong> of building a predictive model in this way? Provide <strong>two reasons</strong> why this may affect the model&#39;s reliability. Then, suggest a method to address this issue and explain how it would improve the evaluation of the model&#39;s performance.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">8 marks</span>\n  <span class=\"ep-orig-qnum\">Q5.2</span>\n  <p class=\"ep-orig-qtxt\">Based on the provided Excel printouts, compute the <strong>classification errors</strong> for one to three decision nodes for the full classification tree based on the training set. Arrange the decision nodes in a top-to-bottom, left-to-right order on the classification tree (as labelled in the printout). Show your calculations and round your final answers to four decimal places. What observations can you make about the classification errors in the training set, and are these results what you would expect?</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">2 marks</span>\n  <span class=\"ep-orig-qnum\">Q5.3</span>\n  <p class=\"ep-orig-qtxt\">Based on the Excel printouts, determine the <strong>predicted classification</strong> for a 55-year-old male voter who is married, owns a home, earns an income of $90,000 AUD, has completed 15 years of formal education, lives in a household of three people, and <strong>regularly attends religious services every Sunday morning</strong>.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q5.4</span>\n  <p class=\"ep-orig-qtxt\">Based on Figure 5.3, calculate the <strong>number of errors</strong> and the <strong>percentage of errors</strong> as indicated by the \"?\" in the error report table. Then, calculate the <strong>F1 score</strong> and briefly interpret what this score reveals about the model&#39;s performance. Round your final answers to four decimal places. Finally, provide an overall conclusion based on your findings.</p>\n</div>\n\n<div class=\"ep-orig-subq\">\n  <span class=\"ep-orig-qmarks\">5 marks</span>\n  <span class=\"ep-orig-qnum\">Q5.5</span>\n  <p class=\"ep-orig-qtxt\">Based on the Excel printouts, determine the <strong>expected number of Class 1 observations at 500 cases</strong> in the cumulative lift chart from the Training Set. Round your answer to two decimal places. Next, interpret the <strong>AUC value</strong> and explain what this value means in the context of the model&#39;s performance.</p>\n</div>\n      </div>\n    </div>\n\n    <!-- ── 右栏：解析 ── -->\n    <div class=\"ep-analysis-col\">\n      <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-1')\">\n          <span class=\"ep-subq-num\">Q5.1</span>\n          <span class=\"ep-subq-title\">One limitation of training-only model. Two reasons. Suggest a method to address it.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 就像备考时把所有真题做完看完答案，再用同样的题考自己——分数当然高，但不代表真实水平。<br><em>Like studying past exam answers, then being tested on the same questions — scores will be inflated, not reflecting true ability.</em></div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">Limitation（局限性） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-tip-box\">\"Using the entire dataset as the training set means <strong>no separate data</strong> can evaluate how well the model performs on unseen data.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">将全部数据用于训练，意味着没有独立数据可以评估模型在未见数据上的表现。</span></div>\n          <p class=\"ep-h5\">Two Reasons（两个影响可靠性的原因） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">1. This
