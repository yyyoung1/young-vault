<p><strong>看图答题模板（趋势+季节）：</strong>\"The time series plot shows <strong>linear trend and seasonal patterns</strong> in the data. For instance, in each year the lowest value occurs in quarter [X] and the highest value occurs in quarter [Y]. Also, the [sales] <strong>increase/decrease</strong> over time.\"</p></div>\n  </div>\n</div>\n\n<!-- 8.2 METHODS -->\n<div id=\"p2\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-purple\" style=\"margin-bottom:10px\">8.2 预测方法 & 精度指标</span>\n    <p class=\"title\" style=\"margin-bottom:12px\">三种方法公式速查</p>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"mini-card\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\"><span class=\"badge badge-teal\" style=\"margin:0\">Naïve</span><p style=\"font-size:13px;font-weight:500;color:var(--color-text-primary)\">朴素预测法</p></div>\n        <div class=\"formula\">ŷ(t+1) = y(t)</div>\n        <p style=\"font-size:12px;color:var(--color-text-secondary);margin-top:4px\">直接用上期实际值。第1期无预测，n = 观测数 − 1</p>\n      </div>\n      <div class=\"mini-card\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\"><span class=\"badge badge-purple\" style=\"margin:0\">Moving Avg</span><p style=\"font-size:13px;font-weight:500;color:var(--color-text-primary)\">移动平均法（k期）</p></div>\n        <div class=\"formula\">ŷ(t+1) = [y(t) + y(t-1) + … + y(t-k+1)] / k</div>\n        <p style=\"font-size:12px;color:var(--color-text-secondary);margin-top:4px\">从第k+1期起有预测值，有效 n = 观测数 − k</p>\n      </div>\n      <div class=\"mini-card\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\"><span class=\"badge badge-amber\" style=\"margin:0\">Exp. Smoothing</span><p style=\"font-size:13px;font-weight:500;color:var(--color-text-primary)\">指数平滑法</p></div>\n        <div class=\"formula\">ŷ(t+1) = α · y(t) + (1−α) · ŷ(t)　（0 &lt; α &lt; 1）</div>\n        <p style=\"font-size:12px;color:var(--color-text-secondary);margin-top:4px\">初始值 ŷ(1) = y(1)，最优 α = MSE 最小时的值</p>\n      </div>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:12px\">四个精度指标速查</p>\n    <table>\n      <tr><th>指标</th><th>公式</th><th>含义 / 用途</th></tr>\n      <tr><td><span class=\"badge badge-teal\">MFE</span></td><td><div class=\"formula\" style=\"margin:0\">Σe(t) / n</div></td><td style=\"font-size:12px\">正负相消，看<strong>系统偏向</strong>（MFE≈0 = 无偏）</td></tr>\n      <tr><td><span class=\"badge badge-purple\">MAE</span></td><td><div class=\"formula\" style=\"margin:0\">Σ|e(t)| / n</div></td><td style=\"font-size:12px\">取绝对值，看<strong>平均误差大小</strong></td></tr>\n      <tr><td><span class=\"badge badge-amber\">MSE</span></td><td><div class=\"formula\" style=\"margin:0\">Σe(t)² / n</div></td><td style=\"font-size:12px\">取平方，<strong>比较方法优劣</strong>（选最优k/α）</td></tr>\n      <tr><td><span class=\"badge badge-coral\">MAPE</span></td><td><div class=\"formula\" style=\"margin:0\">(Σ|e(t)/y(t)|) / n × 100%</div></td><td style=\"font-size:12px\">百分比误差，<strong>跨数据集比较</strong></td></tr>\n    </table>\n    <div class=\"hint\" style=\"margin-top:10px\"><p><strong>记忆口诀：</strong>MFE 看偏向（有正负）→ MAE 看大小（取绝对值）→ MSE 选方法（取平方）→ MAPE 看比例（÷实际值）</p></div>\n  </div>\n</div>\n\n<!-- 8.3 REGRESSION -->\n<div id=\"p3\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-amber\" style=\"margin-bottom:10px\">8.3 回归预测</span>\n    <p class=\"title\" style=\"margin-bottom:12px\">完整答题流程</p>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div class=\"mini-card\" style=\"border-left:3px solid #1D9E75;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0\">\n        <p style=\"font-size:12px;font-weight:500;color:#0F6E56;margin-bottom:4px\">Step 1 — 识别模式（看图）</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">说出\"linear trend + seasonal patterns\"，举例说明哪季度最高/最低</p>\n      </div>\n      <div class=\"mini-card\" style=\"border-left:3px solid #534AB7;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0\">\n        <p style=\"font-size:12px;font-weight:500;color:#3C3489;margin-bottom:4px\">Step 2 — 定义变量（写定义）</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">K−1个虚拟变量定义 + t 的起始说明，缺一扣分</p>\n      </div>\n      <div class=\"mini-card\" style=\"border-left:3px solid #BA7517;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0\">\n        <p style=\"font-size:12px;font-weight:500;color:#633806;margin-bottom:4px\">Step 3 — 写方程（读Excel）</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">从Coefficients列读取截距和各系数，注意正负号</p>\n      </div>\n      <div class=\"mini-card\" style=\"border-left:3px solid #D85A30;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0\">\n        <p style=\"font-size:12px;font-weight:500;color:#712B13;margin-bottom:4px\">Step 4 — 预测（代入计算）</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">确认 t 值（接续编号），确认虚拟变量值，代入计算</p>\n      </div>\n      <div class=\"mini-card\" style=\"border-left:3px solid #185FA5;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0\">\n        <p style=\"font-size:12px;font-weight:500;color:#0C447C;margin-bottom:4px\">Step 5 — 显著性 + 解释（P-value）</p>\n        <p style=\"font-size:12px;color:var(--color-text-secondary)\">P-value vs 0.05，解释系数时与基准季度Q4比较</p>\n      </div>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:10px\">必背答题模板</p>\n    <div class=\"exam-box\"><p><strong>写方程：</strong><br>Let Qtr1 = 1 if quarter 1, 0 otherwise; Qtr2 = 1 if quarter 2, 0 otherwise; Qtr3 = 1 if quarter 3, 0 otherwise. Let t = 1 refer to Q1 of year 1, …, t = 12 refer to Q4 of year 3.<br>ŷ = 2306.667 − 642.292Qtr1 − 1465.42Qtr2 + 349.792Qtr3 + 23.125t</p></div>\n    <div class=\"exam-box\" style=\"margin-top:0\"><p><strong>显著性：</strong><br>\"Qtr2: P-value = 2.3E-07 &lt; 0.05, it is a significant factor.\"</p></div>\n    <div class=\"exam-box\" style=\"margin-top:0\"><p><strong>解释虚拟变量系数：</strong><br>\"When it is in Quarter 2, the sales is 1465.42 <strong>less</strong> than that in Quarter 4, holding other independent variables fixed.\"</p></div>\n    <div class=\"exam-box\" style=\"margin-top:0\"><p><strong>解释趋势系数：</strong><br>\"For each additional time period (quarter), the sales increases by 23.125 copies on average, holding other independent variables fixed.\"</p></div>\n  </div>\n</div>\n\n<!-- TRAPS & TIPS -->\n<div id=\"trap\" class=\"section\">\n  <div class=\"card\">\n    <span class=\"badge badge-red\" style=\"margin-bottom:10px\">易错点总结 COMMON MISTAKES</span>\n    <p class=\"title\" style=\"margin-bottom:12px\">Week 8 最容易丢分的地方</p>\n    <div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>Seasonal vs Cyclical 搞混：</strong>只要题目说\"每年固定时间出现\" → Seasonal；说\"多年一个周期/经济周期\" → Cyclical。关键词\"more than one year\"。</div></div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>MA/ES 分母算错：</strong>3期移动平均，前2期无预测值，分母 = n−2，不是 n。考试时列表格逐期计算，别直接算 n。</div></div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>Naïve 忘写列式：</strong>答题必须先写\"Using Naïve method, ŷ(2) = y(1) = [值]\"来证明所用方法，直接写答案不得分。</div></div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>虚拟变量定义漏写：</strong>写回归方程前必须先定义 Qtr1/Qtr2/Qtr3，再定义 t 的起始，两步缺一扣分。</div></div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>Year 4 的 t 值算错：</strong>3年×4季度=12期，Year 4 Q1 = t=13，Year 4 Q2 = t=14，以此类推。不是从 t=1 重新开始。</div></div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>解释系数比较对象搞错：</strong>虚拟变量系数永远与<strong>基准季度（Q4）</strong>比，不是与上一季度或Q1比。</div></div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>系数正负号忘加：</strong>从 Excel 读系数时，负系数容易漏掉负号。写方程时建议先检查一遍正负。</div></div>\n      <div class=\"trap-item\"><span class=\"trap-icon\">✕</span><div class=\"trap-text\"><strong>为什么用K−1忘了说：</strong>如果被问\"为什么只放3个虚拟变量\"，答\"to avoid perfect multicollinearity（完全多重共线性）\"。</div></div>\n    </div>\n  </div>\n  <div class=\"card\">\n    <p class=\"title\" style=\"font-size:14px;margin-bottom:10px\">考前最后检查清单</p>\n    <div class=\"success\"><p>公式全部背熟：Naïve / MA / ES / MFE / MAE / MSE / MAPE</p></div>\n    <div class=\"success\" style=\"margin-top:6px\"><p>能看折线图判断模式，知道 Seasonal vs Cyclical 的核心区别</p></div>\n    <div class=\"success\" style=\"margin-top:6px\"><p>知道 K−1 规则，知道 Q4 是基准，知道系数解释要说\"compared to Q4\"</p></div>\n    <div class=\"success\" style=\"margin-top:6px\"><p>能完整走完5步答题流程，包括写虚拟变量定义和 t 的定义</p></div>\n    <div class=\"success\" style=\"margin-top:6px\"><p>预测时 t 值接续历史数据编号，Q4 代入时三个虚拟变量全为 0</p></div>\n  </div>\n  <div style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n    \n    \n  </div>\n</div>\n\n<script>\nconst TOTAL=20;\nfunction toggle(el,groupId){\n  el.classList.toggle('done');\n  updateProgress();\n}\nfunction updateProgress(){\n  const done=document.querySelectorAll('.cl-item.done').length;\n  const pct=Math.round(done/TOTAL*100);\n  document.getElementById('prog-fill').style.width=pct+'%';\n  document.getElementById('prog-text').textContent=done+' / '+TOTAL+' 已掌握';\n}\nfunction show(id,btn){\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));\n  document.getElementById(id).classList.add('active');\n  if(btn) btn.classList.add('active');\n}\n<\/script>\n"}, {"id": "week9_predictive_data_mining", "week": "Week 9", "title": "Predictive Data Mining", "subtitle": "分类树 · 逻辑回归", "color": "#10B981", "content": "\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:var(--font-sans,sans-serif)}\n.app{padding:1rem 0;max-width:680px}\n.progress-bar{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}\n.pb-step{flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--color-border-tertiary);cursor:pointer;transition:background .2s}\n.pb-step.done{background:var(--color-text-info)}\n.pb-step.active{background:var(--color-text-primary)}\n.section{display:none}\n.section.active{display:block}\n.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem}\n.badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:12px;font-weight:500;margin-bottom:.5rem}\n.badge-blue{background:var(--color-background-info);color:var(--color-text-info)}\n.badge-amber{background:var(--color-background-warning);color:var(--color-text-warning)}\n.badge-green{background:var(--color-background-success);color:var(--color-text-success)}\n.badge-red{background:var(--color-background-danger);color:var(--color-text-danger)}\nh2{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-bottom:.75rem}\nh3{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:.5rem}\np{font-size:14px;color:var(--color-text-secondary);line-height:1.7;margin-bottom:.5rem}\n.formula{background:var(--color-background-secondary);border-left:3px solid var(--color-border-info);border-radius:0 6px 6px 0;padding:.75rem 1rem;font-size:14px;color:var(--color-text-primary);font-family:var(--font-mono,monospace);margin:.5rem 0}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:.75rem 0}\n.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin:.75rem 0}\n.metric-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem;text-align:center}\n.metric-num{font-size:22px;font-weight:500;color:var(--color-text-primary)}\n.metric-label{font-size:12px;color:var(--color-text-secondary);margin-top:2px}\n.nav-row{display:flex;gap:.75rem;margin-top:1.25rem;align-items:center}\nbutton{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 18px;font-size:13px;cursor:pointer;color:var(--color-text-primary);transition:all .15s}\nbutton:hover{background:var(--color-background-secondary)}\nbutton.primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}\nbutton.primary:hover{opacity:.85}\n.check-btn{font-size:12px;padding:6px 14px}\n.ans-box{margin-top:.75rem;padding:.75rem 1rem;border-radius:var(--border-radius-md);display:none;font-size:13px;line-height:1.7}\n.ans-box.show{display:block}\n.ans-correct{background:var(--color-background-success);color:var(--color-text-success)}\n.ans-info{background:var(--color-background-info);color:var(--color-text-info)}\n.matrix-table{width:100%;border-collapse:collapse;font-size:13px;margin:.75rem 0}\n.matrix-table th,.matrix-table td{border:0.5px solid var(--color-border-secondary);padding:8px 10px;text-align:center}\n.matrix-table th{background:var(--color-background-secondary);font-weight:500}\n.matrix-table .tp{background:#d4edda;color:#155724}\n.matrix-table .tn{background:#d4edda;color:#155724}\n.matrix-table .fp{background:#f8d7da;color:#721c24}\n.matrix-table .fn{background:#f8d7da;color:#721c24}\n.quiz-option{display:block;width:100%;text-align:left;margin:.35rem 0;padding:8px 12px;border-radius:6px;font-size:13px;border:0.5px solid var(--color-border-secondary)}\n.quiz-option.correct{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}\n.quiz-option.wrong{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}\n.tree-box{background:var(--color-background-primary);border:1.5px solid var(--color-border-secondary);border-radius:8px;padding:8px 14px;font-size:12px;text-align:center;display:inline-block;min-width:90px}\n.tree-box.decision{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}\n.tree-box.terminal-0{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}\n.tree-box.terminal-1{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}\n.tree-container{display:flex;flex-direction:column;align-items:center;gap:0;margin:.75rem 0;overflow-x:auto}\n.tree-level{display:flex;justify-content:center;gap:10px;position:relative;margin-bottom:0}\n.tree-connector{width:100%;position:relative;height:28px;margin:0}\nsvg.conn{width:100%;height:28px;overflow:visible}\n.highlight-path{stroke:#2563eb;stroke-width:2;stroke-dasharray:5 3;animation:dash 1s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-16}}\n.step-indicator{font-size:12px;color:var(--color-text-tertiary);margin-left:auto}\n.tag{display:inline-block;font-size:11px;background:var(--color-background-secondary);color:var(--color-text-secondary);padding:1px 8px;border-radius:10px;margin:2px 3px}\n.divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:1rem 0}\n.interactive-calc{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem;margin:.75rem 0}\n.calc-row{display:flex;align-items:center;gap:8px;margin:.4rem 0;font-size:13px}\n.calc-input{width:70px;padding:4px 8px;border:0.5px solid var(--color-border-secondary);border-radius:6px;font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary);text-align:center}\n.calc-result{font-weight:500;color:var(--color-text-primary);min-width:60px;font-size:14px}\n<\/style>\n\n<div class=\"app\">\n  <div class=\"progress-bar\" id=\"progressBar\">\n    <div class=\"pb-step active\" onclick=\"goTo(0)\" title=\"课程概览\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(1)\" title=\"Data Partitioning\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(2)\" title=\"Confusion Matrix\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(3)\" title=\"Performance Measures\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(4)\" title=\"互动计算器\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(5)\" title=\"Classification Tree\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(6)\" title=\"Logistic Regression\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(7)\" title=\"例题精讲\"></div>\n    <div class=\"pb-step\" onclick=\"goTo(8)\" title=\"知识点测验\"></div>\n  </div>\n\n  <!-- Section 0: Overview -->\n  <div class=\"section active\" id=\"s0\">\n    <div class=\"card\">\n      <span class=\"badge badge-blue\">Week 9</span>\n      <h2>Predictive Data Mining</h2>\n      <p>本周学习如何用数据挖掘方法构建预测模型，判断分类结果（如客户是否流失、用户是否感兴趣）。</p>\n      <hr class=\"divider\">\n      <div class=\"grid3\">\n        <div class=\"metric-card\">\n          <div style=\"font-size:20px\">🗂️</div>\n          <div class=\"metric-label\" style=\"font-size:13px;font-weight:500;color:var(--color-text-primary);margin-top:4px\">Data Partitioning</div>\n          <div class=\"metric-label\">训练/验证/测试</div>\n        </div>\n        <div class=\"metric-card\">\n          <div style=\"font-size:20px\">📊</div>\n          <div class=\"metric-label\" style=\"font-size:13px;font-weight:500;color:var(--color-text-primary);margin-top:4px\">Performance Measures</div>\n          <div class=\"metric-label\">⭐⭐ 高频考点</div>\n        </div>\n        <div class=\"metric-card\">\n          <div style=\"font-size:20px\">🌳</div>\n          <div class=\"metric-label\" style=\"font-size:13px;font-weight:500;color:var(--color-text-primary);margin-top:4px\">Classification Tree</div>\n          <div class=\"metric-label\">⭐⭐ 高频考点</div>\n        </div>\n      </div>\n      <hr class=\"divider\">\n      <p style=\"font-size:13px;color:var(--color-text-secondary)\">📌 考试重点：Performance Measures（简答题必考）+ Classification Tree（读图+计算）</p>\n    </div>\n    <div class=\"nav-row\">\n      <button class=\"primary\" onclick=\"next()\">开始学习 →</button>\n    </div>\n  </div>\n\n  <!-- Section 1: Data Partitioning -->\n  <div class=\"section\" id=\"s1\">\n    <div class=\"card\">\n      <span class=\"badge badge-blue\">知识点 1</span>\n      <h2>Data Partitioning — 数据分区</h2>\n      <p>在建立预测模型前，需要将数据分成三部分，各有不同用途：</p>\n      <div class=\"grid3\">\n        <div class=\"card\" style=\"background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem;border:none\">\n          <div style=\"font-size:13px;font-weight:500;color:var(--color-text-primary)\">🏋️ Training Set</div>\n          <div style=\"font-size:12px;color:var(--color-text-secondary);margin-top:4px;line-height:1.6\">训练集 — 用来<strong>建立</strong>候选模型</div>\n        </div>\n        <div class=\"card\" style=\"background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem;border:none\">\n          <div style=\"font-size:13px;font-weight:500;color:var(--color-text-primary)\">✅ Validation Set</div>\n          <div style=\"font-size:12px;color:var(--color-text-secondary);margin-top:4px;line-height:1.6\">验证集 — 用来<strong>评估</strong>并选出最准确的模型</div>\n        </div>\n        <div class=\"card\" style=\"background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem;border:none\">\n          <div style=\"font-size:13px;font-weight:500;color:var(--color-text-primary)\">🧪 Testing Set</div>\n          <div style=\"font-size:12px;color:var(--color-text-secondary);margin-top:4px;line-height:1.6\">测试集 — 对<strong>最终模型</strong>评估其有效性</div>\n        </div>\n      </div>\n      <div class=\"formula\">Data Mining Process: Sampling → Preparation → Partitioning → Model Construction → Model Assessment</div>\n    </div>\n    <div class=\"card\">\n      <h3>🧠 快速检验</h3>\n      <p>验证集（Validation Set）的主要作用是什么？</p>\n      <button class=\"quiz-option\" onclick=\"revealQ1(this,'a')\">A. 用来训练初始模型</button>\n      <button class=\"quiz-option\" onclick=\"revealQ1(this,'b')\">B. 从候选模型中选出最准确的模型</button>\n      <button class=\"quiz-option\" onclick=\"revealQ1(this,'c')\">C. 评估最终模型在全新数据上的表现</button>\n      <div class=\"ans-box\" id=\"q1ans\"></div>\n    </div>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button class=\"primary\" onclick=\"next()\">下一节 →</button>\n      <span class=\"step-indicator\" id=\"si1\">2 / 9</span>\n    </div>\n  </div>\n\n  <!-- Section 2: Confusion Matrix -->\n  <div class=\"section\" id=\"s2\">\n    <div class=\"card\">\n      <span class=\"badge badge-amber\">⭐ 重点</span>\n      <h2>Confusion Matrix — 混淆矩阵</h2>\n      <p>混淆矩阵展示模型预测对/错的情况，是所有 Performance Measures 的计算基础。</p>\n      <table class=\"matrix-table\">\n        <tr>\n          <th colspan=\"2\" rowspan=\"2\" style=\"background:var(--color-background-secondary)\"></th>\n          <th colspan=\"2\" style=\"background:var(--color-background-secondary)\">预测值 (Predicted)</th>\n        </tr>\n        <tr>\n          <th>Predicted = 1</th>\n          <th>Predicted = 0</th>\n        </tr>\n        <tr>\n          <th rowspan=\"2\" style=\"background:var(--color-background-secondary);writing-mode:vertical-lr;text-align:center;padding:8px\">实际值</th>\n          <th>Actual = 1</th>\n          <td class=\"tp\"><strong>TP</strong><br><span style=\"font-size:11px\">True Positive<br>正确预测为1</span></td>\n          <td class=\"fn\"><strong>FN</strong><br><span style=\"font-size:11px\">False Negative<br>误判为0</span></td>\n        </tr>\n        <tr>\n          <th>Actual = 0</th>\n          <td class=\"fp\"><strong>FP</strong><br><span style=\"font-size:11px\">False Positive<br>误判为1</span></td>\n          <td class=\"tn\"><strong>TN</strong><br><span style=\"font-size:11px\">True Negative<br>正确预测为0</span></td>\n        </tr>\n      </table>\n      <div class=\"grid2\">\n        <div style=\"background:var(--color-background-danger);border-radius:8px;padding:.75rem;font-size:13px\">\n          <strong style=\"color:var(--color-text-danger)\">False Positive (FP)</strong>\n          <p style=\"color:var(--color-text-danger);font-size:12px;margin-top:4px\">实际为 Class 0，却预测为 Class 1<br>（把\"没兴趣\"预测成\"有兴趣\"）</p>\n        </div>\n        <div style=\"background:var(--color-background-danger);border-radius:8px;padding:.75rem;font-size:13px\">\n          <strong style=\"color:var(--color-text-danger)\">False Negative (FN)</strong>\n          <p style=\"color:var(--color-text-danger);font-size:12px;margin-top:4px\">实际为 Class 1，却预测为 Class 0<br>（把\"有兴趣\"预测成\"没兴趣\"）</p>\n        </div>\n      </div>\n    </div>\n    <div class=\"card\">\n      <h3>📝 记忆口诀</h3>\n      <p style=\"font-size:13px\"><span class=\"tag\">TP</span> 正确预测正例 ✓</p>\n      <p style=\"font-size:13px\"><span class=\"tag\">TN</span> 正确预测负例 ✓</p>\n      <p style=\"font-size:13px\"><span class=\"tag\">FP</span> 预测1但实际是0 — 误报 ✗</p>\n      <p style=\"font-size:13px\"><span class=\"tag\">FN</span> 预测0但实际是1 — 漏报 ✗</p>\n    </div>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button class=\"primary\" onclick=\"next()\">下一节 →</button>\n      <span class=\"step-indicator\">3 / 9</span>\n    </div>\n  </div>\n\n  <!-- Section 3: Performance Measures -->\n  <div class=\"section\" id=\"s3\">\n    <div class=\"card\">\n      <span class=\"badge badge-red\">⭐⭐ 必考</span>\n      <h2>Performance Measures 公式速查</h2>\n      <p style=\"font-size:13px;color:var(--color-text-secondary)\">以下公式用 TP, TN, FP, FN 表示，考试中直接代入即可。</p>\n    </div>\n    <div class=\"card\">\n      <h3>① Overall Error Rate — 总体错误率</h3>\n      <div class=\"formula\">Error Rate = (FP + FN) / (TP + TN + FP + FN)</div>\n      <p style=\"font-size:12px\">含义：所有预测中，预测错误的比例</p>\n    </div>\n    <div class=\"card\">\n      <h3>② Accuracy — 准确率</h3>\n      <div class=\"formula\">Accuracy = 1 − Overall Error Rate = (TP + TN) / Total</div>\n      <p style=\"font-size:12px\">含义：所有预测中，预测正确的比例</p>\n    </div>\n    <div class=\"card\">\n      <h3>③ Class 1 Error Rate</h3>\n      <div class=\"formula\">Class 1 Error Rate = FN / (TP + FN)</div>\n      <p style=\"font-size:12px\">含义：在所有<strong>实际为1</strong>的数据中，预测错了的比例（漏报率）</p>\n    </div>\n    <div class=\"card\">\n      <h3>④ Class 0 Error Rate</h3>\n      <div class=\"formula\">Class 0 Error Rate = FP / (TN + FP)</div>\n      <p style=\"font-size:12px\">含义：在所有<strong>实际为0</strong>的数据中，预测错了的比例（误报率）</p>\n    </div>\n    <div class=\"card\">\n      <h3>⑤ Sensitivity（敏感性 / Recall）</h3>\n      <div class=\"formula\">Sensitivity = TP / (TP + FN)</div>\n      <p style=\"font-size:12px\">含义：在所有实际为1中，正确预测为1的比例 ← <strong>= 1 − Class 1 Error Rate</strong></p>\n    </div>\n    <div class=\"card\">\n      <h3>⑥ Specificity（特异性）</h3>\n      <div class=\"formula\">Specificity = TN / (TN + FP)</div>\n      <p style=\"font-size:12px\">含义：在所有实际为0中，正确预测为0的比例 ← <strong>= 1 − Class 0 Error Rate</strong></p>\n    </div>\n    <div class=\"card\">\n      <h3>⑦ Precision（精确率）</h3>\n      <div class=\"formula\">Precision = TP / (TP + FP)</div>\n      <p style=\"font-size:12px\">含义：在所有<strong>预测为1</strong>的数据中，实际也是1的比例</p>\n    </div>\n    <div class=\"card\">\n      <h3>⑧ F1 Score</h3>\n      <div class=\"formula\">F1 = (2 × Precision × Sensitivity) / (Precision + Sensitivity)</div>\n      <p style=\"font-size:12px\">含义：Precision 和 Sensitivity 的调和平均数，越接近1越好（范围0–1）</p>\n    </div>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button class=\"primary\" onclick=\"next()\">互动练习 →</button>\n      <span class=\"step-indicator\">4 / 9</span>\n    </div>\n  </div>\n\n  <!-- Section 4: Interactive Calculator -->\n  <div class=\"section\" id=\"s4\">\n    <div class=\"card\">\n      <span class=\"badge badge-green\">互动练习</span>\n      <h2>Performance Measures 计算器</h2>\n      <p>输入混淆矩阵四个值，自动计算所有指标：</p>\n      <div class=\"interactive-calc\">\n        <div class=\"grid2\" style=\"gap:.5rem\">\n          <div class=\"calc-row\" style=\"flex-direction:column;align-items:flex-start;gap:4px\">\n            <label style=\"font-size:12px;color:var(--color-text-secondary)\">TP (True Positive)</label>\n            <input class=\"calc-input\" id=\"tp\" type=\"number\" value=\"18\" oninput=\"calcAll()\" style=\"width:100%\">\n          </div>\n          <div class=\"calc-row\" style=\"flex-direction:column;align-items:flex-start;gap:4px\">\n            <label style=\"font-size:12px;color:var(--color-text-secondary)\">TN (True Negative)</label>\n            <input class=\"calc-input\" id=\"tn\" type=\"number\" value=\"18\" oninput=\"calcAll()\" style=\"width:100%\">\n          </div>\n          <div class=\"calc-row\" style=\"flex-direction:column;align-items:flex-start;gap:4px\">\n            <label style=\"font-size:12px;color:var(--color-text-secondary)\">FP (False Positive)</label>\n            <input class=\"calc-input\" id=\"fp\" type=\"number\" value=\"2\" oninput=\"calcAll()\" style=\"width:100%\">\n          </div>\n          <div class=\"calc-row\" style=\"flex-direction:column;align-items:flex-start;gap:4px\">\n            <label style=\"font-size:12px;color:var(--color-text-secondary)\">FN (False Negative)</label>\n            <input class=\"calc-input\" id=\"fn\" type=\"number\" value=\"2\" oninput=\"calcAll()\" style=\"width:100%\">\n          </div>\n        </div>\n      </div>\n      <div class=\"grid2\" id=\"calc-results\" style=\"margin-top:.75rem\"></div>\n    </div>\n    <div class=\"card\">\n      <h3>📌 图表解读记忆口诀</h3>\n      <p style=\"font-size:13px\"><span class=\"tag\">Cumulative Lift Chart</span> 高于红色基线 = 比随机选择表现更好</p>\n      <p style=\"font-size:13px\"><span class=\"tag\">Decile-wise Lift Chart</span> 十分位越高，升力值越高</p>\n      <p style=\"font-size:13px\"><span class=\"tag\">ROC Curve</span> 曲线越靠左上角，分类性能越好</p>\n    </div>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button class=\"primary\" onclick=\"next()\">下一节 →</button>\n      <span class=\"step-indicator\">5 / 9</span>\n    </div>\n  </div>\n\n  <!-- Section 5: Classification Tree -->\n  <div class=\"section\" id=\"s5\">\n    <div class=\"card\">\n      <span class=\"badge badge-amber\">⭐⭐ 重点</span>\n      <h2>Classification Trees — 分类树</h2>\n      <p>分类树将数据集<strong>逐步分割</strong>成越来越小、越来越同质的子集，最终在叶节点（terminal node）给出分类结果。</p>\n      <hr class=\"divider\">\n      <h3>🌳 Telecom 案例树（简化版）</h3>\n      <p style=\"font-size:12px;color:var(--color-text-secondary);margin-bottom:.75rem\">判断客户是否会 Churn（流失）</p>\n      <div class=\"tree-container\">\n        <div class=\"tree-level\">\n          <div class=\"tree-box decision\" id=\"tn1\">D1: CustServCalls<br>&gt; 3.5?</div>\n        </div>\n        <svg class=\"conn\" viewBox=\"0 0 400 28\" style=\"width:400px\">\n          <line x1=\"200\" y1=\"0\" x2=\"80\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <line x1=\"200\" y1=\"0\" x2=\"320\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <text x=\"110\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">No (&lt;=3.5)</text>\n          <text x=\"290\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">Yes (&gt;3.5)</text>\n        </svg>\n        <div class=\"tree-level\">\n          <div class=\"tree-box decision\" id=\"tn2\" style=\"margin-right:40px\">D2: DayMins<br>&gt; 220.1?</div>\n          <div class=\"tree-box terminal-1\" id=\"tt1\" style=\"margin-left:40px\">Terminal 1<br>🔴 Churn</div>\n        </div>\n        <svg class=\"conn\" viewBox=\"0 0 400 28\" style=\"width:400px\">\n          <line x1=\"100\" y1=\"0\" x2=\"50\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <line x1=\"100\" y1=\"0\" x2=\"160\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <text x=\"40\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\">No</text>\n          <text x=\"145\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\">Yes</text>\n        </svg>\n        <div class=\"tree-level\" style=\"justify-content:flex-start;padding-left:10px\">\n          <div class=\"tree-box decision\" id=\"tn3\" style=\"margin-right:16px;font-size:11px\">D3: Contract<br>Renewed?</div>\n          <div class=\"tree-box decision\" id=\"tn4\" style=\"font-size:11px\">D4: Monthly<br>&gt; $59.15?</div>\n        </div>\n        <svg class=\"conn\" viewBox=\"0 0 400 28\" style=\"width:400px\">\n          <line x1=\"80\" y1=\"0\" x2=\"40\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <line x1=\"80\" y1=\"0\" x2=\"120\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <line x1=\"210\" y1=\"0\" x2=\"190\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <line x1=\"210\" y1=\"0\" x2=\"240\" y2=\"28\" stroke=\"var(--color-text-secondary)\" stroke-width=\"1\"/>\n          <text x=\"30\" y=\"22\" font-size=\"10\" fill=\"var(--color-text-secondary)\">No</text>\n          <text x=\"110\" y=\"22\" font-size=\"10\" fill=\"var(--color-text-secondary)\">Yes</text>\n          <text x=\"178\" y=\"22\" font-size=\"10\" fill=\"var(--color-text-secondary)\">No</text>\n          <text x=\"228\" y=\"22\" font-size=\"10\" fill=\"var(--color-text-secondary)\">Yes</text>\n        </svg>\n        <div class=\"tree-level\" style=\"justify-content:flex-start;padding-left:0;gap:6px\">\n          <div class=\"tree-box terminal-1\" style=\"font-size:11px;min-width:75px\">T1<br>🔴Churn</div>\n          <div class=\"tree-box terminal-0\" style=\"font-size:11px;min-width:75px\">T0<br>🟢No Churn</div>\n          <div class=\"tree-box terminal-0\" style=\"font-size:11px;min-width:75px\">T0<br>🟢No Churn</div>\n          <div class=\"tree-box terminal-1\" style=\"font-size:11px;min-width:75px;margin-left:4px\">T1*<br>🔴Churn</div>\n        </div>\n      </div>\n      <p style=\"font-size:11px;color:var(--color-text-tertiary);margin-top:.5rem\">*T1*: DayMins &gt; 220.1 + Monthly &gt; $59.15 + DataUse &lt; 1.92GB → Churn</p>\n    </div>\n    <div class=\"card\">\n      <h3>📖 读树方法：从根节点开始往下走</h3>\n      <p style=\"font-size:13px\">每次遇到决策节点 → 根据客户数据选择分支 → 直到到达叶节点（Terminal）→ 得到分类结果</p>\n    </div>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button class=\"primary\" onclick=\"next()\">下一节 →</button>\n      <span class=\"step-indicator\">6 / 9</span>\n    </div>\n  </div>\n\n  <!-- Section 6: Logistic Regression -->\n  <div class=\"section\" id=\"s6\">\n    <div class=\"card\">\n      <span class=\"badge badge-blue\">知识点 3</span>\n      <h2>Logistic Regression — 逻辑回归</h2>\n      <p>逻辑回归尝试将<strong>二元分类结果</strong>（y = 0 或 1）表示为解释变量的线性函数。</p>\n      <div class=\"formula\">Log odds of Y=1 = β₀ + β₁X₁ + β₂X₂ + ... + βₙXₙ</div>\n      <p style=\"font-size:13px\">每个解释变量的系数 β 表示该变量对结果的影响方向和大小：</p>\n      <div style=\"background:var(--color-background-secondary);border-radius:8px;padding:.75rem;font-size:13px;margin:.5rem 0\">\n        <div style=\"margin:.3rem 0\">• 系数为<strong>正</strong> → 该变量增加时，Y=1 的概率升高</div>\n        <div style=\"margin:.3rem 0\">• 系数为<strong>负</strong> → 该变量增加时，Y=1 的概率降低</div>\n      </div>\n      <hr class=\"divider\">\n      <h3>案例：Churn 预测模型</h3>\n      <div class=\"formula\" style=\"font-size:12px\">Log odds(churn) = −4.86 − 2.05×ContractRenewal − 0.94×DataPlan + 0.50×CustServCalls + 0.01×DayMins + 0.14×OverageFee + 0.09×RoamMins</div>\n      <p style=\"font-size:12px;margin-top:.5rem\">解读：续签合约（ContractRenewal=1）使流失概率大幅降低（系数 −2.05）；客服通话次数越多，流失概率越高（系数 +0.50）</p>\n    </div>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button class=\"primary\" onclick=\"next()\">例题精讲 →</button>\n      <span class=\"step-indicator\">7 / 9</span>\n    </div>\n  </div>\n\n  <!-- Section 7: Example Questions -->\n  <div class=\"section\" id=\"s7\">\n    <div class=\"card\">\n      <span class=\"badge badge-amber\">例题精讲</span>\n      <h2>例题 1 — Oollama 约会网站（Confusion Matrix）</h2>\n      <p style=\"font-size:13px\">混淆矩阵如下（共40条记录）：TP=18, TN=18, FP=2, FN=2</p>\n      <table class=\"matrix-table\">\n        <tr><th></th><th>Predicted 1</th><th>Predicted 0</th><th>Row Total</th></tr>\n        <tr><th>Actual 1</th><td class=\"tp\">18 (TP)</td><td class=\"fn\">2 (FN)</td><td>20</td></tr>\n        <tr><th>Actual 0</th><td class=\"fp\">2 (FP)</td><td class=\"tn\">18 (TN)</td><td>20</td></tr>\n        <tr><th>Total</th><td>20</td><td>20</td><td>40</td></tr>\n      </table>\n    </div>\n    <div class=\"card\" id=\"eq1\" style=\"cursor:pointer\" onclick=\"toggleEx('eq1c')\">\n      <h3>Q1: Overall Error Rate ▾</h3>\n      <div class=\"ans-box ans-info show\" id=\"eq1c\" style=\"display:none\">\n        <strong>= (FP + FN) / Total = (2+2)/40 = 0.10 = 10%</strong><br>\n        解读：所有40条记录中，预测错误的概率为10%（即4条预测有误）\n      </div>\n    </div>\n    <div class=\"card\" id=\"eq2\" style=\"cursor:pointer\" onclick=\"toggleEx('eq2c')\">\n      <h3>Q2: Accuracy ▾</h3>\n      <div class=\"ans-box ans-info show\" id=\"eq2c\" style=\"display:none\">\n        <strong>= 1 − 10% = 90%</strong><br>\n        解读：36条记录被正确预测\n      </div>\n    </div>\n    <div class=\"card\" id=\"eq3\" style=\"cursor:pointer\" onclick=\"toggleEx('eq3c')\">\n      <h3>Q3: Class 1 Error Rate ▾</h3>\n      <div class=\"ans-box ans-info show\" id=\"eq3c\" style=\"display:none\">\n        <strong>= FN / (TP+FN) = 2/(18+2) = 0.10 = 10%</strong><br>\n        解读：在所有实际感兴趣的20条中，预测成不感兴趣的概率为10%\n      </div>\n    </div>\n    <div class=\"card\" id=\"eq4\" style=\"cursor:pointer\" onclick=\"toggleEx('eq4c')\">\n      <h3>Q4: Sensitivity ▾</h3>\n      <div class=\"ans-box ans-info show\" id=\"eq4c\" style=\"display:none\">\n        <strong>= TP / (TP+FN) = 18/(18+2) = 0.90 = 90%</strong><br>\n        解读：在所有实际感兴趣的数据中，正确预测为感兴趣的概率是90%\n      </div>\n    </div>\n    <div class=\"card\" id=\"eq5\" style=\"cursor:pointer\" onclick=\"toggleEx('eq5c')\">\n      <h3>Q5: Precision ▾</h3>\n      <div class=\"ans-box ans-info show\" id=\"eq5c\" style=\"display:none\">\n        <strong>= TP / (TP+FP) = 18/(18+2) = 0.90 = 90%</strong><br>\n        解读：在所有预测为感兴趣的20条中，她实际也感兴趣的概率是90%\n      </div>\n    </div>\n    <div class=\"card\" id=\"eq6\" style=\"cursor:pointer\" onclick=\"toggleEx('eq6c')\">\n      <h3>Q6: F1 Score ▾</h3>\n      <div class=\"ans-box ans-info show\" id=\"eq6c\" style=\"display:none\">\n        <strong>= 2×Precision×Sensitivity / (Precision+Sensitivity) = 2×0.9×0.9/(0.9+0.9) = 0.90</strong><br>\n        解读：Precision和Sensitivity的调和平均，越接近1越好\n      </div>\n    </div>\n    <p style=\"font-size:12px;color:var(--color-text-secondary);margin-top:.25rem\">👆 点击各题目展开/收起答案</p>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button class=\"primary\" onclick=\"next()\">去做测验 →</button>\n      <span class=\"step-indicator\">8 / 9</span>\n    </div>\n  </div>\n\n  <!-- Section 8: Quiz -->\n  <div class=\"section\" id=\"s8\">\n    <div class=\"card\">\n      <span class=\"badge badge-green\">知识测验</span>\n      <h2>综合测验 — 4题</h2>\n      <p style=\"font-size:13px;color:var(--color-text-secondary)\">测试前先尝试自己作答，再点击查看解析</p>\n    </div>\n    <div class=\"card\">\n      <h3>Q1. 混淆矩阵中，FP 是指什么？</h3>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa1','a','b')\">A. 实际为1，预测正确为1</button>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa1','b','b')\">B. 实际为0，却预测为1（误报）</button>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa1','c','b')\">C. 实际为1，却预测为0（漏报）</button>\n      <div class=\"ans-box\" id=\"qa1\"></div>\n    </div>\n    <div class=\"card\">\n      <h3>Q2. TP=30, TN=40, FP=10, FN=20 时，Sensitivity 是多少？</h3>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa2','a','a')\">A. 30/(30+20) = 60%</button>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa2','b','a')\">B. 40/(40+10) = 80%</button>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa2','c','a')\">C. 30/(30+10) = 75%</button>\n      <div class=\"ans-box\" id=\"qa2\"></div>\n    </div>\n    <div class=\"card\">\n      <h3>Q3. Precision 的分母是什么？</h3>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa3','a','a')\">A. TP + FP（所有预测为1的）</button>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa3','b','a')\">B. TP + FN（所有实际为1的）</button>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa3','c','a')\">C. TN + FP（所有实际为0的）</button>\n      <div class=\"ans-box\" id=\"qa3\"></div>\n    </div>\n    <div class=\"card\">\n      <h3>Q4. 某客户有2次客服通话、230分钟通话时间、$53月费、1.5GB流量。按课堂分类树，该客户是 Churner 吗？</h3>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa4','a','b')\">A. 是 Churner（结果为1）</button>\n      <button class=\"quiz-option\" onclick=\"ansQ('qa4','b','b')\">B. 不是 Churner（结果为0）</button>\n      <div class=\"ans-box\" id=\"qa4\"></div>\n    </div>\n    <div class=\"card\" style=\"background:var(--color-background-secondary)\">\n      <h3>🏆 全部完成！</h3>\n      <p style=\"font-size:13px\">Week 9 核心内容已全部覆盖。<br>如需深入练习某个知识点，点击下方进度条回到对应章节。</p>\n      \n      \n    </div>\n    <div class=\"nav-row\">\n      <button onclick=\"prev()\">← 上一节</button>\n      <button onclick=\"goTo(0)\">🔄 回到开头</button>\n      <span class=\"step-indicator\">9 / 9</span>\n    </div>\n  </div>\n</div>\n\n<script>\nlet cur=0,total=9;\nfunction goTo(n){\n  document.getElementById('s'+cur).classList.remove('active');\n  document.querySelectorAll('.pb-step')[cur].classList.remove('active');\n  document.querySelectorAll('.pb-step')[cur].classList.add('done');\n  cur=n;\n  document.getElementById('s'+cur).classList.add('active');\n  document.querySelectorAll('.pb-step')[cur].classList.remove('done');\n  document.querySelectorAll('.pb-step')[cur].classList.add('active');\n  if(cur===4) calcAll();\n}\nfunction next(){if(cur<total-1)goTo(cur+1);}\nfunction prev(){if(cur>0)goTo(cur-1);}\nfunction revealQ1(btn,ans){\n  var correct=ans==='b';\n  btn.classList.add(correct?'correct':'wrong');\n  var box=document.getElementById('q1ans');\n  box.className='ans-box show '+(correct?'ans-correct':'ans-info');\n  box.innerHTML=correct?'✅ 正确！Validation Set 用于从多个候选模型中选出最准确的那个。':'❌ 不对。<br>A是Training Set的作用，C是Testing Set的作用。<br>Validation Set 的作用是<strong>评估候选模型，选出最准确的</strong>。';\n}\nfunction ansQ(id,chosen,correct){\n  var box=document.getElementById(id);\n  var btns=box.previousElementSibling;\n  var isRight=chosen===correct;\n  var explanations={\n    'qa1':{'correct':'B','text':'FP = False Positive：实际为Class 0（负例），却被预测为Class 1（正例）。常见误报场景。'},\n    'qa2':{'correct':'A','text':'Sensitivity = TP/(TP+FN) = 30/(30+20) = 60%。注意分母是所有实际为1的数据。'},\n    'qa3':{'correct':'A','text':'Precision = TP/(TP+FP)，分母是所有被预测为1的数据（无论实际如何）。'},\n    'qa4':{'correct':'B','text':'D1: 2次通话 < 3.5 → 向左 D2: 230分钟 > 220.1 → 向右 D4: $53 < $59.15 → 向左 → Terminal 0 不是Churner'}\n  };\n  var exp=explanations[id];\n  var allOpts=document.querySelectorAll('#'+id).length>0?box.parentElement.querySelectorAll('.quiz-option'):[];\n  box.className='ans-box show '+(isRight?'ans-correct':'ans-info');\n  box.innerHTML=(isRight?'✅ 正确！':''+'❌ 选'+chosen.toUpperCase()+'不对，正确答案是 '+exp.correct+'。')+' '+exp.text;\n}\nfunction toggleEx(id){\n  var el=document.getElementById(id);\n  el.style.display=el.style.display==='none'?'block':'none';\n}\nfunction calcAll(){\n  var tp=parseFloat(document.getElementById('tp').value)||0;\n  var tn=parseFloat(document.getElementById('tn').value)||0;\n  var fp=parseFloat(document.getElementById('fp').value)||0;\n  var fn=parseFloat(document.getElementById('fn').value)||0;\n  var tot=tp+tn+fp+fn;\n  if(tot===0)return;\n  var err=((fp+fn)/tot*100).toFixed(1);\n  var acc=(100-parseFloat(err)).toFixed(1);\n  var c1e=(tp+fn>0?(fn/(tp+fn)*100).toFixed(1):'—');\n  var c0e=(tn+fp>0?(fp/(tn+fp)*100).toFixed(1):'—');\n  var sen=(tp+fn>0?(tp/(tp+fn)*100).toFixed(1):'—');\n  var spe=(tn+fp>0?(tn/(tn+fp)*100).toFixed(1):'—');\n  var pre=(tp+fp>0?(tp/(tp+fp)*100).toFixed(1):'—');\n  var f1=((2*tp+fp+fn)>0?(2*tp/(2*tp+fp+fn)*100).toFixed(1):'—');\n  var metrics=[\n    ['Error Rate',err+'%'],['Accuracy',acc+'%'],\n    ['Class 1 Err',c1e+'%'],['Class 0 Err',c0e+'%'],\n    ['Sensitivity',sen+'%'],['Specificity',spe+'%'],\n    ['Precision',pre+'%'],['F1 Score',f1+'%']\n  ];\n  var html='';\n  metrics.forEach(function(m){\n    html+='<div class=\"metric-card\"><div class=\"metric-num\">'+m[1]+'</div><div class=\"metric-label\">'+m[0]+'</div></div>';\n  });\n  document.getElementById('calc-results').innerHTML=html;\n}\ncalcAll();\n<\/script>\n"}, {"id": "week9_full_exam_question", "week": "Week 9", "title": "Full Exam Practice", "subtitle": "完整考题练习 · BankChurn", "color": "#10B981", "content": "\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n.app{padding:1rem 0;font-family:var(--font-sans,sans-serif);max-width:680px}\nh2{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:.6rem}\nh3{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:.4rem}\np,li{font-size:13px;color:var(--color-text-secondary);line-height:1.75}\n.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:.85rem}\n.badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:12px;font-weight:500;margin-bottom:.5rem}\n.badge-red{background:var(--color-background-danger);color:var(--color-text-danger)}\n.badge-blue{background:var(--color-background-info);color:var(--color-text-info)}\n.badge-amber{background:var(--color-background-warning);color:var(--color-text-warning)}\n.badge-green{background:var(--color-background-success);color:var(--color-text-success)}\n.badge-purple{background:#EEEDFE;color:#534AB7}\ntable{width:100%;border-collapse:collapse;font-size:13px;margin:.6rem 0}\nth,td{border:0.5px solid var(--color-border-secondary);padding:7px 10px;text-align:center}\nth{background:var(--color-background-secondary);font-weight:500}\n.tp{background:#d4edda;color:#155724;font-weight:500}\n.tn{background:#d4edda;color:#155724;font-weight:500}\n.fp{background:#f8d7da;color:#721c24;font-weight:500}\n.fn{background:#f8d7da;color:#721c24;font-weight:500}\n.qblock{border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:.85rem 1rem;margin:.5rem 0;background:var(--color-background-primary)}\n.qblock h3{margin-bottom:.35rem}\n.ans-area{width:100%;margin-top:.5rem;border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:8px;font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary);resize:vertical;min-height:44px;font-family:var(--font-sans,sans-serif)}\n.reveal-btn{margin-top:.5rem;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--color-text-secondary)}\n.reveal-btn:hover{background:var(--color-background-primary);color:var(--color-text-primary)}\n.ans-reveal{display:none;margin-top:.6rem;background:var(--color-background-info);border-left:3px solid var(--color-border-info);border-radius:0 6px 6px 0;padding:.75rem 1rem;font-size:13px;color:var(--color-text-info);line-height:1.75}\n.ans-reveal.show{display:block}\n.formula-inline{background:var(--color-background-secondary);border-radius:4px;padding:1px 6px;font-family:var(--font-mono,monospace);font-size:12px;color:var(--color-text-primary)}\n.tree-row{display:flex;justify-content:center;gap:8px;margin:.3rem 0}\n.tbox{border-radius:8px;padding:7px 10px;font-size:11px;text-align:center;min-width:95px;line-height:1.4;border:1.5px solid transparent}\n.tbox.dec{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}\n.tbox.t0{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}\n.tbox.t1{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}\n.tbox.highlight{outline:3px solid #f59e0b;outline-offset:2px}\n.conn-svg{display:block;margin:0 auto}\n.step-path{display:none;margin-top:.35rem;font-size:12px;line-height:1.8;color:var(--color-text-secondary)}\n.step-path.show{display:block}\n.step-item{padding:3px 8px;border-radius:4px;margin:.15rem 0;background:var(--color-background-secondary)}\n.step-item.active{background:var(--color-background-warning);color:var(--color-text-warning)}\n.tip{background:var(--color-background-secondary);border-radius:6px;padding:.6rem .85rem;font-size:12px;color:var(--color-text-secondary);margin:.5rem 0;border-left:2px solid var(--color-border-secondary)}\n.tip strong{color:var(--color-text-primary)}\n.tab-row{display:flex;gap:4px;margin-bottom:.75rem;border-bottom:0.5px solid var(--color-border-tertiary);padding-bottom:.5rem}\n.tab{padding:5px 14px;font-size:12px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--color-text-secondary);border:none;background:none}\n.tab.on{background:var(--color-text-primary);color:var(--color-background-primary)}\n.part{display:none}.part.on{display:block}\n.score-pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--color-background-secondary);color:var(--color-text-secondary);margin-left:6px}\n<\/style>\n\n<div class=\"app\">\n\n<div class=\"card\">\n  <span class=\"badge badge-red\">模拟考题 · 综合题</span>\n  <h2>BankChurn Analytics — 银行客户流失预测</h2>\n  <p>某银行希望预测客户是否会关闭账户（Churn=1 为流失，Churn=0 为未流失）。数据团队构建了分类模型，并生成了以下分类树和混淆矩阵。</p>\n</div>\n\n<!-- Tabs -->\n<div class=\"tab-row\">\n  <button class=\"tab on\" onclick=\"switchTab('partA')\">Part A — Confusion Matrix <span class=\"score-pill\">6题</span></button>\n  <button class=\"tab\" onclick=\"switchTab('partB')\">Part B — Classification Tree <span class=\"score-pill\">2题</span></button>\n</div>\n\n<!-- PART A -->\n<div class=\"part on\" id=\"partA\">\n  <div class=\"card\">\n    <span class=\"badge badge-blue\">背景资料</span>\n    <h3>混淆矩阵（共 200 位客户）</h3>\n    <table>\n      <tr><th colspan=\"2\" rowspan=\"2\" style=\"background:var(--color-background-secondary)\"></th><th colspan=\"2\">预测值 (Predicted)</th></tr>\n      <tr><th>Predicted Churn = 1</th><th>Predicted Churn = 0</th></tr>\n      <tr><th rowspan=\"2\" style=\"background:var(--color-background-secondary)\">实际值</th><th>Actual Churn = 1</th><td class=\"tp\">TP = 45</td><td class=\"fn\">FN = 15</td></tr>\n      <tr><th>Actual Churn = 0</th><td class=\"fp\">FP = 20</td><td class=\"tn\">TN = 120</td></tr>\n    </table>\n    <div class=\"tip\"><strong>提示：</strong> Total = 45 + 15 + 20 + 120 = <strong>200</strong></div>\n  </div>\n\n  <!-- Q1 -->\n  <div class=\"qblock\">\n    <h3>Q1. Calculate the overall error rate. <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[2 marks]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"在此写出你的计算过程...\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('a1')\">查看答案与解析</button>\n    <div class=\"ans-reveal\" id=\"a1\">\n      <strong>公式：</strong><span class=\"formula-inline\">Error Rate = (FP + FN) / Total</span><br>\n      <strong>代入：</strong> = (20 + 15) / 200 = 35 / 200 = <strong>0.175 = 17.5%</strong><br><br>\n      <strong>📝 写法模板（考试直接套用）：</strong><br>\n      Overall error rate = (FP + FN) / (TP + TN + FP + FN) = (20 + 15) / 200 = <strong>17.5%</strong><br>\n      Interpret: 在200位客户中，有35位预测有误。\n    </div>\n  </div>\n\n  <!-- Q2 -->\n  <div class=\"qblock\">\n    <h3>Q2. Calculate the accuracy of the model. <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[1 mark]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"在此写出你的计算过程...\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('a2')\">查看答案与解析</button>\n    <div class=\"ans-reveal\" id=\"a2\">\n      <strong>公式：</strong><span class=\"formula-inline\">Accuracy = 1 − Error Rate</span><br>\n      <strong>代入：</strong> = 1 − 0.175 = <strong>0.825 = 82.5%</strong><br><br>\n      <strong>📝 考试答题规范：</strong><br>\n      Accuracy = 1 − 17.5% = <strong>82.5%</strong><br>\n      Interpret: 200位客户中，165位被正确分类。\n    </div>\n  </div>\n\n  <!-- Q3 -->\n  <div class=\"qblock\">\n    <h3>Q3. Calculate the Class 1 error rate and interpret. <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[2 marks]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"在此写出你的计算过程和interpretation...\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('a3')\">查看答案与解析</button>\n    <div class=\"ans-reveal\" id=\"a3\">\n      <strong>公式：</strong><span class=\"formula-inline\">Class 1 Error Rate = FN / (TP + FN)</span><br>\n      <strong>代入：</strong> = 15 / (45 + 15) = 15 / 60 = <strong>0.25 = 25%</strong><br><br>\n      <strong>📝 Interpretation（必须写）：</strong><br>\n      在所有实际上会流失的60位客户中，有25%被模型错误地预测为不会流失。<br><br>\n      <span style=\"font-size:12px;color:var(--color-text-info)\">⚠️ 常见错误：分母写成 Total(200)，正确分母是<strong>所有实际为1的行</strong>（TP+FN）</span>\n    </div>\n  </div>\n\n  <!-- Q4 -->\n  <div class=\"qblock\">\n    <h3>Q4. Calculate the sensitivity and interpret. <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[2 marks]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"在此写出你的计算过程和interpretation...\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('a4')\">查看答案与解析</button>\n    <div class=\"ans-reveal\" id=\"a4\">\n      <strong>公式：</strong><span class=\"formula-inline\">Sensitivity = TP / (TP + FN)</span><br>\n      <strong>代入：</strong> = 45 / (45 + 15) = 45 / 60 = <strong>0.75 = 75%</strong><br><br>\n      <strong>📝 Interpretation：</strong><br>\n      在所有实际会流失的60位客户中，模型正确识别出了75%（即45位）。<br><br>\n      <span style=\"font-size:12px;color:var(--color-text-info)\">💡 关系：Sensitivity = 1 − Class 1 Error Rate = 1 − 25% = 75% ✓（可验证答案）</span>\n    </div>\n  </div>\n\n  <!-- Q5 -->\n  <div class=\"qblock\">\n    <h3>Q5. Calculate the precision and interpret. <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[2 marks]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"在此写出你的计算过程和interpretation...\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('a5')\">查看答案与解析</button>\n    <div class=\"ans-reveal\" id=\"a5\">\n      <strong>公式：</strong><span class=\"formula-inline\">Precision = TP / (TP + FP)</span><br>\n      <strong>代入：</strong> = 45 / (45 + 20) = 45 / 65 ≈ <strong>0.692 = 69.2%</strong><br><br>\n      <strong>📝 Interpretation：</strong><br>\n      在模型预测为会流失的65位客户中，有69.2%实际上确实会流失。<br><br>\n      <span style=\"font-size:12px;color:var(--color-text-info)\">⚠️ 易混淆：Precision 分母是<strong>所有预测为1的列</strong>（TP+FP），不是所有实际为1的行</span>\n    </div>\n  </div>\n\n  <!-- Q6 -->\n  <div class=\"qblock\">\n    <h3>Q6. Calculate the F1 Score. <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[2 marks]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"在此写出你的计算过程...\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('a6')\">查看答案与解析</button>\n    <div class=\"ans-reveal\" id=\"a6\">\n      <strong>公式：</strong><span class=\"formula-inline\">F1 = 2×Precision×Sensitivity / (Precision + Sensitivity)</span><br>\n      <strong>代入：</strong> = 2 × 0.692 × 0.75 / (0.692 + 0.75)<br>\n      = 2 × 0.519 / 1.442 = 1.038 / 1.442 ≈ <strong>0.720 = 72%</strong><br><br>\n      <strong>📝 Interpretation：</strong><br>\n      F1 Score 为 0.72，取值范围 0–1，越接近1说明模型对流失客户的预测效果越好。<br><br>\n      <span style=\"font-size:12px;color:var(--color-text-info)\">💡 备用公式：F1 = 2TP / (2TP + FP + FN) = 90/(90+20+15) = 90/125 = 0.72 ✓（更快）</span>\n    </div>\n  </div>\n</div>\n\n<!-- PART B -->\n<div class=\"part\" id=\"partB\">\n  <div class=\"card\">\n    <span class=\"badge badge-amber\">分类树</span>\n    <h3>银行客户流失分类树（Best Pruned Tree）</h3>\n    <p style=\"margin-bottom:.75rem\">根据以下分类树回答问题：</p>\n    <div class=\"tree-row\">\n      <div class=\"tbox dec\" id=\"nb1\">D1: Balance<br>&gt; $5,000?</div>\n    </div>\n    <svg class=\"conn-svg\" width=\"400\" height=\"28\" viewBox=\"0 0 400 28\">\n      <line x1=\"200\" y1=\"0\" x2=\"90\" y2=\"28\" stroke=\"var(--color-border-secondary)\" stroke-width=\"1.2\"/>\n      <line x1=\"200\" y1=\"0\" x2=\"310\" y2=\"28\" stroke=\"var(--color-border-secondary)\" stroke-width=\"1.2\"/>\n      <text x=\"115\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">No (≤$5k)</text>\n      <text x=\"285\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">Yes (&gt;$5k)</text>\n    </svg>\n    <div class=\"tree-row\">\n      <div class=\"tbox t0\" id=\"nb2\" style=\"margin-right:30px\">Terminal 0<br>🟢 No Churn</div>\n      <div class=\"tbox dec\" id=\"nb3\" style=\"margin-left:30px\">D2: NumProducts<br>≥ 3?</div>\n    </div>\n    <svg class=\"conn-svg\" width=\"400\" height=\"28\" viewBox=\"0 0 400 28\">\n      <line x1=\"270\" y1=\"0\" x2=\"200\" y2=\"28\" stroke=\"var(--color-border-secondary)\" stroke-width=\"1.2\"/>\n      <line x1=\"270\" y1=\"0\" x2=\"340\" y2=\"28\" stroke=\"var(--color-border-secondary)\" stroke-width=\"1.2\"/>\n      <text x=\"185\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">No (&lt;3)</text>\n      <text x=\"355\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">Yes (≥3)</text>\n    </svg>\n    <div class=\"tree-row\" style=\"justify-content:flex-end;margin-right:30px;gap:12px\">\n      <div class=\"tbox dec\" id=\"nb4\" style=\"font-size:11px\">D3: IsActive<br>Member?</div>\n      <div class=\"tbox t1\" id=\"nb5\">Terminal 1<br>🔴 Churn</div>\n    </div>\n    <svg class=\"conn-svg\" width=\"400\" height=\"28\" viewBox=\"0 0 400 28\">\n      <line x1=\"195\" y1=\"0\" x2=\"155\" y2=\"28\" stroke=\"var(--color-border-secondary)\" stroke-width=\"1.2\"/>\n      <line x1=\"195\" y1=\"0\" x2=\"235\" y2=\"28\" stroke=\"var(--color-border-secondary)\" stroke-width=\"1.2\"/>\n      <text x=\"132\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">Yes</text>\n      <text x=\"255\" y=\"22\" font-size=\"11\" fill=\"var(--color-text-secondary)\" text-anchor=\"middle\">No</text>\n    </svg>\n    <div class=\"tree-row\" style=\"justify-content:center;gap:30px\">\n      <div class=\"tbox t0\" id=\"nb6\" style=\"font-size:11px\">Terminal 0<br>🟢 No Churn</div>\n      <div class=\"tbox t1\" id=\"nb7\" style=\"font-size:11px\">Terminal 1<br>🔴 Churn</div>\n    </div>\n    <div style=\"margin-top:.6rem;font-size:11px;color:var(--color-text-tertiary)\">\n      规则总结：① Balance ≤ $5,000 → No Churn &nbsp;|&nbsp; ② Balance &gt; $5k + NumProducts ≥ 3 → Churn &nbsp;|&nbsp; ③ Balance &gt; $5k + NumProducts &lt; 3 + Active → No Churn &nbsp;|&nbsp; ④ Balance &gt; $5k + NumProducts &lt; 3 + Not Active → Churn\n    </div>\n  </div>\n\n  <!-- Q7 -->\n  <div class=\"qblock\">\n    <h3>Q7. 某客户：Balance = $8,000；NumProducts = 2；IsActiveMember = Yes。请判断该客户是否为 Churner，并说明每一步的判断依据。 <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[3 marks]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"写出每一步决策路径和最终结论...\" style=\"min-height:70px\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('b1');showPath('p1')\">查看答案与路径</button>\n    <div class=\"ans-reveal\" id=\"b1\">\n      <strong>结论：Terminal 0 — 不是 Churner 🟢</strong><br><br>\n      <strong>决策路径：</strong><br>\n      <div class=\"step-path show\" id=\"p1\">\n        <div class=\"step-item active\">D1: Balance = $8,000 &gt; $5,000 → 向右走（Yes）</div>\n        <div class=\"step-item active\">D2: NumProducts = 2 &lt; 3 → 向左走（No）</div>\n        <div class=\"step-item active\">D3: IsActiveMember = Yes → 向左走（Yes）</div>\n        <div class=\"step-item\" style=\"background:var(--color-background-success);color:var(--color-text-success)\">→ Terminal 0：No Churn ✅</div>\n      </div>\n      <br>\n      <span style=\"font-size:12px\">📝 <strong>考试写法：</strong>每步必须写出\"数值 + 比较条件 + 方向\"，否则扣分。</span>\n    </div>\n  </div>\n\n  <!-- Q8 -->\n  <div class=\"qblock\">\n    <h3>Q8. 某客户：Balance = $3,500；NumProducts = 4；IsActiveMember = No。请判断该客户是否为 Churner，并说明每一步的判断依据。 <span style=\"font-size:11px;color:var(--color-text-tertiary)\">[3 marks]</span></h3>\n    <textarea class=\"ans-area\" placeholder=\"写出每一步决策路径和最终结论...\" style=\"min-height:70px\"></textarea>\n    <button class=\"reveal-btn\" onclick=\"rev('b2');showPath('p2')\">查看答案与路径</button>\n    <div class=\"ans-reveal\" id=\"b2\">\n      <strong>结论：Terminal 0 — 不是 Churner 🟢</strong><br><br>\n      <strong>决策路径：</strong><br>\n      <div class=\"step-path show\" id=\"p2\">\n        <div class=\"step-item active\">D1: Balance = $3,500 ≤ $5,000 → 向左走（No）</div>\n        <div class=\"step-item\" style=\"background:var(--color-background-success);color:var(--color-text-success)\">→ Terminal 0：No Churn ✅（直接终止，无需继续）</div>\n      </div>\n      <br>\n      <span style=\"font-size:12px\">⚠️ <strong>注意陷阱：</strong>此题虽然 NumProducts=4 且 IsActive=No，但由于 Balance ≤ $5,000，在 D1 就已终止，其他条件<strong>不再参与判断</strong>。</span>\n    </div>\n  </div>\n</div>\n\n<!-- Summary card -->\n<div class=\"card\" style=\"background:var(--color-background-secondary)\">\n  <h3>📋 答题规范总结 — 避免失分</h3>\n  <ul style=\"padding-left:1rem;margin-top:.4rem\">\n    <li style=\"margin:.3rem 0\"><strong>Performance Measures：</strong>先写公式 → 代入数字 → 给出百分比 → 写 Interpret（三步缺一失分）</li>\n    <li style=\"margin:.3rem 0\"><strong>Classification Tree：</strong>每个决策节点都要写\"数值 + 比较 + 走向\"，不能跳步</li>\n    <li style=\"margin:.3rem 0\"><strong>常见混淆：</strong>Class 1 Error Rate 分母是 TP+FN；Precision 分母是 TP+FP；Sensitivity 分母是 TP+FN</li>\n    <li style=\"margin:.3rem 0\"><strong>F1 Score 快捷公式：</strong>2TP / (2TP + FP + FN)，省去先算 Precision 和 Sensitivity 的步骤</li>\n  </ul>\n  \n</div>\n\n</div>\n\n<script>\nfunction rev(id){\n  var el=document.getElementById(id);\n  if(el) el.classList.toggle('show');\n}\nfunction showPath(id){\n  var el=document.getElementById(id);\n  if(el) el.classList.add('show');\n}\nfunction switchTab(part){\n  document.querySelectorAll('.part').forEach(function(p){p.classList.remove('on')});\n  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});\n  document.getElementById(part).classList.add('on');\n  event.target.classList.add('on');\n}\n<\/script>\n"}, {"id": "exam_past_papers", "week": "Finals", "title": "Past Exam Papers", "subtitle": "历年真题 · 官方答案解析", "color": "#6366F1", "content": "<h2 class=\"sr-only\">MGMT90280 历年真题</h2>\n<style>\n/* ── Layout ── */\n.ep-wrap { padding: 0.5rem 0; }\n\n/* ── Session tabs (year level) ── */\n.ep-session-nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1.2rem; }\n.ep-session-btn {\n  font-size:13px; font-weight:600; padding:7px 18px;\n  border-radius:20px; border:0.5px solid var(--color-border-secondary);\n  background:var(--color-background-secondary); color:var(--color-text-secondary);\n  cursor:pointer; font-family:inherit; transition:all 0.15s;\n}\n.ep-session-btn.on {\n  background:var(--color-background-info); color:var(--color-text-info);\n  border-color:var(--color-border-info);\n}\n\n/* ── Session panel ── */\n.ep-session { display:none; }\n.ep-session.on { display:block; }\n\n/* ── Exam meta banner ── */\n.ep-meta {\n  display:flex; align-items:center; gap:12px; flex-wrap:wrap;\n  padding:10px 14px; margin-bottom:1.2rem;\n  background:var(--color-background-secondary);\n  border-radius:var(--border-radius-md);\n  border:0.5px solid var(--color-border-tertiary);\n}\n.ep-meta-tag {\n  font-size:11px; font-weight:600; padding:3px 10px;\n  border-radius:10px; background:var(--color-background-info);\n  color:var(--color-text-info);\n}\n.ep-meta-title { font-size:13px; font-weight:600; color:var(--color-text-primary); }\n.ep-meta-sub { font-size:12px; color:var(--color-text-secondary); }\n\n/* ── Question tabs ── */\n.ep-q-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1rem; }\n.ep-q-btn {\n  font-size:12px; padding:5px 14px; border-radius:16px;\n  border:0.5px solid var(--color-border-secondary);\n  background:var(--color-background-secondary); color:var(--color-text-secondary);\n  cursor:pointer; font-family:inherit; transition:all 0.15s;\n}\n.ep-q-btn.on {\n  background:var(--color-background-info); color:var(--color-text-info);\n  border-color:var(--color-border-info);\n}\n\n/* ── Question panel ── */\n.ep-q-panel { display:none; }\n.ep-q-panel.on { display:block; }\n\n/* ── Context box ── */\n.ep-context {\n  background:var(--color-background-secondary);\n  border-radius:var(--border-radius-md);\n  border:0.5px solid var(--color-border-tertiary);\n  padding:14px; margin-bottom:1rem;\n}\n.ep-context h4 { font-size:13px; font-weight:600; color:var(--color-text-primary); margin-bottom:8px; }\n.ep-context p { font-size:13px; color:var(--color-text-secondary); line-height:1.6; }\n.ep-param-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }\n.ep-param-table th {\n  background:var(--color-background-secondary); color:var(--color-text-secondary);\n  font-weight:500; padding:6px 10px; text-align:left;\n  border:0.5px solid var(--color-border-tertiary);\n}\n.ep-param-table td {\n  padding:6px 10px; border:0.5px solid var(--color-border-tertiary);\n  color:var(--color-text-primary); font-size:13px;\n}\n\n/* ── Sub-question card ── */\n.ep-subq {\n  background:var(--color-background-primary);\n  border:0.5px solid var(--color-border-tertiary);\n  border-radius:var(--border-radius-lg);\n  margin-bottom:10px;\n  overflow:hidden;\n}\n.ep-subq-header {\n  display:flex; align-items:center; gap:10px;\n  padding:12px 16px; cursor:pointer;\n  transition:background 0.15s;\n  user-select:none;\n}\n.ep-subq-header:hover { background:var(--color-background-secondary); }\n.ep-subq-num {\n  font-size:11px; font-weight:700; padding:3px 9px;\n  border-radius:10px; background:var(--color-background-info);\n  color:var(--color-text-info); white-space:nowrap; flex-shrink:0;\n}\n.ep-subq-title { font-size:13px; font-weight:600; color:var(--color-text-primary); flex:1; }\n.ep-subq-marks {\n  font-size:11px; color:var(--color-text-tertiary);\n  white-space:nowrap; flex-shrink:0;\n}\n.ep-subq-arrow {\n  font-size:11px; color:var(--color-text-tertiary);\n  transition:transform 0.2s; flex-shrink:0;\n}\n.ep-subq.open .ep-subq-arrow { transform:rotate(180deg); }\n.ep-subq-body {\n  display:none; padding:0 16px 16px;\n  border-top:0.5px solid var(--color-border-tertiary);\n}\n.ep-subq.open .ep-subq-body { display:block; }\n\n/* ── Content elements inside subq ── */\n.ep-warn-box {\n  background:var(--color-background-danger);\n  border-left:3px solid var(--color-border-danger);\n  border-radius:0 var(--border-radius-sm) var(--border-radius-sm) 0;\n  padding:9px 13px; font-size:13px; color:var(--color-text-danger);\n  margin:10px 0; line-height:1.6;\n}\n.ep-tip-box {\n  background:var(--color-background-success);\n  border-left:3px solid var(--color-border-success);\n  border-radius:0 var(--border-radius-sm) var(--border-radius-sm) 0;\n  padding:9px 13px; font-size:13px; color:var(--color-text-success);\n  margin:10px 0; line-height:1.6;\n}\n.ep-info-box {\n  background:var(--color-background-info);\n  border-left:3px solid var(--color-border-info);\n  border-radius:0 var(--border-radius-sm) var(--border-radius-sm) 0;\n  padding:9px 13px; font-size:13px; color:var(--color-text-info);\n  margin:10px 0; line-height:1.6;\n}\n.ep-warn-box {\n  background:var(--color-background-warning);\n  border-left:3px solid var(--color-border-warning);\n  border-radius:0 var(--border-radius-sm) var(--border-radius-sm) 0;\n  padding:9px 13px; font-size:13px; color:var(--color-text-warning);\n  margin:10px 0; line-height:1.6;\n}\n.ep-formula {\n  background:var(--color-background-secondary);\n  border-left:3px solid var(--color-border-info);\n  border-radius:0 var(--border-radius-sm) var(--border-radius-sm) 0;\n  padding:10px 14px; font-family:var(--font-mono);\n  font-size:13px; color:var(--color-text-primary); margin:8px 0;\n}\n.ep-answer-label {\n  font-size:11px; font-weight:700; text-transform:uppercase;\n  letter-spacing:0.06em; color:var(--color-text-tertiary);\n  margin:12px 0 6px; display:block;\n}\n.ep-score-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }\n.ep-score-table th {\n  background:var(--color-background-secondary); color:var(--color-text-secondary);\n  font-weight:500; padding:5px 10px; text-align:left;\n  border:0.5px solid var(--color-border-tertiary);\n}\n.ep-score-table td {\n  padding:5px 10px; border:0.5px solid var(--color-border-tertiary);\n  color:var(--color-text-primary);\n}\n.ep-score-table tr:last-child td { font-weight:700; background:var(--color-background-secondary); }\n.ep-score-table td:last-child { text-align:center; }\n.ep-ul { font-size:13px; color:var(--color-text-primary); line-height:1.8; padding-left:1.2rem; margin:8px 0; }\n.ep-ul li { margin-bottom:2px; }\n.ep-p { font-size:13px; color:var(--color-text-primary); line-height:1.7; margin:6px 0; }\n.ep-h5 { font-size:13px; font-weight:600; color:var(--color-text-primary); margin:12px 0 4px; }\n.ep-mini-table { width:100%; border-collapse:collapse; font-size:12px; margin:6px 0; }\n.ep-mini-table th {\n  background:var(--color-background-secondary); padding:5px 8px;\n  border:0.5px solid var(--color-border-tertiary); color:var(--color-text-secondary);\n  font-weight:500; text-align:center;\n}\n.ep-mini-table td {\n  padding:5px 8px; border:0.5px solid var(--color-border-tertiary);\n  color:var(--color-text-primary); text-align:center;\n}\n<\/style>\n\n<div class=\"ep-wrap\">\n\n  <!-- ══ EXAM OVERVIEW TABLE ══ -->\n  <div style=\"margin-bottom:1.4rem;\">\n    <div style=\"font-size:15px;font-weight:700;color:var(--color-text-primary);margin-bottom:0.8rem;\">Q1～Q5 各题考什么</div>\n    <table style=\"width:100%;border-collapse:collapse;font-size:13px;\">\n      <thead>\n        <tr style=\"border-bottom:2px solid var(--color-border-secondary);\">\n          <th style=\"padding:8px 12px;text-align:left;color:var(--color-text-secondary);font-weight:600;white-space:nowrap;\">题目</th>\n          <th style=\"padding:8px 12px;text-align:left;color:var(--color-text-secondary);font-weight:600;white-space:nowrap;\">Week 范围</th>\n          <th style=\"padding:8px 12px;text-align:left;color:var(--color-text-secondary);font-weight:600;\">核心考点</th>\n          <th style=\"padding:8px 12px;text-align:left;color:var(--color-text-secondary);font-weight:600;white-space:nowrap;\">难度评估</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr style=\"border-bottom:0.5px solid var(--color-border-tertiary);\">\n          <td style=\"padding:10px 12px;font-weight:700;color:var(--color-text-primary);white-space:nowrap;\">Q1</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">Week 1–3</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-primary);\">LP / ILP / NLP 建模（列公式）+ Sensitivity Analysis（读 Excel Solver 输出）</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">⭐⭐⭐ 中等，但很套路</td>\n        </tr>\n        <tr style=\"border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);\">\n          <td style=\"padding:10px 12px;font-weight:700;color:var(--color-text-primary);white-space:nowrap;\">Q2</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">Week 4–5</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-primary);\">Monte Carlo Simulation + Probability Distribution（Binomial / Normal / Poisson 等）</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">⭐⭐⭐⭐⭐ 难度最高！计算量大</td>\n        </tr>\n        <tr style=\"border-bottom:0.5px solid var(--color-border-tertiary);\">\n          <td style=\"padding:10px 12px;font-weight:700;color:var(--color-text-primary);white-space:nowrap;\">Q3</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">Week 7–8</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-primary);\">Regression Analysis + Time Series 分析与预测</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">⭐⭐⭐⭐ 偏难，需要读图+计算</td>\n        </tr>\n        <tr style=\"border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);\">\n          <td style=\"padding:10px 12px;font-weight:700;color:var(--color-text-primary);white-space:nowrap;\">Q4</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">Week 6</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-primary);\">Descriptive Data Mining（Cluster Analysis, Association Rules, Text Mining）</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">⭐⭐⭐ 以读图为主，相对友好</td>\n        </tr>\n        <tr style=\"border-bottom:0.5px solid var(--color-border-tertiary);\">\n          <td style=\"padding:10px 12px;font-weight:700;color:var(--color-text-primary);white-space:nowrap;\">Q5</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">Week 9</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-primary);\">Classification Tree + Performance Measures（Sensitivity / Specificity / F1 Score 等）</td>\n          <td style=\"padding:10px 12px;color:var(--color-text-secondary);white-space:nowrap;\">⭐⭐⭐ 中等，套路性强</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n\n  <!-- ══ SESSION TABS ══ -->\n  <div class=\"ep-session-nav\">\n    <button class=\"ep-session-btn on\" onclick=\"epSession('s2025s1',this)\">2025 S1</button>\n    <!-- 后续年份在这里添加 -->\n  </div>\n\n  <!-- ══════════════════════════════════════\n       SESSION: 2025 S1\n  ══════════════════════════════════════ -->\n  <div id=\"s2025s1\" class=\"ep-session on\">\n\n    <div class=\"ep-meta\">\n      <span class=\"ep-meta-tag\">2025 Semester 1</span>\n      <div>\n        <div class=\"ep-meta-title\">MGMT90280 Final Exam</div>\n        <div class=\"ep-meta-sub\">Based on official teacher's answer</div>\n      </div>\n    </div>\n\n    <!-- Question tabs -->\n    <div class=\"ep-q-nav\">\n      <button class=\"ep-q-btn on\" onclick=\"epQ('2025s1','q1',this)\">Q1 · LP + Markowitz</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2025s1','q2',this)\">Q2 · Monte Carlo</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2025s1','q3',this)\">Q3 · Regression</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2025s1','q4',this)\">Q4 · Data Mining</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2025s1','q5',this)\">Q5 · Classification Tree</button>\n      <!-- 后续题目在这里添加 -->\n    </div>\n\n    <!-- ── Q1: LP + Markowitz ── -->\n    <div id=\"2025s1-q1\" class=\"ep-q-panel on\">\n\n      <div class=\"ep-context\">\n        <h4>📋 Part 1 — WonderPlay Manufacturing（LP生产规划）</h4>\n        <p>生产两种玩具（STEM Kits 和 Puzzle Boards），三个月（December, January, February），目标是最小化总成本。</p>\n        <table class=\"ep-param-table\">\n          <tr><th>玩具</th><th>期初库存</th><th>纸板/件</th><th>组装时间/件</th><th>生产成本</th><th>库存成本/件/月</th></tr>\n          <tr><td>STEM Kits</td><td>60</td><td>4</td><td>2 hrs</td><td>$16</td><td>$0.90</td></tr>\n          <tr><td>Puzzle Boards</td><td>45</td><td>5</td><td>1.8 hrs</td><td>$12</td><td>$0.70</td></tr>\n        </table>\n        <table class=\"ep-param-table\" style=\"margin-top:8px\">\n          <tr><th>月份</th><th>纸板上限</th><th>组装时间上限</th><th>STEM需求</th><th>Puzzle需求</th></tr>\n          <tr><td>December</td><td>4,200</td><td>2,400</td><td>350</td><td>300</td></tr>\n          <tr><td>January</td><td>4,800</td><td>2,600</td><td>400</td><td>370</td></tr>\n          <tr><td>February</td><td>4,600</td><td>2,500</td><td>450</td><td>390</td></tr>\n        </table>\n        <p style=\"margin-top:8px;font-size:13px;color:var(--color-text-secondary)\">March 1期初库存要求：STEM ≥ 80，Puzzle ≥ 90 ｜ 库存平衡：Beginning + Production − Demand = Ending</p>\n        <div style=\"margin-top:12px;border-top:0.5px solid var(--color-border-tertiary);padding-top:10px\">\n          <h4 style=\"margin-bottom:6px\">📋 Part 2 — Premier Wealth Advisors（Markowitz投资组合）</h4>\n          <p>三只基金：Green Fund / ESG Fund / Climate Fund，最低期望收益 10%，6年收益等概率。目标：最小化投资组合方差（风险）。</p>\n          <table class=\"ep-param-table\" style=\"margin-top:8px\">\n            <tr><th>Year</th><th>Green Fund</th><th>ESG Fund</th><th>Climate Fund</th></tr>\n            <tr><td>1</td><td>12.0%</td><td>8.0%</td><td>6.5%</td></tr>\n            <tr><td>2</td><td>9.5%</td><td>10.5%</td><td>14.0%</td></tr>\n            <tr><td>3</td><td>11.0%</td><td>9.0%</td><td>16.0%</td></tr>\n            <tr><td>4</td><td>−2.0%</td><td>−1.5%</td><td>−3.0%</td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-1\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-1')\">\n          <span class=\"ep-subq-num\">Q1.1</span>\n          <span class=\"ep-subq-title\">Develop a Linear Optimization Model for WonderPlay — minimise total cost</span>\n          <span class=\"ep-subq-marks\">12 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>LP建模五步走：</strong>决策变量 → 目标函数 → 库存平衡约束 → 资源约束 → 非负约束</div>\n          <div class=\"ep-warn-box\">⚠️ 漏掉 S<sub>ij</sub>（库存变量）不得分！有 holding cost 就必须定义库存变量。非负约束不给分但必须写完整。</div>\n          <p class=\"ep-h5\">① Decision Variables <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">P<sub>ij</sub> = number of toy i produced in month j\nS<sub>ij</sub> = surplus (ending inventory) of toy i at end of month j\n\ni = 1 (STEM Kits), i = 2 (Puzzle Boards)\nj = 1 (Dec), j = 2 (Jan), j = 3 (Feb)</div>\n          <p class=\"ep-h5\">② Objective Function <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">Min = 16(P₁₁+P₁₂+P₁₃) + 12(P₂₁+P₂₂+P₂₃)\n    + 0.9(S₁₁+S₁₂+S₁₃) + 0.7(S₂₁+S₂₂+S₂₃)</div>\n          <p class=\"ep-p\" style=\"color:var(--color-text-secondary)\">= 生产成本（3个月）+ 库存持有成本（3个月）</p>\n          <p class=\"ep-h5\">③ Inventory Balance Constraints <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(6 marks，每条1分)</span></p>\n          <div class=\"ep-info-box\">公式：Beginning + Production − Demand = Ending<br>Dec期初库存已代入：STEM: 60+P₁₁−350=S₁₁ → P₁₁−S₁₁=290；Puzzle: 45+P₂₁−300=S₂₁ → P₂₁−S₂₁=255</div>\n          <table class=\"ep-mini-table\">\n            <tr><th>Month</th><th>STEM Kits (i=1)</th><th>Puzzle Boards (i=2)</th></tr>\n            <tr><td>Dec</td><td>P₁₁ − S₁₁ = 290</td><td>P₂₁ − S₂₁ = 255</td></tr>\n            <tr><td>Jan</td><td>S₁₁ + P₁₂ − S₁₂ = 400</td><td>S₂₁ + P₂₂ − S₂₂ = 370</td></tr>\n            <tr><td>Feb</td><td>S₁₂ + P₁₃ − S₁₃ = 450</td><td>S₂₂ + P₂₃ − S₂₃ = 390</td></tr>\n          </table>\n          <p class=\"ep-h5\">④ March 1st Inventory Constraints <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark，各0.5)</span></p>\n          <div class=\"ep-formula\">S₁₃ ≥ 80    S₂₃ ≥ 90</div>\n          <div class=\"ep-warn-box\">⚠️ 必须写 S₁₃ 和 S₂₃，不能写成 X₁ ≥ 80！</div>\n          <p class=\"ep-h5\">⑤ Cardboard Constraints <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks，各0.5)</span></p>\n          <div class=\"ep-formula\">4P₁₁ + 5P₂₁ ≤ 4200\n4P₁₂ + 5P₂₂ ≤ 4800\n4P₁₃ + 5P₂₃ ≤ 4600</div>\n          <p class=\"ep-h5\">⑥ Assembly Time Constraints <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1.5 marks，各0.5)</span></p>\n          <div class=\"ep-formula\">2P₁₁ + 1.8P₂₁ ≤ 2400\n2P₁₂ + 1.8P₂₂ ≤ 2600\n2P₁₃ + 1.8P₂₃ ≤ 2500</div>\n          <p class=\"ep-h5\">⑦ Non-negativity</p>\n          <div class=\"ep-formula\">P<sub>ij</sub>, S<sub>ij</sub> ≥ 0 for all i, j    （不给分但必须写）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Decision variables</td><td>P<sub>ij</sub> 和 S<sub>ij</sub></td><td>1</td></tr>\n            <tr><td>Objective function</td><td>生产成本 + holding cost</td><td>1</td></tr>\n            <tr><td>Inventory balance (STEM)</td><td>Dec/Jan/Feb 各1分</td><td>3</td></tr>\n            <tr><td>Inventory balance (Puzzle)</td><td>Dec/Jan/Feb 各1分</td><td>3</td></tr>\n            <tr><td>March inventory constraints</td><td>各0.5分</td><td>1</td></tr>\n            <tr><td>Cardboard constraints</td><td>各0.5分</td><td>1.5</td></tr>\n            <tr><td>Assembly time constraints</td><td>各0.5分</td><td>1.5</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>12</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q1-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q1-2')\">\n          <span class=\"ep-subq-num\">Q1.2</span>\n          <span class=\"ep-subq-title\">Purchase 200 extra Cardboard in February for $30 — sensible?</span>\n          <span class=\"ep-subq-marks\">2 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>考点：Sensitivity Analysis — Shadow Price 判断题</strong><br>逻辑：节省金额（shadow price × 变化量）vs 购买成本，哪个大？</div>\n          <p class=\"ep-h5\">从 Table 1.3 找关键数据</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Constraint</th><th>Final Value</th><th>Shadow Price</th><th>RHS</th><th>Allowable Increase</th></tr>\n            <tr><td>Cardboard Feb</td><t
