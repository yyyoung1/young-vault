usted R² (0.9911 vs 0.9245), indicating better predictability and overall fit.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Q3.2（trend+seasonal 模型）更有效——MSE 更小、R² 和 Adjusted R² 均更高。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>MSE Q3.2</td><td>12.6007（或19.72）</td><td>1</td></tr>\n                <tr><td>MSE Q3.3</td><td>111.9630（或167.94）</td><td>1</td></tr>\n                <tr><td>MSE comparison</td><td>Q3.2 lower → better predictability</td><td>1</td></tr>\n                <tr><td>R² and Adj R²</td><td>Q3.2 both higher + explanation</td><td>2</td></tr>\n                <tr><td>Significance F</td><td>Both &lt; 0.05, Q3.2 smaller</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>6</strong></td></tr>\n              </table>\n\n              <!-- ══ 考场速查：全部可能情况模板 ══ -->\n              <div style=\"margin-top:18px;padding-top:14px;border-top:2px dashed var(--color-border-info);\">\n                <p class=\"ep-h5\" style=\"color:var(--color-text-info);font-size:13px;margin-bottom:10px\">⚡ 考场速查 — 所有可能情况的模板 | All Possible Scenario Templates</p>\n\n                <!-- ─ Dimension 1: MSE ─ -->\n                <p class=\"ep-h5\">① Predictability（MSE）— 3种情况</p>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 A：Model A 的 MSE 更小（本题）</strong>\n                </p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"MSE for Model A = [SSE÷n] = <strong>X.XX</strong>; MSE for Model B = [SSE÷n] = <strong>Y.YY</strong>. Model A has a <strong>lower MSE</strong>, indicating <strong>better predictability</strong> — it produces smaller average prediction errors.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Model A 的 MSE 更小，预测误差更小，预测能力更强。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 B：Model B 的 MSE 更小（简单模型更精准）</strong>\n                </p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"MSE for Model A = X.XX; MSE for Model B = Y.YY. Model B has a <strong>lower MSE</strong>, indicating <strong>better predictability</strong>, despite having fewer variables.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Model B 的 MSE 更小，即使变量更少，预测精度仍更高。</span></div>\n\n                <!-- ─ Dimension 2: R² / Adj R² ─ -->\n                <p class=\"ep-h5\" style=\"margin-top:12px\">② Overall Fit（R² and Adjusted R²）— 3种情况</p>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 A：Model A 的 R² 和 Adj R² 都更高（本题）</strong>\n                </p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"Model A has a higher R² ([X] vs [Y]) and higher Adjusted R² ([X] vs [Y]), indicating <strong>better overall fit</strong>. R² measures the percentage of variance explained; Adjusted R² corrects for the number of variables and prevents overestimation from adding unnecessary predictors.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Model A 的 R² 和 Adjusted R² 均更高，整体拟合更好。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 B：R² 更高但 Adj R² 更低（加了没用的变量）</strong>\n                </p>\n                <div class=\"ep-warn-box\" style=\"margin:4px 0 10px\">\"Although Model A has a higher R² ([X] vs [Y]), Model B has a <strong>higher Adjusted R²</strong> ([X] vs [Y]). Since Adjusted R² penalises unnecessary variables, this suggests that the <strong>extra variables in Model A do not meaningfully improve the fit</strong>. Model B may therefore have better overall fit when accounting for model complexity.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Model A 的 R² 更高，但 Adj R² 更低——说明增加的变量并没有真正提升解释力，Model B 的综合拟合效果可能更好。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 C：两个模型的 R² 和 Adj R² 都相近</strong>\n                </p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"Both models have similar R² ([X] vs [Y]) and Adjusted R² ([X] vs [Y]), suggesting <strong>comparable overall fit</strong>. In this case, the simpler model (Model B) may be preferred for parsimony.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">两个模型拟合效果相近，此时优先选择更简洁的模型（变量更少）。</span></div>\n\n                <!-- ─ Dimension 3: Significance F ─ -->\n                <p class=\"ep-h5\" style=\"margin-top:12px\">③ Overall Significance（Significance F）— 3种情况</p>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 A：两个模型都显著（本题）</strong>\n                </p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"Both models have Significance F &lt; 0.05, meaning both are overall statistically significant — there is sufficient evidence that the independent variables significantly improve the prediction. However, Model A has a <strong>smaller Significance F</strong>, suggesting <strong>stronger overall significance</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">两个模型都整体显著（Sig F &lt; 0.05），但 Model A 更小，显著性更强。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 B：只有一个模型显著</strong>\n                </p>\n                <div class=\"ep-warn-box\" style=\"margin:4px 0 10px\">\"Model A has Significance F &lt; 0.05, indicating it is <strong>overall statistically significant</strong>. However, Model B has Significance F &gt; 0.05, meaning it is <strong>not overall significant</strong> — there is insufficient evidence that its variables collectively improve the prediction. Therefore, <strong>Model B cannot be recommended</strong> regardless of its R² or MSE.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Model B 的 Sig F &gt; 0.05，整体不显著，无论 R² 多高都不能推荐。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>情况 C：两个模型都显著，但 Sig F 相近</strong>\n                </p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"Both models have Significance F &lt; 0.05, indicating both are overall statistically significant. The Significance F values are similar ([X] vs [Y]), so this dimension alone does not strongly differentiate the two models.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">两个模型都显著，且 Sig F 相近，此维度差异不大，需结合 MSE 和 R² 判断。</span></div>\n\n                <!-- ─ Conclusion Templates ─ -->\n                <p class=\"ep-h5\" style=\"margin-top:12px\">④ 结论模板 — 3种情况</p>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>结论 A：三个维度一致指向同一个模型（最常见，本题）</strong>\n                </p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"<strong>Model A is more effective.</strong> It outperforms Model B across all three dimensions: lower MSE ([X] vs [Y]) indicating better predictability, higher R² ([X] vs [Y]) and Adjusted R² ([X] vs [Y]) indicating better overall fit, and a smaller Significance F suggesting stronger overall significance.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Model A 在所有三个维度上均优于 Model B——MSE 更小、R² 和 Adj R² 更高、Significance F 更小。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>结论 B：各维度指向不同模型（Mixed results）</strong>\n                </p>\n                <div class=\"ep-warn-box\" style=\"margin:4px 0 10px\">\"The comparison yields mixed results. Model A has better predictability (lower MSE) and overall significance (smaller Sig F), while Model B has a higher Adjusted R², suggesting it explains variance more efficiently given its fewer variables. <strong>Overall, Model [A/B] is preferred</strong> because [most critical dimension for the context, e.g., if prediction is the goal → choose lower MSE; if explanation is the goal → choose higher Adj R²].\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">结果不一致时，根据研究目标（预测精度 vs 解释能力）选择最重要的维度作为决定因素。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\">\n                  <strong>结论 C：一个模型不显著 → 直接排除</strong>\n                </p>\n                <div class=\"ep-warn-box\" style=\"margin:4px 0 10px\">\"Although Model B may have [lower MSE / higher R²], it is <strong>not overall statistically significant</strong> (Significance F &gt; 0.05). Therefore, <strong>Model A is the only viable option</strong>, as it is the only model that passes the overall significance test.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">即使 Model B 在某些维度表现好，但整体不显著 → 直接选 Model A。</span></div>\n\n                <!-- ─ Quick Formula Reminder ─ -->\n                <p class=\"ep-h5\" style=\"margin-top:12px\">⚡ 速查公式 | Quick Formula Reminder</p>\n                <div class=\"ep-formula\">MSE = SSE (Residual SS from ANOVA) ÷ n\n     OR  SSE ÷ Residual df (both accepted by marker)\n\nn = number of observations (from Reg. Statistics table)\nResidual df = from ANOVA table Residual row\n\n记住: MSE越小 ✅ | R²越大 ✅ | Adj R²越大 ✅ | Sig F越小且&lt;0.05 ✅</div>\n              </div>\n            </div>\n          </div>\n\n        </div><!-- /analysis col -->\n      </div><!-- /split layout -->\n    </div><!-- /q3 panel -->\n\n    <!-- ══════════════════ Q4 · Clustering Analysis ══════════════════ -->\n    <div id=\"2024s1-q4\" class=\"ep-q-panel\">\n      <div class=\"ep-split-layout\">\n\n        <!-- ── 左栏：原题 ── -->\n        <div class=\"ep-orig-col\">\n          <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n          <div class=\"ep-orig-card\">\n            <div class=\"ep-orig-bg\">\n              <strong>SECTION 1 · Q4 (25 marks)</strong><br>\n              <strong>JB Hi-Fi — Credit Risk Clustering Analysis</strong><br>\n              As a business analyst at JB Hi-Fi, addressing imbalanced classes in fraud detection is a significant responsibility. A comprehensive dataset with 40 clients was used, containing variables: credit_amount, credit_term, age, sex, education, product_type, having_children, family_status, income, bad_client_target (see Table 4.1). A <strong>hierarchical clustering</strong> based on group average linkage method produced a dendrogram and output tables below. A <strong>k-means clustering</strong> was also applied to create 2 clusters.\n              <table class=\"ep-orig-tbl\" style=\"margin-top:10px\">\n                <tr><th>Cluster</th><th>Sub-Cluster</th><th>Avg Credit (AUD)</th><th>Avg Income (AUD)</th><th>Bad Clients</th><th>Total Clients</th></tr>\n                <tr><td rowspan=\"2\"><strong>1</strong></td><td>1</td><td>78,000</td><td>71,000</td><td>0</td><td>1</td></tr>\n                <tr><td>3</td><td>53,800</td><td>84,000</td><td>0</td><td>5</td></tr>\n                <tr><td colspan=\"2\"><strong>1 Total</strong></td><td><strong>57,833</strong></td><td><strong>81,833</strong></td><td><strong>0</strong></td><td><strong>6</strong></td></tr>\n                <tr><td><strong>2</strong></td><td>2</td><td>66,500</td><td>111,000</td><td>1</td><td>1</td></tr>\n                <tr><td colspan=\"2\"><strong>2 Total</strong></td><td><strong>66,500</strong></td><td><strong>111,000</strong></td><td><strong>1</strong></td><td><strong>1</strong></td></tr>\n                <tr><td rowspan=\"7\"><strong>3</strong></td><td>4</td><td>52,500</td><td>24,333</td><td>0</td><td>3</td></tr>\n                <tr><td>5</td><td>55,500</td><td>48,500</td><td>2</td><td>2</td></tr>\n                <tr><td>6</td><td>46,500</td><td>21,000</td><td>5</td><td>5</td></tr>\n                <tr><td>7</td><td>46,250</td><td>86,000</td><td>2</td><td>2</td></tr>\n                <tr><td>8</td><td>36,389</td><td>55,222</td><td>0</td><td>9</td></tr>\n                <tr><td>9</td><td>34,938</td><td>22,250</td><td>0</td><td>8</td></tr>\n                <tr><td>10</td><td>34,125</td><td>31,750</td><td>4</td><td>4</td></tr>\n                <tr><td colspan=\"2\"><strong>3 Total</strong></td><td><strong>40,515</strong></td><td><strong>37,848</strong></td><td><strong>13</strong></td><td><strong>33</strong></td></tr>\n                <tr><td colspan=\"2\"><strong>Grand Total</strong></td><td><strong>43,763</strong></td><td><strong>46,275</strong></td><td><strong>14</strong></td><td><strong>40</strong></td></tr>\n              </table>\n              <p class=\"ep-orig-note\" style=\"margin-top:8px\"><strong>Table 4.4 (K-means):</strong> Cluster 1: Size=22, Avg Distance=0.9393 | Cluster 2: Size=18, Avg Distance=1.6896 | Total=40, Avg=1.2769<br>\n              <strong>Table 4.5 (K-means):</strong> Cluster 1: Avg Credit=$36,682, Avg Income=$36,273, Bad=3, Total=22 | Cluster 2: Avg Credit=$52,417, Avg Income=$58,500, Bad=11, Total=18<br>\n              <strong>Figure 4.1 Dendrogram</strong>: x轴从左到右 — 8, 9, 4, 5, 7, 6, 10, 1, 3, 2。最小合并高度：8&amp;9和6&amp;10（最同质）；最大合并：1&amp;3 with 2（最异质）。距离2.8处可见2个主cluster。</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">2 marks</span>\n              <span class=\"ep-orig-qnum\">Q4.1</span>\n              <p class=\"ep-orig-qtxt\">There are several clustering methods to compare the observations in two clusters to obtain a cluster similarity measure. Explain how the <strong>single linkage</strong> is different from <strong>centroid linkage</strong> method.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">5 marks</span>\n              <span class=\"ep-orig-qnum\">Q4.2.1</span>\n              <p class=\"ep-orig-qtxt\">How would you interpret the results in the two output tables (Table 4.2 and 4.3) below? Provide at least <strong>five</strong> key points that you have identified.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">3 marks</span>\n              <span class=\"ep-orig-qnum\">Q4.2.2</span>\n              <p class=\"ep-orig-qtxt\">Refer to the dendrogram provided in Figure 4.1. How many explicit main clusters can you identify at a distance of <strong>2.8</strong>? At a distance of 2.8, what are the sub clusters that you identify under each main cluster and what are their characteristics? Provide at least <strong>three</strong> key points by analysing the dendrogram at any different distances.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">5 marks</span>\n              <span class=\"ep-orig-qnum\">Q4.2.3</span>\n              <p class=\"ep-orig-qtxt\">A <strong>k-means clustering</strong> was used to create 2 clusters for this same dataset and the relevant output tables are given below (Table 4.4 and 4.5). How many clients are in each cluster? How would you characterise each of the clusters? Briefly explain <strong>five</strong> key points of the 2 clusters.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">3 marks</span>\n              <span class=\"ep-orig-qnum\">Q4.2.4</span>\n              <p class=\"ep-orig-qtxt\">Compare the Hierarchical clustering and K-means clustering outcomes based on the above tables and figures. Which clustering method provides more reliable and meaningful insights? Briefly explain your answer.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">3 marks</span>\n              <span class=\"ep-orig-qnum\">Q4.2.5</span>\n              <p class=\"ep-orig-qtxt\">Are there any other points or considerations to improve the Hierarchical clustering groupings?</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">4 marks</span>\n              <span class=\"ep-orig-qnum\">Q4.2.6</span>\n              <p class=\"ep-orig-qtxt\">As a business analyst, your analysis aims to improve fraud detection capabilities and refine credit risk assessment methodologies within JB Hi-Fi's credit services. <strong>Based on the hierarchical clustering model</strong>, what recommendations would you provide to the top management of JB Hi-Fi to refine the credit risk assessments? Please explain.</p>\n            </div>\n          </div>\n        </div>\n\n        <!-- ── 右栏：解析 ── -->\n        <div class=\"ep-analysis-col\">\n          <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n\n          <!-- 背景知识 -->\n          <div class=\"ep-info-box\" style=\"margin-bottom:12px\">\n            💡 <strong>背景知识 | Key Rules to Remember</strong><br><br>\n            <strong>Dendrogram 怎么看：</strong><br>\n            • 竖线高度<strong>低</strong> = 两个 cluster 合并早 = 相似 = <strong>同质（homogenous）</strong><br>\n            • 竖线高度<strong>高</strong> = 两个 cluster 合并晚 = 差异大 = <strong>异质（heterogeneous）</strong><br>\n            • 在某个距离画横线，横线切断几个分支 = 该距离下有几个 main clusters<br>\n            • 判断最优 cluster 数量：找高度<strong>跳跃最大</strong>的地方，跳跃前的 cluster 数就是最优数<br><br>\n            <strong>Homogenous vs Heterogeneous：</strong><br>\n            • Most homogenous pair = dendrogram 里合并高度<strong>最低</strong>的一对<br>\n            • Most heterogeneous pair = 同一群里合并高度<strong>最高</strong>的一对<br><br>\n            <strong>K-means vs Hierarchical：</strong><br>\n            • Average distance within cluster 越小 = 该 cluster 越<strong>同质</strong><br>\n            • 从 <strong>Table 4.4</strong> 读 average distance\n          </div>\n\n          <!-- Q4.1 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q4-1\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q4-1')\">\n              <span class=\"ep-subq-num\">Q4.1</span>\n              <span class=\"ep-subq-title\">Single Linkage vs Centroid Linkage</span>\n              <span class=\"ep-subq-marks\">2 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>四种 Linkage 速查 | All Linkage Methods:</strong><br>\n                • <strong>Single</strong>：两 cluster 间<strong>最近</strong>一对点的距离（最近点）<br>\n                • <strong>Complete</strong>：两 cluster 间<strong>最远</strong>一对点的距离（最远点）<br>\n                • <strong>Average</strong>：两 cluster 间<strong>所有点对</strong>距离的平均值<br>\n                • <strong>Centroid</strong>：两 cluster 各自<strong>中心点</strong>之间的距离\n              </div>\n              <span class=\"ep-answer-label\">⚡ 考场速查 — 题目问哪两种就写哪两种，各 1 mark</span>\n              <p class=\"ep-h5\">① Single Linkage</p>\n              <div class=\"ep-tip-box\">\"Single linkage compares the <strong>closest points</strong> between two clusters to measure their similarity. It computes the distance between the <strong>closest pair of points</strong>, one from each cluster, and considers this as the similarity between the clusters.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">用两个 cluster 之间<strong>最近</strong>的两个点之间的距离衡量相似度。只看最近一对点。</span></div>\n              <p class=\"ep-h5\">② Complete Linkage</p>\n              <div class=\"ep-tip-box\">\"Complete linkage compares the <strong>farthest points</strong> between two clusters to measure their similarity. It computes the distance between the <strong>furthest pair of points</strong>, one from each cluster, and considers this as the distance between the clusters. It tends to produce more compact and evenly sized clusters, but is sensitive to outliers.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">用两个 cluster 之间<strong>最远</strong>的两个点之间的距离衡量相似度。只看最远一对点。倾向于产生更紧凑均匀的 cluster，但对异常值敏感。</span></div>\n              <p class=\"ep-h5\">③ Average Linkage</p>\n              <div class=\"ep-tip-box\">\"Average linkage calculates the <strong>average distance between all pairs of points</strong>, one from each cluster, to measure similarity. It considers the overall structure of the clusters rather than just the closest or farthest points, making it more robust and less sensitive to outliers than single or complete linkage.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">用两个 cluster 之间<strong>所有点对</strong>距离的平均值衡量相似度。考虑整体结构，对异常值比 single 和 complete linkage 更稳健。</span></div>\n              <p class=\"ep-h5\">④ Centroid Linkage</p>\n              <div class=\"ep-tip-box\">\"Centroid linkage calculates the distance between the <strong>centroids (mean points)</strong> of two clusters. The centroid represents the average location of all points within each cluster. It tends to create more balanced and compact clusters, and is less sensitive to outliers.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">用两个 cluster 各自<strong>中心点</strong>（所有点的均值位置）之间的距离衡量相似度。对异常值不敏感，倾向于形成更均衡紧凑的 cluster。</span></div>\n            </div>\n          </div>\n\n          <!-- Q4.2.1 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q4-21\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q4-21')\">\n              <span class=\"ep-subq-num\">Q4.2.1</span>\n              <span class=\"ep-subq-title\">Interpret Table 4.2 and 4.3 — five key points</span>\n              <span class=\"ep-subq-marks\">5 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • 题目说 \"interpret the results\" → 不是描述表格，是要从数字里找<strong>有意义的观察</strong><br>\n                • 看到 \"at least five key points\" → 必须写够 5 条，每条要有具体数字支撑<br>\n                • 数据来源锁定 <strong>Table 4.2</strong>，逐行逐列扫：谁最多、谁最少、谁全是 bad client、比例怎样\n              </div>\n              <div class=\"ep-warn-box\">⚠️ Point 1 和 Point 2 <strong>必须写</strong>，再加任意 3 个。每个 point 必须有具体数字支撑，不能只说\"cluster 3最大\"，要说\"33 out of 40 (82.5%)\"。<br><em>Points 1 &amp; 2 are mandatory. Every point needs specific numbers.</em></div>\n              <span class=\"ep-answer-label\">8 个 Valid Points（1+2必写，再选3个）</span>\n              <ol class=\"ep-list\">\n                <li>✅ <strong>必写</strong>：There are <strong>3 main clusters</strong> and <strong>10 sub-clusters</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">共有 3 个主 cluster 和 10 个子 cluster。</span></li>\n                <li>✅ <strong>必写</strong>：Cluster 1 has 2 sub-clusters (1, 3)；Cluster 2 has 1 sub-cluster (2)；Cluster 3 has 7 sub-clusters (4, 5, 6, 7, 8, 9, 10).<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 1 有 2 个子 cluster，Cluster 2 只有 1 个，Cluster 3 有 7 个。</span></li>\n                <li>Cluster 3 has the highest number of clients — <strong>33 out of 40 (82.5%)</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 3 客户数最多，占总数 82.5%。</span></li>\n                <li>Cluster 3 has <strong>13 bad clients out of 33 (39.3% bad client rate)</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 3 有 13 个坏客户，坏客户率 39.3%。</span></li>\n                <li>Cluster 2 has only <strong>1 client, and that client is a bad client (100% bad client rate)</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 2 只有 1 个客户且该客户是坏客户，坏客户率 100%。</span></li>\n                <li>Cluster 1 has <strong>6 clients and all are good clients (0 bad clients)</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 1 有 6 个客户且全部是好客户。</span></li>\n                <li>Cluster 2 has the <strong>highest average annual income ($111,000) and highest average credit amount ($66,500)</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 2 的平均年收入和平均信用额度最高。</span></li>\n                <li>Cluster 3 has the <strong>lowest average annual income ($37,848) and lowest average credit amount ($40,515)</strong>. However, the average credit amount is <strong>higher than their average annual income</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 3 平均收入和信用额度最低，但平均信用额度反而高于平均年收入。</span></li>\n              </ol>\n            </div>\n          </div>\n\n          <!-- Q4.2.2 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q4-22\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q4-22')\">\n              <span class=\"ep-subq-num\">Q4.2.2</span>\n              <span class=\"ep-subq-title\">Dendrogram analysis at distance 2.8</span>\n              <span class=\"ep-subq-marks\">3 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • 题目问 \"at a distance of 2.8\" → 在 dendrogram 图上距离 2.8 处画横线，数切断几个分支<br>\n                • 题目问 \"sub-clusters under each main cluster\" → 看横线左右两边各包含哪些 sub-cluster<br>\n                • 题目说 \"at any different distances\" → 可以选任意其他距离来观察，比如 2.2<br><br>\n                <strong>从哪里读数据：</strong><strong>Figure 4.1 Dendrogram</strong> — x 轴从左到右：<strong>8, 9, 4, 5, 7, 6, 10, 1, 3, 2</strong><br><br>\n                <strong>Dendrogram 读法：</strong><br>\n                • 在距离 2.8 处画横线 → 横线切断几个分支 = 几个 main clusters<br>\n                • 合并高度<strong>低</strong> = 两 cluster 相似 = <strong>most homogenous</strong><br>\n                • 合并高度<strong>高</strong> = 两 cluster 差异大 = <strong>most heterogeneous</strong><br>\n                • 最优 cluster 数：高度跳跃最大的地方，跳跃前的数量就是最优数\n              </div>\n              <div class=\"ep-warn-box\">⚠️ Point 1 和 Point 2 <strong>必须写</strong>，再加任意 1 个。<br><em>Points 1 &amp; 2 are mandatory + any 1 more.</em></div>\n              <span class=\"ep-answer-label\">5 个 Valid Points（1+2必写，再选1个）</span>\n              <ol class=\"ep-list\">\n                <li>✅ <strong>必写</strong>：At distance 2.8, we can clearly see <strong>2 main clusters</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">在距离 2.8 处，可以明确看到 2 个主 cluster。</span></li>\n                <li>✅ <strong>必写</strong>：Cluster 1 (left) contains sub-clusters <strong>4, 5, 6, 7, 8, 9, 10</strong>；Cluster 2 (right) contains sub-clusters <strong>1, 2, 3</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">左边大群包含子 cluster 4-10；右边小群包含子 cluster 1, 2, 3。</span></li>\n                <li>Most homogenous sub-clusters are <strong>cluster 8 &amp; 9</strong> and <strong>cluster 6 &amp; 10</strong>（合并高度最低，最相似）.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">最同质的子 cluster 组合是 8&amp;9 和 6&amp;10。</span></li>\n                <li>Most heterogeneous pair is <strong>cluster 1 and 3</strong>（合并高度最高，差异最大）.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">最异质的组合是 1 和 3。</span></li>\n                <li>At distance <strong>2.2</strong>, we can identify <strong>5 main clusters</strong>: (4, 8, 9), (5, 6, 7, 10), 1, 2, 3.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">在距离 2.2 处可以识别出 5 个主 cluster。</span></li>\n              </ol>\n            </div>\n          </div>\n\n          <!-- Q4.2.3 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q4-23\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q4-23')\">\n              <span class=\"ep-subq-num\">Q4.2.3</span>\n              <span class=\"ep-subq-title\">K-means clustering — five key points</span>\n              <span class=\"ep-subq-marks\">5 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • 题目问 \"how many clients in each cluster\" → 从 <strong>Table 4.4</strong> 的 Size 列读<br>\n                • 题目问 \"characterise each cluster\" → 从 <strong>Table 4.5</strong> 找特征（income、credit amount、bad clients）<br>\n                • 题目说 \"five key points\" → 必须写够 5 条，1 和 2 必写<br><br>\n                <strong>从哪里读数据：</strong><br>\n                • Cluster 人数和同质性 → <strong>Table 4.4</strong>（size 和 average distance 列）<br>\n                • Income、credit amount、bad clients → <strong>Table 4.5</strong>\n              </div>\n              <div class=\"ep-warn-box\">⚠️ Point 1 和 Point 2 <strong>必须写</strong>，再加任意 3 个。Point 3 的 homogenous 依据是 average distance（Table 4.4），不是 Table 4.5。<br><em>Points 1 &amp; 2 mandatory. Homogeneity comes from average distance in Table 4.4.</em></div>\n              <span class=\"ep-answer-label\">6 个 Valid Points（1+2必写，再选3个）</span>\n              <ol class=\"ep-list\">\n                <li>✅ <strong>必写</strong>：There are <strong>2 main clusters</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">共 2 个主 cluster。</span></li>\n                <li>✅ <strong>必写</strong>：Cluster 1 has <strong>22 clients (55%)</strong>；Cluster 2 has <strong>18 clients (45%)</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 1 有 22 个客户（55%），Cluster 2 有 18 个（45%）。</span></li>\n                <li>Cluster 1 is <strong>more homogenous</strong> than Cluster 2 — average distance within Cluster 1 (0.9393) &lt; Cluster 2 (1.6896).<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 1 更同质，内部平均距离（0.9393）小于 Cluster 2（1.6896）。</span></li>\n                <li>Average annual income is <strong>higher in Cluster 2</strong> ($58,500) compared to Cluster 1 ($36,273).<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 2 的平均年收入（$58,500）高于 Cluster 1（$36,273）。</span></li>\n                <li>Average credit amount is <strong>higher in Cluster 2</strong> ($52,417) compared to Cluster 1 ($36,682).<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 2 的平均信用额度（$52,417）高于 Cluster 1（$36,682）。</span></li>\n                <li>Cluster 1 has fewer bad clients: <strong>3/22 = 13.6%</strong> bad client rate；Cluster 2 has more: <strong>11/18 = 61%</strong> bad client rate.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 1 坏客户率 13.6%，Cluster 2 坏客户率 61%。</span></li>\n              </ol>\n            </div>\n          </div>\n\n          <!-- Q4.2.4 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q4-24\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q4-24')\">\n              <span class=\"ep-subq-num\">Q4.2.4</span>\n              <span class=\"ep-subq-title\">Compare Hierarchical vs K-means — which is better?</span>\n              <span class=\"ep-subq-marks\">3 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • 题目问 \"which provides more reliable and meaningful insights\" → 要给出<strong>结论</strong>，不能只描述两种方法<br>\n                • 题目说 \"briefly explain\" → 每条给理由，不用展开<br>\n                • 老师说 contradictory solution with fair justification 也可得分 → K-means 更好也可以，但要有理由\n              </div>\n              <div class=\"ep-warn-box\">⚠️ Point 1 和 Point 2 <strong>必须写</strong>，再加任意 1 个。老师说 K-means 更好的答案（有合理理由）也可得分。<br><em>Points 1 &amp; 2 mandatory. Contradictory answer with fair justification is accepted.</em></div>\n              <span class=\"ep-answer-label\">情况一：Hierarchical 更好（老师答案版本）</span>\n              <ol class=\"ep-list\">\n                <li>✅ <strong>必写</strong>：Hierarchical clustering seems to be a <strong>better option</strong>, as more insights are provided on grouping clients into sub-clusters and then main clusters.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Hierarchical clustering 更好，因为它提供了更多关于客户分组的洞察，包括子 cluster 和主 cluster 的层级结构。</span></li>\n                <li>✅ <strong>必写</strong>：All main clusters and sub-clusters with average income and average credit amounts are provided to make better decisions (refer to Table 4.2).<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Table 4.2 提供了所有主 cluster 和子 cluster 的平均收入和信用额度，便于做出更好的决策。</span></li>\n                <li>Significant differences in average annual income and average credit amount between clusters are more visible in hierarchical clustering.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">各 cluster 之间的平均收入和信用额度差异在 hierarchical clustering 中更显著。</span></li>\n              </ol>\n              <span class=\"ep-answer-label\" style=\"margin-top:10px\">情况二：K-means 更好（可替代答案）</span>\n              <ol class=\"ep-list\">\n                <li>K-means clustering seems to be a better option, as it produces cleaner and more balanced clusters that are easier to interpret.</li>\n                <li>K-means provides clear cluster-level summaries of average income and credit amount (Table 4.5), allowing straightforward comparison between the two groups.</li>\n                <li>The average distances within clusters (Table 4.4) show that Cluster 1 is highly homogenous (0.9393), suggesting K-means has effectively grouped similar clients together.</li>\n              </ol>\n            </div>\n          </div>\n\n          <!-- Q4.2.5 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q4-25\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q4-25')\">\n              <span class=\"ep-subq-num\">Q4.2.5</span>\n              <span class=\"ep-subq-title\">Improvements for Hierarchical clustering groupings</span>\n              <span class=\"ep-subq-marks\">3 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>最优 cluster 数的判断 | How to Find Optimal K:</strong><br>\n                看 dendrogram 里高度跳跃最大的地方——从 N 个合并到 N-1 个时跳跃最大，说明 N 个 cluster 最合适。<br>\n                本题：从 2 个合并到 1 个时跳跃最大 → <strong>2 个 cluster 最优</strong>（而非现有的 3 个）。\n              </div>\n              <p class=\"ep-h5\">得分点 | Marking Points</p>\n              <p style=\"font-size:13px;color:var(--color-text-secondary)\">三个点都要写，各 1 mark。</p>\n              <span class=\"ep-answer-label\">标准答案 | Model Answer（三条全写）</span>\n              <ol class=\"ep-list\">\n                <li>Looking at the dendrogram, it is recommended to cluster into <strong>2 main clusters</strong> rather than 3, as there is a significant jump in height when going from 2 clusters to 1, indicating a natural break at 2 clusters.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">建议分成 2 个主 cluster 而不是 3 个，因为从 2 个合并到 1 个时高度有显著跳跃，说明 2 个 cluster 是自然分界点。</span></li>\n                <li>We can explicitly see <strong>2 main groups at distance 2.8</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">在距离 2.8 处可以明确看到 2 个主 cluster。</span></li>\n                <li>Recommend to merge: <strong>Cluster 1: sub-clusters 1, 2, 3</strong>；<strong>Cluster 2: sub-clusters 4, 5, 6, 7, 8, 9, 10</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">建议将子 cluster 重新合并为两组：1/2/3 为一组，4-10 为另一组。</span></li>\n              </ol>\n            </div>\n          </div>\n\n          <!-- Q4.2.6 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q4-26\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q4-26')\">\n              <span class=\"ep-subq-num\">Q4.2.6</span>\n              <span class=\"ep-subq-title\">Recommendations for credit risk assessment (hierarchical model)</span>\n              <span class=\"ep-subq-marks\">4 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • 题目<strong>没有指定</strong>用哪个 clustering 结果，但老师的答案全部引用 <strong>Table 4.2（hierarchical clustering）</strong>，所以默认用 Table 4.2 的数据来写建议<br>\n                • 题目说 \"recommendations\" → 不是描述数据，每条观察后面必须跟行动建议（用 <strong>recommend / encourage / investigate</strong>）<br>\n                • 题目说 \"credit risk assessment\" → 围绕谁是高风险、谁是低风险、怎么处理<br>\n                • <strong>最后一条永远说数据集太小建议扩大样本——送分必写！</strong>\n              </div>\n              <div class=\"ep-warn-box\">⚠️ Point 1 和 Point 5 <strong>必须写</strong>，再加任意 2 个。数据来源锁定 <strong>Table 4.2</strong>（不是 K-means 的表）。每条观察后面必须跟行动建议（recommend/encourage/investigate）。<strong>最后一条数据集太小必须写——送分！</strong><br><em>Points 1 &amp; 5 mandatory. Source = Table 4.2. Always end with \"dataset too small\" point.</em></div>\n              <span class=\"ep-answer-label\">5 个 Valid Points（1+5必写，再选2个）</span>\n              <ol class=\"ep-list\">\n                <li>✅ <strong>必写</strong>：Clients in Cluster 1 are <strong>risk free</strong> — none are bad clients. <strong>Encourage giving more credits</strong> to these clients.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 1 的客户风险为零，全部是好客户，建议给予更多信用额度。</span></li>\n                <li>In Cluster 3, other than sub-clusters 7 and 8, all other sub-clusters have average credit amount <strong>greater than average income</strong> — <strong>thoroughly investigate before approving</strong> credits.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 3 中除子 cluster 7 和 8 外，其余子 cluster 的平均信用额度均高于平均年收入，审批信用前应彻底调查。</span></li>\n                <li>In Cluster 3, sub-clusters <strong>4, 8, 9 have no bad clients</strong> — investigate their characteristics to understand why (e.g., married with spouse income, less family burden).<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 3 中子 cluster 4、8、9 没有坏客户，需进一步调查其低风险特征。</span></li>\n                <li>Cluster 2 is <strong>high risk</strong> despite high income — the only client is a bad client. <strong>Further investigation</strong> needed.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Cluster 2 收入高但仍是坏客户，属于高风险，需进一步调查。</span></li>\n                <li>✅ <strong>必写（送分）</strong>：The dataset is <strong>too small</strong> (only 40 clients) to draw in-depth insights. <strong>Recommend conducting the analysis with a larger number of observations/clients</strong>.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">数据集太小（仅 40 个客户），难以得出深入洞察，建议使用更大的数据集重新分析。</span></li>\n              </ol>\n            </div>\n          </div>\n\n        </div><!-- /analysis col -->\n      </div><!-- /split layout -->\n    </div><!-- /q4 panel -->\n\n    <!-- ══════════════════ Q5 · Classification Tree ══════════════════ -->\n    <div id=\"2024s1-q5\" class=\"ep-q-panel\">\n      <div class=\"ep-split-layout\">\n\n        <!-- ── 左栏：原题 ── -->\n        <div class=\"ep-orig-col\">\n          <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n          <div class=\"ep-orig-card\">\n            <div class=\"ep-orig-bg\">\n              <strong>SECTION 1 · Q5 (25 marks)</strong><br>\n              <strong>JB Hi-Fi — Credit Risk Classification Tree</strong><br>\n              As a business analyst at JB Hi-Fi, addressing imbalanced classes in fraud detection is a significant responsibility. Customers can apply for credit to make purchases. A comprehensive dataset with variables below was used to build a classification tree with 250 observations, where the target variable is whether a customer is a \"bad\" client (<code>bad_client_target</code>).\n              <table class=\"ep-orig-tbl\" style=\"margin-top:10px\">\n                <tr><th>Variable</th><th>Description</th></tr>\n                <tr><td>credit_amount</td><td>Credit requested (AUD)</td></tr>\n                <tr><td>credit_term</td><td>Repayment duration (months)</td></tr>\n                <tr><td>age</td><td>Customer age (years)</td></tr>\n                <tr><td>sex</td><td>Binary: 1 = male, 0 = female</td></tr>\n                <tr><td>education</td><td>Incomplete secondary / Secondary / Incomplete higher / Higher</td></tr>\n                <tr><td>product_type</td><td>Audio &amp; Video / Mobile phones / Computers / Household appliances</td></tr>\n                <tr><td>having_children</td><td>Binary: 1 = at least one child, 0 = none</td></tr>\n                <tr><td>family_status</td><td>Binary: 1 = married, 0 = not married</td></tr>\n                <tr><td>income</td><td>Annual income (AUD)</td></tr>\n                <tr><td>bad_client_target</td><td>Binary: 1 = bad client, 0 = not bad client</td></tr>\n              </table>\n              <p class=\"ep-orig-note\" style=\"margin-top:8px\">The data was used solely as a training set (not split into training/validation/testing). A full-grown tree with max 5 levels was applied. <strong>Figure 5.1</strong>: Full-Grown Tree — Root node splits on credit_amount ≤ 41,500 (231 left, 19 right). Left branch further splits on income ≤ 31,500; Right branch splits on age ≤ 29. <strong>Figure 5.2</strong>: Cumulative Lift Chart, ROC Curve (AUC=0.765), Decile-wise Lift Chart — all from Training set.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">5 marks</span>\n              <span class=\"ep-orig-qnum\">Q5.1</span>\n              <p class=\"ep-orig-qtxt\">What are two issues associated with exclusively using a training set for building a predictive model? Can you suggest a solution to mitigate these issues and explain your answer clearly?</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">8 marks</span>\n              <span class=\"ep-orig-qnum\">Q5.2</span>\n              <p class=\"ep-orig-qtxt\">Based on the Excel printouts provided earlier in the question, compute the classification errors for <strong>one to three decision nodes</strong> for the full classification tree based on the training set. Arrange the decision nodes in a top-to-bottom, left-to-right order on the classification tree. Show your calculations and round your final answers to four decimal places. What observations can you make about these classification errors on the training set?</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">5 marks</span>\n              <span class=\"ep-orig-qnum\">Q5.3</span>\n              <p class=\"ep-orig-qtxt\">Based on the Excel printouts provided earlier in the question, evaluate the <strong>Cumulative Lift chart, AUC, Decile-wise lift chart</strong> from the training set. What conclusions can you draw upon?</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">5 marks</span>\n              <span class=\"ep-orig-qnum\">Q5.4</span>\n              <p class=\"ep-orig-qtxt\">Describe the key steps involved in determining the values represented by the bars in a decile-wise chart. Additionally, determine the number of observations allocated to each decile and the number of actual Class 1 observations are in the second decile. <em>Hint: There are ten actual Class 1 values altogether.</em></p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">2 marks</span>\n              <span class=\"ep-orig-qnum\">Q5.5</span>\n              <p class=\"ep-orig-qtxt\">For a 32-year-old <strong>female</strong> customer, who is <strong>married</strong> with two children, has an income of <strong>70,000 AUD</strong> purchased a mobile phone, has applied for a <strong>2,000 AUD credit amount</strong> to be paid over 12 months, determine the predicted outcome (classification) and identify the specific rule in the classification tree that leads to this prediction.</p>\n            </div>\n          </div>\n        </div>\n\n        <!-- ── 右栏：解析 ── -->\n        <div class=\"ep-analysis-col\">\n          <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n\n          <!-- 背景知识 -->\n          <div class=\"ep-info-box\" style=\"margin-bottom:12px\">\n            💡 <strong>背景知识 | Key Rules to Remember</strong><br><br>\n            <strong>分类树基本逻辑：</strong><br>\n            • 从根节点开始，每个节点用一个变量做判断，往左或往右走<br>\n            • 走到 terminal node 停止，读该节点的 Class 预测值<br>\n            • Binary 变量编码：female = <strong>0</strong>，male = <strong>1</strong>；married = <strong>1</strong>，not married = <strong>0</strong><br><br>\n            <strong>Majority Rule（多数规则）：</strong><br>\n            • 每个分组里 Class 0 和 Class 1 谁多，就预测谁<br>\n            • <strong>errors = 少数派的人数，不是多数派</strong><br>\n            • 例：某组 Class 0 = 9，Class 1 = 10 → majority 是 Class 1 → errors = 9（Class 0 是少数派）<br><br>\n            <strong>Classification Error 规律：</strong><br>\n            • 训练集上，decision nodes 越多，error 只会降不会升<br>\n            • 因为树越深，分组越纯，少数派越来越少<br>\n            • 这是 <strong>expected</strong> 的结果，不是 unexpected\n          </div>\n\n          <!-- Q5.1 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q5-1\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q5-1')\">\n              <span class=\"ep-subq-num\">Q5.1</span>\n              <span class=\"ep-subq-title\">Two issues with training-only model + solution</span>\n              <span class=\"ep-subq-marks\">5 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-warn-box\">⚠️ 两个 reason 必须不同！Overfitting 和 \"overly optimistic\" 属于同一个点，只给 1 分。第二个 reason 必须写 \"no independent validation set\"。<br><em>Two reasons must be DISTINCT. Overfitting ≠ second reason. Reason 2 = no independent validation set.</em></div>\n              <p class=\"ep-h5\">得分点 | Marking Points</p>\n              <ul class=\"ep-list\">\n                <li>1 mark：Limitation — no separate data for unseen evaluation</li>\n                <li>1 mark：Reason 1 — Overfitting</li>\n                <li>1 mark：Reason 2 — No independent validation set（必须与 Reason 1 不同）</li>\n                <li>2 marks：Solution — split into training/validation/testing + 解释三个 set 各自作用</li>\n              </ul>\n              <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n              <p class=\"ep-h5\">Limitation（1 mark）</p>\n              <div class=\"ep-tip-box\">\"Using the entire dataset as the training set means <strong>no separate data</strong> can evaluate how well the model performs on unseen data.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">将全部数据用于训练，意味着没有独立数据可以评估模型在未见数据上的表现。</span></div>\n              <p class=\"ep-h5\">Reason 1 — Overfitting（1 mark）</p>\n              <div class=\"ep-tip-box\">\"This can lead to <strong>overfitting</strong> — the model captures noise or patterns specific to training data rather than general patterns.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">导致过拟合——模型记住了训练数据的特殊规律而非普遍规律。</span></div>\n              <p class=\"ep-h5\">Reason 2 — No independent validation（1 mark）</p>\n              <div class=\"ep-tip-box\">\"Without a separate validation set, there is <strong>no independent dataset</strong> to assess the model's performance and reliability.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">没有独立验证集，无法对模型表现和可靠性进行独立评估。</span></div>\n              <p class=\"ep-h5\">Solution + Explanation（2 marks）</p>\n              <div class=\"ep-tip-box\">\"A recommended solution is to split the data into <strong>training, validation, and testing sets</strong>. The training set is used to train the model; the validation set is used to fine-tune and evaluate performance during training; the test set is kept completely separate until the final evaluation stage to assess performance on unseen data.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">建议将数据分为训练集、验证集和测试集。训练集用于训练模型，验证集用于调优和评估训练过程中的表现，测试集完全独立保留至最终评估阶段，用于评估模型在未见数据上的表现。</span></div>\n            </div>\n          </div>\n\n          <!-- Q5.2 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q5-2\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q5-2')\">\n              <span class=\"ep-subq-num\">Q5.2</span>\n              <span class=\"ep-subq-title\">Classification errors for 1–3 decision nodes</span>\n              <span class=\"ep-subq-marks\">8 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从哪里读数据：</strong><strong>Figure 5.1 分类树</strong> → 每个节点旁边的数字，上面是 Class 0 数量，下面是 Class 1 数量</div>\n              <div class=\"ep-warn-box\">⚠️ <strong>Errors = 少数派人数，不是多数派！</strong> 节点顺序：从上到下、从左到右。分母永远是总 observations 数（250）。<br><em>Errors = minority class count. Node order: top-to-bottom, left-to-right. Denominator always = 250.</em></div>\n              <div class=\"ep-info-box\">💡 <strong>树结构速记 | Tree Structure:</strong><br>\n                Node 1（根）: credit_amount ≤ 41,500 → 左 231（0:231, 1:0）| 右 19（0:9, 1:10）<br>\n                Node 2（左子）: income ≤ 31,500 → 左-左 174（0:174,1:0）| 左-右 57（0:57,1:0）<br>\n                Node 3（右子）: age ≤ 29 → 右-左 9（0:0,1:9）| 右-右 10（0:9,1:1）\n              </div>\n              <p class=\"ep-h5\">得分点 | Marking Points</p>\n              <ul class=\"ep-list\">\n                <li>1 mark：正确处理 1→3 nodes 的方法</li>\n                <li>1 mark：正确尝试区分 Class 0 和 Class 1</li>\n                <li>1 mark：正确使用 majority rule</li>\n                <li>1 mark：整体方法正确</li>\n                <li>2 marks：三个 nodes 的答案全部正确</li>\n                <li>2 marks：Observation（error 下降）+ 解释原因</li>\n              </ul>\n              <span class=\"ep-answer-label\">计算过程 | Working</span>\n              <table class=\"ep-param-table\" style=\"margin-top:8px\">\n                <tr><th>Nodes</th><th>各分组</th><th>Class 0</th><th>Class 1</th><th>Majority</th><th>Errors</th></tr>\n                <tr><td rowspan=\"2\">1</td><td>Left（credit ≤ 41,500）</td><td>231</td><td>0</td><td>Class 0</td><td>0</td></tr>\n                <tr><td>Right（credit &gt; 41,500）</td><td>9</td><td>10</td><td>Class 1</td><td><strong>9</strong></td></tr>\n                <tr><td colspan=\"5\" style=\"text-align:right;font-weight:600;color:var(--color-text-info)\">% Error = (0+9)/250 =</td><td><strong>0.0360</strong></td></tr>\n                <tr><td rowspan=\"3\">2</td><td>Left-left（credit ≤ 41,500, income ≤ 31,500）</td><td>174</td><td>0</td><td>Class 0</td><td>0</td></tr>\n                <tr><td>Left-right（credit ≤ 41,500, income &gt; 31,500）</td><td>57</td><td>0</td><td>Class 0</td><td>0</td></tr>\n                <tr><td>Right（credit &gt; 41,500）</td><td>9</td><td>10</td><td>Class 1</td><td><strong>9</strong></td></tr>\n                <tr><td colspan=\"5\" style=\"text-align:right;font-weight:600;color:var(--color-text-info)\">% Error = (0+0+9)/250 =</td><td><strong>0.0360</strong></td></tr>\n                <tr><td rowspan=\"4\">3</td><td>Left-left（174 records）</td><td>174</td><td>0</td><td>Class 0</td><td>0</td></tr>\n                <tr><td>Left-right（57 records）</td><td>57</td><td>0</td><td>Class 0</td><td>0</td></tr>\n                <tr><td>Right-left（age ≤ 29, 9 records）</td><td>0</td><td>9</td><td>Class 1</td><td>0</td></tr>\n                <tr><td>Right-right（age &gt; 29, 10 records）</td><td>9</td><td>1</td><td>Class 0</td><td><strong>1</strong></td></tr>\n                <tr><td colspan=\"5\" style=\"text-align:right;font-weight:600;color:var(--color-text-info)\">% Error = (0+0+0+1)/250 =</td><td><strong>0.0040</strong></td></tr>\n              </table>\n              <p class=\"ep-h5\" style=\"margin-top:12px\">Observation（2 marks — 老师原文）</p>\n              <div class=\"ep-tip-box\">\"The classification error <strong>consistently decreases</strong> as the number of decision nodes increases from 1 to 3. This is <strong>expected</strong> because the classification tree becomes more specific and tailored to the training data, capturing more patterns and reducing errors.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">随着决策节点从 1 增加到 3，分类错误率持续下降。这符合预期，因为更多节点使树更精细，对训练数据拟合程度更高，错误率随之降低。</span></div>\n\n              <!-- ══ 考场速查：所有可能趋势模板 ══ -->\n              <div style=\"margin-top:18px;padding-top:14px;border-top:2px dashed var(--color-border-info);\">\n                <p class=\"ep-h5\" style=\"color:var(--color-text-info);font-size:13px;margin-bottom:10px\">⚡ 考场速查 — 所有可能趋势的 Observation 模板</p>\n                <div class=\"ep-info-box\" style=\"margin-bottom:10px\">📌 <strong>答 Observation 两步走：</strong><br>① 描述趋势（errors 怎么变）<br>② 解释原因（是否 expected，为什么）</div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况一：Error 持续下降（本题）</strong></p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"The classification error <strong>consistently decreases</strong> as the number of decision nodes increases from 1 to 3. This is <strong>expected</strong> because the classification tree becomes more specific and tailored to the training data, capturing more patterns and reducing errors on the training set.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">错误率持续下降。符合预期——节点越多，树越精细，对训练数据的拟合越好，训练集上错误越少。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况二：Error 先下降后不变（平台期）</strong></p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"The classification error <strong>decreases initially</strong> and then <strong>remains unchanged</strong> as the number of decision nodes increases. This suggests that additional nodes beyond a certain point do not provide further discriminating power, as the additional splits are unable to separate the remaining classes more effectively.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">错误率先下降后趋于平稳，说明超过某个节点数后，额外的分裂不能进一步提升对剩余数据的区分能力。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况三：Error 完全不变（每次 node 都无效）</strong></p>\n                <div class=\"ep-tip-box\" style=\"margin:4px 0 10px\">\"The classification error <strong>remains unchanged</strong> across 1 to 3 decision nodes. This suggests that the additional splits do not improve the model's ability to separate the classes, possibly because the new nodes are splitting on variables that are not useful discriminators for this dataset.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">错误率保持不变，说明额外的分裂对分类没有帮助，可能是新节点选取的变量没有区分能力。</span></div>\n\n                <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况四：Error 先下降后上升（不寻常！可能数据问题）</strong></p>\n                <div class=\"ep-warn-box\" style=\"margin:4px 0 10px\">\"The classification error <strong>decreases initially</strong> but then <strong>increases</strong> with the third decision node. This is <strong>unexpected</strong> on a training set, as adding more nodes should not increase training error. This may indicate an issue with the data, such as class imbalance in a particular node, or that the reported figures may warrant further investigation.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">错误率先降后升，在训练集上属于异常——理论上节点越多训练误差只降不升。可能是某个节点的类别严重不平衡，或数据本身存在问题，需进一步核查。</span></div>\n\n                <div class=\"ep-info-box\" style=\"margin-top:4px\">💡 <strong>规律总结 | Key Rule：</strong><br>训练集上，节点越多 → error <strong>只会 ≤ 之前，不会 &gt; 之前</strong>（这是必然规律）。<br>如果 error 反而升高 → 说明有数据异常，必须质疑数据。<br><em>On training data, adding nodes can only maintain or reduce error — never increase it. An increase signals a data problem.</em></div>\n              </div>\n            </div>\n          </div>\n\n          <!-- Q5.3 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q5-3\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q5-3')\">\n              <span class=\"ep-subq-num\">Q5.3</span>\n              <span class=\"ep-subq-title\">Evaluate Cumulative Lift chart, AUC, Decile-wise lift chart</span>\n              <span class=\"ep-subq-marks\">5 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <p class=\"ep-h5\">得分点 | Marking Points</p>\n              <ul class=\"ep-list\">\n                <li>1 mark：Cumulative Lift Chart 解读</li>\n                <li>1 mark：AUC 解读</li>\n                <li>1 mark：Decile-wise Lift Chart 解读</li>\n                <li>1 mark：Overall conclusion</li>\n                <li>1 mark：Caution（只基于 training set）</li>\n              </ul>\n              <div class=\"ep-info-box\">💡 <strong>从哪里读数据：</strong>全部来自 <strong>Figure 5.2</strong> 的三张图</div>\n\n              <p class=\"ep-h5\">Cumulative Lift Chart — 怎么看</p>\n              <div class=\"ep-info-box\">\n                • X 轴：案例数量；Y 轴：累计找到的 Class 1 数量<br>\n                • 两条线：红色基准线（随机）vs 模型线<br>\n                • 模型线在基准线<strong>上方</strong> → 优于随机选择 ✅<br>\n                • 模型线与基准线<strong>重合</strong> → 和随机一样，无价值<br>\n                • 模型线在基准线<strong>下方</strong> → 比随机还差\n              </div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况一（模型线在基准线上方 — 本题）：</strong></p>\n              <div class=\"ep-tip-box\">\"The cumulative lift chart shows the model line is <strong>above</strong> the baseline, indicating the model performs <strong>better than random selection</strong> in identifying Class 1 cases.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">累积提升图显示模型曲线高于基准线，说明模型识别 Class 1 案例的能力优于随机选择。</span></div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况二（模型线与基准线重合）：</strong></p>\n              <div class=\"ep-tip-box\">\"The cumulative lift chart shows the model line <strong>overlaps</strong> with the baseline, indicating the model performs <strong>no better than random selection</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">累积提升图显示模型曲线与基准线重合，说明模型表现与随机选择无异，没有预测价值。</span></div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况三（模型线在基准线下方）：</strong></p>\n              <div class=\"ep-tip-box\">\"The cumulative lift chart shows the model line is <strong>below</strong> the baseline, indicating the model performs <strong>worse than random selection</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">累积提升图显示模型曲线低于基准线，说明模型表现比随机选择还差。</span></div>\n\n              <p class=\"ep-h5\" style=\"margin-top:12px\">AUC（ROC Curve）— 怎么看</p>\n              <div class=\"ep-info-box\">\n                • 图上有三条线：Random（对角线）、Optimum（左上角折线）、Fitted（你的模型）<br>\n                • AUC 值直接从图上标注读取<br>\n                • AUC &gt; 0.9 → <strong>Excellent</strong>；AUC 0.7–0.9 → <strong>Good/Fair</strong>；AUC 接近 0.5 → <strong>Poor</strong>\n              </div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况一（AUC &gt; 0.9）：</strong></p>\n              <div class=\"ep-tip-box\">\"The AUC value of [X] indicates the model has an <strong>excellent</strong> ability to distinguish between the two classes. In approximately [X×100]% of randomly chosen pairs, the model correctly ranks the positive case higher than the negative.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">AUC 值为 [X]，说明模型区分两类的能力极强。在约 [X×100]% 的随机配对中，模型能正确将正类排在负类之前。</span></div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况二（AUC 0.7–0.9 — 本题，AUC = 0.765）：</strong></p>\n              <div class=\"ep-tip-box\">\"The AUC value of <strong>0.765</strong> indicates the model has a <strong>good/fair</strong> ability to distinguish between the two classes. In approximately <strong>76.5%</strong> of randomly chosen pairs, the model correctly ranks the positive case higher than the negative.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">AUC 值为 0.765，说明模型具有良好的区分两类的能力。在约 76.5% 的随机配对中，模型能正确将正类排在负类之前。</span></div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况三（AUC 接近 0.5）：</strong></p>\n              <div class=\"ep-tip-box\">\"The AUC value of [X] indicates the model has <strong>poor</strong> ability to distinguish between the two classes, performing only slightly better than random chance (AUC = 0.5).\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">AUC 值为 [X]，说明模型区分两类的能力较差，仅略优于随机猜测（AUC = 0.5）。</span></div>\n\n              <p class=\"ep-h5\" style=\"margin-top:12px\">Decile-wise Lift Chart — 怎么看</p>\n              <div class=\"ep-info-box\">\n                • X 轴：Decile（1 到 10）；Y 轴：Lift 值（Decile/Global Mean）<br>\n                • 基准线 = 1.0（随机选择）<br>\n                • Lift 值 = 该分位实际 Class 1 数量 ÷ 随机期望 Class 1 数量<br>\n                • 柱子高于 1.0 → 模型有效；等于 1.0 → 和随机一样；低于 1.0 → 比随机差<br>\n                • 好的模型：前几个分位柱子最高，从左到右递减\n              </div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况一（前几分位高，从左到右递减 — 本题）：</strong></p>\n              <div class=\"ep-tip-box\">\"The decile-wise lift chart shows that the first few deciles have significantly higher lift values, with values decreasing from left to right. This indicates the model is <strong>effectively separating high-scoring from low-scoring cases</strong>, concentrating Class 1 predictions in the top deciles.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">分位提升图显示前几个分位的 lift 值明显较高，从左到右逐渐降低，说明模型能有效区分高分和低分案例，将 Class 1 集中在较高分位中。</span></div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况二（所有柱子接近 1.0）：</strong></p>\n              <div class=\"ep-tip-box\">\"The decile-wise lift chart shows that all deciles have lift values close to 1.0, indicating the model has <strong>little ability to separate</strong> Class 1 from Class 0 cases.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">分位提升图显示所有分位的 lift 值均接近 1.0，说明模型区分 Class 1 和 Class 0 的能力有限。</span></div>\n              <p style=\"font-size:12px;color:var(--color-text-secondary);margin:4px 0 2px\"><strong>情况三（排列混乱，无递减规律）：</strong></p>\n              <div class=\"ep-tip-box\">\"The decile-wise lift chart shows <strong>no clear decreasing pattern</strong> from left to right, suggesting the model is <strong>inconsistent</strong> in ranking high-probability Class 1 cases.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">分位提升图从左到右没有明显递减规律，说明模型排序高概率 Class 1 案例的表现不稳定。</span></div>\n\n              <span class=\"ep-answer-label\" style=\"margin-top:12px\">Q5.3 完整答题模板（本题）</span>\n              <div class=\"ep-tip-box\">\n                <strong>Cumulative Lift Chart</strong>: The model line is above the baseline, indicating the model performs better than random selection in identifying Class 1 cases.<br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">模型曲线高于基准线，说明模型识别 Class 1 的能力优于随机选择。</span><br><br>\n                <strong>AUC</strong>: The AUC value of 0.765 indicates the model has a good/fair ability to distinguish between the two classes. In approximately 76.5% of randomly chosen pairs, the model correctly ranks the positive case higher than the negative.<br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">AUC 值为 0.765，模型具有良好的区分能力，约 76.5% 的随机配对中能正确将正类排在负类之前。</span><br><br>\n                <strong>Decile-wise Lift Chart</strong>: The first few deciles have significantly higher lift values, decreasing from left to right, indicating the model effectively separates high-scoring from low-scoring cases.<br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">前几个分位 lift 值明显较高且从左到右递减，说明模型能有效区分高分和低分案例。</span><br><br>\n                <strong>Overall conclusion</strong>: The model appears to be a good classification model, performing well in distinguishing positive cases and demonstrating reliable predictions.<br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">该模型整体表现良好，能有效识别正类案例，预测较为可靠。</span><br><br>\n                <strong>Caution</strong>: However, these conclusions are drawn from the training set only; validation and test sets should also be considered to ensure reliability and generalisation to unseen data.<br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">但需注意，以上结论均基于训练集，应使用验证集和测试集进一步确认模型的可靠性和泛化能力。</span>\n              </div>\n            </div>\n          </div>\n\n          <!-- Q5.4 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q5-4\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q5-4')\">\n              <span class=\"ep-subq-num\">Q5.4</span>\n              <span class=\"ep-subq-title\">Decile-wise chart steps + calculations</span>\n              <span class=\"ep-subq-marks\">5 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <p class=\"ep-h5\">得分点 | Marking Points</p>\n              <ul class=\"ep-list\">\n                <li>3 marks：五个步骤（1分=有点理解，2分=接近，3分=完整五步）</li>\n                <li>1 mark：每个 decile 的 observations 数量</li>\n                <li>1 mark：第二个 decile 里实际 Class 1 的数量</li>\n              </ul>\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                \"observations in each decile\" → 总数 ÷ 10<br>\n                \"actual Class 1 in Nth decile\" → 读图第 N 根柱子 lift 值 × 期望值<br>\n                Hint 给了总 Class 1 数量（本题 = 10）→ 用来算期望值（10/250）\n              </div>\n              <span class=\"ep-answer-label\">五个步骤（老师原文）</span>\n              <ol class=\"ep-list\">\n                <li><strong>Sorting the Data</strong>：Arrange the predictions in descending order from highest to lowest.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">将预测值从高到低排序。</span></li>\n                <li><strong>Dividing into Deciles</strong>：Divide your sorted predictions into 10 equal parts, with each part representing a decile.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">将排序后的预测值均分为 10 组，每组即一个 decile。</span></li>\n                <li><strong>Calculating Expected value</strong>：Calculate the expected value for Class 1 observations in each decile.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">计算每个 decile 中 Class 1 的期望值。</span></li>\n                <li><strong>Calculating Lift Values</strong>：Actual number of Class 1 ÷ Expected value of Class 1<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Lift 值 = 实际 Class 1 数量 ÷ 期望 Class 1 数量</span></li>\n                <li><strong>Plotting the Bars</strong>：Plot the lift values as bars; x-axis = deciles (1–10), y-axis = lift values.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">将 lift 值绘制成柱状图，x 轴为分位（1–10），y 轴为 lift 值。</span></li>\n              </ol>\n              <span class=\"ep-answer-label\">计算 | Calculations</span>\n              <div class=\"ep-tip-box\">\n                Observations per decile = 250 ÷ 10 = <strong>25 个</strong><br>\n                Expected Class 1 per decile = 25 × (10/250) = <strong>1 个</strong><br>\n                Lift value in second decile (from chart) = <strong>2</strong><br>\n                Actual Class 1 in second decile = 2 × 1 = <strong>2 个</strong>\n              </div>\n              <p class=\"ep-h5\">答题模板</p>\n              <div class=\"ep-tip-box\">\"There are <strong>25 observations</strong> in each decile (250 ÷ 10 = 25). A random sample of 25 would be expected to contain 25 × (10/250) = <strong>1</strong> Class 1. The lift value in the second decile is 2, therefore there are <strong>2 actual Class 1 values</strong> in the second decile.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">每个分位有 25 个观测值。随机情况下期望含 1 个 Class 1。第二分位 lift 值为 2，因此实际有 2 个 Class 1。</span></div>\n            </div>\n          </div>\n\n          <!-- Q5.5 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q5-5\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q5-5')\">\n              <span class=\"ep-subq-num\">Q5.5</span>\n              <span class=\"ep-subq-title\">Predict classification for specific customer</span>\n              <span class=\"ep-subq-marks\">2 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <p class=\"ep-h5\">得分点 | Marking Points</p>\n              <ul class=\"ep-list\">\n                <li>1 mark：正确的 decision rules 路径（三步都对）</li>\n                <li>1 mark：正确的预测结果</li>\n              </ul>\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • 题目给你一堆客户信息 → 逐个代入树的每个节点条件<br>\n                • 每个节点只用<strong>一个变量</strong>做判断，其他信息暂时不用管<br>\n                • 遇到 binary 变量注意编码：female = 0，male = 1<br>\n                • 走到 terminal node 就停，读那个节点的 Class 预测值<br>\n                • <strong>从哪里看：Figure 5.1 分类树</strong> — 从根节点开始逐步往下走\n              </div>\n              <span class=\"ep-answer-label\">本题路径 | Decision Path</span>\n              <div class=\"ep-tip-box\">\n                Step 1: credit_amount = 2,000 <strong>≤ 41,500</strong> → go <strong>Left</strong><br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">信用额度 2,000 ≤ 41,500，走左边</span><br><br>\n                Step 2: income = 70,000 <strong>≥ 31,500</strong> → go <strong>Right</strong><br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">收入 70,000 ≥ 31,500，走右边</span><br><br>\n                Step 3: sex = <strong>0 (female) &lt; 0.5</strong> → go <strong>Left</strong> → terminal node ✅<br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">性别 = 0（女性）&lt; 0.5，走左边，到达终端节点</span>\n              </div>\n              <p class=\"ep-h5\">答题模板</p>\n              <div class=\"ep-tip-box\">\"1. credit_amount = 2,000 ≤ 41,500 → go left<br>2. income = 70,000 ≥ 31,500 → go right<br>3. sex = 0 (female) &lt; 0.5 → go left → terminal node<br><br>Predicted outcome: this customer is <strong>not a bad client (Class 0)</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">预测结果：该客户不是高风险客户（Class 0）。</span></div>\n              <div class=\"ep-warn-box\" style=\"margin-top:10px\">⚡ <strong>考场速查 — 走树通用模板</strong><br>\n                Step 1: [variable] = [value] [≤/&gt;] [threshold] → go [Left/Right]<br>\n                Step 2: [variable] = [value] [≤/&gt;] [threshold] → go [Left/Right]<br>\n                Step 3: [variable] = [value] [≤/&gt;] [threshold] → go [Left/Right] → terminal node<br>\n                Predicted outcome: this customer is [not] a bad client (Class [0/1]).\n              </div>\n            </div>\n          </div>\n\n        </div><!-- /analysis col -->\n      </div><!-- /split layout -->\n    </div><!-- /q5 panel -->\n\n  </div><!-- /2024s1 session -->\n\n</div><!-- /ep-wrap -->\n\n<script>\nfunction epSession(id, btn) {\n  document.querySelectorAll('.ep-session').fo
