 can lead to <strong>overfitting</strong> — the model captures noise or patterns specific to training data rather than general patterns.<br>（导致过拟合——模型记住了训练数据的特殊规律而非普遍规律）<br><br>2. The model's reported accuracy may be <strong>overly optimistic</strong> and not reflect how it would perform on new data.<br>（报告的准确率过于乐观，不能反映在新数据上的真实表现）</div>\n          <p class=\"ep-h5\">Solution + Explanation（建议改进方法及说明） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-tip-box\">\"A recommended solution is to split the data into <strong>training, validation, and testing sets</strong>. This allows for more accurate performance assessment and tuning (e.g., pruning the tree), ensuring the model generalises to new data better.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">建议将数据分为训练集、验证集和测试集。这样可以更准确地评估性能并调优（如剪枝），确保模型能更好地泛化到新数据。</span></div>\n          <div class=\"ep-info-box\">📌 <strong>答题模板：</strong><br>Limitation → \"no separate data for unseen evaluation\"（没有独立数据用于未见数据评估）<br>Reason 1 → \"overfitting — captures noise not general patterns\"（过拟合——记住特殊规律而非普遍规律）<br>Reason 2 → \"overly optimistic accuracy\"（准确率过于乐观）<br>Solution → \"training / validation / testing split\"（训练/验证/测试集划分）<br>Why → \"generalises better + allows pruning\"（更好泛化 + 允许剪枝）</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Limitation</td><td>Training set only, no unseen evaluation</td><td>1</td></tr>\n            <tr><td>Reason 1</td><td>Overfitting</td><td>1</td></tr>\n            <tr><td>Reason 2</td><td>Overly optimistic outcomes</td><td>1</td></tr>\n            <tr><td>Solution</td><td>Train/validation/test split</td><td>1</td></tr>\n            <tr><td>Explanation</td><td>Generalises better + allows pruning</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-2\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-2')\">\n          <span class=\"ep-subq-num\">Q5.2</span>\n          <span class=\"ep-subq-title\">Classification errors for 1–3 decision nodes. What observations can you make?</span>\n          <span class=\"ep-subq-marks\">8 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>Majority Rule（多数投票法）：</strong><br>每个末端 group → 数 Class 0 和 Class 1 → 多的那方 = 预测分类 → 少的那方数量 = errors<br>Error rate = total errors ÷ 2000 ｜ 值 ≤ threshold → 左（left）｜ 值 &gt; threshold → 右（right）</div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">① 1 Decision Node — Node 1: Education ≤ 12.5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(~2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Group</th><th>Class 0</th><th>Class 1</th><th>Majority</th><th>Errors</th></tr>\n            <tr><td>Education ≤ 12.5 (489 obs)</td><td>489</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Education &gt; 12.5 (1511 obs)</td><td>637</td><td>874</td><td>Class 1</td><td>637</td></tr>\n          </table>\n          <div class=\"ep-formula\">% Error = (0 + 637) / 2000 = <strong>0.3185</strong></div>\n          <p class=\"ep-h5\">② 2 Decision Nodes — +Node 2: Age ≤ 38.5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(~2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Group</th><th>Class 0</th><th>Class 1</th><th>Majority</th><th>Errors</th></tr>\n            <tr><td>Edu ≤ 12.5, Age ≤ 38.5 (93 obs)</td><td>93</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Edu ≤ 12.5, Age &gt; 38.5 (396 obs)</td><td>396</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Education &gt; 12.5 (1511 obs)</td><td>637</td><td>874</td><td>Class 1</td><td>637</td></tr>\n          </table>\n          <div class=\"ep-formula\">% Error = (0 + 0 + 637) / 2000 = <strong>0.3185</strong></div>\n          <p class=\"ep-h5\">③ 3 Decision Nodes — +Node 3: Religious ≤ 0.5 <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(~2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Group</th><th>Class 0</th><th>Class 1</th><th>Majority</th><th>Errors</th></tr>\n            <tr><td>Edu ≤ 12.5, Age ≤ 38.5 (93 obs)</td><td>93</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Edu ≤ 12.5, Age &gt; 38.5 (396 obs)</td><td>396</td><td>0</td><td>Class 0</td><td>0</td></tr>\n            <tr><td>Edu &gt; 12.5, Religious ≤ 0.5 (764 obs)</td><td>178</td><td>586</td><td>Class 1</td><td>178</td></tr>\n            <tr><td>Edu &gt; 12.5, Religious &gt; 0.5 (747 obs)</td><td>459</td><td>288</td><td>Class 0</td><td>288</td></tr>\n          </table>\n          <div class=\"ep-formula\">% Error = (0 + 0 + 178 + 288) / 2000 = 466 / 2000 = <strong>0.2330</strong></div>\n          <p class=\"ep-h5\">Observation（规律说明） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks ← 必须说明 expected/unexpected！)</span></p>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：先不变再下降（本题）/ Case 1: stays same then decreases</p>\n          <div class=\"ep-tip-box\">\"The classification error remains the same from node 1 to node 2 (0.3185 → 0.3185), then <strong>decreases</strong> at node 3 (0.2330). This is <strong>expected</strong> because adding Node 2 does not split any group containing errors — both new groups are pure Class 0 with zero errors. The error only decreases when Node 3 further splits the right branch, separating Class 0 and Class 1 observations more effectively.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">从1到2节点错误率不变，到第3节点才下降。这符合预期，因为增加Node 2时新产生的两组都是纯Class 0无错误；只有Node 3进一步分割右支后，错误率才下降。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：持续下降 / Case 2: consistently decreases</p>\n          <div class=\"ep-tip-box\">\"The classification error <strong>consistently decreases</strong> as the number of decision nodes increases from 1 to 3. This is <strong>expected</strong> because the classification tree becomes more specific and tailored to the training data, capturing more patterns and reducing errors.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">随着决策节点增加，分类错误率持续下降。这符合预期，因为更多节点使树更精细，对训练数据拟合程度更高，错误率随之降低。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况三：下降后又上升（不正常！）/ Case 3: increases (unexpected!)</p>\n          <div class=\"ep-tip-box\">\"The error decreases then <strong>increases</strong> at node 3. This is <strong>unexpected</strong> on the training set — normally more nodes lead to lower training errors. This may indicate an issue with the data or node groupings worth investigating.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">错误率先降后升。在训练集上这是<strong>不符合预期的</strong>——通常更多节点会降低训练错误率。这可能表明数据或节点分组存在问题。</span></div>\n          <div class=\"ep-warn-box\">⚠️ 必须说明 <strong>\"expected\"</strong> 或 <strong>\"unexpected\"</strong>！Training set 上错误率正常只会下降或持平，不会上升。</div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>1-node error</td><td>0.3185</td><td>2</td></tr>\n            <tr><td>2-node error</td><td>0.3185</td><td>2</td></tr>\n            <tr><td>3-node error</td><td>0.2330</td><td>2</td></tr>\n            <tr><td>Observation</td><td>Pattern + expected/unexpected + reason</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>8</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-3\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-3')\">\n          <span class=\"ep-subq-num\">Q5.3</span>\n          <span class=\"ep-subq-title\">Predict: 55yo male, married, income $90k, education 15 yrs, household 3, attends religious services.</span>\n          <span class=\"ep-subq-marks\">2 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <div class=\"ep-info-box\">💡 <strong>走树路径规则 / Tree Path Rules：</strong><br>值 ≤ threshold → left branch（左）｜ 值 &gt; threshold → right branch（右）｜ 到达 Terminal Node → 读 Class 预测<br><strong>Class 1 = undecided voter（未决定选民）← 不能写反！Class 0 = decided voter（已决定选民）</strong></div>\n          <div class=\"ep-formula\">Key values: Education = 15    Religious = 1（regularly attends religious services = 1）</div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer — 逐节点路径 / Step-by-step path</span>\n          <table class=\"ep-mini-table\">\n            <tr><th>节点 / Node</th><th>判断条件 / Condition</th><th>该选民的值 / Voter's value</th><th>方向 / Direction</th></tr>\n            <tr><td>Node 1</td><td>Education ≤ 12.5?</td><td>15 &gt; 12.5</td><td>→ Right branch（右）</td></tr>\n            <tr><td>Node 3</td><td>Religious ≤ 0.5?</td><td>1 &gt; 0.5</td><td>→ Right branch（右）</td></tr>\n            <tr><td>Node 7</td><td>Education ≤ 17?</td><td>15 ≤ 17</td><td>→ Left branch（左）→ Terminal</td></tr>\n          </table>\n          <div class=\"ep-tip-box\" style=\"margin-top:10px\"><strong>预测结果：Class 1（Undecided voter，未决定选民）</strong></div>\n          <div class=\"ep-warn-box\">⚠️ 每一步都要写出节点名称、值、方向，不能只写结论。<br><em>Must show each node, the voter's value, and direction — not just the final answer.</em></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Correct path</td><td>All 3 nodes with correct direction</td><td>1</td></tr>\n            <tr><td>Final prediction</td><td>Class 1 / Undecided</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-4\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-4')\">\n          <span class=\"ep-subq-num\">Q5.4</span>\n          <span class=\"ep-subq-title\">Fill error report table. Calculate F1 Score and interpret. Provide overall conclusion.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-h5\">Confusion Matrix 读法 / How to Read</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Actual \\ Predicted</th><th>0</th><th>1</th></tr>\n            <tr><td><strong>0</strong></td><td>1138 (TN ✅)</td><td>5 (FP ❌ Class 0的错误)</td></tr>\n            <tr><td><strong>1</strong></td><td>12 (FN ❌ Class 1的错误)</td><td>845 (TP ✅)</td></tr>\n          </table>\n          <div class=\"ep-info-box\">TN=1138（Actual 0, Predicted 0）｜ FP=5（Actual 0, Predicted 1）← Class 0的错误<br>FN=12（Actual 1, Predicted 0）← Class 1的错误 ｜ TP=845（Actual 1, Predicted 1）</div>\n          <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n          <p class=\"ep-h5\">Error Report <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <table class=\"ep-mini-table\">\n            <tr><th>Class</th><th># Cases</th><th># Errors</th><th>% Error</th></tr>\n            <tr><td>0</td><td>1138+5 = <strong>1143</strong></td><td><strong>5</strong></td><td>5÷1143 = <strong>0.0044</strong></td></tr>\n            <tr><td>1</td><td>12+845 = <strong>857</strong></td><td><strong>12</strong></td><td>12÷857 = <strong>0.0140</strong></td></tr>\n            <tr><td>Overall</td><td><strong>2000</strong></td><td>5+12 = <strong>17</strong></td><td>17÷2000 = <strong>0.0085</strong></td></tr>\n          </table>\n          <p class=\"ep-h5\">F1 Score <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <div class=\"ep-formula\">F1 = 2×TP / (2×TP + FP + FN)\n   = 2×845 / (2×845 + 5 + 12)\n   = 1690 / 1707 = <strong>0.9900</strong></div>\n          <div class=\"ep-info-box\">也可用 / Also valid: F1 = 2 × Precision × Sensitivity / (Precision + Sensitivity)，结果相同但展开版更快！<br><em>Same result but the expanded version above is faster in exams!</em></div>\n          <p class=\"ep-h5\">F1 Interpretation（F1解读） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark)</span></p>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：F1 ≥ 0.9（接近1，本题）/ Case 1: F1 close to 1</p>\n          <div class=\"ep-tip-box\">\"An F1 score of <strong>0.9900</strong> indicates the model achieves a <strong>near-perfect balance</strong> between precision and recall, performing very well at identifying undecided voters in the training set.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">F1=0.9900表示模型在精确率和召回率之间达到<strong>近乎完美的平衡</strong>，在训练集上识别未决定选民的表现非常好。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：F1 0.6–0.9（中等）/ Case 2: F1 moderate</p>\n          <div class=\"ep-tip-box\">\"An F1 score of <strong>[X]</strong> indicates the model achieves a <strong>moderate balance</strong> between precision and recall. The model has reasonable but imperfect performance at identifying [target class] in the training set.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">F1=[X]表示模型在精确率和召回率之间达到<strong>适中的平衡</strong>，识别[目标类别]的表现合理但不完美。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况三：F1 ≤ 0.5（接近0）/ Case 3: F1 close to 0</p>\n          <div class=\"ep-tip-box\">\"An F1 score of <strong>[X]</strong> indicates the model has a <strong>poor balance</strong> between precision and recall — either failing to identify positive cases (low recall) or too many false positives (low precision), suggesting <strong>poor performance</strong> on the training set.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">F1=[X]表示模型在精确率和召回率之间<strong>平衡较差</strong>，可能遗漏了大量正例（低召回率）或产生过多假正例（低精确率），训练集表现较差。</span></div>\n          <p class=\"ep-h5\">Overall Conclusion（整体结论） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(1 mark ← 必须写！)</span></p>\n          <div class=\"ep-tip-box\">\"While the model performs well on the training set as evidenced by a low error rate and high F1 score, these results should be interpreted with <strong>caution</strong>. They may not reflect performance on new, unseen data. There is a <strong>risk of overfitting</strong>, so further evaluation using a separate test set is recommended.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">虽然模型在训练集上表现良好（低错误率和高F1），但这些结果需要谨慎解读。可能不反映新数据上的表现，存在<strong>过拟合风险</strong>，建议使用独立测试集进一步验证。</span></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td># Errors (all 3)</td><td>5, 12, 17</td><td>1</td></tr>\n            <tr><td>% Errors (all 3)</td><td>0.0044, 0.0140, 0.0085</td><td>1</td></tr>\n            <tr><td>F1 Score</td><td>0.9900</td><td>1</td></tr>\n            <tr><td>F1 Interpretation</td><td>Near-perfect balance</td><td>1</td></tr>\n            <tr><td>Overall conclusion</td><td>Good BUT training only, overfitting risk</td><td>1</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"ep-subq\" id=\"sq-2025s1-q5-5\">\n        <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2025s1-q5-5')\">\n          <span class=\"ep-subq-num\">Q5.5</span>\n          <span class=\"ep-subq-title\">Expected Class 1 at 500 cases in cumulative lift chart. Interpret AUC = 0.99909.</span>\n          <span class=\"ep-subq-marks\">5 marks</span>\n          <span class=\"ep-subq-arrow\">▼</span>\n        </div>\n        <div class=\"ep-subq-body\">\n          <p class=\"ep-h5\">① Expected Class 1 at 500 cases（500个案例时预期Class 1数量） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(2 marks)</span></p>\n          <div class=\"ep-info-box\">💡 Baseline = 随机抽样时抽到 Class 1 的概率 = Class 1 占总体的比例<br>857 来自 Error Report 的 Class 1 行，# Cases 列（不能猜！<em>857 comes from Class 1 row, # Cases column in Error Report</em>）</div>\n          <div class=\"ep-formula\">Expected Class 1 = Sample size × (Actual Class 1 / Total observations)\n= 500 × (857 / 2000) = <strong>214.25</strong></div>\n          <p class=\"ep-h5\">② AUC Interpretation（AUC解读） <span style=\"font-weight:400;color:var(--color-text-tertiary)\">(3 marks)</span></p>\n          <p class=\"ep-p\" style=\"color:var(--color-text-secondary)\">AUC = <strong>0.99909</strong>（从Figure 5.2的ROC Curve标题读取 / read from ROC Curve title in Figure 5.2）</p>\n          <table class=\"ep-mini-table\">\n            <tr><th>AUC 范围</th><th>评级</th></tr>\n            <tr><td>&gt; 0.9</td><td>Extremely well / Excellent（极好）← 本题</td></tr>\n            <tr><td>0.8 – 0.9</td><td>Good（好）</td></tr>\n            <tr><td>0.7 – 0.8</td><td>Fair（一般）</td></tr>\n            <tr><td>0.5 – 0.7</td><td>Poor（差）</td></tr>\n            <tr><td>= 0.5</td><td>Random guess，无预测能力</td></tr>\n          </table>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况一：AUC &gt; 0.9（本题，Excellent）/ Case 1: AUC > 0.9</p>\n          <div class=\"ep-tip-box\">\"An AUC of <strong>0.99909</strong> indicates the model performs <strong>extremely well</strong> at distinguishing between the two classes. It means that in approximately <strong>99.91%</strong> of randomly chosen pairs (one Class 0, one Class 1), the model correctly ranks the positive case higher than the negative.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">AUC=0.99909表示模型区分两类的能力<strong>极强</strong>。约99.91%的随机配对中（一个Class 0，一个Class 1），模型能正确将正例排在负例之上。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况二：AUC 0.7–0.9（Good/Fair）/ Case 2: AUC 0.7-0.9</p>\n          <div class=\"ep-tip-box\">\"An AUC of <strong>[X]</strong> indicates the model has a <strong>good/fair</strong> ability to distinguish between the two classes. In approximately <strong>[X×100]%</strong> of randomly chosen pairs, the model correctly ranks the positive case higher than the negative.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">AUC=[X]表示模型具有<strong>良好/一般</strong>的区分能力。约[X×100]%的随机配对中，模型能正确排序正例高于负例。</span></div>\n          <p class=\"ep-h5\" style=\"font-weight:400;font-size:12px;color:var(--color-text-secondary)\">情况三：AUC 接近0.5（Poor）/ Case 3: AUC close to 0.5</p>\n          <div class=\"ep-tip-box\">\"An AUC of <strong>[X]</strong> indicates the model has <strong>little ability</strong> to distinguish between the two classes, performing only slightly better than random guessing. This suggests the model is not effective at classifying [target variable].\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">AUC=[X]表示模型几乎没有区分能力，仅略优于随机猜测，说明模型在分类[目标变量]上效果不佳。</span></div>\n          <div class=\"ep-warn-box\">⚠️ <strong>Training Set Caveat ← 所有情况都必须写！值2分！/ Must write for ALL cases! Worth 2 marks!</strong><br><br>\"However, since this AUC is from the <strong>training set only</strong>, it may <strong>overestimate</strong> the model's true performance. The model could be overfitting and may perform worse on new, unseen data. A separate <strong>validation or test set</strong> is needed to confirm the model's generalisability.\"<br><span style=\"font-size:12px\">但由于AUC来自<strong>训练集</strong>，可能<strong>高估</strong>了真实表现。模型可能存在过拟合，在新数据上表现更差。需要独立的<strong>验证集或测试集</strong>来确认模型的泛化能力。</span></div>\n          <span class=\"ep-answer-label\">得分结构</span>\n          <table class=\"ep-score-table\">\n            <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n            <tr><td>Formula</td><td>500 × (857/2000)</td><td>1</td></tr>\n            <tr><td>Answer</td><td>214.25</td><td>1</td></tr>\n            <tr><td>AUC interpretation</td><td>99.91% pairs correctly ranked, Excellent</td><td>1</td></tr>\n            <tr><td>Training set caveat</td><td>May overestimate, need test set</td><td>2</td></tr>\n            <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n          </table>\n        </div>\n      </div>\n    </div>\n\n  </div>\n</div><!-- /q5 panel -->\n\n\n  </div><!-- /2025s1 session -->\n\n\n  <!-- ══════════════════════════════════════\n       SESSION: 2024 S1\n  ══════════════════════════════════════ -->\n  <div id=\"s2024s1\" class=\"ep-session\">\n\n    <div class=\"ep-meta\">\n      <span class=\"ep-meta-tag\">2024 Semester 1</span>\n      <div>\n        <div class=\"ep-meta-title\">MGMT90280 Final Exam</div>\n        <div class=\"ep-meta-sub\">Based on official teacher's answer</div>\n      </div>\n    </div>\n\n    <div class=\"ep-q-nav\">\n      <button class=\"ep-q-btn on\" onclick=\"epQ('2024s1','q1',this)\">Q1 · LP + Markowitz</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2024s1','q2',this)\">Q2 · Simulation</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2024s1','q3',this)\">Q3 · Time Series Regression</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2024s1','q4',this)\">Q4 · Clustering</button>\n      <button class=\"ep-q-btn\" onclick=\"epQ('2024s1','q5',this)\">Q5 · Classification Tree</button>\n    </div>\n\n    <!-- ── Q1: LP Transportation + Markowitz ── -->\n    <div id=\"2024s1-q1\" class=\"ep-q-panel on\">\n      <div class=\"ep-split-layout\">\n\n        <!-- ── 左栏：原题 ── -->\n        <div class=\"ep-orig-col\">\n          <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n          <div class=\"ep-orig-card\">\n            <div class=\"ep-orig-bg\">\n              <strong>SECTION 1 · Q1 (25 marks)</strong><br>\n              <strong>Part 1 — Green Fields Farms Transportation Problem</strong><br>\n              Green Fields Farms, a renowned cultivator of organically grown strawberries, supplies its premium strawberries exclusively to four regional grocery stores (Organic Wholefoods, Fresh Market, Healthier You, and Farms Fresh) scattered across Victoria. Strawberries travel from orchards → processing facilities (cleaning &amp; packaging) → grocery stores. Costs include transportation from orchard to processing centre, preparation (cleaning) at processing centre, and shipping from processing centre to stores.\n              <table class=\"ep-orig-tbl\" style=\"margin-top:10px\">\n                <tr><th>Processing Centre</th><th>Transportation Cost ($/Kg)</th><th>Preparation Cost ($/Kg)</th><th>Monthly Capacity (Kgs)</th></tr>\n                <tr><td>1</td><td>0.35</td><td>0.05</td><td>200</td></tr>\n                <tr><td>2</td><td>0.90</td><td>0.10</td><td>400</td></tr>\n                <tr><td>3</td><td>1.52</td><td>0.08</td><td>700</td></tr>\n              </table>\n              <table class=\"ep-orig-tbl\" style=\"margin-top:8px\">\n                <tr><th>Processing Centre</th><th>Organic Wholefoods ($/Kg)</th><th>Fresh Market ($/Kg)</th><th>Healthier You ($/Kg)</th><th>Farms Fresh ($/Kg)</th></tr>\n                <tr><td>1</td><td>0.70</td><td>1.00</td><td>0.60</td><td>1.30</td></tr>\n                <tr><td>2</td><td>1.10</td><td>1.00</td><td>0.40</td><td>1.30</td></tr>\n                <tr><td>3</td><td>0.10</td><td>1.30</td><td>1.20</td><td>1.60</td></tr>\n                <tr><td><strong>Monthly Demand (Kgs)</strong></td><td>200</td><td>400</td><td>300</td><td>100</td></tr>\n              </table>\n              <p class=\"ep-orig-note\">Green Fields Farms' data analyst has solved the model and produced Table 1.3 Sensitivity Report (refer to exam printout).</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">9 marks</span>\n              <span class=\"ep-orig-qnum\">Q1.1</span>\n              <p class=\"ep-orig-qtxt\">Formulate a linear optimization model to determine the allocation of strawberries to each of the three processing centres. In your model please also determine the distribution strategy to fulfill the demand of each grocery store. The primary objective is to <strong>minimise the total cost</strong>.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">2 marks</span>\n              <span class=\"ep-orig-qnum\">Q1.2</span>\n              <p class=\"ep-orig-qtxt\">Considering the information provided in Table 1.3 (Sensitivity Report), how many kilograms of strawberries will be processed in all processing centres combined?</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">2 marks</span>\n              <span class=\"ep-orig-qnum\">Q1.3</span>\n              <p class=\"ep-orig-qtxt\">If Green Fields Farms can increase the capacity of the processing centre number 3 by 200 Kgs, what will happen to the optimal solution and the objective function? Explain.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">3 marks</span>\n              <span class=\"ep-orig-qnum\">Q1.4</span>\n              <p class=\"ep-orig-qtxt\">Farms Fresh store is running a marketing campaign and is going to increase its demand to 250 Kgs. What impact will this increase have on Green Fields Farms's total cost?</p>\n            </div>\n\n            <hr class=\"ep-orig-divider\">\n\n            <div class=\"ep-orig-bg\" style=\"border-bottom:none;margin-bottom:0;padding-bottom:0\">\n              <strong>Part 2 — Premier Wealth Advisors (Markowitz Portfolio)</strong><br>\n              John Davis is thinking about developing an investment portfolio for a client using performance data from the previous <strong>six years</strong> for three specific stocks. The main objective is to achieve a <strong>minimum expected return of 10%</strong>. It is assumed that the returns are equally likely.\n              <table class=\"ep-orig-tbl\" style=\"margin-top:8px\">\n                <tr><th></th><th>Year 1</th><th>Year 2</th><th>Year 3</th><th>Year 4</th><th>Year 5</th><th>Year 6</th></tr>\n                <tr><td>Stock 1</td><td>0.200</td><td>0.003</td><td>0.116</td><td>–0.036</td><td>–0.061</td><td>0.046</td></tr>\n                <tr><td>Stock 2</td><td>0.125</td><td>0.190</td><td>0.116</td><td>–0.172</td><td>0.044</td><td>0.007</td></tr>\n                <tr><td>Stock 3</td><td>0.049</td><td>0.160</td><td>0.319</td><td>–0.068</td><td>0.069</td><td>–0.025</td></tr>\n              </table>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">9 marks</span>\n              <span class=\"ep-orig-qnum\">Q1.5</span>\n              <p class=\"ep-orig-qtxt\">Construct the Markowitz portfolio model using the performance data above. The main objective is to achieve a minimum expected return of 10%. Show your decision variables, objective function, annual return constraints (R1–R6), average return formula, minimum return constraint, and portfolio weight constraint.</p>\n            </div>\n          </div>\n        </div>\n\n        <!-- ── 右栏：解析 ── -->\n        <div class=\"ep-analysis-col\">\n          <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q1-1\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q1-1')\">\n              <span class=\"ep-subq-num\">Q1.1</span>\n              <span class=\"ep-subq-title\">Formulate LP transportation model — minimise total cost</span>\n              <span class=\"ep-subq-marks\">9 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-warn-box\">⚠️ <strong>最容易丢分！流量平衡约束（y<sub>ij</sub> ≤ x<sub>i</sub>）漏掉直接失去 3 分！</strong> 这是把两套变量连起来的关键约束，必须写。<br><em>Missing flow balance constraints = lose 3 marks directly. This links two sets of variables.</em></div>\n              <div class=\"ep-info-box\">💡 <strong>系数来源：</strong>x<sub>i</sub> 的系数 = Table 1.1 运输成本 + 准备成本相加（P1: 0.35+0.05=0.40, P2: 0.90+0.10=1.00, P3: 1.52+0.08=1.60）<br>y<sub>ij</sub> 的系数 = Table 1.2 运输成本，直接读入</div>\n              <p class=\"ep-h5\">① Decision Variables（决策变量）<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark)</span></p>\n              <div class=\"ep-formula\">x<sub>i</sub> = amount of strawberries (in Kgs) to process at processing centre i  (i = 1, 2, 3)\ny<sub>ij</sub> = amount to ship from processing centre i to grocery store j  (j = 1=Organic, 2=Fresh, 3=Healthier, 4=Farms Fresh)</div>\n              <p class=\"ep-h5\">② Objective Function（目标函数）<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark)</span></p>\n              <div class=\"ep-formula\">Min Z = 0.4x₁ + 1x₂ + 1.6x₃\n       + 0.70y₁₁ + 1.00y₁₂ + 0.60y₁₃ + 1.30y₁₄\n       + 1.10y₂₁ + 1.00y₂₂ + 0.40y₂₃ + 1.30y₂₄\n       + 0.10y₃₁ + 1.30y₃₂ + 1.20y₃₃ + 1.60y₃₄</div>\n              <p class=\"ep-h5\">③ Flow Balance Constraints 流量平衡约束 — 最容易漏！<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (3 marks)</span></p>\n              <div class=\"ep-formula\">y₁₁ + y₁₂ + y₁₃ + y₁₄ ≤ x₁\ny₂₁ + y₂₂ + y₂₃ + y₂₄ ≤ x₂\ny₃₁ + y₃₂ + y₃₃ + y₃₄ ≤ x₃</div>\n              <p class=\"ep-h5\">④ Capacity Constraints 容量约束<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark — all 3 correct)</span></p>\n              <div class=\"ep-formula\">x₁ ≤ 200 | x₂ ≤ 400 | x₃ ≤ 700</div>\n              <p class=\"ep-h5\">⑤ Demand Constraints 需求约束<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (2 marks — 0.5 each)</span></p>\n              <div class=\"ep-formula\">y₁₁ + y₂₁ + y₃₁ ≥ 200  (Organic Wholefoods)\ny₁₂ + y₂₂ + y₃₂ ≥ 400  (Fresh Market)\ny₁₃ + y₂₃ + y₃₃ ≥ 300  (Healthier You)\ny₁₄ + y₂₄ + y₃₄ ≥ 100  (Farms Fresh)</div>\n              <p class=\"ep-h5\">⑥ Non-negativity 非负约束<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark)</span></p>\n              <div class=\"ep-formula\">xᵢ, yᵢⱼ ≥ 0 for all i, j</div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Decision variables</td><td>x<sub>i</sub> 和 y<sub>ij</sub> 都定义</td><td>1</td></tr>\n                <tr><td>Objective function</td><td>正确系数</td><td>1</td></tr>\n                <tr><td>Flow balance</td><td>3条 y<sub>ij</sub> ≤ x<sub>i</sub></td><td>3</td></tr>\n                <tr><td>Capacity</td><td>3条全对</td><td>1</td></tr>\n                <tr><td>Demand</td><td>4条各0.5分</td><td>2</td></tr>\n                <tr><td>Non-negativity</td><td>两组变量都写</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q1-2\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q1-2')\">\n              <span class=\"ep-subq-num\">Q1.2</span>\n              <span class=\"ep-subq-title\">Total Kgs processed in all processing centres combined</span>\n              <span class=\"ep-subq-marks\">2 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从哪里读：</strong>Sensitivity Report → Variable Cells → P1, P2, P3 的 <strong>Final Value 列</strong></div>\n              <span class=\"ep-answer-label\">标准答案</span>\n              <div class=\"ep-formula\">P1 (Processing Centre 1) = 200 Kgs\nP2 (Processing Centre 2) = 400 Kgs\nP3 (Processing Centre 3) = 400 Kgs\n\nTotal = 200 + 400 + 400 = 1,000 Kgs</div>\n              <div class=\"ep-tip-box\">\"The total amount of strawberries processed across all three processing centres is <strong>1,000 Kgs</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">三个加工中心的草莓处理总量为1,000公斤。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Correct Final Values</td><td>P1=200, P2=400, P3=400</td><td>1</td></tr>\n                <tr><td>Total calculation</td><td>1,000 Kgs</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q1-3\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q1-3')\">\n              <span class=\"ep-subq-num\">Q1.3</span>\n              <span class=\"ep-subq-title\">Increase P3 capacity by 200 Kgs — impact on optimal solution?</span>\n              <span class=\"ep-subq-marks\">2 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从哪里读：</strong>Sensitivity Report → Constraints → P3 行 → Allowable Increase 列 = 1E+30（无穷大）<br>或看 Final Value = 400，Capacity = 700 → Slack = 300 Kgs</div>\n              <span class=\"ep-answer-label\">标准答案（两种写法均可得分）</span>\n              <p class=\"ep-h5\">方式一 — 用 Slack：</p>\n              <div class=\"ep-tip-box\">\"The optimal solution and objective function remain the <strong>same</strong>, as there is already <strong>300 Kgs of slack</strong> available (capacity 700 − current usage 400 = 300). Adding 200 Kgs is within this slack.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">最优解和目标函数不变。P3 已有 300kg 闲置容量（700−400=300），增加 200kg 不影响当前解。</span></div>\n              <p class=\"ep-h5\">方式二 — 用 Allowable Increase：</p>\n              <div class=\"ep-tip-box\">\"The allowable increase for P3's capacity constraint is 1E+30 (effectively infinity), which is greater than 200. Therefore, the optimal solution and objective function remain unchanged.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">P3 容量的 allowable increase 为无穷大，远大于 200，因此最优解不变。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Conclusion</td><td>No change to optimal solution &amp; objective function</td><td>1</td></tr>\n                <tr><td>Explanation</td><td>Slack = 300 Kgs / Allowable increase = ∞</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q1-4\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q1-4')\">\n              <span class=\"ep-subq-num\">Q1.4</span>\n              <span class=\"ep-subq-title\">Farms Fresh demand increases to 250 Kgs — impact on total cost?</span>\n              <span class=\"ep-subq-marks\">3 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从哪里读：</strong>Sensitivity Report → Constraints → Farms Fresh 行 → Allowable Increase 列 = <strong>0</strong></div>\n              <div class=\"ep-warn-box\">⚠️ Allowable increase = 0 意味着<strong>任何增加</strong>都超出范围！不能用 shadow price 计算，必须说 \"rerun the model\"。<br><em>Allowable increase = 0 means ANY increase is out of range. Do NOT use shadow price — must say rerun.</em></div>\n              <span class=\"ep-answer-label\">标准答案</span>\n              <div class=\"ep-tip-box\">\"The demand increase is 250 − 100 = <strong>150 Kgs</strong>. The allowable increase for Farms Fresh is <strong>0</strong>, so the 150 Kgs increase is <strong>outside the range of feasibility</strong>. Therefore, we <strong>do not know</strong> the exact impact on total cost until we <strong>rerun the model</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">需求增加 150kg。Farms Fresh 的 allowable increase 为 0，150kg 超出可行范围，无法得知总成本确切变化，需要重新运行模型。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Increase amount</td><td>250 − 100 = 150 Kgs</td><td>1</td></tr>\n                <tr><td>Outside range</td><td>Allowable increase = 0，超出范围</td><td>1</td></tr>\n                <tr><td>Rerun model</td><td>需要重新运行模型才能确定</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>3</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q1-5\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q1-5')\">\n              <span class=\"ep-subq-num\">Q1.5</span>\n              <span class=\"ep-subq-title\">Construct Markowitz Portfolio Model (min return 10%, 6 years equally likely)</span>\n              <span class=\"ep-subq-marks\">9 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-warn-box\">⚠️ R̄ = (1/6)ΣRs 这一行<strong>单独给 1 分</strong>，不能省略！数据 6 年就写 R1 到 R6。<br><em>The R̄ formula gets its own mark — never skip it!</em></div>\n              <p class=\"ep-h5\">① Decision Variables<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark)</span></p>\n              <div class=\"ep-formula\">X = fraction of the portfolio to invest in Stock 1（投资于股票1的比例）\nY = fraction of the portfolio to invest in Stock 2（投资于股票2的比例）\nZ = fraction of the portfolio to invest in Stock 3（投资于股票3的比例）</div>\n              <p class=\"ep-h5\">② Objective Function<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark)</span></p>\n              <div class=\"ep-formula\">Min  (1/6) × Σ(Rₛ − R̄)²  for s = 1 to 6\n（最小化6年收益率方差 / Minimise portfolio variance over 6 equally-likely years）</div>\n              <p class=\"ep-h5\">③ Annual Return Constraints R1–R6<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (4 marks total — from Table 1.4)</span></p>\n              <div class=\"ep-formula\">R1 =  0.200X + 0.125Y + 0.049Z\nR2 =  0.003X + 0.190Y + 0.160Z\nR3 =  0.116X + 0.116Y + 0.319Z\nR4 = −0.036X − 0.172Y − 0.068Z\nR5 = −0.061X + 0.044Y + 0.069Z\nR6 =  0.046X + 0.007Y − 0.025Z</div>\n              <p class=\"ep-h5\">④ Average Return Formula<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark — standalone, don't skip!)</span></p>\n              <div class=\"ep-formula\">R̄ = (1/6)(R1 + R2 + R3 + R4 + R5 + R6)</div>\n              <p class=\"ep-h5\">⑤ Minimum Return &amp; Weight Constraints<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (2 marks)</span></p>\n              <div class=\"ep-formula\">R̄ ≥ 0.10       (minimum expected return 10%)\nX + Y + Z = 1  (portfolio weights sum to 100%)\nX, Y, Z ≥ 0</div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Decision variables</td><td>X, Y, Z 定义清晰</td><td>1</td></tr>\n                <tr><td>Objective function</td><td>Min (1/6)Σ(Rs−R̄)²</td><td>1</td></tr>\n                <tr><td>R1–R6 constraints</td><td>6年收益约束（各0.5分 × 6 = 3分 + 写出来1分）</td><td>4</td></tr>\n                <tr><td>R̄ formula</td><td>(1/6)(R1+...+R6) — 单独1分</td><td>1</td></tr>\n                <tr><td>R̄ ≥ 0.10</td><td>最低收益约束</td><td>1</td></tr>\n                <tr><td>X+Y+Z=1</td><td>权重约束</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n        </div><!-- /analysis col -->\n      </div><!-- /split layout -->\n    </div><!-- /q1 panel -->\n\n    <!-- ══════════════════ Q2 · Monte Carlo Simulation ══════════════════ -->\n    <div id=\"2024s1-q2\" class=\"ep-q-panel\">\n      <div class=\"ep-split-layout\">\n\n        <!-- ── 左栏：原题 ── -->\n        <div class=\"ep-orig-col\">\n          <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n          <div class=\"ep-orig-card\">\n            <div class=\"ep-orig-bg\">\n              <strong>SECTION 1 · Q2 (25 marks)</strong><br>\n              <strong>Danone — Yoghurt Profit Simulation</strong><br>\n              Danone is evaluating the profitability of a yoghurt product. The selling price is fixed at <strong>$26</strong>. Three costs are uncertain and follow discrete probability distributions (Table 2.1). A Monte Carlo simulation with 1,000 trials is run to estimate the profit distribution.\n              <table class=\"ep-orig-tbl\" style=\"margin-top:10px\">\n                <tr><th>Cost</th><th>Value ($)</th><th>Probability</th></tr>\n                <tr><td rowspan=\"3\">Procurement</td><td>5</td><td>0.25</td></tr>\n                <tr><td>5.5</td><td>0.45</td></tr>\n                <tr><td>6</td><td>0.30</td></tr>\n                <tr><td rowspan=\"4\">Labour</td><td>10</td><td>0.10</td></tr>\n                <tr><td>11</td><td>0.25</td></tr>\n                <tr><td>12</td><td>0.35</td></tr>\n                <tr><td>13</td><td>0.30</td></tr>\n                <tr><td rowspan=\"2\">Transportation</td><td>1</td><td>0.75</td></tr>\n                <tr><td>3</td><td>0.25</td></tr>\n              </table>\n              <p class=\"ep-orig-note\" style=\"margin-top:8px\"><strong>Figure 2.1 Simulation Results:</strong> Average profit = $7.40 | Minimum = $5.00 | Maximum = $10.00<br>Profits most likely fall between $6 and $8.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">3 marks</span>\n              <span class=\"ep-orig-qnum\">Q2.1</span>\n              <p class=\"ep-orig-qtxt\">Write the deterministic formula for profit. Compute the best-case and worst-case profit values.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">2 marks</span>\n              <span class=\"ep-orig-qnum\">Q2.2</span>\n              <p class=\"ep-orig-qtxt\">Why would Danone use simulation rather than just relying on the best and worst case analysis? Compare the results.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">9 marks</span>\n              <span class=\"ep-orig-qnum\">Q2.3</span>\n              <p class=\"ep-orig-qtxt\">Build cumulative probability distributions for each of the three cost variables. Include: cost value, probability, cumulative probability, and random number range.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">9 marks</span>\n              <span class=\"ep-orig-qnum\">Q2.4</span>\n              <p class=\"ep-orig-qtxt\">Explain step by step how Danone should formulate and run a Monte Carlo simulation model in Excel to understand the profit distribution for this yoghurt product.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">2 marks</span>\n              <span class=\"ep-orig-qnum\">Q2.5</span>\n              <p class=\"ep-orig-qtxt\">Danone is not completely happy with the simulation results. What recommendations would you provide to improve profits?</p>\n            </div>\n          </div>\n        </div>\n\n        <!-- ── 右栏：解析 ── -->\n        <div class=\"ep-analysis-col\">\n          <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n\n          <!-- 背景知识 -->\n          <div class=\"ep-info-box\" style=\"margin-bottom:12px\">\n            💡 <strong>背景知识 | Key Rules to Remember</strong><br><br>\n            <strong>Simulation的核心逻辑：</strong><br>\n            • Deterministic model = 固定公式，不考虑概率<br>\n            • Stochastic elements = 把概率分布加进去，让成本变成随机变量<br>\n            • Cumulative probability = 概率从上往下累加，最后一行永远 = 1.00<br>\n            • Random number range = 每个值对应的随机数区间，用于 mapping<br>\n            • 最后一行的 cumulative probability 永远是 1.00，可用来检验自己对不对<br><br>\n            <strong>Cumulative Probability 怎么建：</strong><br>\n            1. 从 Table 读每个值的 probability<br>\n            2. 从上往下累加<br>\n            3. 加 Random Number Range 一列（起点 = 上一行的 cumulative probability）\n          </div>\n\n          <!-- Q2.1 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q2-1\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q2-1')\">\n              <span class=\"ep-subq-num\">Q2.1</span>\n              <span class=\"ep-subq-title\">Deterministic formula + Best/Worst case profit</span>\n              <span class=\"ep-subq-marks\">3 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • \"Deterministic formula\" → 就是利润公式，不含概率<br>\n                • \"Best-case\" → 所有成本取<strong>最小值</strong><br>\n                • \"Worst-case\" → 所有成本取<strong>最大值</strong><br>\n                • 数据来源：selling price 从题目读，各成本最小/最大值从 <strong>Table 2.1</strong> 第一行和最后一行读\n              </div>\n              <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n              <p class=\"ep-h5\">Deterministic Formula（1 mark）</p>\n              <div class=\"ep-formula\">Profit = Selling Price − Procurement Cost − Labour Cost − Transportation Cost\n利润 = 售价 − 采购成本 − 劳动力成本 − 运输成本</div>\n              <p class=\"ep-h5\">Best-case Profit（1 mark — 所有成本取最小值）</p>\n              <div class=\"ep-tip-box\">= 26 − 5 − 10 − 1 = <strong>$10</strong></div>\n              <p class=\"ep-h5\">Worst-case Profit（1 mark — 所有成本取最大值）</p>\n              <div class=\"ep-tip-box\">= 26 − 6 − 13 − 3 = <strong>$4</strong></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Deterministic formula</td><td>四项正确</td><td>1</td></tr>\n                <tr><td>Best-case profit</td><td>$10</td><td>1</td></tr>\n                <tr><td>Worst-case profit</td><td>$4</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>3</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <!-- Q2.2 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q2-2\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q2-2')\">\n              <span class=\"ep-subq-num\">Q2.2</span>\n              <span class=\"ep-subq-title\">Why simulation over best/worst case? Compare results.</span>\n              <span class=\"ep-subq-marks\">2 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从哪里读数据：</strong>Figure 2.1 右边统计表 → Minimum、Maximum、Average 三行</div>\n              <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n              <p class=\"ep-h5\">Why Simulation（1 mark）</p>\n              <div class=\"ep-tip-box\">\"Best and worst case analysis only provides <strong>two extreme values</strong> without showing the <strong>probability of each outcome</strong> occurring. Simulation provides a more complete and realistic picture of the range of possible profits.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Best/worst case 只提供两个极端值，无法显示每种结果发生的概率。Simulation 提供了更完整真实的利润分布。</span></div>\n              <p class=\"ep-h5\">Compare Results（1 mark）</p>\n              <div class=\"ep-tip-box\">\"The best-case profit is <strong>$10</strong> and worst-case is <strong>$4</strong>. The simulation results (Figure 2.1) show an <strong>average profit of $7.40</strong>, with a minimum of $5.00 and maximum of $10.00, indicating profits are most likely to fall between $6 and $8.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Best-case $10，worst-case $4。Simulation 显示平均利润 $7.40，最小 $5，最大 $10，利润最可能落在 $6 到 $8 之间。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Why simulation</td><td>极端值 vs 概率分布</td><td>1</td></tr>\n                <tr><td>Compare results</td><td>数字对比 + 读 Figure 2.1</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>2</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <!-- Q2.3 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q2-3\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q2-3')\">\n              <span class=\"ep-subq-num\">Q2.3</span>\n              <span class=\"ep-subq-title\">Cumulative probability distributions for all three costs</span>\n              <span class=\"ep-subq-marks\">9 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从哪里读数据：</strong>全部来自 <strong>Table 2.1</strong> — 每个成本的 value 和 probability 列<br>每张表必须包含：Cost value、Probability、Cumulative Probability、Random Number Range（<strong>4列缺一不可</strong>）</div>\n              <div class=\"ep-warn-box\">⚠️ Random Number Range 这列<strong>必须写</strong>，后面 simulation 要用。每张表最后一行 cumulative probability 必须 = <strong>1.00</strong>，否则概率加错了。Range 起点 = 上一行的 cumulative probability。<br><em>Last row cumulative prob must = 1.00. Range start = previous row's cumulative prob.</em></div>\n              <span class=\"ep-answer-label\">Procurement Cost（3 marks）</span>\n              <table class=\"ep-param-table\">\n                <tr><th>Cost ($)</th><th>Probability</th><th>Cumulative Probability</th><th>Random Number Range</th></tr>\n                <tr><td>5</td><td>0.25</td><td>0.25</td><td>0.00 – 0.25</td></tr>\n                <tr><td>5.5</td><td>0.45</td><td>0.70</td><td>0.25 – 0.70</td></tr>\n                <tr><td>6</td><td>0.30</td><td><strong>1.00</strong></td><td>0.70 – 1.00</td></tr>\n              </table>\n              <span class=\"ep-answer-label\" style=\"margin-top:12px\">Labour Cost（3 marks）</span>\n              <table class=\"ep-param-table\">\n                <tr><th>Cost ($)</th><th>Probability</th><th>Cumulative Probability</th><th>Random Number Range</th></tr>\n                <tr><td>10</td><td>0.10</td><td>0.10</td><td>0.00 – 0.10</td></tr>\n                <tr><td>11</td><td>0.25</td><td>0.35</td><td>0.10 – 0.35</td></tr>\n                <tr><td>12</td><td>0.35</td><td>0.70</td><td>0.35 – 0.70</td></tr>\n                <tr><td>13</td><td>0.30</td><td><strong>1.00</strong></td><td>0.70 – 1.00</td></tr>\n              </table>\n              <span class=\"ep-answer-label\" style=\"margin-top:12px\">Transportation Cost（3 marks）</span>\n              <table class=\"ep-param-table\">\n                <tr><th>Cost ($)</th><th>Probability</th><th>Cumulative Probability</th><th>Random Number Range</th></tr>\n                <tr><td>1</td><td>0.75</td><td>0.75</td><td>0.00 – 0.75</td></tr>\n                <tr><td>3</td><td>0.25</td><td><strong>1.00</strong></td><td>0.75 – 1.00</td></tr>\n              </table>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Procurement Cost table</td><td>4列全对</td><td>3</td></tr>\n                <tr><td>Labour Cost table</td><td>4列全对</td><td>3</td></tr>\n                <tr><td>Transportation Cost table</td><td>4列全对</td><td>3</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <!-- Q2.4 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q2-4\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q2-4')\">\n              <span class=\"ep-subq-num\">Q2.4</span>\n              <span class=\"ep-subq-title\">Step-by-step Monte Carlo simulation formulation</span>\n              <span class=\"ep-subq-marks\">9 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • \"Step by step\" → 必须分步骤写，不能写成一段话<br>\n                • Step 1：根据题目换参数名称和公式<br>\n                • Step 2 和 Step 3：直接套模板，基本不用改\n              </div>\n              <div class=\"ep-warn-box\">⚠️ <strong>必须出现的关键词 | Must-have keywords:</strong><br>\n                • Step 2：<strong>stochastic elements</strong> + <strong>sufficient number of iterations</strong> + <strong>VLOOKUP</strong><br>\n                • Step 3：<strong>risk appetite</strong>（没写可能扣分）\n              </div>\n              <p class=\"ep-h5\">Step 1（3 marks）— 建立 Deterministic 模型</p>\n              <div class=\"ep-tip-box\">\n                <strong>Parameters（参数）:</strong><br>\n                • Selling price: $26 (fixed / 固定)<br>\n                • Procurement cost: can get any value from the distribution（可从概率分布中取任意值）<br>\n                • Labour cost: can get any value from the distribution（可从概率分布中取任意值）<br>\n                • Transportation cost: can get any value from the distribution（可从概率分布中取任意值）<br><br>\n                <strong>Model（模型）:</strong><br>\n                Profit = Selling price − Procurement cost − Labour cost − Transportation cost<br>\n                <span style=\"color:var(--color-text-secondary);font-size:12px\">利润 = 售价 − 采购成本 − 劳动力成本 − 运输成本</span>\n              </div>\n              <p class=\"ep-h5\">Step 2（3 marks）— 加入随机元素，跑 Simulation</p>\n              <div class=\"ep-tip-box\">\"Adding the <strong>stochastic elements</strong> of the model and running the simulation for a <strong>sufficient number of iterations</strong> (1,000 to 10,000 minimum). First, cumulative probability distributions should be built for each cost variable. Then random numbers are generated and <strong>VLOOKUP</strong> is used in Excel to find the cost value corresponding to each random number. Statistics of the profit are then mapped, including count, maximum, minimum, standard deviation, and frequency of positive and negative profits.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">加入随机元素，跑足够多次迭代（最少1,000到10,000次）。先建累积概率分布，生成随机数，用 VLOOKUP 找对应成本值，再统计利润的各项指标。</span></div>\n              <p class=\"ep-h5\">Step 3（3 marks）— 分析结果，做决策</p>\n              <div class=\"ep-tip-box\">\"Solving the simulation model for various cost combinations to understand how profit changes. Looking at the average, standard deviation, minimum and maximum profit, Danone should decide whether such profit distribution is acceptable. Otherwise, they need to change certain variables such as selling price to increase profits. By the end of the day, it is on the decision maker to choose the best option based on their <strong>risk appetite</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">通过模拟各种成本组合了解利润变化。根据平均值、标准差、最小值和最大值判断利润分布是否可接受。若不满意，需调整变量如提高售价。最终由决策者根据其<strong>风险偏好</strong>选择最佳方案。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Step 1</td><td>参数 + deterministic公式</td><td>3</td></tr>\n                <tr><td>Step 2</td><td>stochastic elements + iterations + VLOOKUP</td><td>3</td></tr>\n                <tr><td>Step 3</td><td>分析结果 + risk appetite</td><td>3</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>9</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <!-- Q2.5 -->\n          <div class=\"ep-subq\" id=\"sq-2024s1-q2-5\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q2-5')\">\n              <span class=\"ep-subq-num\">Q2.5</span>\n              <span class=\"ep-subq-title\">Recommendations to improve profits</span>\n              <span class=\"ep-subq-marks\">2 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>读题思路 | How to Read:</strong><br>\n                • \"Not completely happy with profits\" → 利润太低，建议方向只有两个：<strong>提高收入</strong>或<strong>降低成本</strong><br>\n                • 写两到三条就够 2 分，不用展开解释<br>\n                • 看 Figure 2.1 的统计数据判断是哪种情况\n              </div>\n              <span class=\"ep-answer-label\">情况一：利润太低（本题 — average profit 偏低）</span>\n              <ol class=\"ep-list\">\n                <li><strong>Increase the selling price</strong> to improve revenue.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">提高售价增加收入。</span></li>\n                <li><strong>Reduce costs</strong> by negotiating lower procurement, labour, or transportation costs.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">通过谈判降低采购、劳动力或运输成本。</span></li>\n                <li><strong>Increase production volume</strong> to achieve economies of scale and reduce per-unit costs.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">扩大生产规模，通过规模经济降低单位成本。</span></li>\n                <li><strong>Discontinue the product</strong> if profits remain unacceptable after adjustments.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">若调整后利润仍不理想，考虑停产该产品。</span></li>\n              </ol>\n              <span class=\"ep-answer-label\" style=\"margin-top:10px\">情况二：利润波动太大（standard deviation 高）</span>\n              <ol class=\"ep-list\">\n                <li><strong>Identify and reduce the most volatile cost component</strong> to stabilise profits.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">识别并减少波动最大的成本项以稳定利润。</span></li>\n                <li><strong>Lock in fixed-price contracts</strong> with suppliers to reduce cost uncertainty.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">与供应商签订固定价格合同以降低成本不确定性。</span></li>\n                <li><strong>Rerun the simulation</strong> with adjusted parameters to evaluate the impact.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">用调整后的参数重新运行 simulation 评估影响。</span></li>\n              </ol>\n              <span class=\"ep-answer-label\" style=\"margin-top:10px\">情况三：某个成本概率分布不理想</span>\n              <ol class=\"ep-list\">\n                <li><strong>Focus on reducing the cost</strong> with the highest probability of taking its maximum value.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">重点降低最可能取最大值的成本项。</span></li>\n                <li><strong>Rerun the simulation</strong> after adjusting the cost distributions to see the effect on profit.<br><span style=\"color:var(--color-text-secondary);font-size:12px\">调整成本分布后重新运行 simulation 观察对利润的影响。</span></li>\n              </ol>\n            </div>\n          </div>\n\n        </div><!-- /analysis col -->\n      </div><!-- /split layout -->\n    </div><!-- /q2 panel -->\n\n    <!-- ── Q3: Time Series Regression ── -->\n    <div id=\"2024s1-q3\" class=\"ep-q-panel\">\n      <div class=\"ep-split-layout\">\n\n        <!-- ── 左栏：原题 ── -->\n        <div class=\"ep-orig-col\">\n          <div class=\"ep-col-label\">📄 原题 | Original Exam Question</div>\n          <div class=\"ep-orig-card\">\n            <div class=\"ep-orig-bg\">\n              <strong>SECTION 1 · Q3 (25 marks)</strong><br>\n              <strong>Coastal Grill — Gold Coast, QLD</strong><br>\n              The Coastal Grill, located in Gold Coast, QLD, is owned and managed by James Thompson. Having recently completed its third year of operation, James intends to develop a forecasting system capable of predicting monthly food and beverage sales for the upcoming year. Table 3.1 shows the food and beverage sales data (in $1,000s) for the first three years of the Grill's operation.\n              <table class=\"ep-orig-tbl\" style=\"margin-top:10px\">\n                <tr><th>Month</th><th>1st Year</th><th>2nd Year</th><th>3rd Year</th></tr>\n                <tr><td>January</td><td>232</td><td>253</td><td>272</td></tr>\n                <tr><td>February</td><td>225</td><td>228</td><td>245</td></tr>\n                <tr><td>March</td><td>222</td><td>237</td><td>255</td></tr>\n                <tr><td>April</td><td>168</td><td>183</td><td>195</td></tr>\n                <tr><td>May</td><td>174</td><td>183</td><td>200</td></tr>\n                <tr><td>June</td><td>130</td><td>139</td><td>150</td></tr>\n                <tr><td>July</td><td>135</td><td>147</td><td>156</td></tr>\n                <tr><td>August</td><td>142</td><td>151</td><td>164</td></tr>\n                <tr><td>September</td><td>100</td><td>112</td><td>116</td></tr>\n                <tr><td>October</td><td>120</td><td>120</td><td>138</td></tr>\n                <tr><td>November</td><td>142</td><td>157</td><td>163</td></tr>\n                <tr><td>December</td><td>196</td><td>220</td><td>225</td></tr>\n              </table>\n              <p class=\"ep-orig-note\">t编号规则：Year 1 Jan = t=1，Year 4 Feb = t=38，Year 4 Dec = t=48。December = base category（所有月份虚拟变量中没有出现 = 藏在截距里）。</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">4 marks</span>\n              <span class=\"ep-orig-qnum\">Q3.1</span>\n              <p class=\"ep-orig-qtxt\">A time series plot of monthly sales for Coastal Grill has been constructed and shown in Figure 3.1. What types of relationships exist in the data? Explain why.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">5 marks</span>\n              <span class=\"ep-orig-qnum\">Q3.2</span>\n              <p class=\"ep-orig-qtxt\">James wonders whether his sales differ systematically by month of the year and whether his restaurant has experienced a trend in sales over the past three years. Use the provided summary in Figure 3.2 to create an estimated multiple regression equation to account for both <strong>trend and seasonal effects</strong> in the data. Based on this model, compute an estimate of sales for <strong>February and December of the fourth year</strong>.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">4 marks</span>\n              <span class=\"ep-orig-qnum\">Q3.3</span>\n              <p class=\"ep-orig-qtxt\">James wonders whether his sales systematically have been impacted by the trend or not. Use the provided summary in Figure 3.3 to create an estimated multiple regression equation to account for <strong>only seasonal effects</strong> in the data. Based on this model, compute an estimate of sales for <strong>February of the fourth year</strong> and explain any differences you observe.</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">6 marks</span>\n              <span class=\"ep-orig-qnum\">Q3.4</span>\n              <p class=\"ep-orig-qtxt\">Test whether each of the regression parameters for the model shown in <strong>Figure 3.3</strong> is equal to zero at a 0.05 level of significance. If any of the regression parameters are equal to zero, what would be your recommendation?</p>\n            </div>\n\n            <div class=\"ep-orig-subq\">\n              <span class=\"ep-orig-qmarks\">6 marks</span>\n              <span class=\"ep-orig-qnum\">Q3.5</span>\n              <p class=\"ep-orig-qtxt\">Compare the models in Q3.2 (Figure 3.2) and Q3.3 (Figure 3.3) in terms of <strong>predictability, overall fit and significance</strong>. Explain which model is more effective.</p>\n            </div>\n          </div>\n        </div>\n\n        <!-- ── 右栏：解析 ── -->\n        <div class=\"ep-analysis-col\">\n          <div class=\"ep-col-label\">📝 解析 | Analysis &amp; Model Answer</div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q3-1\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q3-1')\">\n              <span class=\"ep-subq-num\">Q3.1</span>\n              <span class=\"ep-subq-title\">Time series pattern — what relationships exist in the data?</span>\n              <span class=\"ep-subq-marks\">4 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-warn-box\">⚠️ 绝对不能写 \"horizontal pattern\"！Horizontal = 围绕固定均值波动，无趋势无季节性。本题明显有 trend 和 seasonality。<br><em>NEVER write \"horizontal pattern\" — data clearly shows trend + seasonality.</em></div>\n              <div class=\"ep-info-box\">💡 <strong>判断依据 | How to Tell:</strong><br>有 \"Month\" 行 → trend（+ seasonal）模型 ✅<br>无 \"Month\" 行 → 只有 seasonality 模型<br>每年同月重复高低 → Seasonality；整体逐年升高 → Trend</div>\n              <span class=\"ep-answer-label\">标准答案 | Model Answer</span>\n              <div class=\"ep-tip-box\">\"The time series graph shows evidence of <strong>trend</strong> but <strong>stronger evidence of seasonality</strong>.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">时间序列图显示既有趋势，但季节性的证据更为明显。</span></div>\n              <p class=\"ep-h5\">Trend（趋势）<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark + 1 mark reason)</span></p>\n              <div class=\"ep-tip-box\">\"Overall sales levels <strong>increase from Year 1 to Year 3</strong> — for example, January sales rose from 232 → 253 → 272, indicating a gradual upward trend over time.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">整体销售水平从第1年到第3年持续上升，例如1月销售额 232→253→272，显示逐年上升趋势。</span></div>\n              <p class=\"ep-h5\">Seasonality（季节性）<span style=\"font-weight:400;color:var(--color-text-tertiary)\"> (1 mark + 1 mark reason)</span></p>\n              <div class=\"ep-tip-box\">\"Sales follow a <strong>consistent repeating pattern</strong> within each year — <strong>peaks in January–March</strong> and <strong>troughs in June–September</strong> — and this cycle repeats across all three years.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">每年销售额呈现固定周期性起伏——1至3月最高，6至9月最低，且这一模式在三年内重复出现。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Trend identified</td><td>识别出 trend</td><td>1</td></tr>\n                <tr><td>Trend explanation</td><td>举例说明逐年上升</td><td>1</td></tr>\n                <tr><td>Seasonality identified</td><td>识别出 seasonality（证据更强）</td><td>1</td></tr>\n                <tr><td>Seasonality explanation</td><td>说明每年重复的峰谷规律</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q3-2\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q3-2')\">\n              <span class=\"ep-subq-num\">Q3.2</span>\n              <span class=\"ep-subq-title\">Trend + Seasonal model (Figure 3.2) — predict Year 4 Feb &amp; Dec</span>\n              <span class=\"ep-subq-marks\">5 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从 Figure 3.2 Coefficients 列读数：</strong><br>Intercept = 189.25 | Month（trend）= 1.0174 | Jan=49.8576 | Feb=29.1736 | Mar=33.4896 | Apr=−23.5278 | May=−20.8785 | Jun=−67.8958 | Jul=−62.5799 | Aug=−57.2639 | Sep=−101.2813 | Oct=−85.6319 | Nov=−58.6493<br>December 未出现 = <strong>base category</strong>（预测12月时所有月份虚拟变量填0）<br><br>\n                💡 <strong>系数保留位数 | Coefficient Rounding：</strong><br>\n                • 系数从表格直接读，统一四舍五入到 <strong>四位小数</strong>（e.g. 49.8576）<br>\n                • 最终计算结果也保留 <strong>四位小数</strong><br>\n                • Intercept 按表格原样写（如 189.25 保留两位，不需要补到四位）</div>\n              <div class=\"ep-warn-box\">⚠️ t 编号：Year 1 Jan = 1，Year 4 Feb = t = 36 + 2 = <strong>38</strong>，Year 4 Dec = t = 36 + 12 = <strong>48</strong></div>\n              <span class=\"ep-answer-label\">方程 | Equation (2 marks)</span>\n              <div class=\"ep-formula\">Ŷ = 189.25 + 1.0174t + 49.8576Jan + 29.1736Feb + 33.4896Mar\n   − 23.5278Apr − 20.8785May − 67.8958Jun − 62.5799Jul\n   − 57.2639Aug − 101.2813Sep − 85.6319Oct − 58.6493Nov</div>\n              <span class=\"ep-answer-label\">February Year 4（t = 38，Feb = 1，其他月份 = 0）(1 mark)</span>\n              <div class=\"ep-formula\">Ŷ = 189.25 + 1.0174(38) + 29.1736(1)\n  = 189.25 + 38.6612 + 29.1736\n  = 257.0848 ($1,000s)</div>\n              <span class=\"ep-answer-label\">December Year 4（t = 48，所有虚拟变量 = 0，December 是 base category）(1 mark)</span>\n              <div class=\"ep-formula\">Ŷ = 189.25 + 1.0174(48)\n  = 189.25 + 48.8352\n  = 238.0852 ($1,000s)</div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Equation (hat symbol)</td><td>带 Ŷ hat，系数正确</td><td>2</td></tr>\n                <tr><td>Feb Year 4 prediction</td><td>t=38, Feb=1 → 257.0848</td><td>1.5</td></tr>\n                <tr><td>Dec Year 4 prediction</td><td>t=48, all dummies=0 → 238.0852</td><td>1.5</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>5</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q3-3\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q3-3')\">\n              <span class=\"ep-subq-num\">Q3.3</span>\n              <span class=\"ep-subq-title\">Seasonal only model (Figure 3.3) — predict Year 4 Feb, explain difference</span>\n              <span class=\"ep-subq-marks\">4 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>从 Figure 3.3 Coefficients 列读数（注意：无 Month 行 = 无 trend）：</strong><br>Intercept = 213.67 | Jan=38.6667 | Feb=19 | Mar=24.3333 | Apr=−31.6667 | May=−28 | Jun=−74 | Jul=−67.6667 | Aug=−61.3333 | Sep=−104.3333 | Oct=−87.6667 | Nov=−59.6667<br>December 仍是 base category</div>\n              <span class=\"ep-answer-label\">方程 | Equation (2 marks)</span>\n              <div class=\"ep-formula\">Ŷ = 213.67 + 38.6667Jan + 19Feb + 24.3333Mar − 31.6667Apr\n   − 28May − 74Jun − 67.6667Jul − 61.3333Aug\n   − 104.3333Sep − 87.6667Oct − 59.6667Nov</div>\n              <span class=\"ep-answer-label\">February Year 4（无 t，年份不影响预测）(1 mark)</span>\n              <div class=\"ep-formula\">Ŷ = 213.67 + 19(1) = 232.67 ($1,000s)</div>\n              <span class=\"ep-answer-label\">差异解释（1 mark）</span>\n              <div class=\"ep-tip-box\">\"There is about a <strong>24k difference</strong> (257.08 vs 232.67) as there is <strong>no trend factor</strong> in this model. The seasonal-only model cannot capture the gradual increase in sales over time.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">两个预测值相差约24，原因是季节性模型不含 trend 项，无法捕捉销售额随时间增长的效果。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Equation (hat)</td><td>带 Ŷ，系数正确，无 t 项</td><td>2</td></tr>\n                <tr><td>Feb Year 4 prediction</td><td>213.67 + 19 = 232.67</td><td>1</td></tr>\n                <tr><td>Difference explanation</td><td>No trend factor → ~24k difference</td><td>1</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>4</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q3-4\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q3-4')\">\n              <span class=\"ep-subq-num\">Q3.4</span>\n              <span class=\"ep-subq-title\">t-test for each parameter (Figure 3.3) — significant? Recommendation?</span>\n              <span class=\"ep-subq-marks\">6 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>规则：</strong>p &lt; 0.05 → reject H₀ → significant ✅ | p &gt; 0.05 → do not reject H₀ → NOT significant ❌<br><strong>从哪里读数据：</strong>Figure 3.3 回归输出表 → P-value 列，逐行与 0.05 比较<br><strong>本题结果：</strong>显著：Jan, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov | 不显著：<strong>Feb（p = 0.0852）</strong></div>\n              <span class=\"ep-answer-label\">方程（同 Q3.3 直接抄）(1 mark hat + 1 mark formulation)</span>\n              <div class=\"ep-formula\">Ŷ = 213.67 + 38.6667Jan + 19Feb + 24.3333Mar − 31.6667Apr\n   − 28May − 74Jun − 67.6667Jul − 61.3333Aug\n   − 104.3333Sep − 87.6667Oct − 59.6667Nov</div>\n              <span class=\"ep-answer-label\">t-test 结论（显著变量）(2 marks)</span>\n              <div class=\"ep-tip-box\">\"The p-value for the test of the hypothesis that βᵢ = 0 for <strong>Jan, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, and Nov</strong> are <strong>less than</strong> the 0.05 level of significance. We <strong>reject the hypothesis</strong> that βᵢ = 0, and conclude that there is a <strong>significant relationship</strong> between these variables and sales.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">这些变量 p 值均小于 0.05，拒绝 βᵢ=0 的假设，与销售额存在显著关系。</span></div>\n              <span class=\"ep-answer-label\">t-test 结论（不显著变量）(2 marks)</span>\n              <div class=\"ep-tip-box\">\"The p-value for the test of the hypothesis that βᵢ = 0 for <strong>Feb</strong> (p = 0.0852) is <strong>greater than</strong> the 0.05 level of significance. We <strong>do not reject</strong> the hypothesis that βᵢ = 0, and conclude that there is <strong>not a significant linear relationship</strong> between Feb and sales.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Feb 的 p 值（0.0852）大于 0.05，不拒绝 βᵢ=0 的假设，Feb 与销售额不存在显著线性关系。</span></div>\n              <span class=\"ep-answer-label\">建议 Recommendation（2 marks — 不管结果如何都要写！）</span>\n              <div class=\"ep-tip-box\">\"We <strong>cannot simply delete</strong> these independent variables from the model. First, we need to determine whether they <strong>add to Adjusted R²</strong> and explain more variability of sales. If the <strong>expert's judgement</strong> is to keep them, we should keep them. Otherwise, we should start from <strong>deleting only one variable at a time</strong> and test the model again to decide whether to delete one, two, or all of them.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">不能简单删除变量。先看是否提高 Adjusted R²，再考虑专家判断，否则每次只删一个变量重新检验。</span></div>\n              <span class=\"ep-answer-label\">得分结构</span>\n              <table class=\"ep-score-table\">\n                <tr><th>部分</th><th>内容</th><th>分值</th></tr>\n                <tr><td>Equation (hat symbol)</td><td>带 Ŷ hat 符号</td><td>1</td></tr>\n                <tr><td>Equation formulation</td><td>系数正确</td><td>1</td></tr>\n                <tr><td>Significant variables</td><td>Jan, Mar–Nov（除Feb）：reject H₀</td><td>2</td></tr>\n                <tr><td>Not significant (Feb) + Recommendation</td><td>p=0.0852 &gt; 0.05：do not reject H₀ + cannot simply delete</td><td>2</td></tr>\n                <tr><td><strong>Total</strong></td><td></td><td><strong>6</strong></td></tr>\n              </table>\n            </div>\n          </div>\n\n          <div class=\"ep-subq\" id=\"sq-2024s1-q3-5\">\n            <div class=\"ep-subq-header\" onclick=\"epToggle('sq-2024s1-q3-5')\">\n              <span class=\"ep-subq-num\">Q3.5</span>\n              <span class=\"ep-subq-title\">Compare two models — predictability, overall fit, significance. Which is better?</span>\n              <span class=\"ep-subq-marks\">6 marks</span>\n              <span class=\"ep-subq-arrow\">▼</span>\n            </div>\n            <div class=\"ep-subq-body\">\n              <div class=\"ep-info-box\">💡 <strong>三个维度 | Three Dimensions:</strong><br>Predictability → <strong>MSE = SSE ÷ n</strong>（越小越好）| Overall Fit → <strong>R² + Adjusted R²</strong>（越大越好）| Significance → <strong>Significance F</strong>（越小越好，且必须 &lt; 0.05）<br>MSE 从 ANOVA 表读 Residual SS，n = 36 观测值</div>\n              <span class=\"ep-answer-label\">Predictability — MSE 计算 (3 marks)</span>\n              <div class=\"ep-formula\">Q3.2 (Trend + Seasonal): MSE = 453.625 ÷ 36 = 12.6007\nQ3.3 (Seasonal only):  MSE = 4030.6667 ÷ 36 = 111.9630\n\n→ Q3.2 has lower MSE → better predictability（Q3.2 预测误差更小）</div>\n              <p class=\"ep-p\" style=\"font-size:12px;color:var(--color-text-tertiary)\">注：老师答案接受 ÷ residual df（分别为23和24），对应 MSE = 19.72 和 167.94，也正确。</p>\n              <span class=\"ep-answer-label\">Overall Fit — R² and Adjusted R² (2 marks)</span>\n              <table class=\"ep-mini-table\">\n                <tr><th>Model</th><th>R²</th><th>Adjusted R²</th></tr>\n                <tr><td>Q3.2 (Trend + Seasonal)</td><td>0.9942</td><td>0.9911</td></tr>\n                <tr><td>Q3.3 (Seasonal only)</td><td>0.9482</td><td>0.9245</td></tr>\n              </table>\n              <div class=\"ep-tip-box\">\"Q3.2 has <strong>higher R² (0.9942 vs 0.9482)</strong> and <strong>higher Adjusted R² (0.9911 vs 0.9245)</strong>, indicating better overall fit. R² measures the percentage of variance explained; Adjusted R² corrects for the number of variables and prevents overestimation.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">Q3.2 的 R² 和 Adjusted R² 均更高，整体拟合效果更好。</span></div>\n              <span class=\"ep-answer-label\">Overall Significance — Significance F (1 mark)</span>\n              <div class=\"ep-tip-box\">\"Both models have Significance F &lt; 0.05, meaning both are overall statistically significant — there is sufficient evidence that the independent variables improve the prediction. However, Q3.2 has a <strong>smaller Significance F</strong>, suggesting stronger overall significance.\"<br><span style=\"color:var(--color-text-secondary);font-size:12px\">两个模型 Significance F 均小于 0.05，都整体显著，但 Q3.2 更小，显著性更强。</span></div>\n              <span class=\"ep-answer-label\">结论 Conclusion</span>\n              <div class=\"ep-tip-box\">\"<strong>Q3.2 (Trend + Seasonal) is more effective.</strong> It has a smaller MSE (12.6007 vs 111.9630), higher R² (0.9942 vs 0.9482) and higher Adj
